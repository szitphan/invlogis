<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slider: duyệt Figma — bộ thử Ant Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F1F1;--surface:#fff;--line:#E3E5E8;--fg:#171717;--fg-2:#525252;--fg-3:#737373;--brand:#0036B5;--ink-soft:#E5ECFA;
--ok:#007004;--ok-soft:#E3F2E0;--bad:#A50C25;--bad-soft:#FCE4E2;--warn:#8A5A00;--warn-soft:#FFF4D6;--new:#5B2BB5;--new-soft:#EEE6FB;
--f-head:'Cal Sans','Inter',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body)}
.band{background:var(--brand);color:#fff}.band-in{max-width:1240px;margin:0 auto;padding:20px 24px 22px}
.band img{height:26px;display:block;margin-bottom:14px;filter:brightness(0) invert(1)}
.band h1{font:400 30px/1.15 var(--f-head);margin:0 0 8px}.band p{margin:0;max-width:940px;opacity:.95}
.band mark{background:rgba(255,255,255,.22);color:#fff;border-radius:4px;padding:0 4px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 24px 80px}
.status{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.status #store{color:var(--fg-3);font-size:13px}.status .big{font:400 22px var(--f-head);color:var(--brand)}.sp{flex:1}
.btnx{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.btnx[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font:400 22px var(--f-head);margin:22px 0 8px}h2 small{font:400 13px var(--f-body);color:var(--fg-3);margin-left:8px}
.lead{color:var(--fg-2);max-width:980px;margin:0 0 12px}.lead b{color:var(--fg)}.lead mark,.to mark,.q mark{background:#FFF1B8;border-radius:3px;padding:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.groups .g{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.groups .g b{display:block;margin-bottom:2px}
.pill{display:inline-block;font:600 11px var(--f-body);padding:1px 8px;border-radius:99px;vertical-align:middle}
.p1{background:var(--new-soft);color:var(--new)}.p2{background:var(--warn-soft);color:var(--warn)}.p3{background:var(--ink-soft);color:var(--brand)}.p4{background:#ececec;color:#444}.pb{background:var(--bad-soft);color:var(--bad)}
.row{display:grid;grid-template-columns:150px 380px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row.ok{border-left-color:var(--ok)}.row.fix{border-left-color:#d97706}
.id{font:600 15px var(--f-body)}.id small{display:block;font:400 12px var(--f-body);color:var(--fg-3);margin:2px 0 6px}
.src{font-size:12px;color:var(--fg-3);margin-top:6px}
.to{margin-bottom:8px}.to code,.lead code,.q code,table.tk code{font:12px ui-monospace,monospace;background:#f3f3f3;border-radius:4px;padding:0 4px}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.act button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer}
.act .y[aria-pressed=true]{background:var(--ok);color:#fff;border-color:var(--ok)}.act .n[aria-pressed=true]{background:#d97706;color:#fff;border-color:#d97706}
.act .gb{padding:5px 9px}.act .gb[aria-pressed=true]{background:var(--fg);color:#fff}.gsel{font-size:12px;color:var(--fg-3);margin-left:8px}
textarea.note{display:block;width:100%;min-height:40px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:13px var(--f-body);resize:vertical}
.save{font-size:11px;color:var(--fg-3);min-height:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.q h3{margin:0 0 4px;font:600 15px var(--f-body)}.q p{margin:0 0 10px;color:var(--fg-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;display:flex;flex-direction:column;justify-content:flex-start;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;font:13px var(--f-body)}
.opt>b{display:block;font-size:14px}.opt>span{color:var(--fg-3)}.opt[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--ink-soft)}
.opt .pvq{margin-top:8px}
.rec{color:var(--brand);font-weight:600}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px ui-monospace,monospace}
table.st{border-collapse:collapse;min-width:100%}.pv{overflow-x:auto}table.st td,table.st th{border:1px dashed #c9b6f2;padding:12px;vertical-align:top}
table.st th{font:500 12px var(--f-body);color:#7c3aed;text-align:left;background:#faf7ff}
body.dark table.st th{background:transparent}
table.tk{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}table.tk td,table.tk th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}table.tk th{background:#f7f7f8;font-weight:600}
details.card summary{cursor:pointer;font:600 15px var(--f-body)}
/* ===== preview dựng từ token bộ thử AntD (Light / Dark) ===== */
.pv{--t:#0a0a0a;--t2:#737373;--ib:#f5f5f5;--bd:#e5e5e5;--err:#e7000b;--errr:rgba(231,0,11,.2);--warn:#faad14;--ok:#52c41a;--info:#155dfc;--ring:rgba(161,161,161,.5);--bg:#fff;--pri:#171717;--prit:#fafafa;--pop:#fff;--sh:0 4px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06);
 background:var(--bg);color:var(--t);font:14px/20px 'Geist',system-ui,sans-serif;border-radius:10px;padding:16px;border:1px solid var(--line);-webkit-font-smoothing:antialiased}
body.dark .pv{--t:#fafafa;--t2:#a1a1a1;--ib:#262626;--bd:rgba(255,255,255,.1);--err:#ff6467;--errr:rgba(255,100,103,.4);--warn:#d89614;--ok:#49aa19;--info:#2b7fff;--ring:rgba(115,115,115,.5);--bg:#0a0a0a;--pri:#e5e5e5;--prit:#171717;--pop:#171717;--sh:0 4px 12px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1)}
.pv .caret{display:inline-block;width:1px;height:16px;background:var(--t);vertical-align:-3px}
.pv .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;font-weight:500;letter-spacing:-.25px;background:var(--pri);color:var(--prit)}
.pv .btn.o{background:transparent;color:var(--t);border:1px solid var(--bd)}.pv .btn.g{background:transparent;color:var(--t)}.pv .btn.sm{height:32px;padding:0 10px}.pv .btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.pv .muted{color:var(--t2)}.pv .help{font-size:12px;line-height:16px;color:var(--t2);margin-top:6px}
.pv svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.pv .menu{background:var(--pop);border-radius:8px;box-shadow:var(--sh);padding:4px;min-width:128px;display:inline-block}.pv .menu div{padding:6px 8px;border-radius:6px}.pv .menu div.h{background:var(--ib)}
.pv .stack{display:flex;flex-direction:column;gap:12px}.pv .hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.pv img{max-width:100%;display:block}
.pv table.tk{color:#171717}
.pv .dk,.pv .lg{display:flex;align-items:center;justify-content:center;padding:18px 14px;border-radius:8px}
.pv .dk{background:#0a0a0a;--r:rgba(255,255,255,.1);--f:#e5e5e5;--h:#fafafa}
.pv .lg{background:#fff;--t2:#737373}
.pv .mini{position:relative;display:block;width:170px;height:16px}
.pv .mini i{position:absolute;display:block}
.pv .mini .rl{left:0;right:0;top:4px;height:8px;border-radius:99px;background:var(--r)}
.pv .mini .fl{left:0;width:60%;top:4px;height:8px;border-radius:99px;background:var(--f)}
.pv .mini .th{left:60%;top:0;width:24px;height:16px;margin-left:-12px;border-radius:99px;background:var(--h)}
.pv .tk2{display:flex;justify-content:space-between;width:170px}
.pv .tk2 span{display:flex;flex-direction:column;align-items:center;width:20px;gap:8px}
.pv .tk2 i{display:block;width:1px;background:#737373}
.pv .tk2 em{font:12px/16px 'Geist',system-ui,sans-serif;color:#737373;font-style:normal}

body.review .row{grid-template-columns:150px 1fr 340px}body.review .row .pv img{max-width:100%;display:block}
@media(max-width:900px){.row{grid-template-columns:1fr}.groups{grid-template-columns:1fr 1fr}}
</style>
</head>

<div class="band"><div class="band-in"><img src="__LOGO__" alt="innvie">
<h1>Slider: duyệt Figma — bộ thử Ant Design</h1>
<p>Bộ thử DS Ant Design. Mỗi phần là <mark>ảnh chụp Figma</mark> sau khi dựng. Bấm <b>Đồng ý</b> hoặc <b>Sửa</b> kèm ghi chú. Câu hỏi còn mở ở cuối trang. Xong thì báo Claude để đọc kết quả.</p></div></div>

<div class="status"><span class="big" id="cnt">0/0</span><span>đã chọn</span><span id="store">Đang kết nối nơi lưu…</span><span class="sp"></span>

<div id="view"></div>
<div class="card"><h3 style="margin:0 0 6px">Ghi chú chung</h3><textarea class="note" data-n="gnote" id="gnote" placeholder="Ý kiến chung cho component này…"></textarea><div class="save" id="sv-gnote"></div></div>
<pre class="out" id="out" hidden></pre>
</div>

const LS=COMP.ls;let state={};try{state=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){}
let db=null,uid=null,canWrite=true;
const key=r=>COMP.key+"-"+r[0];
const allKeys=()=>[...COMP.rows.map(key),...COMP.qs.map(q=>q[0])];
function counts(){const ks=allKeys();$("#cnt").textContent=ks.filter(k=>state[k]?.choice!=null).length+"/"+ks.length}
function row(r){const k=key(r),s=state[k]||{},c=s.choice,gg=s.grp,[code,title,src,html,g,dest]=r;
 return `<div class="row ${c===0?"ok":c===1?"fix":""}" data-k="${k}"><div class="id">${esc(code)}<small>${esc(title)}</small>${COMP.review?"":`<span class="pill ${GR[g][2]}">${g?"Nhóm "+g:"Đề xuất bỏ"}</span>`}<div class="src">Nguồn: ${esc(src)}</div></div>
 <div class="pv">${html}</div>
 <div><div class="to">${COMP.review?"":`<b>${GR[g][0]}:</b> `}${md(dest)}</div>
 <div class="act"><button class="y" data-c="${k}" data-v="0" aria-pressed="${c===0}">Đồng ý</button><button class="n" data-c="${k}" data-v="1" aria-pressed="${c===1}">Sửa</button>
 ${COMP.review?"":`<span class="gsel">Nhóm đúng:</span>${[1,2,3,4].map(x=>`<button class="gb" data-gk="${k}" data-g="${x}" aria-pressed="${gg===x}">${x}</button>`).join("")}<button class="gb" data-gk="${k}" data-g="9" aria-pressed="${gg===9}">Bỏ</button>`}</div>
 <textarea class="note ${s.note?"has":""}" data-n="${k}" placeholder="Cần sửa gì ở mẫu này…">${esc(s.note||"")}</textarea><div class="save" id="sv-${k}"></div></div></div>`}
function render(){const T=COMP;const nG=g=>T.rows.filter(r=>r[4]===g).length;
 $("#view").innerHTML=`<p class="lead">${md(T.intro)}</p>
 ${COMP.review?"":`<div class="groups">${[1,2,3,4,0].filter(g=>g!==2||nG(2)).slice(0,5).map(g=>`<div class="g"><b><span class="pill ${GR[g][2]}">${g?"Nhóm "+g:"Bỏ"}</span> ${GR[g][0]} · ${nG(g)}</b>${GR[g][1]}</div>`).join("")}</div>`}
 ${T.extra||""}
 ${T.grid?`<h2>Lưới trạng thái<small>dựng từ token, ${esc(T.ng)} — bấm "Xem nền tối" để xem Dark</small></h2><div class="pv">${T.grid}</div>`:""}
 <h2>${T.rows.length} ${COMP.review?"phần":"mẫu"}<small>${COMP.review?"ảnh chụp Figma — bấm Đồng ý hoặc Sửa + ghi chú":"đề xuất sẵn — bấm Đồng ý hoặc Sửa"}</small></h2>${T.rows.map(row).join("")}
 <h2>Câu hỏi cấu trúc<small>phương án có "đề xuất" là cách em sẽ làm nếu bạn không đổi</small></h2>
 ${T.qs.map(([k,t,d,os])=>{const c=state[k]?.choice;return `<div class="q"><h3>${md(t)}</h3><p>${md(d)}</p><div class="opts">${os.map(([l,s,rec,pv],i)=>`<button class="opt" data-q="${k}" data-v="${i}" aria-pressed="${c===i}"><b>${md(l)}${rec?' <span class="rec">· đề xuất</span>':""}</b><span>${md(s)}</span>${pv?`<div class="pv pvq">${pv}</div>`:""}</button>`).join("")}</div><textarea class="note ${state[k]?.note?"has":""}" data-n="${k}" placeholder="Ý khác…">${esc(state[k]?.note||"")}</textarea><div class="save" id="sv-${k}"></div></div>`}).join("")}`;
 $("#gnote").value=state.gnote?.note||"";counts()}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
async function persist(k){lsSave();counts();const st=document.getElementById("sv-"+k);
 if(!db){if(st)st.textContent="Đã lưu trong trình duyệt này";return}
 if(!canWrite){if(st)st.textContent="Bạn chỉ có quyền xem";return}
 const s=state[k];try{await db.doc("answers/"+k).set({choice:s.choice??null,grp:s.grp??null,note:s.note||"",at:s.at,by:uid||null});if(st)st.textContent="Đã lưu "+new Date(s.at).toLocaleTimeString("vi-VN")}
 catch(e){if(st)st.textContent="Chưa lưu được lên trang — đã giữ trong trình duyệt"}}
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-c]");if(c){const k=c.dataset.c,v=+c.dataset.v;const s=state[k]||{};const nv=s.choice===v?null:v;state[k]={...s,choice:nv,grp:nv===0?null:s.grp??null,at:Date.now()};render();persist(k);return}
 const g=e.target.closest("[data-gk]");if(g){const k=g.dataset.gk,v=+g.dataset.g;const s=state[k]||{};const ng=s.grp===v?null:v;state[k]={...s,grp:ng,choice:ng?1:s.choice===1?null:s.choice,at:Date.now()};render();persist(k);return}
 const q=e.target.closest("[data-q]");if(q){const k=q.dataset.q,v=+q.dataset.v;state[k]={...(state[k]||{}),choice:v,at:Date.now()};render();persist(k);return}});
let tmr={};document.addEventListener("input",e=>{const n=e.target.dataset.n;if(!n)return;state[n]={...(state[n]||{}),note:e.target.value,at:Date.now()};clearTimeout(tmr[n]);tmr[n]=setTimeout(()=>persist(n),600)});
$("#btn-dark").onclick=e=>{const on=document.body.classList.toggle("dark");e.target.setAttribute("aria-pressed",String(on))};
$("#btn-allok").onclick=async()=>{for(const r of COMP.rows){const k=key(r);if(state[k]?.choice==null){state[k]={...(state[k]||{}),choice:0,at:Date.now()};await persist(k)}}for(const q of COMP.qs){if(state[q[0]]?.choice==null){state[q[0]]={...(state[q[0]]||{}),choice:Math.max(0,q[3].findIndex(o=>o[2])),at:Date.now()};await persist(q[0])}}render()};
$("#btn-export").onclick=()=>{const L=allKeys().map(k=>{const s=state[k]||{};return `${k}: ${s.choice==null?"chưa chọn":k.startsWith("q-")?"phương án "+(s.choice+1):s.choice===0?"Đồng ý":"Sửa"}${s.grp?" → "+(s.grp===9?"Bỏ":"nhóm "+s.grp):""}${s.note?" — "+s.note:""}`});$("#out").textContent=L.join("\n")+(state.gnote?.note?"\n\nGhi chú chung: "+state.gnote.note:"");$("#out").hidden=false};
if(COMP.review)document.body.classList.add("review");
render();
(async()=>{if(!window.claude?.use){$("#store").textContent="Lưu trong trình duyệt này";return}
 const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!d){$("#store").textContent="Lưu trong trình duyệt này";return}
 db=d;try{uid=u?await u.id():null}catch(e){}try{const w=u?await u.can("data.write"):null;if(w===false)canWrite=false}catch(e){}
 $("#store").textContent=canWrite?"Lựa chọn lưu trên trang, Claude đọc được":"Bạn chỉ có quyền xem trang này";
 db.collection("answers").onSnapshot(snap=>{let ch=false;snap.docs.forEach(doc=>{const x=doc.data();if(!x)return;const c=state[doc.id];if(!c||(x.at||0)>(c.at||0)){state[doc.id]={choice:x.choice??null,grp:x.grp??null,note:x.note||"",at:x.at};ch=true}});
  if(ch){lsSave();const a=document.activeElement;if(!(a&&a.tagName==="TEXTAREA"))render();else counts()}},()=>{$("#store").textContent="Mất kết nối nơi lưu — lựa chọn vẫn giữ trong trình duyệt này"})})();
</script>
</body>
</html>
