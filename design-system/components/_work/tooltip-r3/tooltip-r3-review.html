<title>Tooltip · Rà vòng 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Khung trang duyệt component (/figma-component --html). Sinh bằng _scripts/ds-component-page.py từ
   design-system/components/_work/{slug}/page.json — KHÔNG sửa trang đã sinh, sửa page.json rồi sinh lại.
   Vỏ trang: nền trung tính + dải innvie-v1 #0036B5. Hình xem trước nằm trong shadow DOM, CSS tự do không đụng vỏ. */
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --sunk:#F6F7F9; --line:#E3E5E8; --line-strong:#D4D4D4;
  --fg:#171717; --fg-2:#525252; --fg-3:#737373;
  --brand:#0036B5; --on-brand:#FFFFFF; --accent:#00A2FF;
  --ink:#0036B5; --ink-soft:#E5ECFA;
  --ok:#007004; --ok-soft:#E3F2E0; --near:#745B00; --near-soft:#FBEFD2;
  --new:#5B2BB5; --new-soft:#EEE6FB; --bad:#A50C25; --bad-soft:#FCE4E2;
  --mark:color-mix(in srgb,#00A2FF 28%,transparent); --stage:#E9ECF0;
  --f-head:'Cal Sans','Inter',system-ui,sans-serif;
  --f-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunk:#20242B; --line:#2C3139; --line-strong:#3D434D;
  --fg:#EDEEF0; --fg-2:#B4B8BF; --fg-3:#8A9099; --ink:#7FA6FF; --ink-soft:#18264A;
  --ok:#6FCF7A; --ok-soft:#17301A; --near:#E8C25A; --near-soft:#33290C; --new:#B79BF5; --new-soft:#251A3D;
  --bad:#F28B95; --bad-soft:#3A161B; --stage:#2A2F37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunk:#20242B; --line:#2C3139; --line-strong:#3D434D;
  --fg:#EDEEF0; --fg-2:#B4B8BF; --fg-3:#8A9099; --ink:#7FA6FF; --ink-soft:#18264A;
  --ok:#6FCF7A; --ok-soft:#17301A; --near:#E8C25A; --near-soft:#33290C; --new:#B79BF5; --new-soft:#251A3D;
  --bad:#F28B95; --bad-soft:#3A161B; --stage:#2A2F37; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
.band{background:var(--brand);color:var(--on-brand);padding:20px 16px 0}
.band-in,.wrap{max-width:1180px;margin:0 auto}
.band img{height:28px;display:block}
.band h1{font:600 30px/1.2 var(--f-head);margin:14px 0 4px}
.band p{margin:0 0 14px;opacity:.88;max-width:760px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;color:#fff;opacity:.75;font:500 14px var(--f-body);padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);opacity:1}
.tab[disabled]{opacity:.35;cursor:default}
.tab .n{font-size:12px;margin-left:6px;opacity:.8}
.wrap{padding:20px 16px 80px}
.panel[hidden]{display:none}
.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font:600 15px var(--f-body)}
.small{font-size:13px;color:var(--fg-2)} .src{font:12px/1.5 var(--f-mono);color:var(--fg-3);word-break:break-word}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
h2{font:600 22px/1.3 var(--f-head);margin:28px 0 10px}
.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--fg-2)}
.bar{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink-soft);border-color:var(--brand);color:var(--ink)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.idea .stage{border-bottom:1px solid var(--line)}
.idea .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.idea .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg-3)}
.idea .meta a{color:var(--ink)}
.stage{background:var(--stage);padding:20px;display:flex;align-items:center;justify-content:center;min-height:120px;overflow:auto}
.stage.white{background:#fff}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.item-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.item-h h3{margin:0;font:600 17px var(--f-body)}
.code{font:600 12px var(--f-mono);color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:1px 6px}
.done-dot{font-size:12px;color:var(--ok);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}
.col{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.col .cap{padding:8px 12px;font-size:13px;border-top:1px solid var(--line);background:var(--surface)}
.col .cap b{display:block;font-size:13px}
.col.ref .cap{background:var(--sunk)}
.opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.opt input{margin-top:4px}
.col.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.rec{font-size:11px;font-weight:600;color:var(--ink);margin-left:4px}
textarea{width:100%;min-height:48px;resize:vertical;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:14px/1.5 var(--f-body);background:var(--surface);color:var(--fg)}
.save{font-size:12px;color:var(--fg-3);min-height:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.block-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.block-h b{font:600 15px var(--f-body)}
.block .stage{min-height:200px;justify-content:flex-start;align-items:flex-start}
.phone{width:393px;max-width:100%;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;background:#fff;flex:none}
.demos{display:flex;gap:16px;flex-wrap:wrap}
table.t{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
table.t th{color:var(--fg-3);font-weight:600;position:sticky;top:0;background:var(--surface)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-near{background:var(--near-soft);color:var(--near)}
.c-new{background:var(--new-soft);color:var(--new)} .c-conflict{background:var(--bad-soft);color:var(--bad)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line-strong);vertical-align:-2px;margin-right:6px}
select{font:13px var(--f-body);padding:4px 6px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);max-width:220px}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;font:500 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
pre.out{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--f-mono);max-height:320px;overflow:auto}
.empty{padding:28px;text-align:center;color:var(--fg-3);background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:14px}
.rv img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.zoomov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}.zoomov img{max-width:min(1400px,96vw);max-height:92vh;border-radius:10px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.item.hl{border-color:#00A2FF;box-shadow:0 0 0 2px rgba(0,162,255,.35)}
/* tab 4: màn demo gần full bề rộng cửa sổ (web 1280 hiện đúng cỡ thật khi cửa sổ đủ rộng) để soi spacing, bo, icon, chữ;
   danh sách điểm review là lớp nổi bên phải, thu gọn / mở được (như bảng comment Figma) */
.rvleft{width:calc(100vw - 48px);margin-left:calc(50% - 50vw + 24px)}
.rvright{position:fixed;right:16px;top:72px;bottom:84px;width:420px;max-width:calc(100vw - 32px);z-index:35;background:var(--bg);
  border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:auto;padding:0 12px 12px}
.rvright .rv{grid-template-columns:1fr}
.rvright .item{padding:14px}
.rvhead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.rvhead b{flex:1}
.rvgrid.min .rvright{display:none}
.rvopen{display:none;position:fixed;right:176px;bottom:20px;z-index:40;border:0;border-radius:999px;background:var(--brand);color:#fff;
  font:600 14px var(--f-body);padding:13px 18px;box-shadow:0 6px 20px rgba(0,54,181,.35);cursor:pointer}
.rvgrid.min .rvopen{display:block}
.proto-hint{margin:-4px 0 8px;padding:6px 10px;border-radius:8px;background:var(--sunk)}
/* Thử trên màn — học /prototype-html + /wireframe-html: màn ví dụ thật (vỏ ứng dụng web/app) căn giữa như thiết bị,
   nút nổi "Bảng chọn" mở menu chọn biến thể (desktop: popover góc phải; mobile: sheet từ dưới). Bấm component trên màn cũng mở menu. */
.cfg{margin-bottom:8px}
.cfg-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.screen-tabs{display:flex;gap:6px;flex-wrap:wrap}
.desk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 16px;display:flex;justify-content:center;overflow:hidden}
.webwrap{width:100%;overflow:hidden}
.webframe{border:1px solid #D4D4D4;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 8px 32px rgba(16,24,40,.12);transform-origin:top left}
.phone{width:393px;max-width:100%;border:1px solid #D4D4D4;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 24px 64px rgba(0,0,0,.22);flex:none}
.cfg-panel{position:fixed;right:20px;bottom:84px;z-index:41;width:340px;max-width:calc(100vw - 40px);max-height:calc(100vh - 120px);background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:14px;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.cfg-panel.open{display:flex}
.cp-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-head b{font-size:14px;white-space:nowrap}.cp-head .src{font-size:11px;line-height:15px}.cp-head .x{margin-left:auto;background:none;border:0;font-size:18px;cursor:pointer;color:var(--fg)}
.cp-tabs{display:flex;border-bottom:1px solid var(--line)}
.cp-tab{flex:1;padding:9px;background:none;border:0;border-bottom:2px solid transparent;font:500 13px var(--f-body);color:var(--fg-3);cursor:pointer}
.cp-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.cp-body{overflow-y:auto;padding:12px 14px 16px}
.cp-pane[hidden]{display:none}
.cp-body h4{margin:12px 0 6px;font:600 12px var(--f-body);color:var(--fg-3);text-transform:uppercase;letter-spacing:.4px}
.cp-body h4:first-child{margin-top:0}
.dec{margin-bottom:12px}
.dec .t{font-size:13px;font-weight:600;margin-bottom:4px}
.seg.w{display:flex;flex-wrap:wrap;border:0;gap:4px}
.seg.w button{border:1px solid var(--line-strong);border-radius:8px;text-align:left;flex:1 1 auto}
.seg button[aria-pressed="true"] .rec{color:#fff;opacity:.85}
.preset{display:block;width:100%;text-align:left;margin-bottom:4px}
.preset[aria-pressed="true"]{border-color:var(--brand);background:var(--ink-soft);color:var(--ink)}
.scr-link{display:block;width:100%;text-align:left;margin-bottom:4px}
.fab{position:fixed;right:20px;bottom:20px;z-index:40;border:0;border-radius:999px;background:var(--brand);color:#fff;font:600 14px var(--f-body);padding:13px 18px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,54,181,.35);cursor:pointer}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
@media (max-width:720px){
  .cfg-panel{left:0;right:0;bottom:0;width:auto;max-width:none;max-height:75vh;border-radius:16px 16px 0 0}
  .desk{padding:12px 0;border-radius:0;border-left:0;border-right:0}
  .phone{border-radius:0;box-shadow:none;border:0}
}
/* Tab 3 — preview sống theo foundation */
.fbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.fbar .lbl{font:600 12px var(--f-body);color:var(--fg-3);text-transform:uppercase;letter-spacing:.4px}
.fmode{font:600 13px var(--f-body);padding:3px 10px;border-radius:999px;background:var(--ink-soft);color:var(--ink)}
.fmode.free{background:var(--near-soft);color:var(--near)}
.c-undecl{background:var(--bad-soft);color:var(--bad);outline:1px dashed var(--bad)}
table.t tr[data-row]{cursor:pointer} table.t tr[data-row]:hover td{background:var(--sunk)}
table.t tr.must td:first-child{box-shadow:inset 3px 0 0 var(--near)}
.arrow{color:var(--fg-3);margin:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin:6px 0}
.legend i{display:inline-block;width:14px;height:10px;border:2px dashed;vertical-align:-1px;margin-right:4px}
.warn{background:var(--near-soft);color:var(--near);border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 12px}
@media (max-width:720px){.band h1{font-size:24px}.rv{grid-template-columns:1fr}.stage{padding:12px}}
/* ===== Màn preview toàn màn hình (mặc định) — học khuôn /prototype-html: màn sản phẩm full cửa sổ, nút tròn góc dưới phải
   mở bảng nổi điều hướng (Bước · Màn & kịch bản · Chọn · Hiển thị). Trang tab chi tiết chỉ để đối chiếu. ===== */
body.focus{overflow:hidden}
body.focus .band,body.focus .status,body.focus #out,body.focus .rvopen,body.focus .rvright{display:none!important}
body.focus .wrap{max-width:none;padding:0}
body.focus .panel>*{display:none!important}
body.focus .panel>.cfg,body.focus .panel>.rvgrid{display:block!important}
body.focus .rvgrid>:not(.rvleft){display:none!important}
body.focus .rvleft{width:auto;margin:0}
body.focus .cfg>:not([id^="cfg-view-"]){display:none!important}
body.focus [id^="cfg-view-"]>.small{display:none}
body.focus [id^="cfg-view-"] .desk{position:fixed;inset:0;z-index:20;margin:0;padding:0;border:0;border-radius:0;overflow:auto;background:#E9EAEC}
body.focus [id^="cfg-view-"] .desk:has(.phone){display:flex;justify-content:center;align-items:flex-start;padding:24px 0 96px}
body.focus .webwrap{height:auto!important}
body.focus .webframe{border:0;border-radius:0;box-shadow:none;transform:none!important;min-height:100vh}
#fx-fab{display:none;position:fixed;right:20px;bottom:20px;z-index:60;width:52px;height:52px;border-radius:999px;border:0;background:#171717;color:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;align-items:center;justify-content:center}
#fx-fab svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
#cmt-before-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:999px;background:#7C3AED;color:#fff;font:500 13px/18px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#cmt-before-bar button{border:0;border-radius:999px;background:#fff;color:#5B21B6;font:600 13px/18px Inter,system-ui,sans-serif;padding:6px 12px;cursor:pointer}
#fx-fab b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#E11D48;color:#fff;font:700 11px/20px Inter;padding:0 5px}
body.focus #fx-fab{display:flex}
/* toàn màn · xem Bảng biến thể (nút trong "Màn & kịch bản") */
body.focus.fxblk .panel:not([hidden]){position:fixed;inset:0;z-index:20;overflow:auto;background:#E9EAEC;padding:24px 24px 120px}
body.focus.fxblk .panel>.cfg{display:none!important}
body.focus.fxblk .panel>.block{display:block!important;max-width:1400px;margin:0 auto 20px}
.fx-miss{margin-top:6px;padding:6px 8px;border-radius:8px;background:#FEF3F2;color:#B42318;font-size:12px}
#fx-panel{display:none;position:fixed;right:16px;top:16px;bottom:84px;z-index:61;width:400px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--fg);
  border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.28);flex-direction:column;overflow:hidden;font:14px/1.45 var(--f-body)}
#fx-panel.open{display:flex}
.fx-h{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 8px}
.fx-h .k{font:600 11px var(--f-body);letter-spacing:.5px;text-transform:uppercase;color:var(--fg-3)}
.fx-h b{display:block;font:600 16px var(--f-head)}
.fx-h .x{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:var(--fg-2)}
.fx-tabs{display:flex;border-bottom:1px solid var(--line)}
.fx-tabs button{flex:1;padding:10px 4px;border:0;background:none;font:500 13px var(--f-body);color:var(--fg-3);border-bottom:2px solid transparent;cursor:pointer}
.fx-tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.fx-b{flex:1;overflow:auto;padding:10px 14px 14px}
.fx-f{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px}
.fx-f .btn{flex:1}
.fx-g{font:600 11px var(--f-body);letter-spacing:.5px;text-transform:uppercase;color:var(--fg-3);margin:14px 0 6px}
.fx-i{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font:14px var(--f-body)}
.fx-i:hover{background:var(--sunk)}
.fx-i[aria-current="true"]{background:var(--ink-soft);color:var(--ink);font-weight:600}
.fx-i.sub{padding-left:24px;font-size:13px}
.fx-i .tg{margin-left:auto;font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--fg-3)}
.fx-c{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.fx-c.on{border-color:#00A2FF;box-shadow:0 0 0 2px rgba(0,162,255,.3)}
.fx-c .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.fx-c .tt{margin:4px 0;font-size:13px}
.pill.grp{background:#EEF4FF;color:#3538CD}
.kit summary{cursor:pointer;font-size:13px}.kit-stale{margin:8px 0;padding:6px 10px;border-radius:8px;background:#FEF3F2;color:#B42318;font-size:12px;font-weight:600}
.kit-i.st{outline:1.5px solid #D92D20}.inh{background:#F5F3FF;border-color:#DDD6FE}.inh-i{font-size:12px;margin-top:4px}.kit-nd{color:#B54708;font-weight:600}.kit-ok{color:#067647;font-weight:600}
.kit-g{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}.kit-i{font-size:12px;border-radius:999px;padding:2px 8px;background:#ECFDF3;color:#067647}
.kit-i.nd{background:#FFFAEB;color:#93370D}.kit-i i{font-style:normal;font-weight:600}.fx-grp b{font-weight:700;margin-left:2px}
.fx-c .rule{font-size:12px;color:var(--fg2);margin-top:2px}
/* góp ý của người dùng vs phần Claude sửa — 2 khối tách màu, có nhãn; **từ khoá** trong trả lời → mark */
.cm-more{margin-top:6px;border:1px dashed #7C3AED;background:#fff;color:#5B21B6;border-radius:8px;padding:5px 10px;font:600 12px var(--f-body);cursor:pointer}
.cm-rev{border-color:#B54708;color:#B54708;margin-left:4px}.cm-u.rev{background:#FFFAEB;border-left-color:#DC6803}.cm-u.rev .cm-lb{color:#B54708}
.cm-new textarea{width:100%;min-height:60px;margin-top:6px}.cm-t{font-weight:400;text-transform:none;letter-spacing:0;opacity:.7}
.cm-u,.cm-c{border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px;line-height:1.5}
.cm-u{background:#F5F3FF;border-left:3px solid #7C3AED}
.cm-c{background:#ECFDF3;border-left:3px solid #079455}
.cm-c.todo{background:#FFFAEB;border-left-color:#DC6803}
.cm-lb{display:flex;align-items:center;gap:6px;font:600 11px/16px var(--f-body);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.cm-u .cm-lb{color:#5B21B6}.cm-c .cm-lb{color:#05603A}.cm-c.todo .cm-lb{color:#B54708}
.cm-c mark,.cm-u mark{background:#FEF0C7;color:inherit;padding:0 2px;border-radius:3px;font-weight:600}
.fx-c .ba{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fx-c .op{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fx-c .op button,.fx-seg button{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 9px;font:12px var(--f-body);cursor:pointer;text-align:left}
.fx-c .op button[aria-pressed="true"],.fx-seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.fx-c .mini{border:0;background:none;color:var(--ink);font:500 12px var(--f-body);cursor:pointer;padding:2px 4px}
.fx-c .mini[aria-pressed="true"]{background:var(--ink-soft);border-radius:6px}
.fx-c textarea{width:100%;min-height:30px;margin-top:6px;font:12px var(--f-body)}
.fx-seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fx-note{font-size:12px;color:var(--fg-3);margin:0 0 8px}
#fx-back{display:none;position:fixed;left:20px;bottom:20px;z-index:60} /* góc trái: góc phải là nút "Bảng chọn" */
body:not(.focus) #fx-back{display:block}
@media (max-width:720px){#fx-panel{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:78vh;border-radius:16px 16px 0 0}}

/* Preset chuyển động (DEC-336): chỉ dùng biến thời gian nên giảm chuyển động tự về 0 */
@keyframes inv-fade-in { from { opacity: 0; } to { opacity: 1; } }
.anim-fade-in { animation: inv-fade-in var(--duration-fast) var(--easing-standard) both; }
@keyframes inv-pop { from { transform: scale(0); } to { transform: none; } }
.anim-pop { animation: inv-pop var(--duration-medium) var(--easing-standard) both; }
@keyframes inv-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.anim-draw { stroke-dasharray: 1; animation: inv-draw var(--duration-medium) var(--easing-standard) both; }
@keyframes inv-swap { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }
.anim-swap { animation: inv-swap var(--duration-fast) var(--easing-standard) both; }
@keyframes inv-flash { 0%, 66% { background-color: var(--color-utility-blue-50); } 100% { background-color: transparent; } }
.anim-flash { animation: inv-flash calc(var(--duration-slow) * 3) linear both; }
.anim-expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--duration-exit) var(--easing-exit); }
.anim-expand[data-open="true"] { grid-template-rows: 1fr; transition: grid-template-rows var(--duration-medium) var(--easing-standard); }
.anim-expand > * { overflow: hidden; min-height: 0; }
.anim-glide { transition: transform var(--duration-medium) var(--easing-standard); }
@keyframes inv-grow { from { transform: scaleY(0); } to { transform: none; } }
.anim-grow { transform-origin: bottom; animation: inv-grow var(--duration-medium) var(--easing-standard) both; }

/* ---- tab 3: Đối chiếu foundation ----
   Trên cùng: preview sống (màn demo + bảng biến thể) nạp tokens.css. Ba chế độ:
     free    = bản tự do đã duyệt ở tab 2 (không ghi đè)
     current = theo lựa chọn hiện tại trong bảng (đổi lựa chọn là hình đổi ngay)
     tokens  = tất cả kéo về token có sẵn (để thấy "nếu không tạo token mới thì trông thế nào")
   Mỗi dòng check.json có sel + cssProps → ghi đè `sel{prop: var(--token) !important}`. */
const CAT={ok:["✅ Khớp","c-ok"],near:["↔ Lệch nhỏ","c-near"],new:["＋ Cần token mới","c-new"],conflict:["⛔ Xung đột luật","c-conflict"],undeclared:["⛔ Chưa khai","c-undecl"]};
const FOPT={ok:r=>[`Theo foundation mới: ${r.bind?.token||""}`,"Giữ như đã duyệt"],near:r=>r.isVar?[`Theo foundation mới: ${r.to?.token||""}`,`Giữ số cũ ${r.value}, tạo token mới`]:[`Kéo về ${r.to?.token||"token đề xuất"}`,"Tạo token mới theo preview"],
  new:r=>r.proposal?(r.proposal.opts||[`Thêm token ${r.proposal.token} = ${r.value}`]):r.to?["Thêm token mới (giữ hình preview)",`Sửa preview theo ${r.to.token}`]:["Thêm token mới (giữ hình preview)"],
  conflict:r=>[`Sửa theo luật${r.fix?.token?" → "+r.fix.token:""}`,"Đổi luật foundation (ghi DEC)","Ngoại lệ cho component này"]};
const FMODES=[["free","Tự do (bản tab 2)"],["current","Theo lựa chọn hiện tại"],["tokens","Tất cả về token có sẵn"]];
let fFilter="open", fMode="current", fMark=true, fSoiMark=true, fFlash=null, fBlink=null, FOV_CSS="", fPeek=null;
const ROWS=()=>(CHECK?.rows||[]).filter(r=>r.cat!=="undeclared");
const fch=r=>state["foundation-"+r.id]?.choice;
/* giá trị CSS của một dòng ở một chế độ; null = giữ hình tự do */
function fval(r,mode){
  if(r.isVar) return mode==="free"||fch(r)===1?r.value:null; /* rà vòng 3: trang đã vẽ theo token mới, chỉ ghi đè khi cần xem số cũ */
  if(mode==="free"||!r.sel) return null; const c=fch(r);
  if(r.cat==="ok") return r.bind?.css||null;
  if(r.cat==="near") return mode==="tokens"||c===0||c==null?(r.to?.css||null):null;
  if(r.cat==="new") return mode==="tokens"||c===1?(r.to?.css||null):null;
  if(r.cat==="conflict") return mode==="tokens"?(r.fix?.css||r.to?.css||null):(c===0?(r.fix?.css||null):null);
  return null;}
/* sau khi ghi đè, hình có khác bản tự do không (để tô viền) */
const fchanged=(r,mode)=>fval(r,mode)!=null&&r.cat!=="ok";
/* soi dòng trạng thái tương tác (:hover, :focus…): trang không ở trạng thái đó → bỏ giả lớp để tô đúng phần tử (user 29/10) */
const soiSel=S=>S.replace(/:is\((?=[^)]*:(?:hover|focus|active))[^)]*\)/g,"").replace(/:(?:hover|focus-visible|focus-within|focus|active)\b/g,"").replace(/::?(?:after|before|placeholder|marker)\b/g,"");
/* trạng thái do tương tác bật trên .pv (data-ck, data-sbr, data-state…) — soi thì đặt sẵn để thấy phần tử; bỏ D* (phương án), platform, theme */
function fxAttrs(sel){const out=[]; splitSel(sel).forEach(x=>{const m=x.match(/^\.pv((?:\[[^\]]+\])+)/); if(!m) return; const a={};
  for(const [,k,v] of m[1].matchAll(/\[data-([\w-]+)(?:=\"?([^\]"]*)\"?)?\]/g)){if(/^(platform|theme|D\d+)$/.test(k)) continue; a[k]=v??"";} if(Object.keys(a).length) out.push(a);}); return out;}
/* r.soi (khai ở values): {state, set:{attr:v}, add:{"<sel>":"<class>"}} — bật trạng thái tương tác để thấy phần tử */
function fxSets(r){const out=[]; const so=r.soi; if(so&&(so.state||so.set)) out.push({...(so.state?{state:so.state}:{}),...(so.set||{})}); return out.concat(fxAttrs(selStr(r)));}
function fxAdd(root,add){const done=[]; Object.entries(add||{}).forEach(([q,c])=>{let e=null; try{e=root.querySelector(q)}catch(_){}; if(e&&!e.classList.contains(c)){e.classList.add(c); done.push([e,c]);}}); return ()=>done.forEach(([e,c])=>e.classList.remove(c));}
function fxTry(root,S,sets,add){if(!root) return null; let el=fxFind(root,S); if(el) return el; const pv=root.querySelector(".pv"); if(!pv) return null;
  const undo=fxAdd(root,add); el=fxFind(root,S); if(el) return el;
  for(const a of sets){const old={}; Object.keys(a).forEach(k=>{old[k]=pv.getAttribute("data-"+k); pv.setAttribute("data-"+k,a[k]);});
    el=fxFind(root,S); if(el) return el; Object.keys(a).forEach(k=>old[k]==null?pv.removeAttribute("data-"+k):pv.setAttribute("data-"+k,old[k]));}
  undo(); return null;}
function splitSel(sel){const out=[];let d=0,cur="";for(const ch of sel){if(ch==="("||ch==="[")d++;if(ch===")"||ch==="]")d--;if(ch===","&&!d){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out.map(x=>x.trim()).filter(Boolean);}
const selStr=r=>Array.isArray(r.sel)?r.sel.join(","):(r.sel||"");
function scopeSel(sel,r){const plat=/^(web|mobile)$/i.test(r.platform||"")?`[data-platform="${r.platform.toLowerCase()}"]`:"";
  return splitSel(sel).map(x=>{const g=/data-platform/.test(x)?"":plat; return /^\.pv(?![\w-])/.test(x)?x.replace(/^\.pv/,".pv"+g):`.pv${g} ${x}`;}).join(",");}
function buildFov(mode,marks=true){
  const css=[]; const mk=[];
  ROWS().forEach(r=>{let v=fval(r,mode);
    if(fPeek&&fPeek.id===r.id) v=fPeek.side==="after"?(((r.cat==="conflict"?r.fix:r.to)||r.bind)?.css||null):(r.isVar?r.value:null);
    if(v==null) return; if(r.tpl) v=r.tpl.replace("$",v); const S=scopeSel(selStr(r),r);
    const fs=r.fix?.set&&v===r.fix.css?r.fix.set:null; /* tổ hợp chữ: đổi cả cỡ chữ và cao dòng */
    css.push(`${S}{${fs?Object.entries(fs).map(([p,x])=>`${p}:${x} !important`).join(";"):(r.cssProps||[r.prop]).map(p=>`${p}:${v} !important`).join(";")}}`);
    if(marks&&fMark&&mode!=="free"&&fchanged(r,mode)&&!(r.cssProps||[]).every(p=>p.startsWith("--"))&&!/^\.pv$/.test(selStr(r).trim())){
      const und=r.must&&fch(r)==null; mk.push(`${S}{outline:2px dashed ${und?"#D97706":"#E11D48"} !important;outline-offset:1px}`);}});
  if(marks&&fSoiMark&&fFlash){const r=ROWS().find(x=>x.id===fFlash); if(r?.sel||r?.at) mk.push(`${soiSel(scopeSel(r.at||selStr(r),r))}{outline:1.5px solid #00A2FF !important;outline-offset:4px}`);}
  return css.join("\n")+"\n"+mk.join("\n");}
function refreshFov(){FOV_CSS=buildFov(fMode); document.querySelectorAll(".fovhost").forEach(h=>{const st=h.shadowRoot?.querySelector("style[data-fov]"); if(st) st.textContent=h.id==="cfg-host-review"?rvCss():FOV_CSS;});
  const m=document.getElementById("fmode-now"); if(m){m.textContent=FMODES.find(x=>x[0]===fMode)[1]; m.classList.toggle("free",fMode==="free");}
  document.querySelectorAll("#fmode button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===fMode)));}
function onChoice(key){if(String(key).startsWith("review-")){refreshRv(); return;} if(!String(key).startsWith("foundation-")) return; refreshFov(); renderFSummary();
  const r=ROWS().find(x=>"foundation-"+x.id===key); const cell=document.getElementById("after-"+key); if(r&&cell) cell.innerHTML=afterCell(r);}
const swatch=v=>/^#/.test(String(v))?`<span class="sw" style="background:${esc(v)}"></span>`:"";
const showV=v=>v==null?"":`${swatch(v)}<code>${esc(typeof v==="number"?v:String(v))}</code>`;
function afterCell(r){const c=fch(r);
  if(r.cat==="ok") return `<code>${esc(r.bind?.token||"")}</code>`;
  if(r.cat==="near"&&c==null&&!r.visible) return `${showV(r.to?.value)} <code>${esc(r.to?.token||"")}</code><div class="small">tự kéo về (không thấy khác)</div>`;
  if(c==null) return `<span class="small">chưa chọn</span>`;
  const v=fval(r,"current"); if(v==null) return `${showV(r.value)} <span class="small">${r.cat==="conflict"?(c===1?"đổi luật":"ngoại lệ"):"token mới"}</span>`;
  const t=r.cat==="conflict"?r.fix:r.to; return `${showV(t?.value)} <code>${esc(t?.token||"")}</code>`;}
function renderFSummary(){const el=document.getElementById("fsum"); if(!el) return;
  const ch=ROWS().filter(r=>fchanged(r,"current")&&(r.visible||r.cat!=="near"));
  const nt=ROWS().filter(r=>(r.cat==="near"&&fch(r)===1)||(r.cat==="new"&&fch(r)===0));
  const pend=ROWS().filter(r=>r.must&&fch(r)==null);
  el.innerHTML=`<div class="legend"><span><b>${ch.length}</b> chỗ đổi hình so với bản tự do</span><span><b>${nt.length}</b> token mới sẽ tạo</span><span><b>${pend.length}</b> dòng phải chọn còn trống</span>
   <span><i style="border-color:#E11D48"></i>đã đổi theo token</span><span><i style="border-color:#D97706"></i>đổi tạm (chưa chọn)</span><span><i style="border-color:#00A2FF;border-style:solid"></i>dòng đang soi</span></div>
   ${ch.length?`<div class="tbl"><table class="t"><thead><tr><th>Phần · thuộc tính</th><th>Nền tảng</th><th>Trước (tự do)</th><th>Sau (theo lựa chọn)</th></tr></thead><tbody>${ch.map(r=>{const t=r.cat==="conflict"?r.fix:r.to;
     return `<tr data-row="${esc(r.id)}"><td>${esc(r.part||"")} · <b>${esc(r.prop)}</b>${r.state?` <span class="small">(${esc(r.state)})</span>`:""}</td><td>${esc(r.platform)}${r.theme==="Dark"?" · Dark":""}</td><td>${showV(r.value)}</td><td>${showV(t?.value)} <code>${esc(t?.token||"")}</code>${r.must&&fch(r)==null?' <span class="pill c-near">chưa chọn</span>':""}</td></tr>`;}).join("")}</tbody></table></div>`:""}`;
  bindRowFlash(el);}
function bindRowFlash(root){root.querySelectorAll("tr[data-row]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("select,textarea,input,label")) return;
  fxSoi(tr.dataset.row).then(hit=>{if(hit==="miss") alert0(tr); else if(hit==="screen") document.getElementById("fstage")?.scrollIntoView({behavior:"smooth",block:"start"});});});}
function alert0(tr){tr.querySelector(".fx-miss")||tr.children[1]?.insertAdjacentHTML("beforeend",`<div class="fx-miss">Không thấy phần này trên màn demo nào hay bảng biến thể.</div>`);}

     <label class="small" title="Viền đỏ / cam quanh chỗ đổi so với bản tự do"><input type="checkbox" id="fmark" ${fMark?"checked":""}> Viền chỗ đổi</label>
     <label class="small" title="Viền xanh quanh phần tử của dòng đang Soi"><input type="checkbox" id="fsoimark" ${fSoiMark?"checked":""}> Viền chỗ đang soi</label>
     <div class="seg" id="th3"><button data-t="light" aria-pressed="${theme==="light"}">Light</button><button data-t="dark" aria-pressed="${theme==="dark"}">Dark</button></div></div></div>

  h+=`<h2>Trước → Sau</h2><div id="fsum"></div>`;
  h+=`<h2>Từng giá trị <span class="small">so với <code>design-system/tokens.json</code> bản ${esc(CHECK.tokens_version||"")} và luật foundations</span></h2>
  <div class="filters" id="ff">${[["open","Cần quyết"],["undeclared","Chưa khai"],["near","Lệch nhỏ"],["ok","Khớp"],["all","Tất cả"]].map(([k,l])=>`<button class="chip" aria-pressed="${fFilter===k}" data-k="${k}">${l}</button>`).join("")}</div>
  <div class="tbl"><table class="t"><thead><tr><th>Mã</th><th>Phần · thuộc tính</th><th>Nền tảng</th><th>Preview</th><th>Nhóm</th><th>Token / luật</th><th>Sau</th><th>Quyết định</th></tr></thead><tbody>`;
  const vis=rows.filter(r=>fFilter==="all"||(fFilter==="open"?(r.must&&fch(r)==null)||r.cat==="undeclared":r.cat===fFilter));
  h+=vis.map(r=>{const key="foundation-"+r.id; const s=state[key]||{}; const o=r.must&&FOPT[r.cat]?FOPT[r.cat](r):null; const und=r.cat==="undeclared";

    <td>${esc(r.platform)}${r.size?" · "+esc(r.size):""}${r.theme==="Dark"?" · Dark":""}</td>

    <td><span class="pill ${CAT[r.cat][1]}">${CAT[r.cat][0]}</span>${r.cat==="near"&&!r.visible?'<div class="small">không thấy khác</div>':""}</td>
    <td class="small">${r.appr?`<div><b>Đã duyệt:</b> ${esc(r.appr)}${r.gap&&r.gap!=="none"?` · <b>Gap:</b> ${esc(r.gapLabel||r.gap)}`:""}</div>`:""}${r.rules?.length?r.rules.map(esc).join("<br>"):(r.tokens?.length?`<code>${r.tokens.map(esc).join("</code>, <code>")}</code>`:"")}${r.suggest&&r.cat!=="ok"?`<div>Token có sẵn gần nhất <code>${esc(r.suggest)}</code></div>`:""}${r.note?`<div>${esc(r.note)}</div>`:""}</td>
    <td id="after-${key}">${und?"":afterCell(r)}</td>
    <td>${o?`<select data-key="${key}"><option value="">— chọn —</option>${o.map((x,i)=>`<option value="${i}" ${s.choice===i?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <textarea id="n-${key}" placeholder="Ghi chú (vd tên token mới)" style="min-height:34px;margin-top:6px">${esc(s.note||"")}</textarea><div class="save" id="st-${key}"></div>`:(und?'<span class="small">Claude sửa page.json</span>':`<textarea id="n-${key}" placeholder="Ghi chú (tuỳ chọn)" style="min-height:34px">${esc(s.note||"")}</textarea><div class="save" id="st-${key}"></div>`)}</td></tr>`;}).join("")||`<tr><td colspan="8" class="small">Không có dòng nào ở nhóm này.</td></tr>`;

/* ---- tab 4: Review Figma ----
   Màn demo dựng lại đúng bản đưa lên Figma: preview tab 2 + token "Theo lựa chọn hiện tại" của tab 3. Mỗi điểm review có thể khai
   sel (phần tử trên màn) · screen (id màn) · state · pick (biến thể) để ghim và nhảy tới; after = CSS "sau khi sửa";
   markup thêm cho bản sửa đánh data-fix="R2" trong screens (ẩn ở mọi tab, hiện khi điểm đó được sửa); phần bị thay đánh
   data-unfix="R2" (hiện ở mọi tab, ẩn khi điểm đó được sửa). Đổi chữ dùng cặp này, đừng dùng CSS content. */
const RVMODES=[["now","Figma hiện tại"],["pick","Sau khi sửa · theo lựa chọn"],["all","Sau khi sửa · tất cả"]];
let rvFilter="", rvMode="now", rvFlash=null, rvPins=true, rvOpen=true;
try{rvOpen=localStorage.getItem(LS+"-rvopen")!=="0"}catch(e){}
function setRvOpen(o){rvOpen=o; document.querySelector("#p-review .rvgrid")?.classList.toggle("min",!o);
  try{localStorage.setItem(LS+"-rvopen",o?"1":"0")}catch(e){} if(o) openPanel("review",null,false);}
const RV_PIN_CSS=`.rvpin{position:absolute;z-index:99;min-width:22px;height:22px;padding:0 5px;border-radius:11px 11px 11px 2px;color:#fff;font:700 11px/22px Inter,system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #fff;transform-origin:bottom left}
.rvpin.Cao{background:#E11D48}.rvpin.Trung{background:#D97706}.rvpin.Thấp{background:#0E7490}.rvpin.on{outline:3px solid #00A2FF;outline-offset:1px}`;
const rvFixOn=r=>rvMode==="all"||(rvMode==="pick"&&state["review-"+r.id]?.choice===0);
function rvScope(sel){return splitSel(sel).map(x=>/^\.pv(?![\w-])/.test(x)?x:`.pv ${x}`).join(",");}
function rvCss(){const rv=PAGE.reviews||[]; const on=rvMode==="now"?[]:rv.filter(rvFixOn);
  const fl=rv.find(x=>x.id===rvFlash);
  return (CHECK?buildFov("current",false):"")+"\n"+on.map(r=>r.after||"").join("\n")+"\n"
    +on.map(r=>`.pv [data-fix~="${r.id}"]{display:revert!important}.pv [data-unfix~="${r.id}"]{display:none!important}`).join("\n")+"\n"
    +(fl?.sel?`${rvScope(fl.sel)}{outline:3px solid #00A2FF!important;outline-offset:2px}`:"");}
function refreshRv(){const h=document.getElementById("cfg-host-review"); const st=h?.shadowRoot?.querySelector("style[data-fov]"); if(st) st.textContent=rvCss();
  document.querySelectorAll("#rvmode button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===rvMode)));
  const n=document.getElementById("rvmode-now"); if(n) n.textContent=RVMODES.find(x=>x[0]===rvMode)[1];
  requestAnimationFrame(placePins);}
function placePins(){const host=document.getElementById("cfg-host-review"); const sr=host?.shadowRoot; if(!sr) return;
  sr.querySelectorAll(".rvpin").forEach(x=>x.remove()); const vis=document.getElementById("rv-vis"); if(!rvPins){if(vis) vis.textContent=""; return;}
  const hr=host.getBoundingClientRect(); const k=hr.width/(host.offsetWidth||1)||1; let n=0;
  const scId=(PAGE.screens||[])[CFG.review.screen]?.id;
  (PAGE.reviews||[]).forEach(r=>{if(!r.sel) return; if(rvFilter&&r.agent!==rvFilter) return;
    if(r.screen&&r.screen!==scId) return; if(r.state&&r.state!==CFG.review.state) return;
    const el=[...sr.querySelectorAll(rvScope(r.sel))].find(x=>{const b=x.getBoundingClientRect(); return b.width>0&&b.height>0;}); if(!el) return;
    const b=el.getBoundingClientRect(); const p=document.createElement("div"); n++;
    p.className=`rvpin ${r.severity||""}${rvFlash===r.id?" on":""}`; p.textContent=r.id; p.title=r.text.replace(/<[^>]+>/g,"");
    p.style.left=Math.min((b.right-hr.left)/k-4,host.offsetWidth-34)+"px"; p.style.top=Math.max(2,(b.top-hr.top)/k-18)+"px"; p.style.transform=`scale(${1/k})`;
    p.onclick=e=>{e.stopPropagation(); rvFocus(r.id,false);}; sr.appendChild(p);});
  if(vis) vis.textContent=n?`${n} điểm ghim được trên màn + trạng thái này`:"Không điểm nào nằm trên màn + trạng thái này — bấm “Xem trên hình” ở từng điểm";}
function rvFocus(id,go){const r=(PAGE.reviews||[]).find(x=>x.id===id); if(!r) return; rvFlash=rvFlash===id&&!go?null:id;
  if(document.body.classList.contains("focus")){if(!go){rvFlash=id; fxOpen("choose"); refreshRv();
    requestAnimationFrame(()=>document.getElementById("fxr-"+id)?.scrollIntoView({block:"center"})); return;}}
  else if(!go&&!rvOpen) setRvOpen(true);
  if(go){const si=r.screen!=null?(PAGE.screens||[]).findIndex(s=>s.id===r.screen):-1;

function cmtTarget(e,sr){const pv=sr.querySelector(".pv"); for(const n of e.composedPath()){if(n===pv||n===sr) return null;

  showTab(t);
}
