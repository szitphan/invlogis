<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross Process Flow — SRS Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --color-primary: #262626;
      --color-primary-muted: #f1f1f1;
      --color-canvas: #ffffff;
      --color-surface: #fafafa;
      --color-surface-strong: #f3f3f5;
      --color-ink: #181a20;
      --color-muted: #707a8a;
      --color-hairline: #eaecef;
      --color-link: #2563eb;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-surface);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-hairline);
      padding: 24px 16px;
    }
    aside h2 { font-size: 14px; text-transform: uppercase; color: var(--color-muted); margin: 0 0 12px; letter-spacing: .03em; }
    aside nav ol, aside nav ul { list-style: none; padding: 0; margin: 0; }
    .toc-controls { display: flex; gap: 6px; margin-bottom: 12px; }
    .toc-controls button {
      flex: 1; font-size: 11px; color: var(--color-muted); background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toc-controls button:hover { background: var(--color-surface-strong); color: var(--color-ink); }
    /* TOC nested đa cấp (H2→H3→H4) — thụt lề + cỡ chữ theo cấp. */
    aside nav li.toc-item { list-style: none; }
    aside nav li.toc-item > .toc-row { display: flex; align-items: flex-start; border-radius: 6px; }
    aside nav li.toc-item > .toc-row:hover { background: var(--color-surface); }
    aside nav li.toc-item > .toc-row > a { flex: 1; display: block; text-decoration: none; padding: 5px 8px; line-height: 1.4; }
    aside nav .toc-children { margin: 0; padding: 0; }
    aside nav li.collapsed > .toc-children { display: none; }
    /* Cấp 2 (section chính) */
    aside nav > li.toc-item { margin-top: 12px; }
    aside nav > li.toc-item:first-child { margin-top: 0; }
    aside nav > li.toc-item[data-level="2"] > .toc-row > a { font-weight: 600; font-size: 13px; color: var(--color-ink); }
    aside nav > li.toc-item[data-level="2"].active > .toc-row { background: var(--color-primary-muted); }
    /* Cấp 3 */
    aside nav li.toc-item[data-level="3"] { margin-left: 12px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="3"] > .toc-row > a { font-size: 12px; color: var(--color-muted); }
    /* Cấp 4 */
    aside nav li.toc-item[data-level="4"] { margin-left: 22px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="4"] > .toc-row > a { font-size: 11.5px; color: var(--color-muted); opacity: .9; }
    aside nav li.toc-item.active > .toc-row > a { color: var(--color-ink); font-weight: 600; }
    aside nav .toggle { cursor: pointer; user-select: none; color: var(--color-muted); width: 14px; flex: 0 0 14px; text-align: center; padding-top: 5px; transition: transform .15s; }
    aside nav .toggle.leaf { visibility: hidden; }
    aside nav li.collapsed > .toc-row > .toggle { transform: rotate(-90deg); }
    main { padding: 40px 60px; max-width: 1100px; }
    main h1 { font-size: 32px; border-bottom: 2px solid var(--color-ink); padding-bottom: 12px; }
    main h2 { font-size: 24px; margin-top: 40px; border-bottom: 1px solid var(--color-hairline); padding-bottom: 6px; }
    main h3 { font-size: 18px; margin-top: 28px; color: var(--color-ink); }
    main h4 { font-size: 16px; margin-top: 20px; }
    main p, main li { font-size: 14px; }
    main code { font-family: var(--font-mono); font-size: 13px; background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }
    main pre { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 13px; }
    main pre.mermaid { background: var(--color-canvas); text-align: center; }
    main .mermaid svg { cursor: zoom-in; transition: filter .15s; max-width: 100%; }
    main img.embedded-img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
    main .mermaid svg:hover { filter: drop-shadow(0 0 6px rgba(252, 213, 53, .5)); }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
    main th, main td { border: 1px solid var(--color-hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
    main th { background: var(--color-surface); font-weight: 600; }
    main a { color: var(--color-link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main hr { border: none; border-top: 1px solid var(--color-hairline); margin: 32px 0; }
    main blockquote { border-left: 4px solid var(--color-primary); margin: 16px 0; padding: 8px 16px; background: var(--color-surface); color: var(--color-muted); }
    main details.inline-screen { border: 1px solid var(--color-hairline); border-radius: 8px; padding: 0; margin: 16px 0; background: var(--color-canvas); overflow: hidden; }
    main details.inline-screen[open] { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    main details.inline-screen > summary { cursor: pointer; padding: 12px 16px; background: var(--color-surface); font-size: 14px; user-select: none; border-bottom: 1px solid transparent; }
    main details.inline-screen[open] > summary { border-bottom-color: var(--color-hairline); }
    main details.inline-screen > summary:hover { background: var(--color-surface-strong); }
    main details.inline-screen > summary code { background: var(--color-canvas); border: 1px solid var(--color-hairline); }
    main details.inline-screen > *:not(summary) { padding-left: 16px; padding-right: 16px; }
    main details.inline-screen pre { margin: 8px 0; }
    .wf-src-tag { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
    /* HTML wireframe embed — CSS chi tiết đến từ style GỐC của file wireframe (scope .wf-embed,
       xem extract_scoped_wireframe_css) nên font-size/spacing GIỐNG bản /wireframe-html. Ở đây chỉ
       reset kế thừa + layout container để không bị body preview đè. */
    main .wf-embed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; font-size: 12px; line-height: 1.4; }
    main .wf-embed * { box-sizing: border-box; }
    main .wf-embed .wf-screen { display: inline-block; vertical-align: top; max-width: 100%; }
    main .wf-embed .wf-step-badge { display: none; }
    .meta { color: var(--color-muted); font-size: 13px; margin-bottom: 24px; }
    /* Cover page (export) — khối bìa căn giữa, viền dưới ngăn cách với nội dung. */
    main .cover { text-align: center; padding: 48px 24px 40px; margin-bottom: 24px; border-bottom: 2px solid var(--color-hairline); }
    main .cover h1 { border: none; font-size: 34px; }
    main .cover h2 { border: none; color: var(--color-muted); font-weight: 500; font-size: 17px; margin-top: 4px; }
    main .cover p { font-size: 15px; line-height: 2; }

    /* Mermaid zoom modal */
    .mermaid-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; animation: fadeIn 0.2s ease-out;
    }
    .mermaid-modal.open { display: flex; }
    .modal-svg {
      width: 95vw; height: 90vh; border-radius: 8px;
      background: var(--color-canvas); padding: 2rem; box-sizing: border-box;
      overflow: hidden;
    }
    .modal-svg svg { display: block; max-width: none !important; max-height: none !important; width: 100% !important; height: 100% !important; }
    .modal-toolbar {
      position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;
    }
    .modal-toolbar button {
      width: 40px; height: 40px; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: 6px; font-size: 1.2rem; cursor: pointer; color: var(--color-ink);
    }
    .modal-toolbar button:hover { background: var(--color-surface); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    footer { padding: 24px 60px; border-top: 1px solid var(--color-hairline); color: var(--color-muted); font-size: 13px; background: var(--color-canvas); }
    footer code { font-family: var(--font-mono); background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-hairline); }
      main { padding: 24px; }
      footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h2>Cross Process Flow</h2>
      <div class="meta">SRS Preview · 2026-10-13</div>
      <nav>
        <div class="toc-controls">
          <button type="button" onclick="setAllTocCollapsed(false)">Expand all</button>
          <button type="button" onclick="setAllTocCollapsed(true)">Collapse all</button>
        </div>
        <ol id="toc"></ol>
      </nav>
    </aside>
    <main id="content"></main>
  </div>

  <!-- Mermaid zoom modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div class="modal-toolbar">
      <button onclick="modalPanZoom && modalPanZoom.zoomIn()" title="Zoom in">＋</button>
      <button onclick="modalPanZoom && modalPanZoom.zoomOut()" title="Zoom out">－</button>
      <button onclick="modalPanZoom && (modalPanZoom.resetZoom(), modalPanZoom.center(), modalPanZoom.fit())" title="Reset">⟲</button>
      <button onclick="closeMermaidModal()" title="Close (ESC)">✕</button>
    </div>
    <div class="modal-svg"></div>
  </div>

  <footer><p>Workflow: edit MD source → save → chạy <code>python3 _scripts/build-preview.py cross-process-flow</code> để regen → refresh browser.</p></footer>

  <script>
    const OFFLINE = false;
    let modalPanZoom = null;

    // === Markdown parsing (CHỈ online — offline đã render sẵn server-side) ===
    if (!OFFLINE) {
      const MD_SOURCE = "# Cross Process Flow — SRS Preview\n\n> Active work viewer · Generated 2026-10-13\n\n## 1. Tổng quan nhanh\n\n> Liếc nhanh quy mô SRS. Chi tiết từng mục ở section **SRS Spec** bên dưới.\n\n| Loại | Số lượng |\n|---|---|\n| Functional Requirements (FR) | 22 (P0: 22) |\n| Non-Functional Requirements (NFR) | 10 |\n| Business Rules (BR) | 12 |\n| Error codes | 4 |\n| Success Criteria | 5 |\n| Actors | 6 |\n| Screens | 22 |\n\n\n## 2. Giới thiệu & Mô tả chung\n\n### Definitions / Glossary\n\nThuật ngữ nghiệp vụ dùng chung toàn dự án. Nguồn: tài liệu SRS LG (`docs-input/srs-cu/lg-srs-export.md`).\nTổ chức dữ liệu Công ty → Chi nhánh → Cơ sở xem **System Overview** › Tổ chức dữ liệu.\n\n## Glossary\n| Thuật ngữ | Định nghĩa | Xuất hiện ở | Aliases |\n|---|---|---|---|\n| **Chi nhánh** | Đơn vị vận hành độc lập về dữ liệu: cùng bộ chức năng nhưng dữ liệu tách hẳn. Người ở chi nhánh A không thấy dữ liệu chi nhánh B dù cùng quyền. | mọi module | — |\n| **Cơ sở** | Đơn vị vật lý trực thuộc 1 chi nhánh, chỉ có ở module tổ chức theo cơ sở (Xưởng, Cây dầu). Dữ liệu quản lý riêng theo từng cơ sở. Module nào chia cơ sở là cố định theo nghiệp vụ, không cấu hình. | Xưởng, Cây dầu, Home | — |\n| **Ngoài cơ sở** | Cơ sở đặc biệt hệ thống tạo sẵn cho mỗi chi nhánh, gán tự động cho nghiệp vụ phát sinh ngoài mọi cơ sở nội bộ (vd cấp dầu tại cây dầu mua ngoài của đối tác, hoá đơn lẻ). Không tạo/sửa/xoá được; cần phân quyền riêng mới thấy. | Cây dầu (Cấp dầu, Thanh toán trả sau) | — |\n| **Tất cả cơ sở** | Chế độ xem tổng hợp mọi cơ sở trong chi nhánh mà người dùng được phân quyền (gồm cả \"Ngoài cơ sở\"). Danh sách có thêm cột Cơ sở; Tạo mới ở chế độ này phải chọn 1 cơ sở trước. | Xưởng, Cây dầu | view tổng hợp |\n| **Xưởng** | Cơ sở sửa chữa của Delta (xưởng nhà). Phân biệt với **xưởng ngoài** — xưởng của nhà cung cấp HHDV mà Delta thuê sửa. | Sửa chữa, Báo giá, Kho, Hàng tồn xưởng | xưởng nhà, xưởng Delta (= Xưởng); xưởng đối tác của Delta (= xưởng ngoài) |\n| **Cây dầu** | Điểm cấp nhiên liệu. **Cây dầu nội bộ** là cây dầu của Delta, được quản lý như 1 cơ sở (có sensor đo mức dầu, barem, dung tích, ngưỡng). Cây dầu mua ngoài của đối tác thì nghiệp vụ gắn vào \"Ngoài cơ sở\". | Cây dầu (Mua dầu, Nhập dầu, Cấp dầu, Dashboard), Danh mục | — |\n| **HHDV (Hàng hoá dịch vụ)** | Gọi chung hàng hoá và dịch vụ Delta mua vào hoặc bán ra. Xuất hiện trong tên Đơn mua HHDV, Nhà cung cấp HHDV, Thanh toán bán HHDV. | Mua hàng, Thanh toán, Danh mục | hàng hoá dịch vụ |\n| **PTVT (Phụ tùng vật tư)** | Danh mục phụ tùng và vật tư dùng cho sửa chữa phương tiện, tách riêng với Lốp và Ắc quy. Trong báo giá \"PTVT còn lại\" là phụ tùng không thuộc Lốp/Ắc quy. | Danh mục, Báo giá, Kho, Sửa chữa | phụ tùng vật tư |\n| **CCDC (Công cụ dụng cụ)** | Danh mục công cụ, dụng cụ của xưởng; xuất kho riêng bằng mục đích \"Xuất CCDC\". | Danh mục, Kho, Thanh lý | công cụ dụng cụ |\n| **DVKT (Dịch vụ kỹ thuật)** | Danh mục dịch vụ sửa chữa/kỹ thuật được chuẩn hoá (có mã riêng theo loại phương tiện), dùng khi lập báo giá và lệnh sửa chữa. | Danh mục, Báo giá, Sửa chữa | dịch vụ kỹ thuật |\n| **Chi phí cấp 1 / Chi phí cấp 2** | Danh mục phân loại chi phí 2 tầng: chi phí cấp 2 thuộc 1 chi phí cấp 1. | Danh mục, Thanh toán | — |\n| **Phụ tùng hỏng** | Phụ tùng thay ra từ phương tiện, đưa vào xưởng để phục hồi. Phục hồi thành công thì nhập kho lại; thất bại thì chuyển sang rác thải chờ thanh lý. | Sửa chữa, Kho, Thanh lý | PT hỏng (tránh — \"PT\" trùng với phương tiện) |\n| **Nhà cung cấp HHDV** | Đơn vị bán hàng hoá/dịch vụ cho Delta, gồm cả xưởng ngoài. Có phương thức thanh toán trả trước hoặc trả sau. | Danh mục, Mua hàng, Thanh toán | NCC |\n| **Khách hàng DK05** | Khách hàng đã đăng ký trong danh mục (pháp nhân hoặc cá nhân, có MST/CCCD), mua phụ tùng hoặc dịch vụ sửa chữa của Delta; có phương thức thanh toán trả trước hoặc trả sau. Phân biệt với **khách hàng lẻ** — không có trong danh mục, luôn thanh toán trả trước. | Danh mục, Báo giá, Sửa chữa, Thanh toán | — |\n| **Phương tiện** | Xe của Delta (đầu kéo, xe tải, sơ mi-rơ mooc…). Hiển thị dạng \"[Mã PT] - [Tên PT]\". Xe khách hàng mang tới sửa là đối tượng riêng, xem **Xe của khách hàng**. | Quản lý phương tiện, Sửa chữa, Báo cáo sự cố, Cấp dầu | PT, xe (viết \"PT\" chỉ dùng cho phương tiện, không dùng cho phụ tùng) |\n| **Phân luồng** | Trường hợp nghiệp vụ của 1 chứng từ, quyết định các bước và trường hiển thị. Vd báo giá: Sửa xe / Bán phụ tùng; lệnh sửa chữa: Sửa chữa xe / Phục hồi phụ tùng hỏng; đơn mua HHDV: Mua hàng hoá / Mua dịch vụ / Mua dịch vụ có phương tiện / Mua dịch vụ sửa chữa ngoài / Mua dịch vụ sửa chữa phụ tùng hỏng ở xưởng ngoài. | Báo giá, Sửa chữa, Mua hàng, Thanh toán | luồng, trường hợp |\n| **Báo cáo sự cố** | Báo hỏng hóc phương tiện do lái xe gửi từ Delta Super App; xưởng xác nhận hoặc từ chối, rồi lập báo giá chẩn đoán. | Sửa chữa | yêu cầu sửa chữa (từ lái xe) |\n| **Báo giá** | Chứng từ báo chi phí sửa chữa/bán phụ tùng trước khi làm. **Báo giá chẩn đoán** là báo giá lập sau khi xác nhận báo cáo sự cố, xác định nơi sửa (xưởng nhà / xưởng ngoài). | Sửa chữa, Mua hàng, Thanh toán | — |\n| **Lệnh sửa chữa** | Chứng từ thực hiện sửa chữa sau khi báo giá được duyệt. Loại: sửa chữa xe Delta/khách hàng, thay lốp, thay ắc quy, phục hồi phụ tùng hỏng. **Chốt lệnh** = ghi nhận số lượng thực dùng/hỏng/thừa và giờ công khi kết thúc. | Sửa chữa, Kho, Thanh toán, Bồi thường | lệnh SC |\n| **Đơn mua HHDV** | Đơn đặt mua hàng hoá/dịch vụ từ nhà cung cấp HHDV, duyệt 2 lần. | Mua hàng, Thanh toán | PO, đơn mua |\n| **Định mức nhiên liệu** | Mức tiêu hao nhiên liệu khoán cho từng phương tiện, phân loại theo tải trọng hàng hoá hoặc không theo tải trọng; có yêu cầu định mức cần phê duyệt và cập nhật mức tiêu hao thực tế. | Quản lý phương tiện | định mức NL, khoán định mức |\n| **Barem (dầu)** | Bảng quy đổi chiều cao mức dầu trong bồn sang lượng dầu (lít) của 1 cây dầu nội bộ, upload dạng file khi tạo cây dầu. | Cây dầu | — |\n| **Kế hoạch mua dầu / Phiếu nhập dầu / Phiếu cấp dầu** | Chuỗi nghiệp vụ dầu: lập kế hoạch mua → đơn mua dầu → nhập dầu vào cây dầu (từ nhà cung cấp hoặc phương tiện) → cấp dầu cho phương tiện. Phiếu cấp dầu tại cây dầu đối tác do nhân viên đối tác ghi nhận trên Delta Super App. | Cây dầu, Thanh toán trả sau | — |\n| **Thanh toán trả trước / trả sau** | Hai phương thức thanh toán với nhà cung cấp hoặc khách hàng. **Trả trước**: lập đề nghị thanh toán cho từng đơn. **Trả sau**: gom vào **bảng công nợ** theo tháng rồi **chốt công nợ** (chốt được nhiều lần) và ghi nhận thanh toán. | Thanh toán, Mua hàng, Cây dầu | TT trả trước / TT trả sau |\n| **GTTT (Giá trị thanh toán)** | Tổng tiền phải thanh toán của 1 chứng từ, sau chiết khấu. | Thanh toán, Mua hàng | giá trị thanh toán |\n| **Bồi thường thiệt hại** | Đề nghị bồi thường khi có thất thoát: trả tiền chưa nhận đủ HHDV, chuyển kho chênh lệch số lượng, làm hỏng/mất phụ tùng trong lệnh sửa chữa. | Thanh toán, Kho, Sửa chữa | bồi thường |\n| **Đề xuất cấp mới** | Yêu cầu tạo bản ghi danh mục mới (DVKT, PTVT, CCDC, lốp, ắc quy, nhà cung cấp, khách hàng DK05, chi phí…). Bản ghi chỉ chính thức và có mã sau khi được phê duyệt. | Danh mục, Cây dầu nội bộ | yêu cầu cấp mới, đề xuất tạo mới |\n| **Thu hồi** | Người tạo rút lại yêu cầu đang chờ phê duyệt. Nếu thu hồi và phê duyệt xảy ra cùng lúc, hệ thống ưu tiên thu hồi. | mọi luồng có phê duyệt | huỷ đề xuất, huỷ yêu cầu (tránh dùng) — mọi luồng gọi thống nhất là \"Thu hồi\" |\n| **Xe của khách hàng** | Xe của khách hàng DK05 mang tới xưởng sửa. Quản lý như 1 danh mục: tạo bằng đề xuất cấp mới, có mã sau khi được duyệt. Tách khỏi **Phương tiện** (xe của Delta). | Danh mục, Báo giá, Sửa chữa | xe KH, xe khách |\n| **Nhân viên** | Người của Delta được quản lý trong hệ thống (lái xe, thợ kỹ thuật, nhân viên văn phòng). Tạo bằng đề xuất cấp mới nhân viên; dùng cho phân công lệnh sửa chữa, bàn giao phương tiện, xin nghỉ. | Nhân sự, Sửa chữa, Quản lý phương tiện | NV |\n| **Tài khoản** | Tài khoản đăng nhập hệ thống. Gắn nhóm quyền (quyết định chức năng được dùng) và danh sách chi nhánh được truy cập; chỉ tài khoản đang hoạt động mới đăng nhập được. | Administration, mọi module (đăng nhập, phân quyền) | TK, tài khoản người dùng |\n| **Phiếu nhập kho** | Chứng từ nhập hàng vào kho xưởng: hàng mua về, hàng luân chuyển giữa kho, phụ tùng hỏng đã phục hồi. Tạo dạng yêu cầu nhập kho, phải được phê duyệt mới ghi nhận tồn kho. | Kho, Mua hàng, Sửa chữa, Bồi thường | yêu cầu nhập kho, phiếu nhập |\n| **Phiếu xuất kho** | Chứng từ xuất hàng khỏi kho xưởng (vd xuất phụ tùng cho lệnh sửa chữa, xuất CCDC), phê duyệt 2 lần. | Kho, Sửa chữa | yêu cầu xuất kho, phiếu xuất |\n| **Bàn giao phương tiện** | Yêu cầu giao 1 phương tiện cho nhân viên (thường là lái xe) hoặc thu hồi phương tiện về. Bàn giao và thu hồi là 2 loại của cùng 1 chứng từ, đều phải phê duyệt và ký biên bản. | Quản lý phương tiện, Delta Super App | bàn giao PT, thu hồi phương tiện (loại thu hồi) |\n| **Delta Super App** | Ứng dụng di động dùng chung cho nhân viên nội bộ Delta (lái xe, hiện trường...) và nhân viên đối tác cây dầu. Ai thấy chức năng nào tuỳ phân quyền. Partner Portal của đối tác cây dầu đã gộp vào app này; hiện chỉ có bản mobile. | Sửa chữa, Mua hàng, Quản lý phương tiện, Cây dầu | App Lái xe, ALX, Partner Portal, Portal đối tác (tên cũ, tránh dùng) |\n| **Đơn mua dầu** | Đơn đặt mua dầu (PO) sinh từ kế hoạch mua dầu đã duyệt. Khi dầu về, tạo phiếu nhập dầu theo đơn (trường hợp nhập từ nhà cung cấp). | Cây dầu | PO dầu |\n| **Quy trình** | Chuỗi nghiệp vụ nối nhau, bắt đầu từ một bản ghi gốc (vd báo giá → sửa chữa → xuất kho → thanh toán). Từ màn chi tiết của bất kỳ bản ghi nào trong chuỗi đều xem được cả cây. Mã `QT-[Mã chi nhánh]-[XXXX]`. Trạng thái do hệ thống tự tính: Đang triển khai · Đã dừng · Đã hoàn thành. Mỗi bản ghi thuộc đúng 1 quy trình. Phân biệt với *Liên quy trình*: đó là tên tính năng (CMP-09 Cross Process Flow) dùng để hiển thị Quy trình. | Liên quy trình, Xưởng, Cây dầu, Liên module, Điều phối | quy trình lớn, thanh tiến trình (tên trong SRS LG, tránh dùng) |\n| **Bước quy trình** | Một nút trên cây quy trình, ứng với tối đa 1 bản ghi nghiệp vụ (vd 1 phiếu xuất kho). Bước chưa có bản ghi thì hiện \"Chưa tạo\". Bước có 4 trạng thái: Chưa triển khai · Đang triển khai · Đã thu hồi/từ chối · Đã hoàn thành. Có 5 loại bước: bước chính, nhánh phát sinh, ngã rẽ chưa chốt, bước công nợ, bước liên module. | Liên quy trình, mọi nghiệp vụ có bảng liên quy trình | step (SRS LG) |\n| **Nhánh phát sinh** | Bước nằm ngoài luồng chính, chỉ sinh ra khi bản ghi trước gặp một điều kiện (vd lệnh sửa chữa còn dư phụ tùng thì sinh phiếu nhập kho). Nhánh phát sinh bị từ chối không làm quy trình chuyển sang Đã dừng. | Liên quy trình, Sửa chữa, Kho, Bồi thường | trường hợp phát sinh; TH1/TH2… (mã của SRS LG, không hiện trên giao diện) |\n| **Bảng liên quy trình** | Bảng mỗi nghiệp vụ khai trong SRS của mình, gồm: bước nào tạo từ bước nào, trigger, trường hợp phát sinh, điều kiện, 1 hay nhiều bản ghi, có cho thu hồi/xoá khi đã có bước con không, có cho xoá không. Cây quy trình và nút tạo nghiệp vụ tiếp theo đều đọc từ bảng này. Câu chữ viết cho người dùng đọc. | Liên quy trình, SRS của mọi nghiệp vụ thuộc quy trình | bảng phát sinh (SRS LG UC00.00.02) |\n\n---\n\n### Operating Environment\n\nMôi trường vận hành chung: nền tảng, người dùng, ngôn ngữ và bộ yêu cầu phi chức năng nền mà mọi\nfeature kế thừa. Nguồn: tài liệu SRS LG (`docs-input/srs-cu/lg-srs-export.md` — NFR mục 6, UC02.03.01).\n\n#### Target Platforms\n\n| Kênh | Hỗ trợ | Ghi chú |\n|---|---|---|\n| Website | Trình duyệt **Chrome**; hệ điều hành Windows, macOS, Linux | Kênh chính. Màn mẫu thiết kế cho desktop 1920×1080 (design.md › Breakpoints) |\n| Ứng dụng di động | **iOS** và **Android** | Delta Super App — dùng chung cho nhân viên Delta và nhân viên đối tác cây dầu, theo quyền nền tảng Mobile (vd Đơn mua HHDV, Lịch nhắc, Cấp dầu) |\n\n- Tích hợp với phần mềm ERP khác: **Delta ERP**.\n\n#### Target Users\n\n- Primary: nhân viên nội bộ Delta — quyền tuỳ theo phân quyền (xem **System Overview** › Actors).\n- Admin: full quyền.\n- Secondary: nhân viên đối tác cây dầu (Delta Super App).\n\n#### Regions & Languages\n\n- Vận hành tại Việt Nam, dữ liệu tách theo chi nhánh (vd Chi nhánh Hà Nội, Chi nhánh TP.HCM).\n- UI languages: **Tiếng Việt (mặc định)**, Tiếng Anh. Đổi ngôn ngữ: Avatar › Ngôn ngữ (UC02.03.01), chọn 1, giao diện tải lại theo ngôn ngữ mới + toast thành công.\n- Ghi chú: UC02.03.01 trong nguồn còn liệt kê Tiếng Nhật — đã chốt chỉ Việt + Anh (2026-10-01), UC02.03.01 cần cập nhật theo.\n\n#### NFR nền (áp mọi feature)\n\nFeature kế thừa bảng này; `/srs` chỉ ghi NFR **khác** hoặc **chặt hơn** baseline.\n\n| Nhóm | Yêu cầu |\n|---|---|\n| Hiệu năng | Yêu cầu cơ bản xử lý trong **1 giây**; yêu cầu phức tạp trong **5 giây**. Tối thiểu **200** người dùng đồng thời không giảm hiệu năng |\n| Mở rộng | Mở rộng tới **500** người dùng không ảnh hưởng hiệu năng; tăng tài nguyên (CPU, RAM, bộ nhớ) linh hoạt theo nhu cầu |\n| Tài nguyên | Dùng CPU, RAM, đĩa hiệu quả; có giám sát tài nguyên theo thời gian thực |\n| Bảo mật | Bắt buộc xác thực trước khi truy cập; dữ liệu nhạy cảm mã hoá khi lưu và khi truyền; phân quyền chi tiết theo vai trò |\n| Khả dụng | Uptime tối thiểu **99.9%**; sao lưu định kỳ để phục hồi dữ liệu; tự phát hiện sự cố |\n| Bảo trì | Kiến trúc dễ mở rộng, bảo trì; triển khai tính năng mới không gián đoạn dịch vụ |\n| Khả năng sử dụng | Giao diện dễ dùng, dễ điều hướng; có tài liệu hướng dẫn cho người dùng và quản trị viên |\n| Ứng dụng di động | Giao diện tối ưu cho cảm ứng; chạy mượt trên máy cấu hình trung bình; tiết kiệm pin; hỗ trợ **push notification** |\n\n---\n\n### Conventions\n\nQuy tắc giao diện chung toàn hệ thống, web và app. UC/màn gọi theo mã `Theo GR-xx`, chỉ điền phần **UC phải\nkhai báo**; khác quy tắc chung thì ghi override + lý do. Chỗ app khác web ghi ở dòng **Mobile** trong từng\nmục; GR-21…GR-26 chỉ áp app. Component dùng chung ở\n**UI Common Components (CMP)**.\n\nCâu chữ (lỗi, xác nhận, rỗng, toast) theo `design/design.md` › Content & Formatting › Copy động: ngôi\n\"bạn\", câu ngắn, không \"Vui lòng\". Định dạng hiển thị chi tiết đã có ở design.md — GR trỏ về mục đó.\n\n| Mã | Quy tắc | Chi tiết ở design.md | Nguồn gốc |\n|---|---|---|---|\n| GR-01 | Input / Textbox | Nhập liệu và kiểm tra | 2.1 · app 2.2 |\n| GR-02 | Select / Dropdown | Nhập liệu và kiểm tra | 2.2 · app 2.3 |\n| GR-03 | Date Picker + hiển thị ngày giờ | Ngày giờ | 2.3 · app 2.6 |\n| GR-04 | Định dạng tiền | Số và tiền tệ | 2.4 · app 2.4 |\n| GR-05 | Định dạng số | Số và tiền tệ | 2.5 · app 2.5 |\n| GR-06 | Làm tròn | Số và tiền tệ | 2.6 · app 2.4 |\n| GR-07 | Email | Nhập liệu và kiểm tra | 2.7 · app 2.7 |\n| GR-08 | Số điện thoại | Thông tin liên hệ và địa chỉ | 2.8 · app 2.8 |\n| GR-09 | Thanh tìm kiếm | Quy tắc bảng danh sách | 2.9 · app 2.9 |\n| GR-10 | Trường không có thông tin | — | 2.10 · app 2.10 |\n| GR-11 | Sinh mã yêu cầu và mã bản ghi | — | 2.11 · app 2.11 · cross-process-flow (12/10/2026) |\n| GR-12 | Trạng thái rỗng / đang tải | States + Copy động | 2.12 · MSC-09, MSC-10 |\n| GR-13 | Dữ liệu chưa lưu | Copy động › Hộp xác nhận | 2.13 · app 2.13 |\n| GR-14 | Căn lề trong bảng | Quy tắc bảng danh sách | 2.14 (chỉ web) |\n| GR-15 | Phân loại thông báo lỗi | Copy động + Nhập liệu và kiểm tra | 2.15 · app 2.12 |\n| GR-16 | Freeze cột | Quy tắc bảng danh sách | 2.16 (chỉ web) |\n| GR-17 | Nhóm dữ liệu (Group By) | Quy tắc bảng danh sách | 2.17 (chỉ web) |\n| GR-18 | Sắp xếp | Quy tắc bảng danh sách | 2.18 (chỉ web) |\n| GR-19 | Export | Quy tắc bảng danh sách | 2.19 (chỉ web) |\n| GR-20 | Lọc theo cột | Quy tắc bảng danh sách + Bộ lọc nâng cao | 2.20 (chỉ web) |\n| GR-21 | Nút bấm | — | app 2.1 |\n| GR-22 | Kéo để làm mới | — | app 2.14 |\n| GR-23 | Cuộn danh sách | Phân trang danh sách | app 2.15 |\n| GR-24 | Điều hướng app | — | app 2.16 |\n| GR-25 | Trạng thái kết nối mạng | Copy động | app 2.17 |\n| GR-26 | Popup chặn | Copy động | app 2.18 |\n| GR-27 | Dữ liệu đã cũ | Copy động | cross-process-flow (12/10/2026) |\n| GR-28 | Không có quyền xem (web) | Copy động | cross-process-flow (12/10/2026) |\n\n---\n\n#### Nhập liệu\n\n##### GR-01 — Input / Textbox\n- **Khi nào kiểm:** On Blur (rời trường) và On Submit (kiểm mọi trường, kể cả trường chưa chạm).\n- **Submit có lỗi:** inline error mọi trường lỗi, cuộn tới lỗi đầu tiên, không gửi, nút về thường.\n- **Submit hợp lệ:** nút loading + vô hiệu; server trả lỗi → hiện lỗi, giữ form, nút về thường.\n- **Độ dài:** Tiêu đề tối đa 50 (`E-common-002`) · text ngắn 255, không gõ thêm được, dán vượt tự cắt · textarea 1000 (hoặc theo UC), có đếm ký tự, dán vượt tự cắt.\n- **Bắt buộc:** nhãn có `*`; bỏ trống → `E-common-001`.\n- **UC phải khai báo:** trường nào bắt buộc; loại trường (tiêu đề / ngắn / textarea); giới hạn khác mặc định; rule riêng của trường (`E-{feature}-NNN`).\n- **Mobile:** mở đúng bàn phím theo loại trường (chữ · số · email · điện thoại · số thập phân); icon ✕ trong ô khi có nội dung, chạm để xoá hết. Textarea tối đa 1000 như web, bộ đếm chỉ hiện khi còn ≤ 200 ký tự (tài liệu app ghi 4000 — đã chốt 1000, 2026-10-04).\n- **design.md:** Nhập liệu và kiểm tra\n\n##### GR-02 — Select / Dropdown\n- Chọn 1, hoặc chọn nhiều (giá trị hiện dạng tag trong ô). Danh sách từ server: tìm gần đúng khi gõ.\n- Bắt buộc chưa chọn → `E-common-001` (dạng \"Chọn …\").\n- **UC phải khai báo:** nguồn danh sách; chọn 1 hay nhiều; giá trị mặc định; phụ thuộc trường khác.\n- **Mobile:** mở `BottomSheet` thay dropdown (design.md › BottomSheet, `.Content · Chọn một` / `Chọn nhiều`); có ô tìm khi danh sách > 10 mục. Chọn 1: chạm là chọn và đóng. Chọn nhiều: checkbox + nút **Xong** cố định đáy. Chọn người: avatar + tên đậm, dòng 2 mã · chức vụ; đã chọn hiện avatar nhỏ + \"Mã - Tên\" trong ô.\n- **design.md:** Nhập liệu và kiểm tra\n\n##### GR-03 — Date Picker + hiển thị ngày giờ\n- Gõ trực tiếp hoặc chọn từ lịch. Hiển thị `dd/mm/yyyy`, có giờ `dd/mm/yyyy hh:mm` (24 giờ). Các dạng khác (tương đối, khoảng ngày): design.md › Ngày giờ.\n- Sai định dạng → `E-common-003`.\n- **UC phải khai báo:** có giờ không; khoảng cho phép (vd không chọn ngày quá khứ) + lỗi riêng.\n- **Mobile:** mở bộ chọn ngày của hệ điều hành hoặc bánh xe cuộn tuỳ ngữ cảnh; định dạng và lỗi như web.\n- **design.md:** Ngày giờ\n\n##### GR-04 — Định dạng tiền\n- Mặc định VND; danh sách đơn vị quản lý ở hệ thống, không sửa trên giao diện. Tự chèn `,` hàng nghìn khi gõ. Hiển thị `100,000 đ` / `100,000 VND`; ngoại tệ `50 USD · 25,000 VND/USD`.\n- **UC phải khai báo:** trường tiền nào có ngoại tệ; nguồn tỷ giá.\n- **Mobile:** dùng chung web.\n- **design.md:** Số và tiền tệ\n\n##### GR-05 — Định dạng số\n- Chỉ cho số và `.` thập phân, chặn ký tự khác. Hàng nghìn `,`, thập phân `.`.\n- **UC phải khai báo:** khoảng giá trị hợp lệ (vd > 0) + lỗi riêng.\n- **Mobile:** dùng chung web; mở bàn phím số / số thập phân.\n- **design.md:** Số và tiền tệ\n\n##### GR-06 — Làm tròn\n- Số học và USD: 2 chữ số thập phân, làm tròn nửa lên. VND: không lẻ, luôn làm tròn lên hàng đơn vị. Áp cho hiển thị, tính toán và lưu.\n- **UC phải khai báo:** chỉ khi khác quy tắc (override + lý do).\n- **Mobile:** dùng chung web.\n- **design.md:** Số và tiền tệ\n\n##### GR-07 — Email\n- Phải có `@`. Sai → `E-common-004`.\n- **Mobile:** tự mở bàn phím email.\n- **design.md:** Nhập liệu và kiểm tra\n\n##### GR-08 — Số điện thoại\n- Chỉ số, đầu số `0` hoặc `84`, tối đa 11 ký tự. Hiển thị theo design.md › Thông tin liên hệ. Sai → `E-common-005`.\n- **Mobile:** tự mở bàn phím số, chặn ký tự khác số.\n- **design.md:** Thông tin liên hệ và địa chỉ\n\n#### Danh sách và bảng\n\nGR-14, GR-16…GR-20 chỉ áp web — app không có bảng nhiều cột (danh sách dạng List, cuộn theo GR-23).\n\n##### GR-09 — Thanh tìm kiếm\n- Tìm gần đúng toàn bộ dữ liệu bảng. Chạy khi Enter hoặc rời ô; màn realtime debounce 300ms. Trường cố định (trạng thái, phân loại) không tìm được → tooltip liệt kê, dùng lọc thay thế.\n- **UC phải khai báo:** trường tìm được / không tìm được; có realtime không.\n- **Mobile:** luôn realtime, debounce 300ms. Không ra kết quả → GR-12 (tìm không ra). Trường cố định → lọc bằng CMP-05.\n- **design.md:** Quy tắc bảng danh sách\n\n##### GR-14 — Căn lề trong bảng\n- Số, tiền, % căn phải · ngày giờ căn giữa · văn bản, trạng thái căn trái · tiêu đề cột theo dữ liệu.\n- **design.md:** Quy tắc bảng danh sách\n\n##### GR-16 — Freeze cột\n- Chỉ khi bảng cuộn ngang: cột đầu (Tên/Mã) cố định trái, cột hành động cố định phải, bóng nhẹ ở cạnh trong.\n- **UC phải khai báo:** cột cố định nếu khác Tên/Mã.\n- **design.md:** Quy tắc bảng danh sách\n\n##### GR-17 — Nhóm dữ liệu\n- Nút Nhóm trên toolbar, chọn 1 cột; Xoá để bỏ. Dòng cha = giá trị + số bản ghi. Nhóm đầu mở sẵn tối đa 10 dòng, nhóm khác thu gọn; >10 có \"Xem thêm\" (+10). Phân trang theo nhóm.\n- **UC phải khai báo:** cột được phép nhóm.\n- **design.md:** Quy tắc bảng danh sách; Phân trang danh sách\n\n##### GR-18 — Sắp xếp\n- Click tiêu đề cột: tăng → giảm → mặc định. Mỗi lúc 1 cột. Mặc định mới nhất trước (thời gian tạo giảm dần).\n- **UC phải khai báo:** sort mặc định nếu khác; cột không sort được (override + lý do).\n- **design.md:** Quy tắc bảng danh sách\n\n##### GR-19 — Export\n- Xuất PDF / Excel toàn bộ dữ liệu sau lọc, nhóm, tuỳ chỉnh cột, gồm mọi trang.\n- **UC phải khai báo:** có export không; định dạng nào; quyền.\n- **design.md:** Quy tắc bảng danh sách\n\n##### GR-20 — Lọc theo cột\n- Nhập giá trị/ID → ô tìm · chọn giá trị → dropdown · ngày → khoảng ngày (chỉ ngày, không giờ) · số/tiền/% → Từ – Đến. Cách trình bày: CMP-05.\n- **UC phải khai báo:** cột lọc được + kiểu lọc.\n- **design.md:** Quy tắc bảng danh sách; Bộ lọc nâng cao\n\n#### Hiển thị và trạng thái\n\n##### GR-10 — Trường không có thông tin\n- Ghi chú: ẩn hẳn · ID/Mã: `N/A` · trường khác: `-`.\n- **Mobile:** dùng chung web (tài liệu app ghi `--` — đã chốt `-`, 2026-10-04).\n- **design.md:** —\n\n##### GR-11 — Sinh mã yêu cầu và mã bản ghi\n- Bản ghi phải phê duyệt có 2 mã:\n  - **Mã yêu cầu** sinh ngay khi gửi duyệt lần đầu, dạng `YC-[Prefix]-[Định danh]-[4 số]` ([Định danh] giống mã bản ghi). Hiện khi bản ghi Chờ phê duyệt / Đã từ chối / Đã thu hồi. Sửa rồi gửi lại giữ nguyên mã yêu cầu.\n  - **Mã bản ghi** sinh khi được phê duyệt, dạng `[Prefix]-[Định danh]-[4 số]`. Từ lúc này hiện mã bản ghi; mã yêu cầu vẫn lưu kèm bản ghi.\n- Bản nháp chưa gửi chưa có mã; nhận diện bằng người tạo, ngày tạo, trạng thái.\n- Feature không có phê duyệt hoặc tạo tự động → chỉ có mã bản ghi, sinh ngay khi tạo.\n- Tìm theo mã: tìm được cả mã yêu cầu lẫn mã bản ghi.\n- **UC phải khai báo:** prefix + định danh (theo tài liệu format mã của dự án); thời điểm sinh nếu khác.\n- **Mobile:** dùng chung web.\n- **design.md:** —\n\n##### GR-12 — Trạng thái rỗng / đang tải\n- Chưa có dữ liệu: hình + mô tả + nút Tạo mới (nếu có quyền).\n- Lọc không ra kết quả: thông báo không có kết quả + nút Xoá bộ lọc, không có Tạo mới.\n- Đang tải: skeleton theo số cột/dòng hiện tại. Câu chữ theo design.md › Copy động.\n- **UC phải khai báo:** nội dung trạng thái rỗng (cái gì rỗng + CTA).\n- **Mobile (MSC-09, MSC-10):** rỗng = hình minh hoạ + tiêu đề + mô tả + CTA (chỉ khi có quyền tạo) — hình minh hoạ chưa có chuẩn (design.md KG-29). Tải lần đầu: skeleton theo hình bố cục thật, hiệu ứng shimmer; tải xong chuyển mờ sang dữ liệu. Không tải được dữ liệu: màn lỗi = `EmptyState` lỗi + nút **Thử lại** (design.md › Quy ước chung của component dự án).\n- **design.md:** Trạng thái giao diện; Copy động\n\n##### GR-13 — Dữ liệu chưa lưu\n- Đóng tab / trình duyệt / tải lại: hộp confirm gốc của trình duyệt.\n- Bấm Huỷ trên form đã nhập: CMP-03 (Huỷ form).\n- **UC phải khai báo:** form nào áp dụng.\n- **Mobile:** Back hoặc vuốt back khi form đã đổi so với ban đầu → CMP-03 Mobile: \"Thoát mà không lưu?\" · \"Dữ liệu đã nhập sẽ mất.\" → `[Thoát]` (destructive) `[Ở lại]`. Form chưa đổi → thoát luôn. Câu gốc app 2.13: \"Bạn có chắc muốn thoát? Dữ liệu đã nhập sẽ bị mất.\"\n- **design.md:** Copy động\n\n##### GR-15 — Phân loại thông báo lỗi\n\n| | Loại 1 — Inline | Loại 2 — Popup Error | Loại 3 — Toast Error |\n|---|---|---|---|\n| Khi nào | Lỗi của 1 trường (định dạng, bắt buộc, giá trị không hợp lệ); On Blur / On Submit | Lỗi chỉ biết sau khi submit do đối chiếu dữ liệu server (trùng mã, vượt hạn mức, ràng buộc nghiệp vụ); không gắn trường nào | Lỗi kỹ thuật/hệ thống (API lỗi, mất kết nối, timeout, 5xx); người dùng không tự sửa được |\n| Vị trí | Dưới trường | Modal giữa màn, có nền mờ | Toast góc trên phải (CMP-01) |\n| Hiển thị | Viền trường + câu lỗi màu error | Tiêu đề lỗi + mô tả + Đóng; thêm Thử lại nếu retry được | Nền error |\n| Hành vi | Tự ẩn khi giá trị hợp lệ | Không tự đóng; đóng xong giữ nguyên form | Tự ẩn sau 3 giây, không chặn |\n\n- **UC phải khai báo:** mỗi lỗi nghiệp vụ (`E-{feature}-NNN`) thuộc loại nào; lỗi Loại 2 có Thử lại không.\n- **Mobile:**\n  - Loại 1: như web, chữ error + icon cảnh báo dưới trường.\n  - Loại 2: bottom sheet cùng khung CMP-03 Mobile — icon lỗi + tiêu đề lỗi + mô tả + nút **Đóng** full width; retry được thì **Thử lại** là nút chính đứng trên, **Đóng** ghost đứng dưới; khoá đóng như hàng 8 CMP-03 Mobile (chạm nền / vuốt xuống không đóng); đóng xong giữ nguyên form. Tài liệu app không có loại này — bổ sung 2026-10-04, chưa có chuẩn trong design.md.\n  - Loại 3: toast CMP-01 (Mobile).\n  - Không tải được dữ liệu cả màn: màn lỗi theo GR-12 (Mobile). Lỗi phiên/quyền: GR-26.\n- **design.md:** Copy động; Nhập liệu và kiểm tra\n\n##### GR-27 — Dữ liệu đã cũ\n- Màn đang mở (danh sách, popup, sheet) mà dữ liệu vừa đổi ở nơi khác: hiện banner tông neutral đầu vùng nội dung \"[Đối tượng] vừa có cập nhật.\" kèm nút **Tải lại**. Không tự tải lại, để người dùng không mất chỗ đang xem.\n- Bấm Tải lại: tải dữ liệu mới, giữ chỗ đang xem nếu còn (vd bước đang chọn, bộ lọc), rồi ẩn banner.\n- **UC phải khai báo:** màn nào áp dụng; từ thay cho [Đối tượng] (vd \"Quy trình\", \"Danh sách\"); giữ lại gì sau khi tải lại.\n- **Mobile:** dùng chung web; banner nằm ngay dưới header màn hoặc header sheet.\n- **design.md:** Copy động\n\n##### GR-28 — Không có quyền xem (web)\n- Mở thẳng đường dẫn một trang không có quyền menu → vùng nội dung hiện `E-common-011` + nút **Về trang chủ**; header và menu trái vẫn hiện.\n- Bấm mở một bản ghi không có quyền xem → popup Loại 2 (GR-15) câu `E-common-011` + nút **Đóng**, ở lại màn đang xem.\n- Một khối trong màn (panel, tab) không có quyền xem → câu `E-common-011` tại chỗ thay nội dung khối; phần còn lại dùng bình thường.\n- **UC phải khai báo:** trường hợp nào áp dụng; quyền của nghiệp vụ nào quyết định.\n- **Mobile:** theo GR-26 (popup chặn, nút Quay lại).\n- **design.md:** Copy động\n\n#### App (chỉ mobile)\n\n##### GR-21 — Nút bấm\n- Chạm Gửi / Lưu / Tạo mới → kiểm mọi trường bắt buộc; lỗi inline, cuộn tới lỗi đầu tiên.\n- Đang xử lý: spinner + vô hiệu nút, chống chạm đúp.\n- Nút chính trong form hoặc `BottomSheet` luôn full width.\n- Nút xoá/huỷ tông error, không làm nút chính — luôn là nút phụ hoặc ở vị trí thứ yếu.\n- **design.md:** —\n\n##### GR-22 — Kéo để làm mới\n- Kéo xuống khi đang ở đầu màn → tải lại dữ liệu, về đầu danh sách.\n- Áp mọi màn danh sách và màn chi tiết.\n- **UC phải khai báo:** màn nào không áp (override + lý do).\n- **design.md:** —\n\n##### GR-23 — Cuộn danh sách\n- Cuộn tới 80% cuối → tự tải thêm 20 mục; spinner nhỏ ở cuối khi đang tải; hết dữ liệu → \"Đã hiển thị tất cả kết quả\".\n- Chạm thanh tiêu đề → cuộn về đầu danh sách.\n- Danh sách có nhóm: tiêu đề nhóm dính lại khi cuộn qua.\n- **UC phải khai báo:** số mục mỗi lần nếu khác 20; danh sách có nhóm không, nhóm theo gì.\n- **design.md:** Phân trang danh sách\n\n##### GR-24 — Điều hướng app\n- Back: nút Back, vuốt từ trái sang phải (iOS) hoặc cử chỉ back (Android) → màn trước.\n- Deep link: chạm thông báo (CMP-02) → mở thẳng màn chi tiết bản ghi.\n- `BottomSheet` / popup: vuốt xuống hoặc chạm nền → đóng; trừ CMP-12, GR-26 và hành động không hoàn tác (CMP-03).\n- **UC phải khai báo:** màn đích của deep link.\n- **design.md:** —\n\n##### GR-25 — Trạng thái kết nối mạng\n- Mất kết nối → banner tông neutral đầu màn \"Không có kết nối internet\", giữ tới khi có mạng lại.\n- Có mạng lại → banner tông success \"Đã kết nối lại\", tự ẩn sau 2 giây; tự gửi lại các yêu cầu đang chờ.\n- Yêu cầu thất bại do mạng → toast `E-common-009`.\n- **design.md:** Copy động\n\n##### GR-26 — Popup chặn\n- Popup cùng khung CMP-03 Mobile nhưng **không đóng** khi chạm nền hay vuốt xuống — chỉ đóng bằng nút.\n- Phiên hết hạn → `E-common-010`, nút **Đăng nhập lại** (duy nhất).\n- Mở màn không có quyền → `E-common-011`, nút **Quay lại**.\n- Quyền tài khoản vừa thay đổi → `E-common-012`, nút **Tải lại ngay** (duy nhất).\n- Chuyển site là hộp xác nhận đóng được → CMP-03 Mobile, không thuộc mục này.\n- **design.md:** Copy động\n\n---\n\n#### Lỗi dùng chung (E-common)\n\nUC dùng lại mã dưới, **không tạo `E-{feature}-NNN` trùng nghĩa**. Câu lỗi riêng cho 1 trường (vd \"Nhập\ntên cây dầu.\") vẫn là E-common-001 với `[tên trường]` điền cụ thể.\n\n| ID | Loại (GR-15) | Khi nào | Câu hiển thị | Quy tắc |\n|---|---|---|---|---|\n| E-common-001 | Inline | Trường bắt buộc bỏ trống khi submit | \"Nhập [tên trường].\" · Select: \"Chọn [tên trường].\" | GR-01, GR-02 |\n| E-common-002 | Inline | Tiêu đề vượt 50 ký tự | \"Tối đa 50 ký tự.\" | GR-01 |\n| E-common-003 | Inline | Ngày sai định dạng | \"Hãy nhập ngày tháng theo định dạng: dd/mm/yyyy\" | GR-03 |\n| E-common-004 | Inline | Email sai định dạng | \"Email không đúng định dạng.\" | GR-07 |\n| E-common-005 | Inline | SĐT sai định dạng | \"Số điện thoại không đúng định dạng.\" | GR-08 |\n| E-common-006 | Inline | File sai định dạng | \"File không đúng định dạng.\" | CMP-10 |\n| E-common-007 | Inline | File vượt dung lượng | \"Dung lượng file tối đa 250MB.\" | CMP-10 |\n| E-common-008 | Toast | Lỗi hệ thống / API / timeout | \"Đã xảy ra lỗi. Thử lại sau.\" | GR-15 Loại 3 |\n| E-common-009 | Toast | Mất kết nối mạng | \"Mất kết nối. Kiểm tra mạng và thử lại.\" | GR-15 Loại 3 |\n| E-common-010 | Toast (web) · Popup chặn (app) | Phiên đăng nhập hết hạn | \"Phiên làm việc đã hết hạn. Đăng nhập lại.\" | GR-15 Loại 3 · GR-26 |\n| E-common-011 | Tại chỗ / Popup Loại 2 (web) · Popup chặn (app) | Mở màn, bản ghi hoặc khối không có quyền xem | \"Bạn không có quyền xem thông tin này. Liên hệ quản trị viên để được cấp quyền.\" | GR-28 · GR-26 |\n| E-common-012 | Popup chặn (app) | Quyền tài khoản vừa thay đổi | \"Quyền của tài khoản vừa thay đổi. Tải lại để áp dụng.\" | GR-26 |\n\nCâu gốc tài liệu app (2.17, 2.18) đã viết lại theo design.md › Copy động (bỏ \"Vui lòng\"):\n\"Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại để tiếp tục.\" → E-common-010 ·\n\"Bạn không có quyền xem thông tin này. Vui lòng liên hệ quản trị viên.\" → E-common-011 ·\n\"Tài khoản của bạn vừa được thay đổi phân quyền. Vui lòng tải lại để áp dụng thay đổi mới.\" → E-common-012 ·\n\"Không thể kết nối. Vui lòng kiểm tra mạng và thử lại.\" → E-common-009.\n\n---\n\n### System Overview\n\nBức tranh tổng của hệ thống: ai dùng, gồm những module nào, tổ chức dữ liệu ra sao và nối với dịch\nvụ ngoài nào. Nguồn: tài liệu SRS LG (`docs-input/srs-cu/lg-srs-export.md`, bản export 2026-10). Chi tiết từng\nfeature nằm ở `docs/{feature}/`.\n\n#### Actors\n\n- **Nhân viên nội bộ Delta** — thấy và làm được gì **tuỳ theo phân quyền** (nhóm quyền, quyền chức năng theo nền tảng, phạm vi chi nhánh / cơ sở). Dùng Website, và Delta Super App (mobile) cho một số nghiệp vụ. Trong luồng phê duyệt đóng vai *người tạo* (tạo, thu hồi, xoá yêu cầu của mình) hoặc *người có quyền phê duyệt* (phê duyệt / từ chối).\n- **Admin** — **full quyền** trên toàn hệ thống, gồm quản lý tài khoản, nhóm quyền và phân quyền tài khoản (Module Administration).\n- **Nhân viên đối tác cây dầu** — dùng Delta Super App (Partner Portal cũ đã gộp vào app, hiện chỉ có mobile) cho nghiệp vụ Cấp dầu: xem phiếu cấp dầu, ghi nhận bơm dầu, xuất hoá đơn, chốt phiếu.\n\n#### Tổ chức dữ liệu\n\n| Cấp       | Ý nghĩa                                                                                                                                                        | Ví dụ                                |\n| ---------- | ---------------------------------------------------------------------------------------------------------------------------------------------------------------- | -------------------------------------- |\n| Công ty   | Đơn vị cao nhất, sở hữu mọi chi nhánh                                                                                                                    | Delta                                  |\n| Chi nhánh | Vận hành độc lập về dữ liệu: cùng bộ feature nhưng dữ liệu tách hẳn, người ở chi nhánh A không thấy dữ liệu chi nhánh B dù cùng quyền | Chi nhánh Hà Nội, Chi nhánh TP.HCM |\n| Cơ sở    | Đơn vị vật lý trực thuộc 1 chi nhánh, chỉ có ở module tổ chức theo cơ sở (Xưởng, Cây dầu); dữ liệu quản lý riêng theo cơ sở            | Cây dầu nội bộ A, Xưởng B        |\n\n- Sau đăng nhập: được cấp 1 chi nhánh thì vào thẳng, nhiều chi nhánh thì chọn trước khi vào Home. Sau đó chọn Module → Cơ sở.\n- **Phạm vi đặc biệt:** \"Ngoài cơ sở\" — nghiệp vụ phát sinh ngoài mọi cơ sở nội bộ (vd cấp dầu tại cây dầu mua ngoài), phải được cấp quyền riêng. \"Tất cả cơ sở\" — xem gộp dữ liệu các cơ sở được cấp quyền; thao tác trên từng bản ghi vẫn theo quyền tại cơ sở gốc của bản ghi.\n- **Phân quyền dữ liệu theo quyền chức năng:** không có quyền thì không thấy feature trên menu. Có quyền xem thì thấy mọi yêu cầu do bất kỳ ai tạo; chỉ thu hồi / xoá được yêu cầu của chính mình. Nút hành động không có quyền thì ẩn, không vô hiệu. Được xem thông tin của feature liên quan qua liên kết (vd có quyền Khách hàng thì vẫn mở được chi tiết Xe của khách hàng).\n\n#### Subsystems\n\n| Module                     | Nhóm năng lực               | Website                                |\n| 5 — Danh mục             | Danh mục dùng chung cấp chi nhánh: phương tiện (bàn giao, thu hồi, định mức nhiên liệu), xưởng, cây dầu nội bộ                                                                                                                               | Website                                |\n| 6 — Quản trị hệ thống | Lịch nhắc · Trợ giúp (FAQs, hướng dẫn sử dụng)                                                                                                                                                                                                         | Website, Delta Super App (lịch nhắc) |\n\n#### Feature Map\n\nMã và tên theo tài liệu nguồn. Cột **Vault** cho biết feature đã có tài liệu trong `docs/` chưa.\n\n| Module                     | Epic                               | Feature                                                                                                                                                                                                                                      | Vault     |\n| -------------------------- | ---------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | --------- |\n| Dùng chung                | 01 Quản lý tài khoản cá nhân | UC01.01–01.06 (đăng nhập, quên / đổi / tạo mật khẩu, đăng xuất, thông tin cá nhân)                                                                                                                                           | chưa có |\n| 1 — Xưởng               | 03 Danh mục                       | 03.01 Dịch vụ kỹ thuật · 03.03 Phụ tùng vật tư · 03.04 Công cụ dụng cụ · 03.05 Lốp · 03.06 Ắc quy · 03.07 Nhà cung cấp HHDV · 03.08 Khách hàng DK05 · 03.09 Xe của khách hàng · 03.10–03.12 Chi phí ốc xưởng khỏi các quyền này (lg-srs-export.md:3059). | Mục 3 |\n| OQ-2 | Bảng vai trò mẫu (5 vai trò) đang đánh dấu `[not done]` trong SRS — còn đúng để dùng không? | Vai trò nghiệp vụ |\n| OQ-3 | Lệnh sửa chữa có sinh phiếu xuất kho phụ tùng không, và 1 lệnh có nhiều phiếu xuất không? | Mục 2, Lệnh sửa chữa — Phiếu xuất kho |\n| OQ-4 | Báo giá chọn sửa ở xưởng ngoài có sinh Đơn mua HHDV (dịch vụ sửa chữa ngoài) không? | Mục 2, Báo giá — Đơn mua HHDV |\n| OQ-5 | Nhà cung cấp dầu có phải là Nhà cung cấp HHDV trong danh mục không? | Mục 2, Đơn mua dầu |\n| OQ-6 | Mỗi nhân viên có đúng 1 tài khoản đăng nhập không? | Mục 2, Nhân viên — Tài khoản |\n| OQ-7 | Ai xác nhận báo giá với khách hàng (bước Chờ xác nhận → Đã xác nhận)? | Mục 3, Báo giá |\n| OQ-8 | Ai ký biên bản bàn giao / thu hồi phương tiện — lái xe nhận xe, người giao, hay cả hai? | Mục 3, Bàn giao phương tiện |\n| OQ-9 | Phiếu nhập dầu đã tạo có thu hồi hoặc huỷ được không? SRS không có lưu đồ trạng thái cho phiếu này. | Mục 3, Phiếu nhập dầu |\n\n\n## <a id=\"sec-spec\"></a>4. SRS Spec\n\n### 1. Scope\n\nTính năng dùng chung cho mọi module có quy trình nhiều nghiệp vụ (Xưởng, Cây dầu, Liên module; Điều vận khi chốt với khách — OQ-1). Từ màn chi tiết của bất kỳ bản ghi nào thuộc một quy trình, người dùng thấy dòng quy trình, mở sơ đồ cây toàn bộ bước chính và nhánh phát sinh, xem trạng thái + lịch sử từng bước rồi mở màn hình chi tiết của bước đó. Tính năng cũng hiện nút tạo nghiệp vụ tiếp theo khi bản ghi đạt điều kiện, và có màn danh sách Quy trình (web) để theo dõi mọi quy trình đang chạy.\n\nTài liệu gồm 2 lớp:\n- **Lớp nghiệp vụ** (tài liệu này): tạo quy trình, thêm bước, trạng thái bước và quy trình, mã quy trình, quyền xem, ràng buộc gửi/thu hồi/xoá, danh sách Quy trình.\n- **Lớp hiển thị**: Xem CMP-09 — Cross Process Flow (Liên quy trình), quy tắc vẽ R1–R17.\n\nMỗi nghiệp vụ thuộc quy trình khai **bảng liên quy trình** trong SRS của nghiệp vụ đó (BR-cross-process-flow-007). Tài liệu này không chứa bảng phát sinh của từng luồng.\n\n**Ngoài phạm vi:** quy tắc bảng công nợ (hoàn thành khi nào, nhận thêm đơn không) — thuộc SRS Thanh toán · nội dung form của từng nghiệp vụ được tạo · thông báo cho người liên quan (đi theo từng nghiệp vụ, CMP-02) · đóng quy trình thủ công.\n\n### 2. Actors & Stakeholders\n\n| Actor | Loại (người/hệ thống/ngoài) | Mục tiêu | Trong scope? |\n|-------|-----------------------------|----------|--------------|\n| Người theo dõi quy trình (Nhân viên nội bộ Delta: Kế toán thanh toán, Quản lý xưởng, Thủ kho, Người duyệt, Điều phối) | người | Thấy các bước trước/sau và bước đang kẹt của một bản ghi mà không mở từng phiếu | Có |\n| Người tạo bản ghi (Nhân viên nội bộ Delta) | người | Tạo nghiệp vụ tiếp theo từ bản ghi trước, dữ liệu điền sẵn | Có |\n| Lái xe | người | Xem tiến độ sửa xe của mình trên Delta Super App | Có |\n| Admin | người | Cấp quyền menu Quy trình theo module | Có |\n| Hệ thống | hệ thống | Tự tạo quy trình, sinh mã, thêm bước, tính trạng thái | Có |\n| Nhân viên đối tác cây dầu | người | — | Không — không dùng liên quy trình |\n\n### 3. Functional Requirements (FR)\n\n| ID | Tầng | Title | Description | Priority | Verify by | Source |\n|----|------|-------|-------------|----------|-----------|--------|\n| FR-cross-process-flow-001 | [Lõi] [Cấu hình] | Tạo quy trình tự động | Khi bản ghi gốc của một luồng gửi thành công, hệ thống phải tạo Quy trình ở trạng thái Đang triển khai và sinh mã theo `P-mau-ma-quy-trinh` (Delta: `QT-[Mã chi nhánh]-[YY]-[XXXX]`) ngay lúc đó (BR-cross-process-flow-004). Luồng độc lập (bản ghi gốc tự nó không tạo quy trình): quy trình tạo khi nhánh phát sinh đầu tiên gửi thành công, bản ghi gốc là nút đầu cây. Lưu nháp không tạo quy trình. | P0 | test: gửi bản ghi gốc → có mã QT; lưu nháp → không có | brainstorm Mục 6.3; object map Mục 3; OQ-10 |\n| FR-cross-process-flow-002 | [Lõi] | Tính trạng thái quy trình | Hệ thống phải tự tính trạng thái Quy trình theo BR-cross-process-flow-002/003, không ai sửa tay: Đang triển khai · Đã dừng · Đã hoàn thành. | P0 | test theo bảng chuyển trạng thái Mục 9 | brainstorm Mục 6.3 |\n| FR-cross-process-flow-003 | [Lõi] | Thêm bước vào cây | Khi một bản ghi thuộc bảng liên quy trình gửi thành công, hệ thống phải thêm Bước vào cây của bản ghi nguồn, nối về đúng bản ghi tạo ra nó (R1), và gắn \"Ở đây\" cho bước đó khi người tạo vào màn chi tiết. Gửi bản ghi và thêm bước cùng thành công hoặc cùng không: cây không nhận thì bản ghi không được ghi nhận gửi và giữ nguyên bản nháp. Nếu bản ghi nguồn vừa bị thu hồi trong lúc gửi, thì thu hồi thắng: hệ thống chặn bằng E-cross-process-flow-003. Bản nháp không hiện trên cây. | P0 | test: gửi phiếu xuất kho từ lệnh sửa chữa → cây có bước mới nối từ lệnh; thu hồi lệnh cùng lúc gửi phiếu → E-003, phiếu giữ nháp | brainstorm Mục 5.3; OQ-3, OQ-7 |\n| FR-cross-process-flow-004 | [Lõi] | Tính trạng thái bước | Hệ thống phải tính trạng thái Bước theo bản ghi hiện hành ứng với nó: Chưa triển khai · Đang triển khai · Đã hoàn thành · Đã thu hồi/từ chối · Đã huỷ (chỉ nhánh phát sinh, BR-cross-process-flow-009) (bảng chuyển Mục 9). Bước công nợ trả sau: Đang triển khai khi chốt công nợ lần đầu, Đã hoàn thành khi phần công nợ thuộc nghiệp vụ của luồng đó đã thanh toán (không chờ cả bảng công nợ), không có trạng thái Đã thu hồi/từ chối. | P0 | test theo bảng chuyển trạng thái Mục 9 | brainstorm Mục 6.3; OQ-14, OQ-15 |\n| FR-cross-process-flow-005 | [Lõi] | Dòng quy trình trên màn chi tiết | Khi người dùng mở màn chi tiết của một bản ghi thuộc quy trình, hệ thống phải hiện dòng quy trình (web: đầu màn · mobile: thẻ quy trình) gồm tên luồng, thanh tiến độ, \"Xong x/y bước · n nhánh phát sinh\", và \"Bước trước: {tên bước} {mã}\" (bước chính) hoặc \"Phát sinh từ: {tên bước} {mã}\" (nhánh phát sinh). y = mọi bước trên cây: bước chính (kể cả bước Chưa tạo), ngã rẽ (tính 1 bước), nhánh phát sinh, bước công nợ; không tính nhánh Đã huỷ và bản ghi Đã thay thế. Bản ghi không thuộc quy trình, hoặc luồng độc lập chưa có nhánh → không hiện gì. Đang tải: web hiện skeleton cao bằng dòng thật, không đẩy bố cục; app hiện skeleton thẻ có shimmer (GR-12). Nếu tải dòng quy trình lỗi, thì hệ thống phải hiện \"Không tải được quy trình.\" + Thử lại và vẫn cho dùng màn chi tiết bình thường. | P0 | demo trên 3 loại bản ghi: bước chính, nhánh phát sinh, không thuộc quy trình | brainstorm Mục 5.1, D1; OQ-11, OQ-22 |\n| FR-cross-process-flow-006 | [Lõi] | Mở sơ đồ | Khi người dùng bấm dòng quy trình hoặc một dòng ở danh sách Quy trình, hệ thống phải mở sơ đồ (web: popup · mobile: sheet), mặc định vừa khung. Mở từ màn chi tiết: chọn sẵn bước \"Ở đây\"; web mở luôn panel bước đó, app chỉ đánh dấu bước, không tự mở sheet bước. Mở từ danh sách: chưa chọn bước nào. Web: zoom 40–250%, kéo, nút vừa khung. App: chụm hai ngón để thu phóng, vuốt để kéo, không có nút thu phóng. Đang tải: \"Đang tải sơ đồ…\" (Override GR-12, Mục 10). Tải lỗi: tiêu đề \"Không tải được sơ đồ.\" + câu E-common-008 hoặc E-common-009 + Thử lại. | P0 | demo: mở từ màn chi tiết và từ danh sách | brainstorm Mục 5.2; OQ-23, OQ-25, OQ-26 |\n| FR-cross-process-flow-007 | [Lõi] | Vẽ cây quy trình | Hệ thống phải vẽ cây theo quy tắc R1–R17 của CMP-09: bước chính, nhánh phát sinh (nhãn Phát sinh), ngã rẽ chưa chốt, bước thuộc module khác (nhãn module), bước công nợ \"Công nợ {Tên NCC}\", nhiều bước trước cùng nối vào 1 bước, nhiều phiếu cùng loại là các bước anh em. Bước chính chưa tới hiện \"Chưa tạo\" viền đứt; nhánh phát sinh chỉ hiện khi điều kiện đã xảy ra. Ngã rẽ đã chốt hướng: nút ngã rẽ thành bước của hướng đã chọn, các hướng khác biến mất. Nhánh phát sinh Đã huỷ: viền đứt, chữ gạch, nhãn Đã huỷ. Bước \"1 bản ghi\" có bản ghi Đã thay thế: thẻ hiện bản ghi hiện hành kèm \"+n bản ghi trước\" (BR-cross-process-flow-011). Mã trên thẻ theo BR-cross-process-flow-012. | P0 | kiểm tra trên mẫu luồng Sửa chữa xe khách hàng có Nhập kho dư → Bồi thường và 2 phiếu Xuất kho | brainstorm Mục 4 P0; CMP-09; OQ-4, OQ-9, OQ-11, OQ-14 |\n| FR-cross-process-flow-008 | [Lõi] | Panel chi tiết bước | Khi người dùng chọn một bước, hệ thống phải mở panel gồm đầu panel (tên, mã, trạng thái, nhãn Ở đây / Phát sinh / module; nhánh phát sinh có thêm lý do phát sinh), 5 dòng lịch sử hoạt động mới nhất + \"Xem tất cả\", và nút mở ghim đáy panel. Nếu bước chưa có bản ghi, thì hiện \"Chưa có hoạt động. Bước này chưa được tạo.\" (D2). Nếu bước là ngã rẽ chưa chốt, thì liệt kê các hướng có thể đi (D5). Nếu bước có bản ghi Đã thay thế, thì thêm khối \"Bản ghi trước đó\": mỗi bản ghi 1 dòng gồm mã · Đã thay thế · ngày bị từ chối/thu hồi · Mở (theo quyền FR-cross-process-flow-009). Khối lịch sử: đang tải hiện skeleton 5 dòng; lỗi hiện \"Không tải được lịch sử.\" + Thử lại trong khối, đầu panel và nút mở vẫn dùng được; rỗng hiện \"Chưa có hoạt động.\" | P0 | demo 5 loại bước: có bản ghi, chưa tạo, ngã rẽ, công nợ, có bản ghi thay thế | brainstorm Mục 5.2, D2, D5; OQ-4, OQ-22 |\n| FR-cross-process-flow-009 | [Lõi] | Quyền xem theo bước | Hệ thống phải cho người xem thấy mọi bước của cây (tên, mã, trạng thái, lý do phát sinh). Quyền xem lịch sử và mở bản ghi của một bước tính theo phân quyền xem của nghiệp vụ ứng với bước đó, áp như nhau cho mọi người dùng kể cả Lái xe; bước thuộc module khác mà người xem có quyền thì mở bình thường. Nếu người xem không có quyền (D3), thì panel ẩn lịch sử và nút mở, hiện câu E-common-011 tại chỗ. Trên app, nút mở chỉ có khi app có màn chi tiết của loại bản ghi đó (Mục 11). | P0 | test: người Xưởng xem bước Cấp dầu khi có và không có quyền Cây dầu | brainstorm Mục 6.2, D3; OQ-16, OQ-17, OQ-18, OQ-20 |\n| FR-cross-process-flow-010 | [Lõi] | Mở màn hình chi tiết của bước | Khi người dùng bấm \"Mở màn hình chi tiết\", hệ thống phải mở màn chi tiết bản ghi của bước — web: cùng tab, đóng popup, Back trình duyệt về màn cũ và popup không mở lại · mobile: đẩy màn mới, Back về màn trước, sheet đã đóng. Nếu bản ghi vừa bị thu quyền, thì web hiện popup Loại 2 (GR-15) câu E-common-011 + Đóng, ở lại sơ đồ; app hiện popup chặn E-common-011 Theo GR-26. Nếu bản ghi đã bị xoá trong lúc sơ đồ đang mở, thì hiện E-cross-process-flow-004 + Tải lại sơ đồ. | P0 | demo web + mobile, kiểm Back | brainstorm Mục 5.2, Mục 6.4; OQ-23, OQ-26 |\n| FR-cross-process-flow-011 | [Lõi] | Mở bảng công nợ | Nếu bước là thanh toán trả sau (D4), thì panel phải có nút \"Mở bảng công nợ\" thay cho \"Mở màn hình chi tiết\", mở bảng công nợ đã lọc theo nhà cung cấp và khoảng thời gian của bảng công nợ đó. Chỉ trên web: Delta Super App không có màn Bảng công nợ, sheet bước công nợ chỉ hiện trạng thái, không có nút mở. | P0 | demo trên luồng trả sau | brainstorm Mục 5.4, D4; userflow OQ-2 |\n| FR-cross-process-flow-012 | [Lõi] | Tạo nghiệp vụ tiếp theo | Khi bản ghi đạt hành động trigger theo bảng liên quy trình và người xem có quyền tạo (D6), hệ thống phải hiện nút tạo bước tiếp theo (vd \"Tạo phiếu xuất kho\") ở vùng hành động đầu trang, không đặt trên sơ đồ. Bấm → form tạo mới đã điền sẵn thông tin mang từ bản ghi trước. Gửi thành công → vào màn chi tiết bản ghi mới, cây có bước mới (FR-cross-process-flow-003). Trên app: chỉ có ở nghiệp vụ có màn trên app (cột \"Có trên app\" của bảng liên quy trình, BR-cross-process-flow-007); lỗi E-cross-process-flow-001/003 hiện dạng sheet lỗi Loại 2 (GR-15 Mobile). | P0 | test: chốt lệnh sửa chữa → hiện nút; người không có quyền tạo → không hiện | brainstorm Mục 5.3, D6; OQ-19 |\n| FR-cross-process-flow-013 | [Lõi] | Chặn gửi trùng bước \"1 bản ghi\" | Nếu người dùng gửi bản ghi cho một bước khai \"1 bản ghi\" mà bước đó đã có bản ghi khác đang chờ phê duyệt hoặc đã xong, thì hệ thống phải chặn bằng E-cross-process-flow-001 (câu theo từng trường hợp) và giữ nguyên bản nháp. Hai người cùng gửi thì chỉ người gửi trước được nhận. Bản ghi hiện có đang Đã thu hồi/từ chối thì không chặn: bản ghi mới thay thế bản cũ (BR-cross-process-flow-011). Bước khai \"nhiều bản ghi\" (vd Xuất kho) không chặn — bản ghi mới thành bước anh em. | P0 | test 2 người cùng gửi cho 1 bước \"1 OQ-25 |\n| FR-cross-process-flow-022 | [Lõi] | Xuất danh sách Quy trình | Khi người dùng bấm Xuất trên danh sách Quy trình, hệ thống phải xuất PDF hoặc Excel đúng tập dữ liệu đang thấy (sau tìm, lọc, sắp, gồm mọi trang) và đúng các cột đang hiện theo thứ tự đang cấu hình. File theo quy định xuất danh sách chung: 1 dòng = 1 quy trình, không dòng nhóm/tổng; khối thông tin phụ gồm Thời gian xuất · Người xuất · Tổng số dòng · Tiêu chí lọc; tên sheet \"DS - Quy trình\"; tên file `Export_DanhSach_QuyTrinh_<yyyyMMdd_HHmm>.xlsx`; trang in nằm ngang. Ai xem được menu Quy trình của module thì xuất được. | P0 | test: lọc 1 chi nhánh + ẩn 2 cột → file đúng số dòng, đúng 8 cột, khối thông tin phụ ghi đúng bộ lọc | SRS cũ UC00.00.09 Export danh sách; Theo GR-19; OQ-16, OQ-31 |\n\n### 4. Non-Functional Requirements (NFR)\n\n| ID | Category | Requirement | Priority | Acceptance |\n|----|----------|-------------|----------|------------|\n| NFR-cross-process-flow-001 | performance | Sơ đồ hiện đủ sau khi bấm dòng quy trình | P0 | ≤2 giây với cây ≤20 bước; ≤3 giây với cây ≤50 bước |\n| NFR-cross-process-flow-002 | performance | Dòng quy trình không làm chậm màn chi tiết | P0 | Màn chi tiết hiện không phải chờ dòng quy trình; dòng quy trình hiện trong ≤2 giây |\n| NFR-cross-process-flow-003 | freshness | Trạng thái bước và quy trình phản ánh gần như ngay sau khi bản ghi đổi | P0 | Màn mở sau thay đổi thấy trạng thái mới; màn đang mở hiện banner GR-27 trong vòng tối đa 2 giây kể từ lúc bản ghi đổi |\n| NFR-cross-process-flow-004 | security | Không lộ thông tin bước người xem không có quyền | P0 | Panel bước không có quyền không hiện lịch sử, không có nút mở; quyền theo phân quyền xem của nghiệp vụ ứng với từng bước (FR-cross-process-flow-009) |\n| NFR-cross-process-flow-005 | usability | Trạng thái không chỉ báo bằng màu; tôn trọng giảm chuyển động | P0 | Mọi trạng thái có chữ + icon; vệt sáng trên đường nối tắt khi thiết bị bật giảm chuyển động |\n| NFR-cross-process-flow-006 | capacity | Mức thiết kế 20 bước mỗi cây | P1 | Cây trên 20 bước vẫn vẽ đủ, mặc định vừa khung, zoom/kéo xem được |\n| NFR-cross-process-flow-007 | localization | Giao diện Tiếng Việt và Tiếng Anh | P0 | Mọi câu chữ của tính năng có 2 ngôn ngữ, gồm câu lỗi ở Error Matrix và nhãn trong bảng liên quy trình (BR-cross-process-flow-007) |\n| NFR-cross-process-flow-008 | data | Quy trình dựng từ dữ liệu cũ khớp chứng từ nguồn | P0 | Dựng toàn bộ, kể cả quy trình đã hoàn thành; đối chiếu mẫu theo từng luồng trước khi lên: 0 sai lệch về bước, nguồn, trạng thái; mã theo dãy `QT-[Mã chi nhánh]-LG-[XXXX]` (BR-cross-process-flow-004); Cập nhật lần cuối = ngày chuyển dữ liệu |\n| NFR-cross-process-flow-009 | performance | Danh sách và ô tìm phản hồi nhanh | P0 | Trang 50 dòng hiện trong ≤2 giây; kết quả tìm hiện trong ≤1 giây sau khi ngừng gõ |\n| NFR-cross-process-flow-010 | data | Cây không lệch với bản ghi | P1 | Đối soát hằng đêm giữa cây và trạng thái bản ghi; lệch thì sửa theo bản ghi và ghi log, người dùng không thấy |\n\n### 5. Business Rules\n\n| ID | Tầng | Rule | Trigger | Implements FR | Source |\n|----|------|------|---------|---------------|--------|\n| BR-cross-process-flow-001 | [Lõi] | Mỗi bản ghi thuộc đúng 1 quy trình, không có ngoại lệ. | Thêm bước | FR-cross-process-flow-003 | brainstorm Mục 6.5 |\n| BR-cross-process-flow-002 | [Lõi] | Quy trình chuyển Đã dừng khi một bước của **luồng chính** bị từ chối/thu hồi chưa gửi lại; về Đang triển khai khi bước đó được gửi lại, có bản ghi thay thế (BR-cross-process-flow-011), hoặc bản ghi bị xoá (tính lại như thể bản ghi đó chưa từng có). Nhánh phát sinh bị từ chối không làm quy trình Đã dừng; cột Bước đang chờ hiện nhánh đó kèm trạng thái. | Bước đổi trạng thái | FR-cross-process-flow-002, FR-cross-process-flow-015 | brainstorm Mục 6.3; OQ-13 |\n| BR-cross-process-flow-003 | [Lõi] | Quy trình Đã hoàn thành khi mọi bước chính và nhánh phát sinh đã xong; nhánh phát sinh Đã huỷ không tính. Không có đóng thủ công. Đã hoàn thành cess-flow-003, FR-cross-process-flow-007 | brainstorm Mục 6.5 |\n| BR-cross-process-flow-009 | [Lõi] | Xoá bản ghi (chỉ nghiệp vụ cho xoá): bước chính về Chưa triển khai, mã về `N/A`, hiện \"Chưa tạo\" nét đứt; nhánh phát sinh chuyển Đã huỷ (viền đứt, chữ gạch), không tính vào tiến độ và không chặn quy trình Đã hoàn thành; bản ghi Đã thay thế bị xoá thì bỏ khỏi khối \"Bản ghi trước đó\", không đổi trạng thái gì. | Xoá bản ghi | FR-cross-process-flow-004, FR-cross-process-flow-007 | brainstorm Mục 6.3; OQ-14 |\n| BR-cross-process-flow-010 | [Lõi] | Liên quy trình không tự gửi thông báo; thông báo đi theo từng nghiệp vụ (CMP-02). | — | FR-cross-process-flow-003 | brainstorm Mục 8 |\n| BR-cross-process-flow-011 | [Lõi] | Bước khai \"1 bản ghi\" có bản ghi đang Đã thu hồi/từ chối vẫn nhận bản ghi mới. Bản ghi mới thành bản ghi hiện hành, trạng thái bước tính theo nó; bản ghi cũ mang nhãn Đã thay thế, không tính vào tiến độ, không làm quy trình Đã dừng. Sửa bản cũ rồi gửi lại bị chặn bằng E-cross-process-flow-001. Bản mới bị từ chối tiếp thì lặp lại cách trên. | Gửi bản ghi cho bước \"1 bản ghi\" | FR-cross-process-flow-007, FR-cross-process-flow-008, FR-cross-process-flow-013 | OQ-4 |\n| BR-cross-process-flow-012 | [Lõi] | Mã trên bước: bản ghi chưa được duyệt hiện mã yêu cầu; được duyệt thì hiện mã bản ghi. Sửa rồi gửi lại giữ nguyên mã yêu cầu. Ô tìm tìm được cả hai mã. | Bản ghi gửi / được duyệt | FR-cross-process-flow-007, FR-cross-process-flow-016 | OQ-9 |\n\n### 6. Error Matrix\n\n| Error ID | Title | Trigger | Severity | Related FR | Screen state | Recovery |\n|----------|-------|---------|----------|------------|--------------|----------|\n| E-cross-process-flow-001 | Bước đã có yêu cầu khác | Gửi bản ghi cho bước \"1 bản ghi\" đã có bản ghi khác đang chờ phê duyệt hoặc đã xong; hoặc gửi lại bản ghi Đã thay thế. Popup (GR-15 Loại 2), tiêu đề \"Không thể gửi\", không có Thử lại. Wording — đang chờ: \"Bước [Tên bước] đã có yêu cầu khác đang chờ phê duyệt. Chờ yêu ghi [mã] đã bị xoá.\" / EN: \"Record [code] has been deleted.\" Nút: Tải lại sơ đồ (chính) · Đóng. | minor | FR-cross-process-flow-010 | Sơ đồ giữ nguyên tới khi tải lại | Tải lại sơ đồ để thấy trạng thái mới |\n\nE-common dùng lại (wording ở `design/ui-common/conventions.md`):\n\n| Mã lỗi | Chỗ dùng | Related FR |\n|---|---|---|\n| E-common-008 | Lỗi tải sơ đồ (mô tả trong popup lỗi) / danh sách (khối lỗi trong vùng bảng) / lịch sử trong panel — kèm Thử lại tại chỗ | FR-cross-process-flow-006, FR-cross-process-flow-008, FR-cross-process-flow-015 |\n| E-common-009 | Mất mạng khi mở sơ đồ — mô tả trong popup lỗi + Thử lại | FR-cross-process-flow-006 |\n| E-common-011 | Bước không có quyền xem (hiện tại chỗ trong panel) · bản ghi vừa bị thu quyền khi bấm mở (web: popup Loại 2 · app: popup chặn) · mở đường dẫn danh sách khi không có quyền | FR-cross-process-flow-009, FR-cross-process-flow-010, FR-cross-process-flow-019 |\n\n### 7. Success Criteria\n\n| ID | Outcome nghiệp vụ | Đo bằng | Mốc đạt |\n|----|-------------------|---------|---------|\n| SC-cross-process-flow-01 | Mọi luồng có bảng liên quy trình theo quy tắc câu chữ mới | Đối chiếu bảng phát sinh SRS cũ (Xưởng, Cây dầu, Liên module) | 100% luồng |\n| SC-cross-process-flow-02 | Từ một mã bất kỳ tìm ra quy trình chứa nó nhanh | Số thao tác: gõ mã → bấm dòng | ≤2 thao tác |\n| SC-cross-process-flow-03 | Quản lý xưởng thấy bước kẹt của một lệnh sửa chữa mà không mở từng phiếu | Demo nghiệm thu trên luồng Sửa chữa | Thấy được từ cột Bước đang chờ hoặc sơ đồ |\n| SC-cross-process-flow-04 | Bản ghi được tạo qua nút \"tạo nghiệp vụ tiếp theo\" thay vì tạo tay | Tỉ lệ tạo qua nút / tạo tay | Đo sau khi lên; mốc chốt ở URD/BRD |\n| SC-cross-process-flow-05 | Giảm việc mở từng phiếu để tìm bước kẹt | Số lần mở phiếu trước và sau khi lên | Đo sau khi lên; mốc chốt ở URD/BRD |\n\n### 8. Data Entities (tóm tắt — chi tiết ở [erd.md](#sec-erd))\n\n| Đối tượng | Thuộc tính nghiệp vụ | Quan hệ |\n|---|---|---|\n| Quy trình | Mã quy trình · Luồng · Bản ghi gốc · Tiến độ (Xong x/y bước) · Số nhánh phát sinh · Bước đang chờ · Trạng thái · Chi nhánh · Cập nhật lần cuối | Chi nhánh / Phương tiện / Xe của khách hàng 1–n Quy trình · Quy trình gồm 1–n Bước |\n| Bước quy trình | Tên bước · Mã bản ghi (`N/A` khi chưa tạo) · Trạng thái bước · Loại bước (bước chính, nhánh phát sinh, ngã rẽ chưa chốt, công nợ, liên module) · Module · Trường hợp phát sinh · Các hướng có thể đi (chỉ ngã rẽ) | Bước phát sinh 1–n Bước · Bước ứng với 1–1 bản ghi nghiệp vụ (Báo cáo sự cố, Báo giá, Lệnh sửa chữa, Phiếu xuất kho, Phiếu nhập kho, Đề nghị bồi thường, Đơn mua HHDV, Thanh toán trả trước, Kế hoạch mua dầu, Đơn mua dầu, Phiếu nhập dầu, Phiếu cấp dầu, Định mức nhiên liệu, Bàn giao phương tiện) · Bước trỏ tới n–1 Thanh toán trả sau |\n\nNguồn: **Bản đồ đối tượng**.\n\n### 9. Flows\n\n> Sequence diagram chi tiết cho từng flow (nguồn: `srs/flows.md`).\n\n#### Flow: Gửi bản ghi → cập nhật cây quy trình\n__Trigger__: Người tạo bản ghi gửi, thu hồi hoặc xoá một bản ghi thuộc bảng liên quy trình\n__Related UC__: [uc-tao-nghiep-vu-tiep-theo](#uc-uc-tao-nghiep-vu-tiep-theo) · [uc-cap-nhat-quy-trinh-theo-ban-ghi](#uc-uc-cap-nhat-quy-trinh-theo-ban-ghi)\n__Related FR__: FR-cross-process-flow-001, -002, -003, -004, -012, -013, -014, -020 · BR-cross-process-flow-011, -012\n\n```mermaid\nsequenceDiagram\n    actor U as Người tạo bản ghi\n    participant NV as Nghiệp vụ (module)\n    participant LQT as Liên quy trình\n    participant M as Màn đang mở\n\n    U->>NV: Bấm nút tạo bước tiếp theo\n    NV->>LQT: Hỏi dữ liệu mang từ bản ghi trước\n    LQT-->>NV: Dữ liệu điền sẵn\n    NV-->>U: Form tạo mới đã điền sẵn\n    U->>NV: Gửi bản ghi\n    NV->>LQT: Hỏi cây có nhận bước mới từ bản ghi nguồn không\n    alt Bản ghi nguồn vừa bị thu hồi (thu hồi đến trước)\n        LQT-->>NV: Từ chối thêm bước\n        NV-->>U: Popup E-cross-process-flow-003, nút Giữ bản nháp hoặc Xoá bản nháp\n    else Bước khai 1 bản ghi đã có bản ghi đang chờ phê duyệt hoặc đã xong\n        LQT-->>NV: Từ chối thêm bước\n        NV-->>U: Popup E-cross-process-flow-001, giữ bản nháp\n    else Bước nhận được (hợp lệ, khai nhiều bản ghi, hoặc bản cũ Đã thu hồi/từ chối)\n        LQT-->>NV: Nhận bước\n        Note over NV,LQT: Ghi nhận gửi và thêm bước cùng thành công hoặc cùng không. Lỗi thì bản ghi giữ nháp\n        NV->>LQT: Ghi nhận bản ghi gửi thành công kèm bản ghi nguồn\n        opt Chưa có quy trình\n            LQT->>LQT: Tạo quy trình, sinh mã QT-[CN]-[YY]-[XXXX]\n        end\n        opt Bước 1 bản ghi đang có bản ghi Đã thu hồi/từ chối\n            LQT->>LQT: Bản ghi cũ thành Đã thay thế, bản mới là bản ghi hiện hành\n        end\n        LQT->>LQT: Thêm bước nối về bản ghi nguồn, Đang triển khai, hiện mã yêu cầu\n        LQT->>LQT: Tính lại trạng thái quy trình\n        LQT-->>NV: Đã cập nhật cây\n        NV-->>U: Màn chi tiết bản ghi mới, ghim Ở đây\n        LQT-)M: Báo quy trình vừa có cập nhật (GR-27)\n    end\n\n    U->>NV: Thu hồi hoặc xoá bản ghi\n    NV->>LQT: Hỏi bản ghi đã có bước con chưa\n    alt Đã có bước con\n        LQT-->>NV: Không cho phép\n        NV-->>U: Popup E-cross-process-flow-002, nêu tối đa 2 bước con kèm mã\n    else Chưa có bước con\n        LQT-->>NV: Cho phép\n        NV->>LQT: Báo bản ghi đã thu hồi hoặc đã xoá\n        LQT->>LQT: Đổi trạng thái bước (xoá nhánh phát sinh thì Đã huỷ), tính lại quy trình\n        LQT-)M: Báo quy trình vừa có cập nhật (GR-27)\n    end\n\n    NV->>LQT: Bản ghi được duyệt\n    LQT->>LQT: Thẻ bước đổi từ mã yêu cầu sang mã bản ghi, tính lại trạng thái\n```\n\n#### Flow: Mở sơ đồ và xem một bước\n__Trigger__: Người theo dõi quy trình bấm dòng quy trình trên màn chi tiết, hoặc bấm một dòng ở danh sách Quy trình\n__Related UC__: [uc-xem-quy-trinh-cua-ban-ghi](#uc-uc-xem-quy-trinh-cua-ban-ghi) · [uc-tra-cuu-quy-trinh](#uc-uc-tra-cuu-quy-trinh)\n__Related FR__: FR-cross-process-flow-006 → 011, FR-cross-process-flow-020\n\n```mermaid\nflowchart TD\n    start([\"Bấm dòng quy trình hoặc dòng danh sách\"]) --> load[\"Tải sơ đồ\"]\n    load --> ok{\"Tải được?\"}\n    ok -->|\"Không\"| err[\"Popup Không tải được sơ đồ: E-common-008 hoặc E-common-009 + Thử lại\"]\n    err -->|\"Thử lại\"| load\n    ok -->|\"Có\"| from{\"Mở từ đâu?\"}\n    from -->|\"Màn chi tiết\"| here[\"Chọn sẵn bước Ở đây\"]\n    from -->|\"Danh sách\"| none[\"Chưa chọn bước nào\"]\n    none --> pick[\"Người dùng chọn một bước\"]\n    here --> chan{\"Kênh?\"}\n    chan -->|\"Web\"| d5\n    chan -->|\"App: chỉ đánh dấu bước\"| pick\n    pick --> d5{\"D5: Ngã rẽ chưa chốt?\"}\n    d5 -->|\"Có\"| fork[\"Panel liệt kê các hướng có thể đi\"]\n    d5 -->|\"Không\"| d2{\"D2: Bước đã có bản ghi?\"}\n    d2 -->|\"Không\"| empty[\"Panel: Chưa có hoạt động\"]\n    d2 -->|\"Có\"| d3{\"D3: Có quyền xem?\"}\n    d3 -->|\"Không\"| noperm[\"Panel: E-common-011 tại chỗ, ẩn lịch sử và nút, giữ lý do phát sinh\"]\n    d3 -->|\"Có\"| hist[\"Panel: lịch sử 5 dòng mới nhất + khối Bản ghi trước đó nếu có\"]\n    hist --> d4{\"D4: Bước công nợ trả sau?\"}\n    d4 -->|\"Có, web\"| debt[\"Mở bảng công nợ đã lọc theo NCC\"]\n    d4 -->|\"Có, app\"| debtapp[\"Sheet chỉ hiện trạng thái, không có nút mở\"]\n    d4 -->|\"Không\"| open[\"Mở màn hình chi tiết\"]\n    open --> gone{\"Bản ghi còn không?\"}\n    gone -->|\"Đã bị xoá\"| e4[\"Popup E-cross-process-flow-004\"]\n    e4 -->|\"Tải lại sơ đồ\"| load\n    gone -->|\"Còn\"| perm{\"Vẫn còn quyền?\"}\n    perm -->|\"Không\"| block[\"Web: popup Loại 2 E-common-011 + Đóng · App: popup chặn GR-26\"]\n    perm -->|\"Có\"| done([\"Màn chi tiết bản ghi của bước\"])\n    debtapp --> pick\n    debt --> done2([\"Bảng công nợ\"])\n    fork --> pick\n    empty --> pick\n    noperm --> pick\n    block --> pick\n```\n\nTrong khi sơ đồ đang mở, thông tin đang hiện trên sơ đồ đổi ở nơi khác thì hiện banner Theo GR-27 + Tải lại; tải lại giữ bước đang chọn nếu còn. Thay đổi không làm đổi thông tin đang hiện thì không báo (FR-cross-process-flow-020).\n\nKhông vẽ trong sơ đồ, theo spec: đang tải sơ đồ hiện \"Đang tải sơ đồ…\" (FR-cross-process-flow-006) · khối lịch sử có đang tải (skeleton 5 dòng), lỗi (\"Không tải được lịch sử.\" + Thử lại, đầu panel và nút mở vẫn dùng được), rỗng (FR-cross-process-flow-008) · trên app, nút mở chỉ có khi app có màn chi tiết của loại bản ghi đó (FR-cross-process-flow-009).\n\n#### Notes\n\n- Mã lỗi theo Error Matrix trong [SRS spec](#sec-spec) Mục 6.\n- \"Liên quy trình\" trong sequence là phần dùng chung của hệ thống. \"Nghiệp vụ (module)\" là phần của từng nghiệp vụ (Xưởng, Kho, Thanh toán…).\n\n### 10. Screens — Design (Figma)\n\n#### Danh mục màn\n\n<\!-- screens-catalog:begin — máy sinh bởi _scripts/screens-md.py, KHÔNG sửa tay; sửa screens/*.md (qua /figma-sync) rồi chạy lại. Sinh 2026-10-13 -->\n\n| # | Slug | Màn | Status | Thuộc flow | Used by | Mô tả | Figma |\n|---|---|---|---|---|---|---|---|\n| 1 | `record-detail` | 1.1 · web · Màn chi tiết bản ghi có dòng quy trình | approved | view-process | FR-001, FR-002, FR-005, FR-006, FR-012, FR-014 | Màn chi tiết của bản ghi nghiệp vụ, có dòng quy trình ở đầu cho biết bản ghi đang ở bước nào; bấm dòng để mở sơ đồ, có nút tạo nghiệp vụ tiếp theo khi đạt điều kiện. | [1.1 · web](https://www.figma.com/design/FifpyOMpZk9OP8qyNzbRVJ/?node-id=5587-117888) |\n| 2 | `process-diagram` | 1.2 · web · Popup sơ đồ — chọn sẵn Ở đây | approved | view-process | FR-001, FR-002, FR-003, FR-005, FR-006, FR-007, FR-008, FR-009, FR-010, FR-020 | Popup sơ đồ cây quy trình mở từ màn chi tiết, chọn sẵn bước \"Ở đây\" và mở panel của bước đó. | [1.2 · web](https://www.figma.com/design/FifpyOMpZk9OP8qyNzbRVJ/?node-id=5587-119271) |\n| 3 | `step-not-created` | 1.3 · web · Panel bước chưa tạo | approved | view-process | FR-008 | Panel của bước chưa tạo bản ghi: mã N/A, nhãn \"Chưa tạo\", chưa có lịch sử. | [1.3 · web](https://www.figma.com/design/FifpyOMpZk9OP8qyNzbRVJ/?node-id=5587-122359) |\n| 4 | `branch-point` | 1.4 · web · Panel ngã rẽ | approved | view-pr
