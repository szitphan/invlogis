` | — | Swap vào `BottomSheet › Content`: cây = Tall, panel bước = Hug, đang tải = Tall (skeleton GR-12), lỗi = Capped. Sheet cây: header tên quy trình + mã/tiến độ + X Ghost LG bo full. Sheet panel bước: không header, dòng đầu là nút quay lại \"‹ Sơ đồ quy trình\" của panel. Cây vuốt ngang, mép phải mờ 32px. Không có nút Đóng ở đáy |\n| Dòng, Nhãn đường, Thanh zoom, .Chấm bước, .Dòng lịch sử | trong Master Components | — | Theo screen-patterns CMP-09 |\n\n* **Đường nối (theo lab):** vuông góc, bo góc 10px, **không mũi tên**; góc rẽ cách bước trước 16px; mỗi đường vào 1\n  cửa riêng ở cạnh trái thẻ, cách nhau 14px theo thứ tự trên → dưới của bước trước. Nét 1.8px, đường từ gốc tới\n  bước của màn đang mở 2.6px, đường chạm bước đang chọn 3px, đường khác mờ 25% khi có bước đang chọn. Màu theo\n  trạng thái bước đích: đã tạo `Green/Icon` · đang triển khai `Blue/Icon` (+ vệt sáng chạy) · chưa tạo `Gray/Icon`\n  nét đứt 5/4.\n* **Dàn cây web:** cây toả — bước chính giữ hàng của bước trước, nhánh chia nửa trên/nửa dưới; thẻ 320, khe cột 64\n  (hoặc nhãn dài nhất + 32), khe hàng 32.\n* **Mã:** `{typography.code-sm}` (`Text/Code Small`), không cắt; thẻ giãn tới 360 để đủ chỗ.\n* **Cảnh ví dụ:** popup mở từ màn chi tiết (Ở đây + panel), mở từ danh sách (không chọn, tooltip điều kiện), bước\n  không có quyền, nhánh phát sinh có lý do, sơ đồ đang tải/lỗi (web + mobile), sheet cây + sheet panel bước, chữ dài.\n* **Giới hạn khi dựng bằng proxy (KG-32):** xem Known Gaps.\n\n##### Khung trang web (CMP-11, component thật 12/10/2026)\n\n_Nguồn: `design/design.md:1416`_\n\nMenu trái + thanh trên cho mọi màn web, thay `AppShell` SideNav 300 của Astryx. Số đo khung: § Grid & Container ›\nKhung trang dự án; nội dung + hành vi: `design/ui-common/screen-patterns.md` § CMP-11. Figma: trang 00 · Chung ›\nkhung `Khung trang · innvie` (`5596:129165`).\n\n| Component | Node | Biến thể / thuộc tính | Ghi chú |\n| --- | --- | --- | --- |\n| `Khung trang / .Mục menu` | `5596:129193` | Dạng Mở rộng / Thu gọn × Tương tác Thường / Rê chuột / Đang chọn · `Nhãn`, `Icon` (swap), `Có số đếm` | Mở rộng 216×34 (icon 16 + nhãn 14, đệm 10, khe 10, bo `{rounded.element}`); Thu gọn 40×34 chỉ icon, số đếm thành chấm, rê chuột hiện tooltip tên. Rê chuột: nền `{colors.overlay-hover}`; Đang chọn: nền `{colors.background-muted}`, chữ `{typography.label}`; cả hai chữ + icon primary. **Không vạch dọc.** Số đếm = `Badge` Info |\n| `Khung trang / .Nhóm menu` | `5596:129227` | `Tên nhóm` | Chữ hoa `{typography.supporting}` secondary; cách mục trên 16, mục dưới 6; ẩn khi thu gọn |\n| `Khung trang / .Chân menu` | `5596:129268` | Trường hợp Nhiều cơ sở / Một cơ sở / Không chia cơ sở / Thu gọn · `Module`, `Cơ sở`, `Icon module` (swap) | Thẻ viền `{colors.border-default}` bo `{rounded.container}`, đệm 8: ô icon module 32 + tên module, vạch, dòng cơ sở (pin + tên + chevron khi nhiều cơ sở). Không kẻ vạch phía trên chân menu |\n| `Khung trang / Menu trái` | `5596:129316` | Dạng Mở rộng 240 / Thu gọn 64 · `Tên đơn vị`, `Tên module`, `Chữ logo` | Nền surface, viền phải 1px, đệm 12, mục cách 2. Đầu: ô logo 30 (màu `P-mau-logo`) + tên đơn vị + module + nút thu gọn (Ghost icon-only). Chân menu ghim đáy. Mục và nhóm là instance — sửa nhãn, icon, số đếm, mục đang chọn trên instance; thêm/bớt theo module và phân quyền role |\n| `Khung trang / Thanh trên` | `5596:129536` | `Mục cha`, `Trang hiện tại`, `Có thông báo` | Cao 44, nền surface, vạch dưới 1px: đường dẫn (mục cha secondary › trang hiện tại primary) · tìm · chuông (chấm đỏ khi có việc cần xử lý, CMP-02) · avatar chữ tắt |\n\n* **Ghép màn:** khung ngang [Menu trái (STRETCH)][Vùng chính: Thanh trên (STRETCH) + Nội dung đệm 24, nền surface].\n  Danh sách giãn hết; chi tiết ≤ 1440, form ≤ 720, căn giữa. 768–1279 dùng Menu trái Thu gọn; < 768 dùng MobileNav.\n* **Chữ dài:** mọi chữ 1 dòng, code cắt \"…\" (Figma cắt cứng ở mép — KG-32); số đếm, chevron giữ bên phải.\n* **Icon mục menu:** feature khai trong UC (vị trí mục, module cha); mẫu theo h trái, cột action cố định phải; cột cố định có bóng nhẹ ở cạnh trong. Đủ rộng hiện hết cột thì không freeze |\n| **Nhóm** (2.17) | Nút **Nhóm** trên toolbar, chọn **1 cột**; chọn **Xoá** để bỏ nhóm. Dòng cha = giá trị nhóm + số bản ghi (\"Petrolimex (5)\"). Nhóm đầu mở sẵn tối đa 10 dòng con, nhóm khác thu gọn; click dòng cha để mở/thu. > 10 dòng → **\"Xem thêm\"** (+10 mỗi lần). Phân trang theo nhóm (xem Phân trang) |\n| **Sắp xếp** (2.18) | Click tiêu đề cột: lần 1 tăng dần ↑ → lần 2 giảm dần ↓ → lần 3 về mặc định. Mọi cột sort được; mỗi lúc chỉ **1 cột** (sort cột khác thì cột cũ reset). Chưa sort: icon mờ. Mặc định: **mới nhất trước** (thời gian tạo giảm dần) |\n| **Export** (2.19) | Xuất PDF / Excel **toàn bộ** dữ liệu sau khi đã lọc, nhóm, tuỳ chỉnh cột — gồm mọi trang, không chỉ trang đang xem |\n| **Lọc theo cột** (2.20) | Nhập giá trị/ID → ô tìm · chọn giá trị → dropdown · ngày giờ → chọn khoảng ngày (chỉ `dd/mm/yyyy`, không chọn giờ) · số/tiền/% → 2 ô Từ – Đến. Cách trình bày trên innvie: § Bộ lọc nâng cao |\n| **Cột action** (SC-07) | Tối đa **2** icon hiện thẳng trên hàng, còn lại gom vào `⋯` (MoreMenu). Chỉ hiện action **dùng được** theo trạng thái + quyền — không hiện rồi vô hiệu. Xoá/Huỷ luôn nằm trong `⋯`; chỉ có 1 action phụ thì hiện thẳng, không dùng `⋯`. Nút icon phải có nhãn truy cập |\n| **Sửa trong ô** | Theo § Sửa trong bảng: bảng danh sách click-to-edit, lưu từng ô; bảng dòng hàng trong form luôn là input, lưu cùng form. Ô đang sửa được thì click ô **không** mở chi tiết |\n| **Mở chi tiết** (SC-07) | Click vùng thông tin của hàng (tên, mã, người phụ trách…) → mở chi tiết. Click vùng action **không** mở chi tiết |\n\n##### Trạng thái giao diện: mọi màn phải có đủ\n\n_Nguồn: `design/design.md:1539`_\n\n| Trạng thái | Component dùng | Mẫu tham chiếu |\n| --- | --- | --- |\n| **Rỗng · chưa có dữ liệu** | `EmptyState` (icon + tiêu đề + mô tả + hành động); trong cột/khối nhỏ dùng Size=Compact. Nút **+ Tạo mới** nếu user có quyền | Cột \"In review\" của Kanban: \"Nothing in review / Items awaiting your review appear here.\" |\n| **Rỗng · lọc/tìm không ra** | `EmptyState`: \"Không tìm thấy kết quả phù hợp\" + nút **Xoá bộ lọc**. **Không** có Tạo mới (2.12) | — |\n| **Đang tải** | `Skeleton` giữ đúng hình khối nội dung; `Spinner` cho thao tác ngắn; Button State=Loading khi gửi; ProgressBar khi biết tiến độ | Shell Side/Top Nav: vùng nội dung skeleton |\n| **Lỗi field** | Field`state=error` + status message dưới field, chữ `{colors.error}` + ring error | — |\n| **Lỗi trang/khối** | `Banner` Status=error (có hành động thử lại ở End Content). Khối dữ liệu tải lỗi trong panel/sheet (lịch sử hoạt động CMP-08/CMP-09, sơ đồ CMP-09): `EmptyState` icon `wifi-off` + câu theo E-common-008/009 + **Thử lại** (Compact trong khối nhỏ) | — |\n| **Thành công/xác nhận** | `Toast` (tạm thời) hoặc `Banner` success (bền) | — |\n| **Vô hiệu** | State=Disabled (opacity 0.5 cho nút; chữ`{colors.text-disabled}` cho field) | — |\n| **Đang chọn** | TableCell/ListItem/SideNavItem State=Selected; SelectableCard Selected | — |\n\n##### Nhập liệu và kiểm tra (theo 2.1–2.3, 2.7, 2.15)\n\n_Nguồn: `design/design.md:1650`_\n\nLỗi cấp field là **Inline Error** (2.15 Loại 1): viền field chuyển error + câu lỗi dưới field\n(Field `state=error`), tự ẩn khi giá trị hợp lệ. Lỗi server không gắn với field → Popup Error; lỗi\nkỹ thuật → Toast error (xem Copy động).\n\n| Quy tắc | Chuẩn |\n| --- | --- |\n| Khi nào kiểm | **On Blur**: rời field (click ra ngoài, sang field khác) thì kiểm và hiện lỗi field đó. **On Submit**: bấm Lưu/Gửi/Tạo mới thì kiểm **mọi** field, kể cả field chưa chạm |\n| Submit có lỗi | Hiện inline error mọi field lỗi, cuộn tới field lỗi **đầu tiên**, không gửi đi, nút về trạng thái thường |\n| Submit hợp lệ | Nút Loading + vô hiệu tới khi có kết quả. Server trả lỗi → hiện lỗi tương ứng, giữ nguyên form, nút về thường |\n| Bắt buộc bỏ trống (Input, Select) | Nhãn có `*` (FieldLabel Indicator=Required). Câu chung: \"Nhập [tên trường].\" (Select: \"Chọn [tên trường].\") — dùng khi UC không ghi câu riêng |\n| Tiêu đề (Title) | Tối đa **50** ký tự. Vượt → \"Tối đa 50 ký tự.\" |\n| Text ngắn | Tối đa **255** ký tự. Không gõ thêm được; dán vượt thì tự cắt |\n| TextArea | Tối đa **1000** ký tự (hoặc theo UC), đếm ký tự góc dưới phải (`120/1000`); dán vượt thì tự cắt |\n| Ngày sai định dạng | \"Hãy nhập ngày tháng theo định dạng: dd/mm/yyyy\" |\n| Email sai định dạng | Phải có `@`. Câu lỗi: \"Email không đúng định dạng.\" |\n| Select | Single: chọn 1. Multi: giá trị hiện dạng tag trong ô. Danh sách từ server: tìm gần đúng khi gõ |\n\n* Câu lỗi theo tông giọng của Copy động (không \"Vui lòng\"), không lấy nguyên văn `web-common-rules.md`.\n\n#### A.4 Lỗi dùng chung (E-common)\n\n| Mã lỗi | Loại (GR-15) | Khi nào | Câu hiển thị | Quy tắc |\n|---|---|---|---|---|\n| E-common-008 | Toast | Lỗi hệ thống / API / timeout | \"Đã xảy ra lỗi. Thử lại sau.\" | GR-15 Loại 3 |\n| E-common-009 | Toast | Mất kết nối mạng | \"Mất kết nối. Kiểm tra mạng và thử lại.\" | GR-15 Loại 3 |\n| E-common-011 | Tại chỗ / Popup Loại 2 (web) · Popup chặn (app) | Mở màn, bản ghi hoặc khối không có quyền xem | \"Bạn không có quyền xem thông tin này. Liên hệ quản trị viên để được cấp quyền.\" | GR-28 · GR-26 |\n\n<\!-- ui-common:end -->\n\n\n## <a id=\"sec-erd\"></a>5. ERD\n\n> Scope: Quy trình, Bước quy trình và các đối tượng nó trỏ tới. Bản ghi nghiệp vụ của từng module (Báo giá, Lệnh sửa chữa, Phiếu xuất kho…) chi tiết ở SRS module đó.\n\n### Diagram\n\n```mermaid\nerDiagram\n    ChiNhanh ||--o{ QuyTrinh : \"có\"\n    PhuongTien |o--o{ QuyTrinh : \"có\"\n    XeKhachHang |o--o{ QuyTrinh : \"có\"\n    QuyTrinh ||--|{ BuocQuyTrinh : \"gồm\"\n    BuocQuyTrinh ||--o{ LienKetBuoc : \"là bước trước\"\n    BuocQuyTrinh ||--o{ LienKetBuoc : \"là bước sau\"\n    BuocQuyTrinh |o--o{ BanGhiNghiepVu : \"ứng với\"\n    BangCongNo |o--o{ BuocQuyTrinh : \"được trỏ tới\"\n\n    QuyTrinh {\n        string ma_quy_trinh PK \"QT-[Mã chi nhánh]-[YY]-[XXXX], dữ liệu cũ QT-[Mã chi nhánh]-LG-[XXXX], sinh khi bản ghi gốc gửi thành công\"\n        string luong \"vd Sửa chữa xe khách hàng\"\n        string trang_thai \"Đang triển khai | Đã dừng | Đã hoàn thành\"\n        string chi_nhanh_id FK \"chi nhánh lúc tạo, không đổi\"\n        string phuong_tien_id FK \"theo luồng, có thể trống\"\n        string xe_khach_hang_id FK \"theo luồng, có thể trống\"\n        datetime cap_nhat_lan_cuoi \"lọc + sắp danh sách\"\n    }\n    BuocQuyTrinh {\n        string id PK\n        string quy_trinh_id FK\n        string bang_cong_no_id FK \"chỉ bước thanh toán trả sau\"\n        string ten_buoc\n        string loai_buoc \"bước chính | nhánh phát sinh | ngã rẽ chưa chốt | công nợ\"\n        string module \"nhãn module khi khác module đang mở\"\n        string trang_thai \"Chưa triển khai | Đang triển khai | Đã hoàn thành | Đã thu hồi/từ chối | Đã huỷ (chỉ nhánh phát sinh)\"\n        string truong_hop_phat_sinh \"câu cho người dùng đọc, giá trị lúc phát sinh\"\n        string truong_hop_phat_sinh_en \"nhãn tiếng Anh\"\n        string cac_huong_co_the_di \"chỉ ngã rẽ\"\n    }\n    LienKetBuoc {\n        string buoc_quy_trinh_truoc_id FK\n        string buoc_quy_trinh_sau_id FK\n        string nhan_dieu_kien \"1 dòng, tối đa 40 ký tự (bắt buộc)\"\n        string nhan_dieu_kien_en \"nhãn tiếng Anh\"\n    }\n    BanGhiNghiepVu {\n        string id PK\n        string buoc_quy_trinh_id FK \"trống khi còn là bản nháp\"\n        string ma_yeu_cau \"sinh khi gửi, giữ nguyên khi sửa rồi gửi lại\"\n        string ma_ban_ghi \"sinh khi được duyệt, trống trước đó\"\n        string loai \"Báo cáo sự cố, Báo giá, Lệnh sửa chữa, Phiếu xuất kho...\"\n        string trang_thai\n        boolean da_thay_the \"true khi bước 1 bản ghi đã nhận bản ghi mới thay\"\n    }\n    BangCongNo {\n        string id PK\n        string nha_cung_cap\n        date tu_ngay\n        date den_ngay\n        string trang_thai\n    }\n    ChiNhanh {\n        string ma_chi_nhanh PK\n    }\n    PhuongTien {\n        string id PK\n    }\n    XeKhachHang {\n        string id PK\n    }\n```\n\n### Entity Reference\n\n| Entity | Purpose | Key attributes |\n|--------|---------|----------------|\n| QuyTrinh | Quy trình — chuỗi nghiệp vụ bắt đầu từ một bản ghi gốc, trạng thái do hệ thống tự tính | Mã quy trình (BR-cross-process-flow-004) · Luồng · Trạng thái · Chi nhánh · Cập nhật lần cuối |\n| BuocQuyTrinh | Bước quy trình — một nút trên cây, ứng với tối đa 1 bản ghi hiện hành; bước \"1 bản ghi\" có thể kèm các bản ghi Đã thay thế | Tên bước · Loại bước · Module · Trạng thái · Trường hợp phát sinh |\n| LienKetBuoc | Đường nối bước trước → bước sau; 1 bước có thể có nhiều bước trước (R1) | Bước trước · Bước sau · Nhãn điều kiện |\n| BanGhiNghiepVu | Đại diện cho 14 loại bản ghi của các module (object map Mục 2) | Mã yêu cầu · Mã bản ghi · Loại · Trạng thái · Đã thay thế |\n| BangCongNo | Bảng công nợ (nhóm đơn) của nhà cung cấp — thuộc SRS Thanh toán | Nhà cung cấp · Khoảng thời gian · Trạng thái |\n| ChiNhanh, PhuongTien, XeKhachHang | Đối tượng cấp dự án (object map dự án) | — |\n\n### Notes & Assumptions\n\n- Object map ghi \"Bước quy trình phát sinh Bước quy trình 1–n\". ERD tách thành `LienKetBuoc` vì một bước có thể cần nhiều bước trước cùng xong (R1).\n- Mỗi bản ghi thuộc đúng 1 cây (BR-cross-process-flow-001): `BanGhiNghiepVu` ứng với tối đa 1 `BuocQuyTrinh` (bản nháp chưa ứng với bước nào).\n- Một `BuocQuyTrinh` có nhiều `BanGhiNghiepVu` chỉ khi bước khai \"1 bản ghi\" nhận bản ghi thay thế (BR-cross-process-flow-011): đúng 1 bản ghi hiện hành (`da_thay_the` = false), còn lại Đã thay thế. Bước \"nhiều bản ghi\" không dùng cách này — mỗi bản ghi là 1 bước anh em (BR-cross-process-flow-008).\n- Mã trên thẻ bước: `ma_ban_ghi` nếu đã có, không thì `ma_yeu_cau` (BR-cross-process-flow-012). Ô tìm tìm cả hai.\n- Nhãn tiếng Anh lấy từ bảng liên quy trình của nghiệp vụ (BR-cross-process-flow-007).\n- Bản ghi gốc của quy trình là bước không có `LienKetBuoc` nào trỏ vào.\n- Tiến độ, số nhánh phát sinh và Bước đang chờ tính từ các bước, không lưu riêng; không tính bước Đã huỷ và bản ghi Đã thay thế.\n\n\n## <a id=\"sec-states\"></a>6. State Diagrams\n\n### State: QuyTrinh\n\n<\!-- chip-the-buoc: khong -->\n\n**Related UC**: [uc-cap-nhat-quy-trinh-theo-ban-ghi](#uc-uc-cap-nhat-quy-trinh-theo-ban-ghi)\n**Related BR**: BR-cross-process-flow-002, BR-cross-process-flow-003, BR-cross-process-flow-009, BR-cross-process-flow-011\n\n```mermaid\nstateDiagram-v2\n    [*] --> DangTrienKhai : Bản ghi gốc gửi thành công, sinh mã QT\n    DangTrienKhai --> DaDung : Bước của luồng chính bị từ chối hoặc thu hồi\n    DaDung --> DangTrienKhai : Bước đó được gửi lại, có bản ghi thay thế hoặc bị xoá\n    DangTrienKhai --> DaHoanThanh : Mọi bước chính và nhánh phát sinh đã xong, không tính nhánh Đã huỷ\n    DaHoanThanh --> [*]\n\n    DangTrienKhai : Đang triển khai\n    DaDung : Đã dừng\n    DaHoanThanh : Đã hoàn thành\n```\n\nLuồng độc lập: quy trình tạo khi nhánh phát sinh đầu tiên gửi thành công. Nhánh phát sinh bị từ chối không làm quy trình Đã dừng; xoá bản ghi của nhánh đó thì nhánh Đã huỷ, không chặn quy trình Đã hoàn thành (BR-cross-process-flow-003, BR-cross-process-flow-009). Bản ghi của luồng chính bị xoá thì quy trình tính lại như thể bản ghi đó chưa từng có (BR-cross-process-flow-002). Bản ghi Đã thay thế không tính vào trạng thái quy trình (BR-cross-process-flow-011).\n\n#### Invalid transitions\n\n| From | To | Why not |\n|---|---|---|\n| Đã hoàn thành | Đang triển khai | Đã hoàn thành là trạng thái kết thúc; chưa luồng nào phát sinh nhánh sau khi xong (BR-cross-process-flow-003) |\n| Đã dừng | Đã hoàn thành | Bước của luồng chính đang bị từ chối/thu hồi thì chưa xong |\n| Bất kỳ | Bất kỳ (sửa tay) | Trạng thái do hệ thống tự tính, không ai sửa tay, không đóng thủ công |\n\n### State: BuocQuyTrinh\n\n<\!-- chip-the-buoc: khong -->\n\n**Related UC**: [uc-cap-nhat-quy-trinh-theo-ban-ghi](#uc-uc-cap-nhat-quy-trinh-theo-ban-ghi)\n**Related BR**: BR-cross-process-flow-006, BR-cross-process-flow-009, BR-cross-process-flow-011\n\n```mermaid\nstateDiagram-v2\n    [*] --> ChuaTrienKhai : Bước chính chưa tới hoặc ngã rẽ\n    [*] --> DangTrienKhai : Nhánh phát sinh, bản ghi gửi thành công\n    ChuaTrienKhai --> DangTrienKhai : Bản ghi gửi thành công\n    DangTrienKhai --> DaHoanThanh : Phê duyệt ở hành động cuối hoặc hoàn tất\n    DangTrienKhai --> DaThuHoiTuChoi : Thu hồi hoặc từ chối\n    DaThuHoiTuChoi --> DangTrienKhai : Sửa rồi gửi lại hoặc có bản ghi thay thế\n    DaThuHoiTuChoi --> ChuaTrienKhai : Xoá bản ghi của bước chính, mã về N/A\n    DaThuHoiTuChoi --> DaHuy : Xoá bản ghi của nhánh phát sinh\n    DaHoanThanh --> [*]\n    DaHuy --> [*]\n\n    ChuaTrienKhai : Chưa triển khai\n    DangTrienKhai : Đang triển khai\n    DaHoanThanh : Đã hoàn thành\n    DaThuHoiTuChoi : Đã thu hồi/từ chối\n    DaHuy : Đã huỷ\n```\n\n**Bước công nợ trả sau** dùng cùng tập trạng thái nhưng đổi theo bảng công nợ: Chưa triển khai → Đang triển khai khi chốt công nợ lần đầu; Đang triển khai → Đã hoàn thành khi phần công nợ thuộc nghiệp vụ của luồng đó đã thanh toán (không chờ cả bảng công nợ). Không có Đã thu hồi/từ chối. Khối Chứng từ trong panel/sheet công nợ hiện trạng thái của bảng công nợ (vd \"Chưa đối soát\") — đó là trạng thái của chứng từ bên Thanh toán, không phải trạng thái của bước.\n\n**Ngã rẽ chưa chốt** (bước Chưa triển khai có nhiều hướng, D5): thẻ và panel/sheet hiện chip chờ theo điều kiện của ngã rẽ, khai ở bảng liên quy trình (Delta: điều kiện \"Tuỳ nơi sửa\" → chip \"Chờ chọn gara\", nhóm Vàng). Chip chờ là nhãn hiển thị, không phải trạng thái mới; chốt điều kiện thì ngã rẽ thành nhánh thật.\n\nNhánh phát sinh chỉ xuất hiện trên cây khi điều kiện đã xảy ra, vào thẳng Đang triển khai khi bản ghi gửi thành công. Bản ghi của nhánh bị xoá thì nhánh chuyển Đã huỷ (viền đứt, chữ gạch, nhãn Đã huỷ), không tính vào tiến độ (BR-cross-process-flow-009). Đã huỷ chỉ có ở nhánh phát sinh.\n\n**Bản ghi thay thế (bước khai \"1 bản ghi\")**: bước đang Đã thu hồi/từ chối nhận bản ghi mới thì về Đang triển khai, trạng thái tính theo bản ghi mới. Bản ghi cũ mang nhãn Đã thay thế — đây là nhãn của bản ghi, không phải trạng thái của bước (BR-cross-process-flow-011).\n\n#### Invalid transitions\n\n| From | To | Why not |\n|---|---|---|\n| Đã hoàn thành | Bất kỳ | Bản ghi đã hoàn tất không quay lại |\n| Chưa triển khai | Đang triển khai (lưu nháp) | Nháp không tính, bước chỉ đổi khi gửi thành công |\n| Đã thu hồi/từ chối | Chưa triển khai / Đã huỷ (nghiệp vụ không cho xoá) | Bảng liên quy trình khai \"không cho xoá\" (vd Bồi thường) |\n| Đang triển khai / Đã thu hồi/từ chối | (thu hồi/xoá) khi đã có bước con | Chặn bằng E-cross-process-flow-002; hiện chưa nghiệp vụ nào cho phép (Giả định spec Mục 11) |\n| Đã thu hồi/từ chối (bản ghi Đã thay thế) | Đang triển khai | Bản ghi cũ đã bị thay; sửa rồi gửi lại bị chặn bằng E-cross-process-flow-001 (BR-cross-process-flow-011) |\n\n\n## <a id=\"sec-functions\"></a>7. Functions\n\n### Use Cases Index\n\n#### Use cases\n\n| # | Slug | Level | Status | Actor primary | Covers FR | Screens | Errors (E-*) | OQ ref | Priority | Updated |\n|---|------|-------|--------|---------------|-----------|---------|--------------|--------|----------|---------|\n| 1 | [uc-xem-quy-trinh-cua-ban-ghi](#uc-uc-xem-quy-trinh-cua-ban-ghi) | sea | draft | Người theo dõi quy trình · Lái xe | FR-cross-process-flow-005, -006, -007, -008, -009, -010, -011, -020, -021 | view-process [1.1]–[1.9] · view-process-mobile [1.1]–[1.6], [4.1] · bước [1.3]–[1.7] cũng mở từ [2.2] | E-cross-process-flow-004, E-common-008, E-common-009, E-common-011 | — | P0 | 2026-10-12 |\n| 2 | [uc-tao-nghiep-vu-tiep-theo](#uc-uc-tao-nghiep-vu-tiep-theo) | sea | draft | Người tạo bản ghi | FR-cross-process-flow-003, -012, -013 | [1.1] record-detail · create-next-step [3.1]–[3.3] | E-cross-process-flow-001, E-cross-process-flow-003, E-common-008, E-common-009 | — | P0 | 2026-10-12 |\n| 3 | [uc-tra-cuu-quy-trinh](#uc-uc-tra-cuu-quy-trinh) | sea | draft | Người theo dõi quy trình | FR-cross-process-flow-015, -016, -017, -018, -019, -020, -022 | search-process [2.1]–[2.2] · bước [1.3]–[1.7] | E-common-008, E-common-011 | — | P0 | 2026-10-12 |\n| 4 | [uc-cap-nhat-quy-trinh-theo-ban-ghi](#uc-uc-cap-nhat-quy-trinh-theo-ban-ghi) | sea | draft | Hệ thống | FR-cross-process-flow-001, -002, -003, -004, -014, -020 | [3.4] has-child-step | E-cross-process-flow-001, E-cross-process-flow-002, E-cross-process-flow-003 | [spec.md](#sec-spec)#OQ-1 | P0 | 2026-10-12 |\n\nKhông thành use case riêng: \"Xem dòng quy trình\" (bước 1–2 của uc-xem-quy-trinh-cua-ban-ghi) · \"Cấp quyền menu Quy trình\" (FR-cross-process-flow-019 — một bước trong luồng phân quyền chung của Admin, tiền điều kiện của uc-tra-cuu-quy-trinh).\n\n#### CRUD matrix\n\n| UC \\ Entity | QuyTrinh | BuocQuyTrinh | LienKetBuoc | BanGhiNghiepVu | BangCongNo |\n|---|---|---|---|---|---|\n| [uc-xem-quy-trinh-cua-ban-ghi](#uc-uc-xem-quy-trinh-cua-ban-ghi) | R | R | R | R | R |\n| [uc-tao-nghiep-vu-tiep-theo](#uc-uc-tao-nghiep-vu-tiep-theo) | R | C | C | CR | — |\n| [uc-tra-cuu-quy-trinh](#uc-uc-tra-cuu-quy-trinh) | R | R | R | R | — |\n| [uc-cap-nhat-quy-trinh-theo-ban-ghi](#uc-uc-cap-nhat-quy-trinh-theo-ban-ghi) | CU | CU | C | R | R |\n\n#### Actors\n\n| Actor | Loại | Mô tả | Nguồn |\n|---|---|---|---|\n| Người theo dõi quy trình | primary | Nhân viên nội bộ Delta xem quy trình (Kế toán thanh toán, Quản lý xưởng, Thủ kho, Người duyệt, Điều phối) | object map › Vai trò nghiệp vụ |\n| Người tạo bản ghi | primary | Nhân viên nội bộ Delta tạo nghiệp vụ tiếp theo | object map › Vai trò nghiệp vụ |\n| Lái xe | primary | Xem tiến độ trên Delta Super App, quyền theo FR-cross-process-flow-009 | brainstorm Mục 6.2 |\n| Admin | secondary | Cấp quyền menu Quy trình theo module | object map › Vai trò nghiệp vụ |\n| Hệ thống | system | Tạo quy trình, sinh mã, thêm bước, tính trạng thái | object map › Vai trò nghiệp vụ |\n\n#### Nguồn dữ liệu\n\n- FR + Error Matrix: [SRS spec](#sec-spec)\n- Open Questions: `srs/cross-process-flow-spec.md` Mục 12 (canonical)\n\n\n---\n\n### <a id=\"uc-uc-cap-nhat-quy-trinh-theo-ban-ghi\"></a>Use Case: Cập nhật quy trình theo bản ghi\n\n> Scope: Liên quy trình (dùng chung mọi module) · Level: sea\n\n#### Primary Actor\n\nHệ thống — hành động theo sự kiện của bản ghi nghiệp vụ (gửi, phê duyệt, từ chối, thu hồi, xoá, chốt công nợ, thanh toán).\n\n#### Stakeholders & Interests\n\n| Stakeholder | Interest |\n|-------------|----------|\n| Người tạo bản ghi | Không thu hồi/xoá nhầm bản ghi đã có bước con |\n| Người theo dõi quy trình | Trạng thái bước và quy trình luôn đúng, không phải sửa tay |\n\n#### Trigger\n\nMột bản ghi thuộc bảng liên quy trình đổi trạng thái (gửi thành công, phê duyệt, từ chối, thu hồi, xoá), hoặc bảng công nợ được chốt lần đầu / phần công nợ của luồng được thanh toán.\n\n#### Preconditions\n\n- Nghiệp vụ của bản ghi đã khai bảng liên quy trình (BR-cross-process-flow-007).\n\n#### Guarantees\n\n- **Minimal Guarantee:** Không có bước nào gắn vào 2 cây; không có bản ghi đã sinh bước con bị thu hồi/xoá khi bảng liên quy trình không cho phép; trạng thái quy trình không bị sửa tay.\n- **Success Guarantee:** Bước của bản ghi mang trạng thái mới; Quy trình mang trạng thái tính lại theo BR-cross-process-flow-002/003; màn đang mở nhận được báo cập nhật.\n\n#### Main Success Scenario\n\n1. Bản ghi gốc của một luồng gửi thành công.\n2. Hệ thống tạo Quy trình ở trạng thái Đang triển khai, sinh mã `QT-[Mã chi nhánh]-[YY]-[XXXX]` (FR-cross-process-flow-001, BR-cross-process-flow-004) và tạo Bước gốc.\n3. Một bản ghi tiếp theo (bước chính hoặc nhánh phát sinh) gửi thành công.\n4. Hệ thống thêm Bước vào cây của bản ghi nguồn, nối về đúng bản ghi tạo ra nó, lưu trường hợp phát sinh theo giá trị lúc xảy ra (FR-cross-process-flow-003, BR-cross-process-flow-005); bước ở Đang triển khai, thẻ bước hiện mã yêu cầu (BR-cross-process-flow-012). Ghi nhận gửi và thêm bước cùng thành công hoặc cùng không.\n5. Bản ghi của bước được phê duyệt ở hành động cuối (hoặc hoàn tất theo UC riêng của nghiệp vụ).\n6. Hệ thống chuyển Bước sang Đã hoàn thành (FR-cross-process-flow-004); thẻ bước đổi sang mã bản ghi khi bản ghi được duyệt (BR-cross-process-flow-012).\n7. Hệ thống tính lại trạng thái Quy trình; khi mọi bước chính và nhánh phát sinh đã xong (không tính nhánh Đã huỷ) → Đã hoàn thành (BR-cross-process-flow-003).\n\n#### Extensions\n\n**1a. Luồng độc lập (bản ghi gốc tự nó không tạo quy trình):**\n- 1a1. Hệ thống chưa tạo quy trình. Khi nhánh phát sinh đầu tiên gửi thành công → tạo Quy trình với bản ghi gốc là nút đầu cây, tiếp bước 2.\n\n**1b. Bản ghi chỉ được lưu nháp:**\n- 1b1. Hệ thống không làm gì. Use case kết thúc.\n\n**3a. Cây không nhận bước (lỗi khi thêm bước):**\n- 3a1. Bản ghi không được ghi nhận gửi, giữ nguyên bản nháp (FR-cross-process-flow-003). Use case kết thúc với Minimal Guarantee.\n\n**3b. Bản ghi nguồn vừa bị thu hồi trong lúc gửi:**\n- 3b1. Thu hồi thắng: hệ thống chặn bằng popup E-cross-process-flow-003, bản nháp giữ lại (FR-cross-process-flow-003). Use case kết thúc với Minimal Guarantee.\n\n**3c. Bước khai \"1 bản ghi\" đang có bản ghi Đã thu hồi/từ chối:**\n- 3c1. Bản ghi mới thành bản ghi hiện hành; bản cũ mang nhãn Đã thay thế, không tính vào tiến độ (BR-cross-process-flow-011).\n- 3c2. Bước về Đang triển khai; nếu là bước của luồng chính → Quy trình về Đang triển khai (BR-cross-process-flow-002). Tiếp bước 5.\n\n**5a. Bản ghi bị từ chối hoặc thu hồi:**\n- 5a1. Hệ thống chuyển Bước sang Đã thu hồi/từ chối; nhánh con đã có giữ nguyên.\n- 5a2. Nếu là bước của luồng chính → Quy trình chuyển Đã dừng. Nếu là nhánh phát sinh → Quy trình giữ nguyên, Bước đang chờ = nhánh đó (BR-cross-process-flow-002).\n- 5a3. Khi bản ghi được sửa và gửi lại (giữ nguyên mã yêu cầu), hoặc bước nhận bản ghi thay thế (3c) → Bước về Đang triển khai; nếu là bước của luồng chính → Quy trình về Đang triển khai. Tiếp bước 5.\n- 5a4. Bản ghi đã bị thay thế mà được sửa rồi gửi lại → hệ thống chặn bằng E-cross-process-flow-001 (BR-cross-process-flow-011).\n\n**5b. Người tạo thu hồi hoặc xoá bản ghi đã sinh bước con:**\n- 5b1. Hệ thống chặn bằng popup E-cross-process-flow-002 (GR-15 Loại 2), nêu tối đa 2 bước con kèm mã + \"và n bước khác\"; bản ghi giữ nguyên trạng thái (FR-cross-process-flow-014). Hiện chưa nghiệp vụ nào cho thu hồi/xoá khi đã có bước con (Giả định spec Mục 11). Use case kết thúc với Minimal Guarantee.\n\n**5c. Bản ghi đang Đã thu hồi/từ chối bị xoá (chỉ nghiệp vụ cho xoá):**\n- 5c1. Bước của luồng chính: về Chưa triển khai, mã về `N/A`, hiện \"Chưa tạo\"; Quy trình tính lại như thể bản ghi đó chưa từng có (BR-cross-process-flow-002, BR-cross-process-flow-009).\n- 5c2. Nhánh phát sinh: chuyển Đã huỷ (viền đứt, chữ gạch), không tính vào tiến độ, không chặn Quy trình Đã hoàn thành (BR-cross-process-flow-009, BR-cross-process-flow-003).\n- 5c3. Bản ghi Đã thay thế: bỏ khỏi khối \"Bản ghi trước đó\", không đổi trạng thái gì (BR-cross-process-flow-009).\n\n**5d. Bước là thanh toán trả sau:**\n- 5d1. Chốt công nợ lần đầu → Bước Đang triển khai; phần công nợ thuộc nghiệp vụ của luồng đã thanh toán → Bước Đã hoàn thành (FR-cross-process-flow-004, BR-cross-process-flow-006). Tiếp bước 7.\n\n**7a. Có màn sơ đồ / danh sách đang mở chứa quy trình này:**\n- 7a1. Nếu thông tin đang hiện trên màn đó đổi, hệ thống báo cập nhật để màn đó hiện banner Theo GR-27 (FR-cross-process-flow-020).\n\n#### Related Requirements\n\nFR-cross-process-flow-001 → 004, FR-cross-process-flow-014, FR-cross-process-flow-020 · BR-cross-process-flow-001 → 006, BR-cross-process-flow-007, BR-cross-process-flow-008, BR-cross-process-flow-009 → 012 · E-cross-process-flow-001, -002, -003 · NFR-cross-process-flow-010 — [SRS spec](#sec-spec)\n\n\n---\n\n### <a id=\"uc-uc-tao-nghiep-vu-tiep-theo\"></a>Use Case: Tạo nghiệp vụ tiếp theo từ một bản ghi\n\n> Scope: Liên quy trình (dùng chung mọi module) · Level: sea\n\n#### Primary Actor\n\nNgười tạo bản ghi (Nhân viên nội bộ Delta, Website; Delta Super App ở nghiệp vụ có màn trên app — cột \"Có trên app\" của bảng liên quy trình, BR-cross-process-flow-007).\n\n#### Trigger\n\nNgười tạo bản ghi bấm nút tạo bước tiếp theo (vd \"Tạo phiếu xuất kho\") ở vùng hành động đầu màn chi tiết của bản ghi trước.\n\n#### Preconditions\n\n- Bản ghi trước đã đạt hành động trigger theo bảng liên quy trình của nghiệp vụ (vd Phê duyệt báo giá, Chốt lệnh sửa chữa).\n- Người tạo bản ghi có quyền tạo bản ghi của bước tiếp theo (D6).\n\n#### Guarantees\n\n- **Minimal Guarantee:** Không có bước mới nào trên cây khi bản ghi chưa gửi thành công; bản nháp không bị tự xoá khi gửi bị chặn.\n- **Success Guarantee:** Bản ghi mới ở trạng thái gửi thành công, cây có thêm Bước ở trạng thái Đang triển khai nối về bản ghi trước, trạng thái Quy trình được tính lại.\n\n#### Main Success Scenario\n\n1. Hệ thống hiện nút tạo bước tiếp theo ở vùng hành động đầu trang khi bản ghi trước đạt trigger và người xem có quyền tạo (FR-cross-process-flow-012).\n2. Người tạo bản ghi bấm nút.\n3. Hệ thống mở form tạo mới của nghiệp vụ tiếp theo, đã điền sẵn thông tin mang từ bản ghi trước (theo bảng liên quy trình của nghiệp vụ).\n4. Người tạo bản ghi bổ sung thông tin và gửi.\n5. Hệ thống ghi nhận bản ghi mới và thêm Bước vào cây nối về bản ghi trước — cùng thành công hoặc cùng không — rồi tính lại trạng thái Quy trình (FR-cross-process-flow-003; chi tiết ở uc-cap-nhat-quy-trinh-theo-ban-ghi).\n6. Hệ thống đưa người tạo vào màn chi tiết bản ghi mới; dòng quy trình gắn \"Ở đây\" cho bước mới. Thông báo thành công theo toast của nghiệp vụ được tạo.\n\n#### Extensions\n\n**1a. Bản ghi trước chưa đạt trigger, hoặc người xem không có quyền tạo:**\n- 1a1. Hệ thống không hiện nút. Use case kết thúc.\n\n**4a. Người tạo bản ghi lưu nháp thay vì gửi:**\n- 4a1. Hệ thống lưu nháp riêng tư; cây không thay đổi. Use case kết thúc với Minimal Guarantee.\n\n**5a. Bước khai \"1 bản ghi\" đã có bản ghi khác đang chờ phê duyệt hoặc đã xong (có người tạo trước):**\n- 5a1. Hệ thống chặn bằng E-cross-process-flow-001 — câu \"đang chờ phê duyệt\" hoặc \"đã hoàn thành với [mã]\" (web: popup GR-15 Loại 2 · app: sheet lỗi Loại 2), giữ nguyên form và bản nháp. Hai người cùng gửi thì chỉ người gửi trước được nhận.\n- 5a2. Người tạo đóng popup; tải lại màn bản ghi trước thì nút ẩn theo điều kiện của nghiệp vụ. Use case kết thúc với Minimal Guarantee.\n\n**5b. Bước khai \"nhiều bản ghi\" (vd Xuất kho) đã có bản ghi khác:**\n- 5b1. Hệ thống không chặn; bản ghi mới thành bước anh em cùng tên, phân biệt bằng mã (BR-cross-process-flow-008). Tiếp bước 6.\n\n**5c. Bước khai \"1 bản ghi\" đang có bản ghi Đã thu hồi/từ chối:**\n- 5c1. Hệ thống không chặn; bản ghi mới thay thế bản cũ, bản cũ mang nhãn Đã thay thế (BR-cross-process-flow-011). Tiếp bước 6.\n\n**5d. Bản ghi trước vừa bị thu hồi trong lúc gửi:**\n- 5d1. Thu hồi thắng: hệ thống chặn bằng popup E-cross-process-flow-003 (web: GR-15 Loại 2 · app: sheet lỗi Loại 2), bản ghi không được ghi nhận gửi.\n- 5d2. Người tạo bấm Giữ bản nháp (nút chính) → đóng popup, bản nháp giữ lại; hoặc bấm Xoá bản nháp → xác nhận Xem CMP-03 rồi xoá. Use case kết thúc với Minimal Guarantee.\n\n**5e. Gửi thất bại do lỗi hệ thống, mất mạng, hoặc cây không nhận bước:**\n- 5e1. Bản ghi không được ghi nhận gửi; hệ thống hiện toast E-common-008 / E-common-009, giữ nguyên form. Quay lại bước 4.\n\n#### Related Requirements\n\nFR-cross-process-flow-003, FR-cross-process-flow-012, FR-cross-process-flow-013 · BR-cross-process-flow-001, BR-cross-process-flow-007, BR-cross-process-flow-008, BR-cross-process-flow-011 · E-cross-process-flow-001, -003 — [SRS spec](#sec-spec)\n\n\n---\n\n### <a id=\"uc-uc-tra-cuu-quy-trinh\"></a>Use Case: Tra cứu quy trình trên danh sách\n\n> Scope: Liên quy trình — màn danh sách Quy trình (Website) · Level: sea\n\n#### Primary Actor\n\nNgười theo dõi quy trình (Nhân viên nội bộ Delta, Website).\n\n#### Trigger\n\nNgười dùng vào menu {Module} › Quy trình.\n\n#### Preconditions\n\n- Người dùng có quyền xem menu Quy trình của module (Admin cấp theo FR-cross-process-flow-019).\n\n#### Guarantees\n\n- **Minimal Guarantee:** Danh sách chỉ hiện quy trình thuộc module + chi nhánh người dùng được phân quyền dữ liệu; lỗi tải không làm mất bộ lọc đang chọn.\n- **Success Guarantee:** Người dùng tìm ra quy trình cần theo dõi và mở được sơ đồ của nó (hoặc xuất được đúng danh sách đang thấy).\n\n#### Main Success Scenario\n\n1. Hệ thống hiện danh sách Quy trình của module, chỉ gồm quy trình thuộc chi nhánh người dùng được phân quyền dữ liệu, 10 cột, sắp theo Cập nhật lần cuối mới nhất; cột Bước đang chờ hiện bước chờ lâu nhất + \"+n bước khác\" (FR-cross-process-flow-015). Đang tải: skeleton theo 10 cột (GR-12). Luồng liên module hiện ở cả 2 module.\n2. Người dùng gõ mã của bất kỳ bản ghi nào trong cây (mã yêu cầu, mã bản ghi, hoặc mã quy trình) vào ô tìm.\n3. Hệ thống tìm khi ô có từ 3 ký tự, mã chứa chuỗi đã gõ ở bất kỳ vị trí nào, không phân biệt hoa thường, sau khi ngừng gõ 0,3 giây (FR-cross-process-flow-016). Theo GR-09.\n4. Người dùng lọc thêm theo Luồng, Trạng thái, Chi nhánh, khoảng ngày Cập nhật lần cuối (FR-cross-process-flow-017). Xem CMP-05 — Filter Drawer.\n5. Hệ thống hiện kết quả sau lọc.\n6. Người dùng bấm một dòng.\n7. Hệ thống mở popup sơ đồ ngay trên danh sách, chưa chọn bước nào (FR-cross-process-flow-018). Từ đây tiếp như uc-xem-quy-trinh-cua-ban-ghi bước 5–8.\n\n#### Extensions\n\n**1a. Chưa có quy trình nào:**\n- 1a1. Hệ thống hiện \"Chưa có quy trình nào. Quy trình tự tạo khi có bản ghi đầu tiên được gửi.\" (Theo GR-12, không có nút Tạo mới). Use case kết thúc.\n\n**1b. Lỗi tải danh sách:**\n- 1b1. Hệ thống thay vùng bảng bằng khối \"Không tải được danh sách.\" + Thử lại, giữ thanh công cụ và bộ lọc (Override GR-15). Người dùng bấm Thử lại → quay lại bước 1.\n\n**1c. Người dùng mở thẳng đường dẫn danh sách khi không có quyền menu Quy trình:**\n- 1c1. Vùng nội dung hiện câu E-common-011 + nút Về trang chủ (FR-cross-process-flow-019). Use case kết thúc.\n\n**3a. Ô tìm dưới 3 ký tự:**\n- 3a1. Hệ thống chưa tìm, không báo lỗi. Quay lại bước 2.\n\n**5a. Không có kết quả:**\n- 5a1. Có từ khoá: hệ thống hiện \"Không tìm thấy quy trình chứa mã \"[mã]\".\" + Xoá bộ lọc. Ô tìm trống: \"Không có quy trình phù hợp với bộ lọc.\" + Xoá bộ lọc (FR-cross-process-flow-017).\n- 5a2. Người dùng bấm Xoá bộ lọc → quay lại bước 1.\n\n**5b. Thông tin đang hiện trên danh sách đổi trong khi đang mở:**\n- 5b1. Hệ thống hiện banner Theo GR-27 \"Danh sách vừa có cập nhật.\" + Tải lại; tải lại giữ bộ lọc (FR-cross-process-flow-020). Tiếp bước 5.\n\n**5c. Người dùng muốn xuất danh sách:**\n- 5c1. Người dùng bấm Xuất, chọn PDF hoặc Excel; hệ thống xuất đúng tập dữ liệu đang thấy (sau tìm, lọc, sắp, gồm mọi trang) và các cột đang hiện, theo quy định xuất danh sách chung (FR-cross-process-flow-022, Theo GR-19). Use case kết thúc.\n\n**6a. Người dùng bấm ô Phương tiện / khách hàng:**\n- 6a1. Hệ thống mở màn chi tiết Phương tiện hoặc Xe của khách hàng (FR-cross-process-flow-018). Use case kết thúc.\n\n#### Related Requirements\n\nFR-cross-process-flow-015 → 020, FR-cross-process-flow-022 · BR-cross-process-flow-002 (cột Bước đang chờ), BR-cross-process-flow-012 (tìm theo mã yêu cầu) · NFR-cross-process-flow-009 — [SRS spec](#sec-spec)\n\n\n---\n\n### <a id=\"uc-uc-xem-quy-trinh-cua-ban-ghi\"></a>Use Case: Xem quy trình của một bản ghi\n\n> Scope: Liên quy trình (dùng chung mọi module) · Level: sea\n\n#### Primary Actor\n\nNgười theo dõi quy trình (Nhân viên nội bộ Delta, Website hoặc Delta Super App). Lái xe dùng cùng use case trên Delta Super App, quyền xem theo FR-cross-process-flow-009.\n\n#### Stakeholders & Interests\n\n| Stakeholder | Interest |\n|-------------|----------|\n| Kế toán thanh toán | Biết các bước trước (xuất kho, chốt lệnh, công nợ) đã xong chưa trước khi thanh toán |\n| Quản lý xưởng | Thấy bước đang kẹt của một lệnh sửa chữa mà không mở từng phiếu |\n\n#### Trigger\n\nNgười dùng mở màn chi tiết của một bản ghi nghiệp vụ.\n\n#### Preconditions\n\n- Người dùng đã đăng nhập và có quyền xem bản ghi đang mở.\n\n#### Guarantees\n\n- **Minimal Guarantee:** Màn chi tiết bản ghi vẫn dùng được kể cả khi không tải được quy trình; không hiện lịch sử hay nút mở của bước người dùng không có quyền xem.\n- **Success Guarantee:** Người dùng thấy toàn bộ cây quy trình với trạng thái mới nhất của từng bước, và đã đến được màn chi tiết (hoặc bảng công nợ) của bước mình chọn.\n\n#### Main Success Scenario\n\n1. Người dùng mở màn chi tiết bản ghi.\n2. Hệ thống hiện dòng quy trình (web: đầu màn · mobile: thẻ quy trình): tên luồng, thanh tiến độ, \"Xong x/y bước · n nhánh phát sinh\", \"Bước trước: …\" hoặc \"Phát sinh từ: …\" (FR-cross-process-flow-005). Đang tải: skeleton (web cao bằng dòng thật · app thẻ có shimmer).\n3. Người dùng bấm dòng quy trình.\n4. Hệ thống mở sơ đồ (web: popup · mobile: sheet), vừa khung, chọn sẵn bước \"Ở đây\"; web mở panel của bước đó, app chỉ đánh dấu bước, không tự mở sheet bước (FR-cross-process-flow-006, -007).\n5. Người dùng thu phóng (web: zoom, nút vừa khung · app: chụm hai ngón), kéo và chọn một bước khác.\n6. Hệ thống hiện panel bước: đầu panel (tên, mã, trạng thái, nhãn), 5 dòng lịch sử hoạt động mới nhất và nút \"Mở màn hình chi tiết\" (FR-cross-process-flow-008). Mã là mã yêu cầu khi bản ghi chưa được duyệt, mã bản ghi khi đã duyệt (BR-cross-process-flow-012). Xem CMP-09 — Cross Process Flow (Liên quy trình), Xem CMP-08 — Activity Log.\n7. Người dùng bấm \"Mở màn hình chi tiết\".\n8. Hệ thống mở màn chi tiết bản ghi của bước (web: cùng tab, đóng popup · mobile: đẩy màn mới) (FR-cross-process-flow-010).\n\n#### Extensions\n\n**2a. Bản ghi không thuộc quy trình, hoặc là luồng độc lập chưa có nhánh:**\n- 2a1. Hệ thống không hiện dòng quy trình. Use case kết thúc.\n\n**2b. Không tải được dòng quy trình:**\n- 2b1. Hệ thống hiện \"Không tải được quy trình.\" + Thử lại; màn chi tiết vẫn dùng bình thường.\n- 2b2. Người dùng bấm Thử lại → quay lại bước 2.\n\n**4a. Lỗi tải sơ đồ hoặc mất mạng:**\n- 4a1. Hệ thống hiện \"Không tải được sơ đồ.\" kèm câu E-common-008 (lỗi hệ thống) hoặc E-common-009 (mất mạng) và nút Thử lại trong popup/sheet (Override GR-15).\n- 4a2. Người dùng bấm Thử lại → quay lại bước 4.\n\n**5a. Trong khi sơ đồ đang mở, thông tin đang hiện trên sơ đồ đổi ở nơi khác:**\n- 5a1. Hệ thống hiện banner Theo GR-27 \"Quy trình vừa có cập nhật.\" + Tải lại (FR-cross-process-flow-020).\n- 5a2. Người dùng bấm Tải lại → hệ thống tải lại cây, giữ bước đang chọn nếu còn → tiếp bước 5.\n\n**6a. Bước là ngã rẽ chưa chốt:**\n- 6a1. Panel ghi \"Chưa xác định …\" và liệt kê các hướng có thể đi; không có nút mở. Quay lại bước 5.\n\n**6b. Bước chưa có bản ghi:**\n- 6b1. Panel ghi \"Chưa có hoạt động. Bước này chưa được tạo.\"; không có nút mở. Quay lại bước 5.\n\n**6c. Người dùng không có quyền xem bản ghi của bước:**\n- 6c1. Panel chỉ hiện đầu panel (tên, mã, trạng thái, lý do phát sinh nếu có), ẩn lịch sử và nút, hiện câu E-common-011 tại chỗ (Override GR-26). Quyền tính theo phân quyền xem của nghiệp vụ ứng với bước đó, như nhau cho mọi người dùng kể cả Lái xe (FR-cross-process-flow-009). Quay lại bước 5.\n\n**6d. Bước là thanh toán trả sau:**\n- 6d1. Panel ghi \"Công nợ {Tên NCC}\", nút \"Mở bảng công nợ\" thay cho \"Mở màn hình chi tiết\".\n- 6d2. Người dùng bấm → hệ thống mở bảng công nợ đã lọc theo nhà cung cấp và khoảng thời gian của bảng công nợ (FR-cross-process-flow-011). Use case kết thúc.\n- 6d3. Trên app: sheet bước chỉ hiện trạng thái, không có nút mở — Delta Super App không có màn Bảng công nợ (userflow OQ-2). Use case kết thúc.\n\n**6e. Không tải được lịch sử:**\n- 6e1. Khối lịch sử hiện \"Không tải được lịch sử.\" + Thử lại; đầu panel và nút mở vẫn dùng được (FR-cross-process-flow-008). Lịch sử rỗng: \"Chưa có hoạt động.\"\n\n**6f. Bước có bản ghi Đã thay thế:**\n- 6f1. Thẻ bước hiện bản ghi hiện hành kèm \"+n bản ghi trước\"; panel thêm khối \"Bản ghi trước đó\", mỗi bản ghi 1 dòng: mã · Đã thay thế · ngày bị từ chối/thu hồi · Mở (theo quyền) (FR-cross-process-flow-008, BR-cross-process-flow-011). Tiếp bước 7.\n\n**6g. Trên app, loại bản ghi của bước không có màn chi tiết trên app:**\n- 6g1. Sheet bước không có nút mở (FR-cross-process-flow-009). Quay lại bước 5.\n\n**8a. Bản ghi vừa bị thu quyền xem:**\n- 8a1. Web: hệ thống hiện popup Loại 2 (GR-15) câu E-common-011 + Đóng · app: popup chặn E-common-011 Theo GR-26; người dùng ở lại sơ đồ. Quay lại bước 5.\n\n**8b. Bản ghi đã bị xoá trong lúc sơ đồ đang mở:**\n- 8b1. Hệ thống hiện popup E-cross-process-flow-004 + Tải lại sơ đồ (FR-cross-process-flow-010).\n- 8b2. Người dùng bấm Tải lại sơ đồ → cây tải lại theo trạng thái mới (bước chính thành \"Chưa tạo\", nhánh phát sinh thành Đã huỷ). Quay lại bước 5.\n\n#### Related Requirements\n\nFR-cross-process-flow-005 → 011, FR-cross-process-flow-020, FR-cross-process-flow-021 · BR-cross-process-flow-005, BR-cross-process-flow-006, BR-cross-process-flow-009, BR-cross-process-flow-011, BR-cross-process-flow-012 · E-cross-process-flow-004 · NFR-cross-process-flow-001, -002, -004, -005 — [SRS spec](#sec-spec)\n\n\n## <a id=\"sec-openq\"></a>8. Open Questions (tổng hợp)\n\n> Gom từ các mục **Open Questions** rải rác trong tài liệu (SRS spec, từng function, ...). Nội dung gốc vẫn nằm nguyên trong file MD — đây chỉ là bản tổng hợp để dễ đọc.\n\n### SRS Spec\n\n| # | Câu hỏi | Owner | Nguồn khách |\n|---|---|---|---|\n| OQ-1 | Bảng phát sinh luồng Điều vận (Cung cấp dịch vụ tổng quát → Điều phối → Lệnh vận tải → Thanh toán chi/thu) — chờ chốt với khách, không chặn feature. (kế thừa brainstorm OQ-1) | Delta | chưa có trong tài liệu khách gửi |\n| ✅ OQ-3 | ⭐ Gửi bản ghi và thêm bước vào cây có phải \"cùng thành công hoặc cùng không\" (cây không nhận → bản ghi giữ nháp; 2 người cùng gửi cho bước \"1 bản ghi\" thì chỉ 1 người được)? Đề xuất: có. → **Chốt 12/10:** Có — cùng thành công hoặc cùng không (FR-003, FR-013) | Delta | ch 12; cách ghi \"chờ bao lâu\" và tiêu đề popup E-001/E-002 chưa chuẩn. → **Chốt 12/10:** Web dùng popup Loại 2; Override GR-12 cho sơ đồ; chờ ghi phút/giờ/ngày; tiêu đề popup \"Không thể …\" | BA | chưa có trong tài liệu khách gửi |\n| ✅ OQ-27 | Dữ liệu cũ: brainstorm ghi chỉ dựng quy trình chưa hoàn thành, spec ghi dựng toàn bộ — chốt bên nào, cỡ mẫu đối chiếu? \"Cập nhật lần cuối\" theo ngày nghiệp vụ gốc hay ngày chuyển dữ liệu? → **Chốt 12/10:** Dựng toàn bộ; Cập nhật lần cuối = ngày chuyển dữ liệu (NFR-008) | Delta | chưa có trong tài liệu khách gửi |\n| ✅ OQ-28 | Thời gian phản hồi cho danh sách + ô tìm, cây >20 bước chưa có mục tiêu. Tìm \"chứa chuỗi\" hay \"khớp đầu mã\"? Cần đối soát định kỳ khi cây lệch bản ghi? → **Chốt 12/10:** Danh sách ≤2s, tìm ≤1s, cây ≤50 bước ≤3s; tìm chứa chuỗi; đối soát hằng đêm (NFR-001, -009, -010, FR-016) | Tech | chưa có trong tài liệu khách gửi |\n| ✅ OQ-29 | NFR-007 đòi 2 ngôn ngữ nhưng Error Matrix và BR-005/007 chỉ có tiếng Việt. → **Chốt 12/10:** Thêm câu EN cho E-001 → 004; bảng liên quy trình có nhãn EN (NFR-007, BR-007) | BA | chưa có trong tài liệu khách gửi |\n| ✅ OQ-30 | FR-020 (banner dữ liệu cũ) P1 trong khi NFR-003 P0 dựa vào FR-020. Banner danh sách hiện khi nào — chỉ khi quy trình đang hiện trên trang thay đổi? → **Chốt 12/10:** Chỉ khi thông tin đang hiện trên màn đổi; FR-020 lên P0 | BA | chưa có trong tài liệu khách gửi |\n| ✅ OQ-31 | BR-007 thiếu 2 cột (hành động hoàn thành bước, thông tin mang sang form sau); giới hạn nhãn 40 ký tự bắt buộc hay mục tiêu? Export, phân trang, tuỳ chỉnh cột chưa có FR. → **Chốt 12/10:** Thêm 2 cột vào BR-007; nhãn ≤40 ký tự bắt buộc; thêm FR-022 Export, phân trang + tuỳ chỉnh cột vào FR-015 | BA | chưa có trong tài liệu khách gửi |\n\n";
      const md = window.markdownit({ html: true, linkify: true, breaks: false });

      document.getElementById('content').innerHTML = md.render(MD_SOURCE);
    }

    // === Build nested TOC đa cấp (H2 → H3 → H4) theo đúng phân cấp heading ===
    const toc = document.getElementById('toc');
    // Lấy H2/H3/H4 (bỏ heading trong cover page). H4 cho thấy mục con sâu (vd
    // "## Screen: ..." trong wireframe demote thành H4) — TOC nest đúng theo cấp.
    const headings = Array.from(document.querySelectorAll('main h2, main h3, main h4'))
                          .filter(h => !h.closest('.cover'));
    // Stack các <ul> theo cấp: stack[L] = ul chứa item cấp L. Gốc toc = cấp 1 (giữ H2).
    const listStack = { 1: toc };   // toc là <ol> gốc
    let counter = 0;

    headings.forEach((h) => {
      const level = parseInt(h.tagName[1], 10);   // 2 | 3 | 4
      const id = `sec-${++counter}`;
      h.id = id;

      const li = document.createElement('li');
      li.className = 'toc-item';
      li.dataset.level = level;
      const row = document.createElement('div');
      row.className = 'toc-row';
      const toggle = document.createElement('span');
      toggle.className = 'toggle leaf';   // 'leaf' cho tới khi có con
      toggle.textContent = '▾';
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      row.appendChild(toggle);
      row.appendChild(a);
      li.appendChild(row);
      const childUl = document.createElement('ul');
      childUl.className = 'toc-children';
      li.appendChild(childUl);

      // Gắn vào parent = ul của cấp NGAY TRÊN đang mở (level-1); không có thì leo lên tiếp.
      let parentUl = null;
      for (let L = level - 1; L >= 1; L--) { if (listStack[L]) { parentUl = listStack[L]; break; } }
      (parentUl || toc).appendChild(li);
      // Parent li không còn là leaf → hiện toggle.
      const parentLi = (parentUl || toc).closest('li.toc-item');
      if (parentLi) parentLi.querySelector(':scope > .toc-row > .toggle').classList.remove('leaf');

      // Cấp hiện tại giờ mở childUl này; xóa mọi cấp sâu hơn khỏi stack.
      listStack[level] = childUl;
      for (let L = level + 1; L <= 6; L++) delete listStack[L];

      toggle.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        li.classList.toggle('collapsed');
      });
    });

    function setAllTocCollapsed(collapsed) {
      // Chỉ gập/mở các item CÓ con (leaf giữ nguyên).
      toc.querySelectorAll('li.toc-item').forEach(li => {
        const t = li.querySelector(':scope > .toc-row > .toggle');
        if (t && !t.classList.contains('leaf')) li.classList.toggle('collapsed', collapsed);
      });
    }

    // === Click link nội bộ #anchor (TOC LẪN trong nội dung) → cuộn mượt tới mục ===
    // Bắt ở document để phủ cả link "chi tiết ở erd.md" (đã đổi thành #sec-erd) trong
    // content, không chỉ TOC. Anchor có thể là <a id> động (sec-N) hoặc cố định (sec-erd...).
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      const target = document.getElementById(id) ||
                     document.querySelector(`main [id="${id}"]`);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + id);
      }
    });

    // === Scroll-spy: highlight mục đang xem + mọi tổ tiên của nó ===
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          toc.querySelectorAll('li.active').forEach(el => el.classList.remove('active'));
          const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
          if (link) {
            // Đánh dấu item hiện tại + leo lên mọi cấp cha (nested).
            let li = link.closest('li.toc-item');
            while (li) { li.classList.add('active'); li = li.parentElement.closest('li.toc-item'); }
          }
        }
      });
    }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
    document.querySelectorAll('main h2, main h3, main h4').forEach(h => obs.observe(h));

    // === Mermaid render (CHỈ online) + zoom modal ===
    if (!OFFLINE && window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
      (async () => {
        const blocks = Array.from(document.querySelectorAll('pre.mermaid'));
        for (let i = 0; i < blocks.length; i++) {
          const el = blocks[i];
          const code = el.textContent;
          try {
            const { svg } = await mermaid.render(`mmd-${i}`, code);
            el.innerHTML = svg;
            el.dataset.processed = '1';
          } catch (err) {
            console.error(`Mermaid block #${i} failed:`, err.message || err);
            el.innerHTML = `<div style="color:#b00;font-family:monospace;font-size:12px;padding:8px;border:1px solid #b00;border-radius:4px;text-align:left;">⚠ Mermaid render lỗi: ${(err.message||err).toString().split('\n')[0]}<br><pre style="white-space:pre-wrap;margin-top:8px;">${code.replace(/</g,'&lt;')}</pre></div>`;
          }
        }
        attachMermaidZoom();
      })();
    } else {
      // offline: SVG đã inline sẵn server-side, chỉ cần gắn click-zoom.
      attachMermaidZoom();
    }

    function attachMermaidZoom() {
      document.querySelectorAll('.mermaid svg, pre.mermaid svg').forEach(svg => {
        if (svg.dataset.zoomAttached) return;
        svg.dataset.zoomAttached = '1';
        svg.addEventListener('click', () => openMermaidModal(svg));
      });
    }

    function openMermaidModal(svg) {
      const modal = document.getElementById('mermaid-modal');
      const inner = modal.querySelector('.modal-svg');
      const clone = svg.cloneNode(true);
      clone.style.maxWidth = 'none';
      clone.style.maxHeight = 'none';
      clone.setAttribute('width', '100%');
      clone.setAttribute('height', '100%');
      inner.innerHTML = '';
      inner.appendChild(clone);
      modal.classList.add('open');
      // svg-pan-zoom chỉ có online (CDN). Offline: hiển thị to trong modal, không pan/zoom lib
      // (degrade nhẹ — vẫn xem được full diagram, ESC/click nền để đóng).
      if (!OFFLINE && window.svgPanZoom) {
        requestAnimationFrame(() => {
          modalPanZoom = svgPanZoom(clone, {
            zoomEnabled: true, controlIconsEnabled: false,
            fit: true, center: true, minZoom: 0.3, maxZoom: 20,
            zoomScaleSensitivity: 0.3
          });
        });
      }
    }

    function closeMermaidModal() {
      const modal = document.getElementById('mermaid-modal');
      if (modalPanZoom) { modalPanZoom.destroy(); modalPanZoom = null; }
      modal.querySelector('.modal-svg').innerHTML = '';
      modal.classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('mermaid-modal').classList.contains('open')) {
        closeMermaidModal();
      }
    });
  </script>
</body>
</html>
