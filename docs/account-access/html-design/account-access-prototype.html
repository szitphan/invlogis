<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập và tài khoản — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════ LỚP 1: VỎ CHROME (neutral B&W — KHÔNG token app) ══════════ */
    :root {
      --chrome-bg: #f4f4f4; --chrome-panel: #fff; --chrome-line: #ccc;
      --chrome-ink: #000; --chrome-muted: #777;
    }
    html { font-size: 14px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--chrome-bg);
      color: var(--chrome-ink);
      min-height: 100vh;
    }
    .proto-stage {
      min-height: 100vh; display: flex; align-items: flex-start;
      justify-content: center; padding: 32px 16px;
    }
    .proto-app {
      width: min(var(--device-w, 393px), 100%);
      height: min(var(--device-h, 852px), calc(100vh - 64px));
      background: var(--bg);
      border-radius: 44px; overflow: hidden; position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28); display: flex; flex-direction: column;
    }
    .proto-stage[data-device="desktop"] .proto-app {
      width: min(1920px, 100%); height: auto; min-height: calc(100vh - 64px);
      max-height: none; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); overflow: visible;
    }
    @media (max-width: 480px) {
      .proto-stage { padding: 0; }
      .proto-app { border-radius: 0; height: 100vh; max-height: 100vh; box-shadow: none; }
    }

    .proto-fab {
      position: fixed; right: 20px; bottom: 20px; z-index: 900;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--chrome-ink); color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .proto-fab svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.6; }
    .proto-panel {
      position: fixed; right: 20px; bottom: 84px; z-index: 901;
      width: 360px; max-width: calc(100vw - 40px); max-height: calc(100vh - 120px);
      background: var(--chrome-panel); color: var(--chrome-ink);
      border: 1px solid var(--chrome-ink); border-radius: 12px; overflow: hidden;
      display: none; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .proto-panel.open { display: flex; }
    .proto-panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--chrome-line); }
    .proto-panel-head .feat { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--chrome-muted); }
    .proto-panel-head .close { margin-left: auto; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--chrome-ink); }
    .proto-tabs { display: flex; border-bottom: 1px solid var(--chrome-line); }
    .proto-tab { flex: 1; padding: 9px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 12px; cursor: pointer; color: var(--chrome-muted); font-family: inherit; }
    .proto-tab.active { color: var(--chrome-ink); border-bottom-color: var(--chrome-ink); font-weight: 700; }
    .proto-panel-body { overflow-y: auto; padding: 10px 0; }
    .proto-pane { display: none; } .proto-pane.active { display: block; }

    .toc-section { padding: 10px 14px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--chrome-muted); }
    .toc-link { display: block; padding: 6px 14px; font-size: 13px; color: var(--chrome-ink); text-decoration: none; border-left: 3px solid transparent; cursor: pointer; }
    .toc-link:hover { background: #f4f4f4; }
    .toc-link.active { border-left-color: #000; background: #f0f0f0; font-weight: 700; }
    .toc-link.screen { padding-left: 30px; font-size: 12px; color: #444; }
    .toc-link.screen::before { content: "› "; color: var(--chrome-muted); }
    .toc-dev { font-size: 10px; color: var(--chrome-muted); border: 1px solid var(--chrome-line); border-radius: 3px; padding: 0 4px; margin-left: 4px; }

    .flowmap { padding: 10px 14px; display: flex; flex-direction: column; gap: 16px; }
    .flowgroup { border: 1px solid var(--chrome-line); border-radius: 8px; padding: 12px; }
    .flowgroup h3 { font-size: 13px; margin-bottom: 8px; }
    .chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .node { border: 1.5px solid #000; border-radius: 6px; padding: 6px 10px; font-size: 11px; background: #fff; cursor: pointer; text-decoration: none; color: #000; }
    .node:hover { background: #f0f0f0; }
    .node.edge { background: repeating-linear-gradient(45deg,#fff,#fff 4px,#f0f0f0 4px,#f0f0f0 8px); }
    .node.error { background: #000; color: #fff; }
    .arrow { color: var(--chrome-muted); font-size: 13px; }
    .panel-reset { margin: 6px 14px 12px; padding: 8px; width: calc(100% - 28px); background: none; border: 1px solid var(--chrome-line); border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--chrome-muted); font-family: inherit; }
    .panel-reset:hover { border-color: #000; color: #000; }

    /* Pane Mô phỏng (chrome) */
    .seg { display: inline-flex; border: 1px solid #000; border-radius: 6px; overflow: hidden; margin: 4px 14px 6px; }
    .seg button { background: #fff; border: 0; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer; }
    .seg button.on { background: #000; color: #fff; font-weight: 700; }
    .sim-line { padding: 2px 14px; font-size: 12px; color: #333; line-height: 1.5; }
    .sim-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 6px; }
    .sim-btn { background: #fff; border: 1px solid var(--chrome-line); border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; color: #000; text-align: left; }
    .sim-btn:hover:not([disabled]) { border-color: #000; }
    .sim-btn[disabled] { color: var(--chrome-muted); cursor: not-allowed; }
    .sim-btn.on { background: #000; color: #fff; border-color: #000; }
    .acc { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px dashed #eee; font-size: 12px; }
    .acc > div { flex: 1; min-width: 0; line-height: 1.4; }
    .acc small { color: var(--chrome-muted); }
    .toc-section.demo-trigger-head { margin-top: 8px; border-top: 1px dashed var(--chrome-line); padding-top: 12px; }
    .demo-trigger-note { padding: 0 14px 6px; font-size: 10px; color: var(--chrome-muted); line-height: 1.4; }
    .sim-select { margin: 0 14px 0 14px; font: inherit; font-size: 12px; padding: 4px; }
    .proto-note { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 950; background: #000; color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 6px; max-width: 520px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .na { margin: auto; padding: 40px 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .na button { background: #000; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }

    .demo-notice { position: fixed; left: 12px; bottom: 12px; z-index: 700;
      background: rgba(255,255,255,0.9); border: 1px solid var(--chrome-line); color: var(--chrome-muted);
      font-size: 10px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
      pointer-events: none; opacity: 0.75; }

    /* ══════════ LỚP 2: APP (design tokens — CHỈ lớp này có màu) ══════════ */
    /* RAW PALETTE — copy hex từ design/design.md (main, 15/10/2026). SỬA CHỈ ở đây */
    :root {
      --palette-accent: #262626; --palette-accent-dark: #ebebeb;
      --palette-on-accent: #ffffff; --palette-on-accent-dark: #171717;
      --palette-neutral: #0000000f; --palette-neutral-dark: #ffffff1a;
      --palette-surface: #ffffff; --palette-surface-dark: #262626;
      --palette-body: #f1f1f1; --palette-body-dark: #1b1b1b;
      --palette-muted: #f1f1f1; --palette-muted-dark: #1b1b1b;
      --palette-overlay: #00000080; --palette-overlay-dark: #000000cc;
      --palette-overlay-hover: #0000000d; --palette-overlay-hover-dark: #ffffff0d;
      --palette-overlay-pressed: #0000001a; --palette-overlay-pressed-dark: #ffffff1a;
      --palette-text-primary: #171717; --palette-text-primary-dark: #fafafa;
      --palette-text-secondary: #737373; --palette-text-secondary-dark: #a3a3a3;
      --palette-text-disabled: #a3a3a3; --palette-text-disabled-dark: #525252;
      --palette-border-default: #00000014; --palette-border-default-dark: #ffffff1a;
      --palette-border-emphasized: #d4d4d4; --palette-border-emphasized-dark: #525252;
      --palette-skeleton: #ebebeb; --palette-skeleton-dark: #525252;
      --palette-success: #007004; --palette-success-dark: #9fe59b;
      --palette-success-muted: #c5e5c0;
      --palette-error: #a50c25; --palette-error-dark: #ffc6c1;
      --palette-error-muted: #facecb;
      --palette-error-inverted: #aa071e; --palette-error-inverted-dark: #e3193b;
      --palette-background-inverted: #0a1317; --palette-background-inverted-dark: #ffffff;
      --palette-blue-bg: #c4ddfb; --palette-blue-text: #00458c;
      --palette-chip-gray-fg: #525252; --palette-chip-gray-fg-dark: #e5e5e5;
      --palette-input-ring-focus: #f1f1f1; --palette-input-ring-focus-dark: #262626;
      --palette-input-ring-error: #e33f4a4d;
      --palette-shadow-medium: 0 2px 4px #0000000d, 0 4px 12px #0000001a;
      --palette-shadow-high: 0 4px 6px #0000001a, 0 12px 24px #00000026;
      --palette-shadow-medium-dark: 0 2px 4px #00000059, 0 4px 12px #00000080, inset 0 0 0 1px #ffffff1f;
      --palette-shadow-high-dark: 0 4px 6px #00000080, 0 12px 24px #000000b3, inset 0 0 0 1px #ffffff26;
      --palette-chip-green-bg: #e8f5ec; --palette-chip-green-fg: #1b7542;   /* status-chip-green (Hoàn tất / đang hoạt động) */
      --palette-logo-delta: #1B7B46;     /* P-mau-logo (Delta) — chỉ tô ô logo */
      --palette-hardware: #000000;       /* Dynamic Island — phần cứng, không theo theme */
      --font-body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-head: "Cal Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ease: cubic-bezier(0.24, 1, 0.4, 1);
      --dur-fast: 125ms; --dur-medium: 300ms; --dur-slow: 700ms;
    }
    @media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0s; --dur-medium: 0s; --dur-slow: 0s; } }

    /* SEMANTIC — 3 block bắt buộc */
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: var(--palette-body); --surface: var(--palette-surface); --muted: var(--palette-muted);
      --ink: var(--palette-text-primary); --ink-2: var(--palette-text-secondary); --ink-3: var(--palette-text-disabled);
      --ink-strong-2: var(--palette-chip-gray-fg);
      --line: var(--palette-border-default); --line-strong: var(--palette-border-emphasized);
      --accent: var(--palette-accent); --on-accent: var(--palette-on-accent); --neutral: var(--palette-neutral);
      --hover: var(--palette-overlay-hover); --pressed: var(--palette-overlay-pressed); --scrim: var(--palette-overlay);
      --skeleton: var(--palette-skeleton);
      --error: var(--palette-error); --error-muted: var(--palette-error-muted); --error-inv: var(--palette-error-inverted);
      --success: var(--palette-success); --success-muted: var(--palette-success-muted);
      --inverted: var(--palette-background-inverted);
      --info-bg: var(--palette-blue-bg); --info-ink: var(--palette-blue-text);
      --ring-focus: var(--palette-input-ring-focus); --ring-error: var(--palette-input-ring-error);
      --focus-ring: var(--palette-accent);
      --shadow-md: var(--palette-shadow-medium); --shadow-hi: var(--palette-shadow-high);
      --logo: var(--palette-logo-delta); --hw: var(--palette-hardware);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: var(--palette-body-dark); --surface: var(--palette-surface-dark); --muted: var(--palette-muted-dark);
      --ink: var(--palette-text-primary-dark); --ink-2: var(--palette-text-secondary-dark); --ink-3: var(--palette-text-disabled-dark);
      --ink-strong-2: var(--palette-chip-gray-fg-dark);
      --line: var(--palette-border-default-dark); --line-strong: var(--palette-border-emphasized-dark);
      --accent: var(--palette-accent-dark); --on-accent: var(--palette-on-accent-dark); --neutral: var(--palette-neutral-dark);
      --hover: var(--palette-overlay-hover-dark); --pressed: var(--palette-overlay-pressed-dark); --scrim: var(--palette-overlay-dark);
      --skeleton: var(--palette-skeleton-dark);
      --error: var(--palette-error-dark); --error-muted: var(--palette-error-muted); --error-inv: var(--palette-error-inverted-dark);
      --success: var(--palette-success-dark); --success-muted: var(--palette-success-muted);
      --inverted: var(--palette-background-inverted-dark);
      --info-bg: var(--palette-blue-bg); --info-ink: var(--palette-blue-text);
      --ring-focus: var(--palette-input-ring-focus-dark); --ring-error: var(--palette-input-ring-error);
      --focus-ring: var(--palette-accent-dark);
      --shadow-md: var(--palette-shadow-medium-dark); --shadow-hi: var(--palette-shadow-high-dark);
      --logo: var(--palette-logo-delta); --hw: var(--palette-hardware);
    }
    [data-theme]:not(dialog) { background-color: var(--bg); color: var(--ink); }

    dialog { margin: auto; border: none; padding: 0; background: transparent; max-width: calc(100% - 40px); }
    dialog::backdrop { background: rgba(0,0,0,0.5); }

    [data-screen] { display: none; flex-direction: column; height: 100%; overflow-y: auto; font-family: var(--font-body); font-size: 14px; line-height: 20px; }
    [data-screen].active { display: flex; }
    .proto-stage[data-device="mobile"] [data-screen] { overflow: hidden; }
    .proto-stage[data-device="desktop"] [data-screen] { min-height: calc(100vh - 64px); height: auto; overflow: visible; }

    /* ── App component CSS (chỉ semantic token) ── */
    .ic { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ic-14 { width: 14px; height: 14px; }
    .ic-20 { width: 20px; height: 20px; }
    .ic-24 { width: 24px; height: 24px; }
    .ic-32 { width: 32px; height: 32px; stroke-width: 1.6; }
    .ic-48 { width: 48px; height: 48px; stroke-width: 1.4; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 0s; } }
    .sp { flex: 1; }
    .grow { flex: 1; min-width: 0; }

    /* Nút */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px;
      border: 0; border-radius: 10px; font-family: var(--font-body); font-size: 14px; font-weight: 500; line-height: 20px;
      cursor: pointer; white-space: nowrap; transition: box-shadow var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); }
    .btn:hover:not([disabled]) { box-shadow: inset 0 0 0 999px var(--hover); }
    .btn:active:not([disabled]) { box-shadow: inset 0 0 0 999px var(--pressed); }
    .btn:focus-visible, .link:focus-visible, .row-link:focus-visible, .iconbtn:focus-visible, .m-iconbtn:focus-visible, .pick-item:has(input:focus-visible), .tab-btn:focus-visible, .acct-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .btn.loading[disabled] { opacity: .8; }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-secondary { background: var(--neutral); color: var(--ink); }
    .btn-ghost { background: transparent; color: var(--ink); }
    .btn-block { width: 100%; }
    .link { background: none; border: 0; padding: 0; font: inherit; font-weight: 500; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .iconbtn { width: 32px; height: 32px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; }
    .iconbtn:hover { background: var(--hover); }

    /* Field */
    .fld { display: flex; flex-direction: column; gap: 4px; }
    .fld-label { font-size: 14px; font-weight: 500; color: var(--ink); }
    .req { color: var(--error); }
    .fld-ctl { position: relative; }
    .inp { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface);
      color: var(--ink); font-family: var(--font-body); font-size: 14px; outline: none;
      transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
    .inp::placeholder { color: var(--ink-2); }
    .inp:hover { box-shadow: inset 0 0 0 3px var(--ring-focus); }
    .inp:focus { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--ring-focus); }
    .fld.has-err .inp { border-color: var(--error); box-shadow: inset 0 0 0 3px var(--ring-error); }
    .fld-ctl.has-eye .inp { padding-right: 38px; }
    .eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 32px; height: 28px; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; border-radius: 8px; }
    select.inp { appearance: none; padding-right: 32px; background-image: none; cursor: pointer; }
    .sel-wrap { position: relative; }
    .sel-wrap .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-2); }
    span.err-inline { display: none; font-size: 12px; line-height: 16px; color: var(--error); }
    span.err-inline.show { display: block; }
    span.err-link { display: none; }
    span.err-link.show { display: block; font-size: 12px; }
    .hint { font-size: 12px; line-height: 20px; color: var(--ink-2); }
    .hint.center { text-align: center; }
    .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

    /* Logo khách */
    .logo-tile { width: var(--s, 32px); height: var(--s, 32px); border-radius: 8px; background: var(--logo); color: var(--palette-on-accent);
      display: inline-grid; place-items: center; font-family: var(--font-head); font-size: calc(var(--s, 32px) * 0.55); line-height: 1; flex: none; }
    .brand { display: flex; align-items: center; justify-content: flex-start; gap: 10px; }
    .w-card.center .brand { justify-content: center; }
    .logo-img { display: block; width: auto; }
    .brand-name { font-family: var(--font-head); font-size: 20px; line-height: 28px; }

    /* Banner, toast, empty, skeleton */
    .banner { display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--info-bg); color: var(--info-ink); font-size: 14px; }
    .banner .ic { margin-top: 2px; }
    .toast-host { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 800; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .proto-stage[data-device="mobile"] .toast-host { position: absolute; bottom: 116px; width: calc(100% - 32px); }
    .toast { display: flex; align-items: center; gap: 12px; width: 360px; max-width: 100%; padding: 12px; border-radius: 12px; background: var(--inverted); color: var(--on-accent);
      box-shadow: var(--shadow-md); font-family: var(--font-body); font-size: 14px; line-height: 20px; animation: toastIn var(--dur-medium) var(--ease); }
    .toast-err { background: var(--error-inv); color: var(--palette-on-accent); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 16px; color: var(--ink); }
    .empty .ic { color: var(--ink-2); margin-bottom: 4px; }
    .empty h3 { font-family: var(--font-head); font-weight: 400; font-size: 17px; line-height: 24px; }
    .empty p { color: var(--ink-2); max-width: 360px; }
    .sk { background: var(--skeleton); border-radius: 12px; animation: pulse var(--dur-slow) var(--ease) infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: .55; } }

    /* ═══ WEB ═══ */
    .w-auth { flex: 1; min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 48px 24px; background: var(--bg); }
    .w-card { width: 400px; max-width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
    .w-card.center { align-items: center; text-align: center; }
    .w-card .back { align-self: flex-start; padding-left: 4px; margin: -8px 0 -4px -4px; }
    .h-auth { font-family: var(--font-head); font-weight: 400; font-size: 24px; line-height: 32px; }
    .w-card.center .h-auth { text-align: center; }
    .lead { font-size: 14px; color: var(--ink); }

    // ════ NAVIGATION ════
    function goto(slug){ if (location.hash.slice(1) === slug) routeTo(slug); else location.hash = slug; }
    function showScreen(slug){
      if (!slug || !SCREENS.includes(slug)) slug = DEFAULT_SCREEN;
      document.querySelectorAll('[data-screen]').forEach(s => s.classList.remove('active'));
      const t = document.querySelector('[data-screen="'+slug+'"]');
      if (t) t.classList.add('active');
      if (ENTRY_SCREENS.includes(slug)) clearFormInputs(slug);
      renderScreen(slug);
      document.querySelectorAll('.toc-link').forEach(a => a.classList.toggle('active', a.dataset.goto === slug));
    }
    const routeTo = showScreen;                               // bản gốc cho điều hướng nội bộ + Back (window.showScreen bị bọc ở INIT cho lớp góp ý)
    window.addEventListener('hashchange', () => routeHash());

    function clearFormInputs(slug){
      const section = document.querySelector('[data-screen="'+slug+'"]');
      if (!section) return;
      section.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], textarea').forEach(el => { el.value = ''; delete el.dataset.touched; el.setAttribute('aria-invalid', 'false'); });
      section.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => el.checked = false);
      section.querySelectorAll('.banner').forEach(el => el.classList.remove('show'));
      section.querySelectorAll('.err-inline').forEach(el => el.classList.remove('show'));
      delete section.dataset.submitted;
    }

    function digitsOnly(value, max){ const d = (value || '').replace(/\D/g, ''); return max ? d.slice(0, max) : d; }
    function markFieldTouched(el){ el.dataset.touched = '1'; }
    function isFieldTouched(el){ return el.dataset.touched === '1'; }

    function togglePanel(force){
      const p = document.getElementById('proto-panel');
      const open = force === undefined ? !p.classList.contains('open') : force;
      p.classList.toggle('open', open);
      if (open) renderSim();
    }
    function switchPane(name, btn){
      document.querySelectorAll('.proto-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      ['toc','flow','sim'].forEach(n => document.getElementById('pane-'+n).classList.toggle('active', n === name));
      if (name === 'sim') renderSim();
    }
    document.getElementById('proto-panel').addEventListener('click', e => {
      const a = e.target.closest('[data-goto]');
      if (!a) return;
      e.preventDefault(); R.deep = true; goto(a.dataset.goto); togglePanel(false);
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('proto-panel').classList.contains('open')) { togglePanel(false); return; }
      const rt = document.querySelector('.ov.rt');
      if (rt) { if (!rt.dataset.blocking) closeOverlay(); return; }
      if (R.menu) { R.menu = false; renderScreen(curSlug()); const b = q('.acct-btn'); if (b) b.focus(); return; }
      const s = curSlug();
      if (s === 'branch-picker') cancelPick();
      else if (s === 'change-password' && dev() === 'web') cancelCpw();
      else if (s === 'sign-out-confirm') goto(S.backTo || 'account-info');
    });

    function resetPrototypeData(){
      if(!confirm('Xoá toàn bộ dữ liệu demo và làm mới? Không thể hoàn tác.')) return;
      localStorage.removeItem(STORE_KEY);
      store.state = structuredClone(DEFAULT_STATE);
      history.replaceState(null, '', location.pathname + location.search);
      location.reload();
    }

        if (rec.lockUntil != null) { inputOf('password').value = ''; lockedErr(rec); save(); return; }
        const usingTemp = !!(user && user.tempPw && pw === user.tempPw);
        const okPw = !!(user && ((user.pw && pw === user.pw) || usingTemp));
        // BR-022 (2) Sai mật khẩu — đếm chung web và app, kể cả tên không tồn tại
        if (!okPw) {

      let b = null;

      else if (user.lastBranch && (user.lastBranch === 'parent' ? user.orgWide : user.branches.includes(user.lastBranch))) b = user.lastBranch;
      S.session = { u: user.u, branch: b, picking: b ? null : 'login' };
      save();
      goto(b ? 'home' : 'branch-picker');
    }

    // 1.4 Không được dùng kênh này
    const deniedMsg = () => `Tài khoản này không được dùng ${S.denied === 'web' ? 'Web' : 'ứng dụng'}. Liên hệ quản trị viên.`;
    W['channel-denied'] = () => wAuth(`<span class="ic-circle err">${ic('ban', 'ic-24')}</span><p class="lead">${esc(deniedMsg())}</p><button class="btn btn-primary btn-block" onclick="goto('sign-in')" data-cmt="channel-denied.back">Quay về đăng nhập</button>`, { center: true });
    M['channel-denied'] = () => mScreen({
      body: `<div class="m-center"><span class="ic-circle err">${ic('ban', 'ic-24')}</span><p class="m-text">${esc(deniedMsg())}</p></div>`,
      bottom: `<button class="btn btn-primary btn-block" onclick="goto('sign-in')" data-cmt="channel-denied.back">Quay về đăng nhập</button>`
    });

    // 1.5 Chọn chi nhánh
    function pickerItems(){
      const user = me(); const qy = norm(R.pq || '');
      const sel = R.psel != null ? R.psel : (S.session.picking === 'switch' ? S.session.branch : null);
      const order = (user.recent || []).filter(b => user.branches.includes(b)).concat(user.branches.filter(b => !(user.recent || []).includes(b)));
      const list = order.filter(b => !qy || norm(DEMO.branches[b].name).includes(qy) || norm(DEMO.branches[b].prov).includes(qy));
      const showParent = user.orgWide && (!qy || norm(DEMO.parentName).includes(qy));
      const radio = (v, icon, t, d) => `<label class="pick-item"><span class="pick-ic">${ic(icon)}</span><span class="grow"><span class="t">${esc(t)}</span><br><span class="d">${esc(d)}</span></span><input type="radio" name="br" value="${v}" ${sel === v ? 'checked' : ''} onchange="R.psel='${v}';syncPick()" data-cmt="branch-picker.${v}"></label>`;
      if (!showParent && list.length === 0) return `<div class="empty" style="padding:24px 8px">${ic('search', 'ic-24')}<p>Không có chi nhánh phù hợp.</p></div>`;
      return (showParent ? radio('parent', 'warehouse', DEMO.parentName, `Toàn bộ ${user.branches.length} chi nhánh`) : '')
        + (showParent && list.length ? `<div class="divider">Hoặc chọn chi nhánh cụ thể</div>` : '')
        + list.map(b => radio(b, 'map-pin', DEMO.branches[b].name, DEMO.branches[b].prov)).join('');
    }
    function pickerBox(){
      const sel = R.psel != null ? R.psel : (S.session.picking === 'switch' ? S.session.branch : null);
      const sheet = dev() === 'app';
      return `<div class="ov ${sheet ? 'ov-sheet' : ''}" style="${sheet ? '' : ''}"><div class="ov-box wide" role="dialog" aria-modal="true" aria-labelledby="pick-t">
        ${sheet ? `<button class="handle" aria-label="${S.session.picking === 'switch' ? 'Đóng' : 'Huỷ và đăng xuất'}" onclick="cancelPick()"></button>` : ''}
        <div class="ov-head"><h2 class="ov-title" id="pick-t">Chọn chi nhánh</h2>
          <button class="${sheet ? 'm-iconbtn' : 'iconbtn'}" aria-label="${R.pshow ? 'Đóng tìm kiếm' : 'Tìm chi nhánh'}" aria-expanded="${!!R.pshow}" onclick="togglePickSearch()" data-cmt="branch-picker.search-toggle">${ic(R.pshow ? 'x' : 'search')}</button></div>
        ${R.pshow ? `<div class="search">${ic('search', 'ic-14')}<input id="f-pq" class="inp" placeholder="Tìm theo tên chi nhánh hoặc tỉnh thành" value="${esc(R.pq || '')}" oninput="pickerSearch(this.value)" aria-label="Tìm chi nhánh" data-cmt="branch-picker.search"></div>` : ''}
        <div class="pick-list" id="pick-list" role="radiogroup" aria-label="Chi nhánh">${pickerItems()}</div>
        <div class="ov-actions">${sheet
          ? `<button class="btn btn-primary btn-block" id="btn-pick" onclick="pickBranch(this)" ${sel ? '' : 'disabled'} data-cmt="branch-picker.choose">Chọn</button><button class="btn btn-secondary btn-block" onclick="cancelPick()">Huỷ</button>`
          : `<button class="btn btn-secondary" onclick="cancelPick()">Huỷ</button><button class="btn btn-primary" id="btn-pick" onclick="pickBranch(this)" ${sel ? '' : 'disabled'} data-cmt="branch-picker.choose">Chọn</button>`}</div>
      </div></div>`;
    }
    function pickerBg(){
      if (S.session.picking === 'switch') {
        if (S.session.pickFrom === 'account-info') return dev() === 'web' ? accountWeb(true) : accountApp(true);
        if (S.session.pickFrom === 'activity-history') return dev() === 'web' ? shell('account', `<b>Lịch sử hoạt động</b>`, `<div class="page-head"><h1 class="h1">Lịch sử hoạt động</h1></div>`) : mScreen({ bg: 'body', title: 'Lịch sử hoạt động', body: '' });
        return dev() === 'web' ? homeWeb() : homeApp();
      }
      return dev() === 'web' ? wAuth(`<h1 class="h-auth">Đăng nhập</h1><div class="sk" style="height:56px"></div><div class="sk" style="height:56px"></div>`) : mScreen({ body: `<h1 class="m-title" style="margin-top:80px">Đăng nhập</h1>` });
    }
    W['branch-picker'] = () => `<div class="bg-layer" inert aria-hidden="true">${pickerBg()}</div>${pickerBox()}`;
    M['branch-picker'] = () => `<div class="m-stack"><div class="bg-layer" inert aria-hidden="true">${pickerBg()}</div>${pickerBox()}</div>`;
    function togglePickSearch(){
      R.pshow = !R.pshow; if (!R.pshow) R.pq = '';
      const keep = (q('input[name="br"]:checked') || {}).value; if (keep) R.psel = keep;
      renderScreen('branch-picker');
      const t = R.pshow ? q('#f-pq') : q('[data-cmt="branch-picker.search-toggle"]'); if (t) t.focus();
    }
    function pickerSearch(v){ R.pq = v; const l = q('#pick-list'); if (l) l.innerHTML = pickerItems(); syncPick(); }
    function syncPick(){ const b = q('#btn-pick'); const sel = q('input[name="br"]:checked'); if (b) b.disabled = !sel; }
    function pickBranch(btn){
      const sel = q('input[name="br"]:checked'); if (!sel) return;
      busy(btn, 'Đang chọn…', () => {
        if (offline()) return;
        const user = me(); const v = sel.value;
        if (v === 'parent' ? !user.orgWide : !user.branches.includes(v)) { toast(MSG.c012, 'error'); R.psel = null; renderScreen('branch-picker'); return; }
        S.session.branch = v; S.session.picking = null; user.lastBranch = v;
        if (v !== 'parent') user.recent = [v].concat((user.recent || []).filter(x => x !== v));
        save(); goto('home');
      }, 500);
    }
    function cancelPick(){
      if (S.session && S.session.picking === 'switch') { const back = S.session.pickFrom || 'home'; S.session.picking = null; save(); goto(back); }
      else { S.session = null; save(); goto('sign-in'); }   // BR-014: huỷ sau đăng nhập = đăng xuất
    }
    function openBranchSwitch(){
      const from = curSlug();
      const go = () => { S.sim.unsaved = false; S.session.picking = 'switch'; S.session.pickFrom = from; R.psel = null; R.pq = ''; save(); goto('branch-picker'); };
      if (S.sim.unsaved) confirmLeave(go); else go();
    }

    // 2.1 Tạo mật khẩu mới
    function cpExpired(){
      const c = S.cp; if (!c) return null; const u = U(c.u);
      if (c.via === 'temp') return (u.tempPw && S.clock - u.tempIssued > P.tempPwMin) ? 'temp' : null;
      return S.clock - c.start > P.createPwMin ? 'window' : null;
    }
    function cpFields(){
      return field({ name: 'new', label: 'Mật khẩu mới', type: 'password', ph: 'Mật khẩu mới', eye: true, auto: 'new-password', hintId: 'hint-new', after: `<span class="hint" id="hint-new">${MSG.policy}</span>` })
           + field({ name: 'confirm', label: 'Nhập lại mật khẩu mới', type: 'password', ph: 'Nhập lại mật khẩu mới', eye: true, auto: 'new-password' });
    }
    function cpExpiredView(kind){
      if (kind === 'temp') return { icon: 'clock', title: '', text: MSG.e006, btn: `<button class="btn btn-primary btn-block" onclick="S.cp=null;save();goto('sign-in')">Quay về đăng nhập</button>`, link: `<button class="link" onclick="S.cp=null;save();goto('forgot-options')">Quên mật khẩu</button>` };
      return { icon: 'clock', title: 'Hết thời gian', text: MSG.e018, btn: `<button class="btn btn-primary btn-block" onclick="S.cp=null;save();goto('reset-request')">Gửi lại yêu cầu</button>`, link: `<button class="link" onclick="S.cp=null;save();goto('sign-in')">Quay về đăng nhập</button>` };
    }
    W['create-password'] = () => {
      const ex = cpExpired();
      if (ex) { const v = cpExpiredView(ex); return wAuth(`<span class="ic-circle err">${ic(v.icon, 'ic-24')}</span>${v.title ? `<h1 class="h-auth">${v.title}</h1>` : ''}<p class="lead">${v.text}</p>${v.btn}${v.link || ''}`, { center: true }); }
      return wAuth(`<h1 class="h-auth">Tạo mật khẩu mới</h1>${cpFields()}<div class="ov-actions"><button class="btn btn-secondary" onclick="cancelCreate()">Huỷ</button><button class="btn btn-primary" data-submit onclick="doCreate(this)" data-cmt="create-password.submit">Xác nhận</button></div>`);
    };
    M['create-password'] = () => {
      const ex = cpExpired();
      if (ex) { const v = cpExpiredView(ex); return mScreen({ back: "S.cp=null;save();goto('sign-in')", body: `<div class="m-center"><span class="ic-circle err">${ic(v.icon, 'ic-24')}</span>${v.title ? `<h1 class="m-title">${v.title}</h1>` : ''}<p class="m-text">${v.text}</p>${v.link || ''}</div>`, bottom: v.btn }); }
      return mScreen({ back: 'cancelCreate()', title: 'Tạo mật khẩu mới', body: cpFields(), bottom: `<button class="btn btn-primary btn-block" data-submit onclick="doCreate(this)" data-cmt="create-password.submit">Xác nhận</button>` });
    };
    function cancelCreate(){ const leave = () => { S.cp = null; save(); goto('sign-in'); }; if (anyTyped()) confirmLeave(leave); else leave(); }
    function newPwCheck(v){ const u = U(S.cp.u); if (!POLICY(v)) return MSG.e008; if (v === u.pw || v === u.tempPw) return MSG.e009; return ''; }
    function doCreate(btn){
      if (cpExpired()) { renderScreen('create-password'); return; }
      if (!reqCheck(['new', 'confirm'])) return;
      const nw = val('new'), cf = val('confirm');
      const e1 = newPwCheck(nw), e2 = cf !== nw ? MSG.e010 : '';
      setErr('new', e1); setErr('confirm', e2);
      if (e1 || e2) { focusFirstErr(); return; }
      busy(btn, 'Đang lưu…', () => {
        if (offline()) return;
        if (cpExpired()) { renderScreen('create-password'); return; }
        const u = U(S.cp.u);
        u.pw = nw; u.tempPw = null; u.tempIssued = null; u.status = 'active'; u.fails = 0; u.lockUntil = null; // BR-011
        if (S.reset && S.reset.u === u.u) S.reset = null;                                                // BR-024
        if (S.session && S.session.u === u.u) S.session = null;                                          // BR-012
        addHistory(u.u, 'key-round', S.cp.via === 'temp' ? 'Đã kích hoạt tài khoản' : 'Đã đặt lại mật khẩu');
        S.cp = null; S.flash = 'pwcreated'; save(); goto('sign-in');
      });
    }

    // 3.1 Chọn cách lấy lại mật khẩu
    function forgotCards(){
      const emailDesc = dev() === 'web' ? 'Nhận link qua email' : 'Nhận mã 6 số qua email';
      return `<button class="opt-card" onclick="goto('reset-request')" data-cmt="forgot-options.email"><span class="opt-ic">${ic('mail')}</span><span class="grow"><span class="t">Đặt lại qua email</span><br><span class="d">${emailDesc}</span></span>${ic('chevron-right')}</button>
        <button class="opt-card" onclick="goto('contact-it')" data-cmt="forgot-options.contact-it"><span class="opt-ic">${ic('headset')}</span><span class="grow"><span class="t">Liên hệ IT</span><br><span class="d">Khi không có hoặc không nhận được email</span></span>${ic('chevron-right')}</button>`;
    }
    W['forgot-options'] = () => wAuth(`<h1 class="h-auth">Quên mật khẩu</h1>${forgotCards()}`, { back: "goto('sign-in')" });
    M['forgot-options'] = () => mScreen({ back: "goto('sign-in')", title: 'Quên mật khẩu', body: forgotCards() });

    // 3.2 Nhập tên tài khoản
    const rrField = () => field({ name: 'rname', label: 'Tên tài khoản', ph: 'Tên tài khoản', auto: 'username', value: R.prefill || '' });
    W['reset-request'] = () => wAuth(`<h1 class="h-auth">Đặt lại mật khẩu</h1>${rrField()}<button class="btn btn-primary btn-block" data-submit data-label="Xác nhận" onclick="doResetRequest(this)" data-cmt="reset-request.submit">Xác nhận</button>`, { back: "goto('forgot-options')" });
    M['reset-request'] = () => mScreen({ back: "goto('forgot-options')", title: 'Đặt lại mật khẩu', body: rrField(), bottom: `<button class="btn btn-primary btn-block" data-submit data-label="Xác nhận" onclick="doResetRequest(this)" data-cmt="reset-request.submit">Xác nhận</button>` });
    function doResetRequest(btn){
      if (!reqCheck(['rname'])) return;
      const name = val('rname').trim(), k = keyOf(name);
      // Đã gửi trong thời gian chờ: link/mã trước vẫn còn hiệu lực → đi tiếp màn chờ, không gửi thêm
      if (R.cool[k] > 0 && S.reset && S.reset.key === k) { S.resetName = name; save(); goto(dev() === 'web' ? 'check-email' : 'otp-entry'); return; }
      busy(btn, 'Đang gửi…', () => {
        if (offline()) return;
        const until = rateLimited(k);
        if (until) { setErr('rname', MSG.e014(until)); return; }
        recordSend(k); issueReset(name); S.resetName = name; R.cool[k] = P.resendSec; save();
        goto(dev() === 'web' ? 'check-email' : 'otp-entry');
      });
    }

    // 3.3 Kiểm tra email (web)
    // 3.3 chia 3 khu: thông báo · "Chưa nhận được email?" (2 cách cùng cấp: gửi lại / nhờ IT) · điều hướng về đăng nhập
    W['check-email'] = () => wAuth(`<span class="ic-circle">${ic('mail', 'ic-24')}</span><h1 class="h-auth">Kiểm tra email</h1>
      <p class="lead">Nếu tài khoản có email đăng ký, link đặt lại mật khẩu đã được gửi tới email đó.</p>
      <div class="ce-help"><span class="ce-label">Chưa nhận được email?</span>
        <span class="sup ce-note">Kiểm tra cả mục Thư rác, rồi thử gửi lại link. Nếu vẫn không nhận được, chọn Liên hệ IT để bộ phận hỗ trợ đặt lại và gửi mật khẩu tạm cho bạn.</span>
        <div class="ce-opts">${coolBtn(keyOf(S.resetName), 'Gửi lại link', 'btn-secondary', 'resendReset(this)', 'check-email.resend', 'refresh-cw')}
          <button class="btn btn-ghost btn-block" onclick="R.prefill=S.resetName;goto('contact-it')" data-cmt="check-email.contact-it">${ic('headset')}Liên hệ IT</button></div>
        ${errSlot('resend')}</div>
      <div class="ce-foot"><button class="btn btn-ghost btn-block" onclick="goto('sign-in')" data-cmt="check-email.back">${ic('arrow-left')}Quay về đăng nhập</button></div>`, { center: true });
    function resendReset(btn){
      const k = keyOf(S.resetName);
      busy(btn, 'Đang gửi…', () => {
        if (offline()) return;
        const until = rateLimited(k);
        if (until) { setErr('resend', MSG.e014(until)); return; }
        setErr('resend', '');
        recordSend(k); issueReset(S.resetName); R.cool[k] = P.resendSec; save();
        if (dev() === 'app') renderScreen('otp-entry');
        toast(dev() === 'web' ? 'Đã gửi lại link.' : 'Đã gửi mã mới.');
        renderSim();
      });
    }

    // 3.4 Nhập mã xác thực (app)
    M['otp-entry'] = () => {
      const r = S.reset; const dead = !r || r.dead;
      const k = keyOf(S.resetName);
      return mScreen({ back: "R.prefill=S.resetName;goto('reset-request')", title: 'Nhập mã xác thực',
        body: `<p class="m-text">Nếu tài khoản có email đăng ký, mã 6 số đã được gửi tới email đó. Mã có hiệu lực ${P.otpMin} phút.</p>
          <div class="otp${dead ? ' err' : ''}" role="group" aria-label="Mã xác thực 6 số" data-cmt="otp-entry.code">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" ${i === 0 ? 'autocomplete="one-time-code"' : ''} aria-label="Số thứ ${i + 1}" ${dead ? 'disabled' : ''}>`).join('')}</div>
          <span class="sup" id="otp-status" role="status" style="justify-content:center"></span>
          ${errSlot('otp')}
          ${dead ? `<button class="btn btn-primary btn-block" data-cool="${esc(k)}" data-label="Gửi mã mới" onclick="resendReset(this)" data-cmt="otp-entry.resend">Gửi mã mới</button>` : coolBtn(k, 'Gửi mã mới', 'btn-secondary', 'resendReset(this)', 'otp-entry.resend')}
          ${errSlot('resend')}
          <button class="link" style="align-self:center" onclick="R.prefill=S.resetName;goto('contact-it')">Không nhận được email</button>` });
    };
    function bindOtp(sec){
      const boxes = [...sec.querySelectorAll('.otp input')];
      if (S.reset && S.reset.dead) setErr('otp', MSG.e012);
      boxes.forEach((b, i) => {
        b.addEventListener('input', () => {
          const d = digitsOnly(b.value);
          if (d.length > 1) { d.split('').slice(0, 6 - i).forEach((c, j) => boxes[i + j].value = c); }
          else b.value = d;
          const nxt = boxes.find(x => !x.value); if (nxt) nxt.focus();
          if (boxes.every(x => x.value)) checkOtp(boxes.map(x => x.value).join(''));
        });
        b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && i > 0) boxes[i - 1].focus(); });
      });
      if (boxes[0] && !boxes[0].disabled) boxes[0].focus();
    }
    function checkOtp(code){
      const boxes = [...q('.otp').querySelectorAll('input')];
      boxes.forEach(b => b.disabled = true);
      setErr('otp', '');
      const st = q('#otp-status'); if (st) st.innerHTML = `${ic('loader', 'spin ic-14')} Đang kiểm tra…`;
      setTimeout(() => {
        const r = S.reset;
        if (!r) return;
        if (S.clock - r.sentAt > P.otpMin) r.dead = true;
        if (!r.dead && r.u && code === r.code) { S.cp = { u: r.u, via: 'otp', start: S.clock }; save(); goto('create-password'); return; }
        if (!r.dead) { r.wrong++; if (r.wrong >= P.otpMaxWrong) r.dead = true; }
        save();
        renderScreen('otp-entry');
        if (!S.reset.dead) setErr('otp', MSG.e011(P.otpMaxWrong - S.reset.wrong));
      }, 500);
    }

    // 3.5 Link đặt lại hết hạn (web)
    W['reset-link-expired'] = () => wAuth(`<span class="ic-circle">${ic('clock', 'ic-24')}</span><p class="lead">${MSG.e013}</p>
      <button class="btn btn-primary btn-block" onclick="R.prefill=S.resetName;goto('reset-request')" data-cmt="reset-link-expired.resend">Gửi lại link</button>
      <button class="btn btn-secondary btn-block" onclick="R.prefill=S.resetName;goto('contact-it')">Liên hệ IT</button>`, { center: true });

    // 4.1 Liên hệ IT
    const ciBody = () => `<p class="hint">Dùng khi không có email hoặc không nhận được email.</p>${field({ name: 'cname', label: 'Tên tài khoản', ph: 'Tên tài khoản', auto: 'username', value: R.prefill || '' })}`;
    W['contact-it'] = () => wAuth(`<h1 class="h-auth">Liên hệ IT</h1>${ciBody()}<button class="btn btn-primary btn-block" data-submit onclick="doContactIt(this)" data-cmt="contact-it.submit">Xác nhận</button>`, { back: "goto('forgot-options')" });
    M['contact-it'] = () => mScreen({ back: "goto('forgot-options')", title: 'Liên hệ IT', body: ciBody(), bottom: `<button class="btn btn-primary btn-block" data-submit onclick="doContactIt(this)" data-cmt="contact-it.submit">Xác nhận</button>` });
    function doContactIt(btn){
      if (!reqCheck(['cname'])) return;
      const name = val('cname').trim(), k = keyOf(name);
      busy(btn, 'Đang gửi…', () => {
        if (offline()) return;
        const until = rateLimited(k);
        if (until) { setErr('cname', MSG.e014(until)); return; }
        if (S.sim.emailDown) { toast(MSG.e015, 'error'); return; }     // BR-021: không tự gửi lại
        recordSend(k); S.contactName = name; save(); goto('contact-it-sent');
      });
    }
    // 4.2 Đã gửi yêu cầu
    W['contact-it-sent'] = () => wAuth(`<span class="ic-circle ok">${ic('circle-check', 'ic-24')}</span><h1 class="h-auth">Đã gửi yêu cầu</h1><p class="lead">Bộ phận hỗ trợ sẽ đặt lại mật khẩu và gửi mật khẩu tạm cho bạn.</p><button class="btn btn-primary btn-block" onclick="goto('sign-in')" data-cmt="contact-it-sent.back">Quay về đăng nhập</button>`, { center: true });

    function homeApp(){

        body: `${offlineBanner()}<div class="m-greet">${avatar(user, 44)}<div class="grow"><div class="sup">Xin chào,</div><div style="font-size:17px;font-weight:600">${esc(user.name)}</div>${subLine}</div>
            <button class="m-iconbtn" aria-label="Tìm" onclick="protoNote('Tìm kiếm thuộc tính năng khác.')">${ic('search')}</button><button class="m-iconbtn" aria-label="Thông báo" onclick="protoNote('Thông báo thuộc tính năng khác.')">${ic('bell')}</button></div>
          <div class="m-card"><div class="empty" style="padding:16px 4px">${ic('house', 'ic-32')}<h3>Trang chủ</h3><p>Nội dung Trang chủ thuộc tính năng Không gian làm việc chung.</p></div></div>
          <div class="sk" style="height:96px;border-radius:22px" aria-hidden="true"></div>` });
    }
    function offlineBanner(){ return S.sim.offline ? `<div class="banner" role="status" data-offline>${ic('wifi-off')}<span>Không có kết nối internet</span></div>` : ''; }
    W['home'] = homeWeb;
    M['home'] = homeApp;
    M['home-partner'] = () => mScreen({ bg: 'body', nav: 'home',
      body: `${offlineBanner()}<div class="m-greet"><span class="avatar" style="width:44px;height:44px">${ic('fuel', 'ic-20')}</span><div class="grow"><div class="sup">Xin chào,</div><div style="font-size:17px;font-weight:600">${esc(DEMO.oilStation.name)}</div></div><button class="m-iconbtn" aria-label="Thông báo" onclick="protoNote('Thông báo thuộc tính năng khác.')">${ic('bell')}</button></div>
        <div class="m-card"><div class="empty" style="padding:16px 4px">${ic('fuel', 'ic-32')}<h3>Home đối tác</h3><p>Nội dung Home đối tác thuộc tính năng Cấp dầu.</p></div></div>` });

    // 5.1 Thông tin tài khoản — tách 3 khối: Hồ sơ (thông tin) · Cài đặt · Bảo mật và hoạt động (hành động)
    const LANGS = { vi: 'Tiếng Việt', en: 'Tiếng Anh' };
    function profileRows(u){
      const p = DEMO.profiles[u.u] || {};
      const br = u.branches.map(b => DEMO.branches[b].name).join(', ') || '-';
      const rows = [['Họ và tên', u.name], ['Mã nhân viên', p.code || 'N/A'], ['Tên tài khoản', u.u], ['Chức vụ', p.title || '-'], ['Phòng ban', p.dept || '-'], ['Email', u.email || '-'], ['Số điện thoại', p.phone || '-'], ['Chi nhánh được cấp', br]];
      return `<dl class="fgrid">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
        <span class="sup">${ic('info', 'ic-14')}Chỉ đọc. Dữ liệu mẫu — các trường hồ sơ chốt ở Hồ sơ nhân sự.</span>`;
    }
    function avatarStatus(){
      return `${R.uploading ? `<span class="sup">${ic('loader', 'spin ic-14')} Đang tải ảnh lên…</span>` : ''}
        <input type="file" id="f-avatar" accept=".jpg,.jpeg,.png,image/jpeg,image/png" hidden onchange="onAvatar(this)">${errSlot('avatar')}`;
    }
    function settingRows(){
      const v = S.lang[me().u] || 'vi';
      if (dev() === 'web') return `<div class="set-row"><span class="grow"><span class="t">Ngôn ngữ</span><br><span class="sup">Áp dụng cho Web và ứng dụng</span></span>
          <div class="fld" data-f="lang" style="width:220px"><div class="sel-wrap"><select id="f-lang" class="inp" aria-label="Ngôn ngữ" onchange="setLang(this.value)" ${R.langSaving ? 'disabled' : ''} data-cmt="account-info.language">${Object.entries(LANGS).map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${ic('chevron-down', 'ic-14')}</div></div></div>
          ${R.langSaving ? `<span class="sup">${ic('loader', 'spin ic-14')} Đang lưu…</span>` : ''}`;
      return `<button class="m-row" onclick="openLangSheet()" ${R.langSaving ? 'disabled' : ''} data-cmt="account-info.language">${ic('globe', 'ic-20')}<span class="grow">Ngôn ngữ</span><span class="m-val">${R.langSaving ? 'Đang lưu…' : LANGS[v]}</span>${ic('chevron-right')}</button>`;
    }
    function securityRows(partner){
      const row = (k, icon, label, act) => dev() === 'web'
        ? `<button class="row-link" onclick="${act}" data-cmt="${k}">${ic(icon)}<span>${label}</span>${ic('chevron-right')}</button>`
        : `<button class="m-row" onclick="${act}" data-cmt="${k}">${ic(icon, 'ic-20')}<span class="grow">${label}</span>${ic('chevron-right')}</button>`;
      const slug = partner ? 'oil-station-account' : 'account-info';
      return row(slug + '.change-password', 'key-round', 'Đổi mật khẩu', "goto('change-password')")
        + (partner ? '' : row('account-info.history', 'history', 'Lịch sử hoạt động', "goto('activity-history')"));
    }
    // Hàng đầu hồ sơ: Đổi mật khẩu (Secondary) | Đăng xuất. Ngôn ngữ + Lịch sử nằm ở khối Cài đặt dưới hồ sơ.
    function webActions(){
      return `<button class="btn btn-ghost" onclick="goto('activity-history')" data-cmt="account-info.history">${ic('history')}Lịch sử hoạt động</button>
        <button class="btn btn-secondary" onclick="goto('change-password')" data-cmt="account-info.change-password">${ic('key-round')}Đổi mật khẩu</button>`;
    }
    function webSettings(){
      const v = S.lang[me().u] || 'vi';
      return `<div class="set-row"><span class="grow"><span class="t">Ngôn ngữ</span><br><span class="sup">Áp dụng cho Web và ứng dụng</span></span>
          <div class="lang-wrap"><button class="btn btn-secondary" onclick="R.langMenu=!R.langMenu;renderScreen(curSlug());const m=q('.lang-menu button');if(m)m.focus()" aria-haspopup="menu" aria-expanded="${!!R.langMenu}" ${R.langSaving ? 'disabled' : ''} data-cmt="account-info.language">${R.langSaving ? ic('loader', 'spin') + 'Đang lưu…' : ic('globe') + LANGS[v]}${ic('chevron-down', 'ic-14')}</button>
          ${R.langMenu ? `<div class="menu lang-menu" role="menu">${Object.keys(LANGS).map(k => `<button role="menuitemradio" aria-checked="${k === v}" onclick="R.langMenu=false;${k === v ? "renderScreen(curSlug())" : `setLang('${k}')`}">${k === v ? ic('check') : '<span style="width:16px"></span>'}${LANGS[k]}</button>`).join('')}</div>` : ''}</div></div>`;
    }
    // Đăng xuất: app = Secondary chữ đỏ rộng hết; web = Ghost chữ đỏ, tách khỏi nhóm tác vụ bằng vạch
    const signOutBtn = slug => dev() === 'app'
      ? `<button class="btn btn-destructive btn-block" onclick="askSignOut()" data-cmt="${slug}.sign-out">${ic('log-out')}Đăng xuất</button>`
      : `<span class="vsep" aria-hidden="true"></span><button class="btn btn-ghost btn-danger-text" onclick="askSignOut()" data-cmt="${slug}.sign-out">${ic('log-out')}Đăng xuất</button>`;
    function accountWeb(bg){
      const u = me(); const slug = 'account-info';
      let body;
      if (!bg && needLoad(slug)) body = `<div class="w-form">${skeleton(3)}</div>`;
      else if (!bg && R.loaded[slug] === 'err') body = `<div class="w-form">${loadErr(slug)}</div>`;
      else {
        const p = DEMO.profiles[u.u] || {};
        body = `<div class="w-form">
        <section class="card emp-head">
          <div class="emp-top">
            <div class="ava-wrap">${avatar(u, 64)}<button class="ava-cam sm" aria-label="Đổi ảnh đại diện" onclick="q('#f-avatar').click()" ${R.uploading ? 'disabled' : ''} data-cmt="account-info.avatar">${ic('camera', 'ic-14')}</button></div>
            <div class="grow"><div class="emp-name">${esc(u.name)}</div>
              <div class="emp-meta">${esc(p.code || 'N/A')} · ${esc(p.title || '-')} · ${esc(branchLabel())}</div></div>
            <div class="emp-acts">${webActions()}${signOutBtn('account-info')}</div>
          </div>${avatarStatus()}
        </section>
        <section class="card"><h2 class="h3">Thông tin cơ bản</h2>${profileRows(u)}</section>
        <section class="card"><h2 class="h3">Cài đặt</h2>${webSettings()}</section></div>`;
      }
      return shell('account', `<b>Thông tin tài khoản</b>`, `<div class="acct-page"><div class="page-head"><h1 class="h1">Thông tin tài khoản</h1></div>${body}</div>`);
    }
    function accountApp(bg){
      const u = me(); const slug = 'account-info';
      let body;
      if (!bg && needLoad(slug)) body = skeleton(4);
      else if (!bg && R.loaded[slug] === 'err') body = loadErr(slug);
      else body = `<div class="m-card profile-head">
            <div class="ava-wrap">${avatar(u, 88)}<button class="ava-cam" aria-label="Đổi ảnh đại diện" onclick="openAvatarSheet()" ${R.uploading ? 'disabled' : ''} data-cmt="account-info.avatar">${ic('camera', 'ic-20')}</button></div>
            <div style="font-size:17px;font-weight:600">${esc(u.name)}</div><div class="sup">${esc(u.u)}</div>${avatarStatus()}</div>
          <div class="m-sec">Hồ sơ</div><div class="m-card">${profileRows(u)}</div>
          <div class="m-sec">Cài đặt</div><div class="m-card rows">${settingRows()}</div>
          <div class="m-sec">Bảo mật và hoạt động</div><div class="m-card rows">${securityRows(false)}</div>
          ${signOutBtn('account-info')}`;
      return mScreen({ bg: 'body', nav: 'acct', title: 'Tài khoản', body });
    }
    W['account-info'] = () => accountWeb(false);
    M['account-info'] = () => accountApp(false);
    function sheetList(items){
      return `<div class="sheet-list">${items.map((it, i) => `<button class="m-row" data-sheet-i="${i}">${ic(it.icon, 'ic-20')}<span class="grow">${esc(it.label)}</span>${it.on ? ic('check', 'ic-20') : ''}</button>`).join('')}</div>`;
    }
    function openAvatarSheet(){
      const pick = () => { closeOverlay(); q('#f-avatar').click(); };
      openOverlay({ sheet: true, title: 'Ảnh đại diện', desc: `JPG, PNG · tối đa ${P.avatarMB} MB`, actions: [],
        body: sheetList([{ icon: 'image', label: 'Thư viện ảnh' }, { icon: 'camera', label: 'Chụp ảnh' }, { icon: 'file-text', label: 'Tệp' }]),
        onItem: () => pick() });
    }
    function openLangSheet(){
      const v = S.lang[me().u] || 'vi'; const keys = Object.keys(LANGS);
      openOverlay({ sheet: true, title: 'Ngôn ngữ', actions: [],
        body: sheetList(keys.map(k => ({ icon: 'globe', label: LANGS[k], on: k === v }))),
        onItem: i => { closeOverlay(); if (keys[i] !== v) setLang(keys[i]); } });
    }
    function onAvatar(inp){
      const f = inp.files && inp.files[0]; if (!f) return;
      setErr('avatar', '');
      if (!/\.(jpe?g|png)$/i.test(f.name)) { setErr('avatar', MSG.c006); inp.value = ''; return; }
      if (f.size > P.avatarMB * 1024 * 1024) { setErr('avatar', MSG.e016); inp.value = ''; return; }
      R.uploading = true; renderScreen(curSlug());
      const rd = new FileReader();
      rd.onload = () => setTimeout(() => {
        R.uploading = false;
        if (S.sim.offline) { renderScreen(curSlug()); toast(MSG.c009, 'error'); return; }
        R.avatar[me().u] = rd.result; addHistory(me().u, 'image', 'Đã cập nhật ảnh đại diện'); save();
        renderScreen(curSlug()); toast('Đã cập nhật ảnh đại diện.');
      }, 800);
      rd.readAsDataURL(f);
    }
    function setLang(v){
      const u = me();
      R.langSaving = true; renderScreen(curSlug());
      setTimeout(() => {
        R.langSaving = false;
        if (S.sim.offline) { renderScreen(curSlug()); toast(MSG.c009, 'error'); return; }
        S.lang[u.u] = v; addHistory(u.u, 'globe', 'Đã đổi ngôn ngữ sang ' + LANGS[v]); save();
        renderScreen(curSlug()); toast('Đã đổi ngôn ngữ.');
      }, 600);
    }

    // 5.2 Lịch sử hoạt động
    function histRange(){
      const today = at(S.clock); const first = new Date(today.getTime() - P.historyDays * 86400000);
      return { min: ymd(first), max: ymd(today) };
    }
    function histBody(){
      const slug = 'activity-history';
      if (needLoad(slug)) return skeleton(4);
      if (R.loaded[slug] === 'err') return loadErr(slug, 'Không tải được lịch sử');
      const r = histRange(); const from = R.hFrom || r.min, to = R.hTo || r.max;
      const all = (S.history[me().u] || []).filter(e => e.at.slice(0, 10) >= r.min);
      const list = all.filter(e => e.at.slice(0, 10) >= from && e.at.slice(0, 10) <= to);
      const filtered = !!(R.hFrom || R.hTo);
      const range = `<div class="toolbar" data-cmt="activity-history.range">
          ${dateField('hfrom', 'Từ ngày', from, r.min, to)}${dateField('hto', 'Đến ngày', to, from, r.max)}
          ${dev() === 'web' ? `<span class="hint" style="padding-bottom:6px">Trong ${P.historyDays} ngày gần nhất</span>` : ''}</div>`;
      let content;
      if (all.length === 0) content = `<div class="empty">${ic('history', 'ic-32')}<h3>Chưa có hoạt động nào.</h3></div>`;
      else if (list.length === 0) content = `<div class="empty">${ic('search', 'ic-32')}<h3>Không có hoạt động trong khoảng ngày đã chọn.</h3><button class="btn btn-secondary" onclick="R.hFrom=null;R.hTo=null;renderScreen('activity-history')">Xoá bộ lọc</button></div>`;
      else content = `<ul class="tl">${list.map(e => `<li><span class="tl-ic">${ic(e.icon)}</span><span class="grow">${esc(e.text)}<br><span class="tl-time">${showStamp(e.at)}</span></span></li>`).join('')}</ul>`;
      return range + (dev() === 'web' ? `<section class="card">${content}</section>` : `<div class="m-card">${content}</div>`) + (filtered && list.length ? '' : '');
    }
    function dateField(name, label, v, min, max){
      return `<div class="fld" data-f="${name}">${dev() === 'web' ? `<label class="fld-label" for="f-${name}">${label}</label>` : ''}<div class="fld-ctl">${dev() === 'app' ? `<label class="fld-label" for="f-${name}">${label}</label>` : ''}<input type="date" id="f-${name}" class="inp" value="${v}" min="${min}" max="${max}" onchange="onRange('${name}', this.value)"></div></div>`;
    }
    function onRange(n, v){
      const r = histRange(); if (!v) v = n === 'hfrom' ? r.min : r.max;
      v = v < r.min ? r.min : v > r.max ? r.max : v;                        // chặn ngoài 90 ngày, không có câu lỗi
      if (n === 'hfrom') { R.hFrom = v; if (R.hTo && R.hTo < v) R.hTo = v; } else { R.hTo = v; if (R.hFrom && R.hFrom > v) R.hFrom = v; }
      renderScreen('activity-history');
    }
    W['activity-history'] = () => shell('account', `Cài đặt ${ic('chevron-right', 'ic-14')} Thông tin tài khoản ${ic('chevron-right', 'ic-14')} <b>Lịch sử hoạt động</b>`,
      `<div><button class="btn btn-ghost" style="padding-left:4px" onclick="goto('account-info')">${ic('arrow-left')}Thông tin tài khoản</button></div><div class="page-head"><h1 class="h1">Lịch sử hoạt động</h1></div><div class="w-form">${histBody()}</div>`);
    M['activity-history'] = () => mScreen({ back: "goto('account-info')", title: 'Lịch sử hoạt động', bg: 'body', body: histBody() });

    // 5.3 Tài khoản cây dầu (app)
    M['oil-station-account'] = (bg) => {
      const slug = 'oil-station-account', o = DEMO.oilStation;
      let body;
      if (!bg && needLoad(slug)) body = skeleton(4);
      else if (!bg && R.loaded[slug] === 'err') body = loadErr(slug);
      else {
        const dep = S.sim.contract === 'deposit';
        const month = at(S.clock); const ml = p2(month.getMonth() + 1) + '/' + month.getFullYear();
        body = `<div class="m-card profile-head"><span class="avatar" style="width:88px;height:88px;margin-bottom:6px">${ic('fuel', 'ic-32')}</span><div style="font-size:17px;font-weight:600">${esc(o.name)}</div><div class="sup">Mã đối tác ${esc(o.code || 'N/A')}</div></div>
          <div class="m-sec">Thông tin cây dầu</div><div class="m-card"><dl class="kv"><dt>Nhà cung cấp</dt><dd>${esc(o.supplier)}</dd><dt>Người đại diện</dt><dd>${esc(o.rep)}</dd></dl></div>
          <div class="m-sec">Hạn mức tháng ${ml}</div><div class="m-card"><dl class="kv"><dt>Đã cấp</dt><dd>${fmtNum(o.used)} lít</dd><dt>Còn lại</dt><dd>${fmtNum(o.quota - o.used)} lít</dd></dl></div>
          <div class="m-sec">Hợp đồng</div><div class="m-card rows"><dl class="kv"><dt>Loại hợp đồng</dt><dd>${dep ? 'Đặt cọc' : 'Tín chấp'}</dd>${dep ? `<dt>Số tiền đặt cọc</dt><dd>${fmtNum(o.deposit)} đ</dd>` : ''}</dl>
            ${dep ? `<button class="m-row" onclick="protoNote('Nội dung mục Hợp đồng chưa có đặc tả (OQ ở Cây dầu).')">${ic('file-text', 'ic-20')}<span class="grow">Xem hợp đồng</span>${ic('chevron-right')}</button>` : ''}</div>
          ${o.note ? `<div class="m-sec">Ghi chú</div><div class="m-card"><p>${esc(o.note)}</p></div>` : ''}
          <div class="m-sec">Cài đặt</div><div class="m-card rows">${settingRows()}</div>
          <div class="m-sec">Bảo mật</div><div class="m-card rows">${securityRows(true)}</div>
          ${signOutBtn('oil-station-account')}`;
      }
      return mScreen({ bg: 'body', nav: 'acct', title: 'Tài khoản', body });
    };

    // 6.1 Đổi mật khẩu
    function cpwFields(){
      return field({ name: 'old', label: 'Mật khẩu cũ', type: 'password', ph: 'Mật khẩu cũ', eye: true, auto: 'current-password' })
           + field({ name: 'new', label: 'Mật khẩu mới', type: 'password', ph: 'Mật khẩu mới', eye: true, auto: 'new-password', hintId: 'hint-new', after: `<span class="hint" id="hint-new">${MSG.policy}</span>` })
           + field({ name: 'confirm', label: 'Nhập lại mật khẩu mới', type: 'password', ph: 'Nhập lại mật khẩu mới', eye: true, auto: 'new-password' });
    }
    W['change-password'] = () => `<div class="bg-layer" inert aria-hidden="true">${accountWeb(true)}</div>
      <div class="ov"><div class="ov-box" role="dialog" aria-modal="true" aria-labelledby="cpw-t"><h2 class="ov-title" id="cpw-t">Đổi mật khẩu</h2>${cpwFields()}

    M['change-password'] = () => mScreen({ back: 'cancelCpw()', title: 'Đổi mật khẩu', body: cpwFields(), bottom: `<button class="btn btn-primary btn-block" data-submit onclick="doCpw(this)" data-cmt="change-password.submit">Xác nhận</button>` });

    function renderScreen(slug){

  // ════════════════════════════════════════════════════════════════════════

  // (1) khai báo tường minh
