<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog — Reverse SRS Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --color-primary: #262626;
      --color-primary-muted: #f1f1f1;
      --color-canvas: #ffffff;
      --color-surface: #fafafa;
      --color-surface-strong: #f3f3f5;
      --color-ink: #181a20;
      --color-muted: #707a8a;
      --color-hairline: #eaecef;
      --color-link: #2563eb;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-surface);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-hairline);
      padding: 24px 16px;
    }
    aside h2 { font-size: 14px; text-transform: uppercase; color: var(--color-muted); margin: 0 0 12px; letter-spacing: .03em; }
    aside nav ol, aside nav ul { list-style: none; padding: 0; margin: 0; }
    .toc-controls { display: flex; gap: 6px; margin-bottom: 12px; }
    .toc-controls button {
      flex: 1; font-size: 11px; color: var(--color-muted); background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toc-controls button:hover { background: var(--color-surface-strong); color: var(--color-ink); }
    /* TOC nested đa cấp (H2→H3→H4) — thụt lề + cỡ chữ theo cấp. */
    aside nav li.toc-item { list-style: none; }
    aside nav li.toc-item > .toc-row { display: flex; align-items: flex-start; border-radius: 6px; }
    aside nav li.toc-item > .toc-row:hover { background: var(--color-surface); }
    aside nav li.toc-item > .toc-row > a { flex: 1; display: block; text-decoration: none; padding: 5px 8px; line-height: 1.4; }
    aside nav .toc-children { margin: 0; padding: 0; }
    aside nav li.collapsed > .toc-children { display: none; }
    /* Cấp 2 (section chính) */
    aside nav > li.toc-item { margin-top: 12px; }
    aside nav > li.toc-item:first-child { margin-top: 0; }
    aside nav > li.toc-item[data-level="2"] > .toc-row > a { font-weight: 600; font-size: 13px; color: var(--color-ink); }
    aside nav > li.toc-item[data-level="2"].active > .toc-row { background: var(--color-primary-muted); }
    /* Cấp 3 */
    aside nav li.toc-item[data-level="3"] { margin-left: 12px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="3"] > .toc-row > a { font-size: 12px; color: var(--color-muted); }
    /* Cấp 4 */
    aside nav li.toc-item[data-level="4"] { margin-left: 22px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="4"] > .toc-row > a { font-size: 11.5px; color: var(--color-muted); opacity: .9; }
    aside nav li.toc-item.active > .toc-row > a { color: var(--color-ink); font-weight: 600; }
    aside nav .toggle { cursor: pointer; user-select: none; color: var(--color-muted); width: 14px; flex: 0 0 14px; text-align: center; padding-top: 5px; transition: transform .15s; }
    aside nav .toggle.leaf { visibility: hidden; }
    aside nav li.collapsed > .toc-row > .toggle { transform: rotate(-90deg); }
    main { padding: 40px 60px; max-width: 1100px; }
    main h1 { font-size: 32px; border-bottom: 2px solid var(--color-ink); padding-bottom: 12px; }
    main h2 { font-size: 24px; margin-top: 40px; border-bottom: 1px solid var(--color-hairline); padding-bottom: 6px; }
    main h3 { font-size: 18px; margin-top: 28px; color: var(--color-ink); }
    main h4 { font-size: 16px; margin-top: 20px; }
    main p, main li { font-size: 14px; }
    main code { font-family: var(--font-mono); font-size: 13px; background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }
    main pre { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 13px; }
    main pre.mermaid { background: var(--color-canvas); text-align: center; }
    main .mermaid svg { cursor: zoom-in; transition: filter .15s; max-width: 100%; }
    main img.embedded-img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
    main .mermaid svg:hover { filter: drop-shadow(0 0 6px rgba(252, 213, 53, .5)); }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
    main th, main td { border: 1px solid var(--color-hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
    main th { background: var(--color-surface); font-weight: 600; }
    main a { color: var(--color-link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main hr { border: none; border-top: 1px solid var(--color-hairline); margin: 32px 0; }
    main blockquote { border-left: 4px solid var(--color-primary); margin: 16px 0; padding: 8px 16px; background: var(--color-surface); color: var(--color-muted); }
    main details.inline-screen { border: 1px solid var(--color-hairline); border-radius: 8px; padding: 0; margin: 16px 0; background: var(--color-canvas); overflow: hidden; }
    main details.inline-screen[open] { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    main details.inline-screen > summary { cursor: pointer; padding: 12px 16px; background: var(--color-surface); font-size: 14px; user-select: none; border-bottom: 1px solid transparent; }
    main details.inline-screen[open] > summary { border-bottom-color: var(--color-hairline); }
    main details.inline-screen > summary:hover { background: var(--color-surface-strong); }
    main details.inline-screen > summary code { background: var(--color-canvas); border: 1px solid var(--color-hairline); }
    main details.inline-screen > *:not(summary) { padding-left: 16px; padding-right: 16px; }
    main details.inline-screen pre { margin: 8px 0; }
    .wf-src-tag { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
    /* HTML wireframe embed — CSS chi tiết đến từ style GỐC của file wireframe (scope .wf-embed,
       xem extract_scoped_wireframe_css) nên font-size/spacing GIỐNG bản /wireframe-html. Ở đây chỉ
       reset kế thừa + layout container để không bị body preview đè. */
    main .wf-embed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; font-size: 12px; line-height: 1.4; }
    main .wf-embed * { box-sizing: border-box; }
    main .wf-embed .wf-screen { display: inline-block; vertical-align: top; max-width: 100%; }
    main .wf-embed .wf-step-badge { display: none; }
    .meta { color: var(--color-muted); font-size: 13px; margin-bottom: 24px; }
    /* Cover page (export) — khối bìa căn giữa, viền dưới ngăn cách với nội dung. */
    main .cover { text-align: center; padding: 48px 24px 40px; margin-bottom: 24px; border-bottom: 2px solid var(--color-hairline); }
    main .cover h1 { border: none; font-size: 34px; }
    main .cover h2 { border: none; color: var(--color-muted); font-weight: 500; font-size: 17px; margin-top: 4px; }
    main .cover p { font-size: 15px; line-height: 2; }

    /* Mermaid zoom modal */
    .mermaid-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; animation: fadeIn 0.2s ease-out;
    }
    .mermaid-modal.open { display: flex; }
    .modal-svg {
      width: 95vw; height: 90vh; border-radius: 8px;
      background: var(--color-canvas); padding: 2rem; box-sizing: border-box;
      overflow: hidden;
    }
    .modal-svg svg { display: block; max-width: none !important; max-height: none !important; width: 100% !important; height: 100% !important; }
    .modal-toolbar {
      position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;
    }
    .modal-toolbar button {
      width: 40px; height: 40px; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: 6px; font-size: 1.2rem; cursor: pointer; color: var(--color-ink);
    }
    .modal-toolbar button:hover { background: var(--color-surface); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    footer { padding: 24px 60px; border-top: 1px solid var(--color-hairline); color: var(--color-muted); font-size: 13px; background: var(--color-canvas); }
    footer code { font-family: var(--font-mono); background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-hairline); }
      main { padding: 24px; }
      footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h2>Product Catalog</h2>
      <div class="meta">Reverse SRS Preview · 2026-10-15</div>
      <nav>
        <div class="toc-controls">
          <button type="button" onclick="setAllTocCollapsed(false)">Expand all</button>
          <button type="button" onclick="setAllTocCollapsed(true)">Collapse all</button>
        </div>
        <ol id="toc"></ol>
      </nav>
    </aside>
    <main id="content"></main>
  </div>

  <!-- Mermaid zoom modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div class="modal-toolbar">
      <button onclick="modalPanZoom && modalPanZoom.zoomIn()" title="Zoom in">＋</button>
      <button onclick="modalPanZoom && modalPanZoom.zoomOut()" title="Zoom out">－</button>
      <button onclick="modalPanZoom && (modalPanZoom.resetZoom(), modalPanZoom.center(), modalPanZoom.fit())" title="Reset">⟲</button>
      <button onclick="closeMermaidModal()" title="Close (ESC)">✕</button>
    </div>
    <div class="modal-svg"></div>
  </div>

  <footer><p>Workflow: edit MD source → save → chạy <code>python3 _scripts/build-reverse-preview.py product-catalog</code> để regen → refresh browser.</p></footer>

  <script>
    const OFFLINE = false;
    let modalPanZoom = null;

    // === Markdown parsing (CHỈ online — offline đã render sẵn server-side) ===
    if (!OFFLINE) {
      const MD_SOURCE = "# Product Catalog — Reverse SRS Preview\n\n> Bản tái lập từ nguồn · Generated 2026-10-15\n\n\n> Tái lập (chưa duyệt) · `draft` · **✅109 🔵16 🟡10**  \n> Nhãn: ✅ chắc chắn · 🔵 suy đoán · 🟡 cần xác nhận\n\n## <a id=\"sec-spec\"></a>1. Đặc tả tái lập (spec 12 Mục)\n\n> Trạng thái: `draft` (tái lập, chưa duyệt). Nhãn: ✅ chắc chắn · 🔵 suy đoán · 🟡 cần xác nhận.\n\n### 0. Truy vết nguồn & độ tin cậy\n\n- **Module:** Danh mục › Hàng hoá (gắn tạm theo DEC-079, chốt ở PRD).\n- **Nguồn:** Tài liệu SRS - ERP Delta 3.0 (Web) (bản 30/9/2026) — chi tiết ở `reverse-sources.md`.\n- **Câu hỏi mở / khác biệt:** xem `reverse-gaps.md`.\n- **Độ tin cậy:** ✅ 109 · 🔵 16 · 🟡 10 (đếm trên các dòng bảng).\n- **Trạng thái:** tái lập từ SRS cũ, **CHƯA duyệt**. ✅ nghĩa là \"SRS cũ ghi rõ\", không có nghĩa \"hệ thống đang chạy đúng như thế\".\n\n| Phần | Nguồn đã đọc |\n|---|---|\n| Dịch vụ kỹ thuật, phụ tùng vật tư, công cụ dụng cụ, lốp, ắc quy | SRS Web tr.282–457 |\n\n### 1. Scope\n\nPhần này đặc tả 5 danh mục hàng hoá và dịch vụ kỹ thuật của phần mềm xưởng (PMX) trong Module Xưởng, Epic Danh mục: Dịch vụ kỹ thuật (DVKT), Phụ tùng vật tư (PTVT), Công cụ dụng cụ (CCDC), Lốp, Ắc quy. Cả 5 danh mục dùng chung một bộ 5 use case (Xem danh sách, Xem thông tin, Tạo đề xuất tạo mới, Huỷ đề xuất cấp mới, Phê duyệt/Từ chối đề xuất cấp mới) và chung một lưu đồ trạng thái 4 trạng thái (Chờ phê duyệt, Đã huỷ, Đã từ chối, Đã phê duyệt) ✅ [SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục]. Một bản ghi danh mục chỉ được tạo thông qua \"đề xuất tạo mới\" và có hiệu lực (có mã) sau khi được phê duyệt ✅ [SRS Web tr.298 — UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật; SRS Web tr.319 — UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật]. Nguồn của phần này chỉ gồm SRS Web (không có SRS Mobile) ✅ [SRS Web tr.282 — Module 1 Xưởng].\n\nSpec viết theo cách \"nhóm cùng khuôn\": FR, BR, use case, flow viết một lần cho cả khuôn; mọi khác biệt giữa 5 danh mục nằm ở bảng \"Khác biệt theo danh mục\" ngay sau bảng FR (Mục 3).\n\nNgoài phạm vi:\n- Chức năng Export, Import, Tuỳ chỉnh cột, Bộ lọc, phân trang, Thông báo, Lịch sử hoạt động ở mức chung — nguồn chỉ dẫn \"xem Common Rules\" nên chi tiết nằm ngoài phần này ✅ [SRS Web tr.290 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web tr.286 — 03.01 Thông báo & Lịch sử hoạt động].\n- Danh mục Feature 03.02 (nếu có) không nằm trong lát này; nguồn nhảy từ 03.01 sang 03.03 🟡 [SRS Web tr.285 — Feature 03.01 Dịch vụ kỹ thuật; SRS Web tr.322 — Feature 03.03 Phụ tùng vật tư].\n- Phân quyền chi tiết theo vai trò (nguồn ghi \"chưa tính phân quyền\") ✅ [SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục].\n- Nơi các bản ghi danh mục đã phê duyệt được dùng (lệnh sửa chữa, kho, báo giá…) — nguồn không nói trong phần này 🟡.\n- Chỉnh sửa bản ghi đã phê duyệt, ngừng dùng, xoá bản ghi đã phê duyệt — nguồn không có (xem Gap vòng đời danh mục ở gaps.md).\n- Danh mục áp theo từng xưởng hay dùng chung toàn công ty: ảnh có bộ chọn xưởng nhưng nguồn không nói (OQ-25).\n- Userflow, wireframe, prototype, API, user story không sinh theo brief reverse.\n\n### 2. Actors & Stakeholders\n\n| Actor | Loại (người/hệ thống/ngoài) | Mục tiêu | Trong scope? | Nguồn | Nhãn |\n|-------|-----------------------------|----------|--------------|-------|------|\n| Người dùng phần mềm xưởng | người | Xem danh mục, xem chi tiết, tạo đề xuất tạo mới, huỷ đề xuất, phê duyệt/từ chối đề xuất (mỗi chức năng cần được phân quyền riêng) | Có | SRS Web tr.288 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web tr.298 — UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật; SRS Web tr.313 — UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật | ✅ |\n| Người dùng có quyền phê duyệt/từ chối yêu cầu cấp mới | người | Nhận thông báo khi có yêu cầu cấp mới chờ duyệt hoặc bị huỷ; phê duyệt hoặc từ chối | Có | SRS Web tr.287 — 03.01 Thông báo & Lịch sử hoạt động (Dịch vụ kỹ thuật) | ✅ |\n| Người dùng đã tạo yêu cầu cấp mới | người | Nhận thông báo khi yêu cầu của mình được phê duyệt hoặc bị từ chối; xoá hoặc tạo lại yêu cầu | Có | SRS Web tr.287 — 03.01 Thông báo & Lịch sử hoạt động (Dịch vụ kỹ thuật) | ✅ |\n| Hệ thống PMX | hệ thống | Kiểm tra dữ liệu, đổi trạng thái, sinh mã, gửi thông báo, ghi lịch sử hoạt động | Có | SRS Web tr.298 — hình lưu đồ UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật | ✅ |\n\n### 3. Functional Requirements (FR)\n\n| ID | Title | Description | Priority | Verify by | Nguồn | Nhãn |\n|----|-------|-------------|----------|-----------|-------|------|\n| FR-product-catalog-001 | Mở danh sách danh mục | Người dùng đã đăng nhập và được phân quyền chức năng Xem của danh mục: vào Dashboards, chọn tab Danh mục ở thanh điều hướng, chọn sub-tab của danh mục (Dịch vụ kỹ thuật / Phụ tùng vật tư / Công cụ dụng cụ / Lốp / Ắc quy); hệ thống hiển thị màn hình Danh sách của danh mục đó. | — | demo | SRS Web tr.288, 325, 361, 394, 427 — Xem danh mục (UC03.01.01, UC03.03.01, UC03.04.01, UC03.05.01, UC03.06.01) | ✅ |\n| FR-product-catalog-002 | Tìm kiếm, nhóm, lọc danh sách | Thanh tìm kiếm cho phép tìm gần đúng trên dữ liệu toàn bảng. Nút Nhóm cho phép nhóm theo một số cột; nút Bộ lọc (sidebar) cho phép lọc theo cùng các cột đó. Cột nhóm/lọc khác nhau theo danh mục (xem bảng Khác biệt). Chi tiết bộ lọc xem Common Rules (ngoài phần này). | — | demo | SRS Web tr.289–290 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web tr.326–327 — UC03.03.01; SRS Web tr.362 — UC03.04.01; SRS Web tr.395–396 — UC03.05.01; SRS Web tr.428–429 — UC03.06.01 | ✅ |\n| FR-product-catalog-003 | Export, Import, Tuỳ chỉnh cột | Có nút Export, nút Import và nút Tuỳ chỉnh; cả 3 chỉ dẫn \"Xem mô tả phần Common Rules\". Nút Tuỳ chỉnh liệt kê \"tất cả các trường thông tin hiển thị\" (khác nhau theo danh mục, xem bảng Khác biệt). Với DVKT, mặc định hiển thị ban đầu là hiển thị tất cả và có thao tác reset số lượng thông tin và thứ tự về như danh sách gốc. | — | demo | SRS Web tr.290 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web t — ảnh UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web tr.395 — ảnh UC03.05.01 Xem danh mục lốp]\n- Màn Tạo mới và màn Thông tin là panel trượt từ bên phải, có icon X đóng, nền là màn Danh sách mờ ✅ [SRS Web tr.299 — ảnh UC03.01.03; SRS Web tr.307, 311 — ảnh UC03.01.03, UC03.01.04]. Popup xác nhận, popup lỗi là hộp thoại giữa màn.\n- Ở màn Thông tin: tiêu đề \"Thông tin {danh mục}\", tên bản ghi, huy hiệu trạng thái (Chờ phê duyệt / Đã huỷ / Đã từ chối / Đã phê duyệt), ở trạng thái Chờ phê duyệt có 3 nút xếp Phê duyệt (xanh), Từ chối (đỏ), Huỷ đề xuất (viền); mục \"Thông tin chung\" (2 cột trường), khung \"Ghi chú\"; nút tròn tải lại ở góc phải dưới (nguồn không mô tả); ở Đã phê duyệt có dòng \"ID: …\" dưới tên (mã). Lốp và Ắc quy ở Đã huỷ / Đã từ chối có nút \"…\" cạnh X; DVKT, PTVT, CCDC ở Đã huỷ / Đã từ chối không thấy nút \"…\" trên ảnh (Conflict) ✅ chữ nhìn thấy [SRS Web tr.307, 311, 317, 321 — ảnh UC03.01.03 đến UC03.01.05; SRS Web tr.415, 420 — ảnh UC03.05.04, UC03.05.05; SRS Web tr.447, 453 — ảnh UC03.06.04, UC03.06.05]\n- Danh sách DVKT ảnh có nút Nhóm, Bộ lọc, Export, Import, Tuỳ chỉnh, Tạo mới và cột \"…\" cho dòng Chờ phê duyệt / Đã từ chối, dòng Đã phê duyệt không có \"…\" ✅ [SRS Web tr.289 — ảnh UC03.01.01]. Nền các form Lốp / Ắc quy có thêm tab \"Chung\" và \"Chờ phê duyệt\" và cột \"Cỡ lốp\", \"Lốp gắn trên ph…\" không có trong bảng mô tả (Conflict, OQ-24) 🟡 [SRS Web tr.406 — ảnh UC03.05.03; SRS Web tr.438 — ảnh UC03.06.03]\n\nDanh sách (5 màn, cùng khuôn)\n- Danh sách dịch vụ kỹ thuật — xem danh mục — tìm kiếm, Nhóm, Bộ lọc, Export, Import, Tuỳ chỉnh, Tạo mới, bảng (8 cột), phân trang — ✅ [SRS Web tr.288–292 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; ảnh tr.289]\n- Danh sách phụ tùng vật tư — như trên, thêm cột Serial NCC (9 cột) — ✅ [SRS Web tr.325–328 — UC03.03.01 Xem danh mục phụ tùng vật tư]\n- Danh sách công cụ dụng cụ — cột ID (ảnh form tr.371 ghi \"Mã CCDC\"), Tên, Đơn vị tính, Loại CCDC, Serial NCC, Trạng thái, Hành động — ✅ [SRS Web tr.361–364 — UC03.04.01 Xem danh mục công cụ dụng cụ]\n- Danh sách lốp — 12 cột — ✅ [SRS Web tr.394–398 — UC03.05.01 Xem danh mục lốp; ảnh tr.395]\n- Danh sách ắc quy — 11 cột — ✅ [SRS Web tr.427–431 — UC03.06.01 Xem danh mục ắc quy]\n\nThông tin (xem) — mỗi danh mục 1 màn, 4 biến thể theo trạng thái\n- Thông tin dịch vụ kỹ thuật — nhãn: tên (tiêu đề), mã, tên, đơn vị tính, loại và tên phương tiện, hệ thống, trạng thái, ghi chú; nút \"…\", Huỷ đề xuất / Phê duyệt / Từ chối, Lịch sử hoạt động, icon đóng — ✅ [SRS Web tr.293–297 — UC03.01.02 Xem thông tin Dịch vụ kỹ thuật]. Biến thể Chờ phê duyệt ✅ [SRS Web tr.307]; Đã huỷ ✅ [SRS Web tr.311–312]; Đã từ chối ✅ [SRS Web tr.317–318]; Đã phê duyệt (không có hành động thêm) ✅ [SRS Web tr.321]. Ảnh có nhãn \"Mã PT - Tên PT\" và \"Hệ thống tổng thành xe\", không thấy nút Lịch sử hoạt động.\n- Thông tin phụ tùng vật tư — thêm Quản lý serial nhà sản xuất (ảnh) / \"Quản lý serial NCC\" (bảng) — ✅ [SRS Web tr.329–333 — UC03.03.02; biến thể tr.343, 347–348, 353–354, 357]\n- Thông tin công cụ dụng cụ — nhãn \"Phân loại\", \"Quản lý serial nhà sản xuất\" (ảnh), giá trị ảnh \"CCDC cầm tay\" — ✅ [SRS Web tr.365–369 — UC03.04.02; biến thể tr.375, 380–381, 386–387, 389–390]\n- Thông tin lốp — ảnh nhãn \"Đường kính (mm)\" và \"Độ rộng bề mặt (mm)\" ở Chờ phê duyệt, \"Đường kính lốp (mm)\" và \"Độ rộng bề mặt lốp(mm)\" ở các trạng thái khác — ✅ [SRS Web tr.399–403 — UC03.05.02; biến thể tr.411, 415–416, 420–421, 423]\n- Thông tin ắc quy — ảnh Chờ phê duyệt có thêm Cỡ ắc quy, Vị trí ắc quy, Lốp gắn trên phương tiện, Đơn giá (USD), Tỷ giá, Đơn giá (VND) không có trong bảng mô tả (Conflict, OQ-27); các trạng thái khác khớp bảng — ✅ chữ nhìn thấy [SRS Web tr.432–436 — UC03.06.02; biến thể tr.443, 447–448, 453–454, 456–457]\n\nTạo mới — mỗi danh mục 1 panel (nút \"Huỷ\" và \"Tạo mới\" ở chân panel, ghi chú có gợi ý \"Nhập thông tin ghi chú…\")\n- Tạo mới DVKT — 6 trường — ✅ [SRS Web tr.298–304 — UC03.01.03; ảnh tr.299]\n- Tạo mới PTVT — 7 trường; ảnh nhãn \"Quản lý serial nhà sản xuất\" — ✅ [SRS Web tr.334–340 — UC03.03.03; ảnh tr.335]\n- Tạo mới CCDC — 5 trường; ảnh hiện serial \"Có\" — ✅ [SRS Web tr.370–375 — UC03.04.03; ảnh tr.371]\n- Tạo mới lốp — 11 trường; ảnh nhãn \"Quản lý số serial NSX\" (disable, \"Có\"), \"Có săm/ không săm *\" (radio Có / Không) — ✅ [SRS Web tr.404–410 — UC03.05.03; ảnh tr.406]\n- Tạo mới ắc quy — 10 trường; ảnh nhãn \"Quản lý số serial NSX\" (disable, \"Có\"), \"Dung tích bình (Ah)\", \"Điện thế (V)\" — ✅ [SRS Web tr.437–442 — UC03.06.03; ảnh tr.438]\n\nPopup dùng chung (chữ nhìn thấy trên ảnh, giống nhau ở cả 5 danh mục; chữ chi tiết ở FR-product-catalog-024)\n- Hộp thoại \"Huỷ tạo mới?\" — nút Huỷ / Xác nhận — ✅ [SRS Web tr.303–304 — UC03.01.03; tr.339–340, 374–375, 410, 442]\n- Popup \"Huỷ đề xuất tạo mới?\" — nút Huỷ bỏ / Xác nhận — ✅ [SRS Web tr.309 — UC03.01.04; tr.345, 378, 413, 445]\n- Popup \"Từ chối đề xuất tạo mới?\" — ô lý do từ chối, nút Huỷ bỏ / Từ chối — ✅ [SRS Web tr.314 — UC03.01.05; tr.350, 383, 418, 450]\n- Popup \"Phê duyệt đề xuất tạo mới?\" — nút Huỷ / Phê duyệt (bảng mô tả ghi \"Huỷ bỏ\") — ✅ [SRS Web tr.318 — UC03.01.05; tr.354, 387, 421, 454]\n- Popup \"Xoá yêu cầu?\" — nút Huỷ / Xoá — ✅ [SRS Web tr.296, 312, 317 — UC03.01.02, .04, .05; tr.332, 348, 353, 368, 381, 386, 402, 416, 421, 435, 448, 453]\n- Popup lỗi \"Lỗi!\" nút \"Tải lại trang\" — ✅ [SRS Web tr.316, 319 — UC03.01.05; tr.352, 355, 385, 388, 419, 422, 452, 455]\n- Toast (ảnh DVKT): \"Huỷ đề xuất tạo mới thành công!\" và \"Từ chối tạo mới dịch vụ kỹ thuật thành công!\" — ✅ chữ nhìn thấy, lệch bảng mô tả (Conflict) [SRS Web tr.311, 317 — ảnh UC03.01.04, UC03.01.05]\n- Popup Lịch sử hoạt động — nguồn không có ảnh — ✅ [SRS Web tr.297 — UC03.01.02]\n- Thông báo (Notification) — nhấn dẫn đến màn Thông tin — ✅ [SRS Web tr.287 — 03.01 Thông báo & Lịch sử hoạt động]\n\nBáo cáo / dashboard: không có trong phần này.\n\n### 11. Constraints, Dependencies & Assumptions\n\n**Constraints (ràng buộc áp đặt):**\n\n| Ràng buộc | Source / Owner | Nguồn | Nhãn |\n|-----------|----------------|-------|------|\n| Bản ghi danh mục chỉ vào hệ thống qua đề xuất tạo mới và phê duyệt | Quy trình trong SRS cũ | SRS Web tr.284 — Lưu đồ trạng thái chung; SRS Web tr.298 — UC03.01.03 | ✅ |\n| Lốp và ắc quy bắt buộc quản lý serial nhà sản xuất | SRS cũ | SRS Web tr.406 — UC03.05.03; SRS Web tr.438 — UC03.06.03 | ✅ |\n| Tên bản ghi duy nhất | SRS cũ | SRS Web tr.299 — UC03.01.03 | ✅ |\n| Mỗi chức năng có quyền riêng (Xem, Tạo, Huỷ, Phê duyệt/Từ chối) | SRS cũ | SRS Web tr.288, 298, 308, 313 — UC03.01.01 đến UC03.01.05 | ✅ |\n\n**Dependencies (deliverable do bên khác sở hữu):**\n\n| Phụ thuộc | Owner | Blocks nếu chưa sẵn | Nguồn | Nhãn |\n|-----------|-------|---------------------|-------|------|\n| Common Rules (Bộ lọc, Export, Import, Tuỳ chỉnh, phân trang, Thông báo, Lịch sử hoạt động) | Tài liệu SRS Web phần Common Rules (ngoài lát) | Không thể đặc tả chi tiết các chức năng chung | SRS Web tr.290 — UC03.01.01; SRS Web tr.286 — 03.01 Thông báo & Lịch sử hoạt động | ✅ |\n| Danh mục phương tiện (loại, mã - tên) | Chưa rõ (nguồn chỉ đưa bảng đính kèm) | Không chọn được phương tiện khi tạo đề xuất | SRS Web tr.300, 304–307 — UC03.01.03 | 🔵 |\n| Hệ thống phân quyền | Chưa rõ | Không kiểm quyền các chức năng | SRS Web tr.288 — UC03.01.01 (điều kiện trước) | 🔵 |\n\n**Assumptions (tin là đúng — nêu hệ quả nếu sai):**\n\n| Giả định | Invalidate {X} nếu sai | Nguồn | Nhãn |\n|----------|------------------------|-------|------|\n| Yêu cầu cấp mới và bản ghi danh mục là cùng một bản ghi | Mô hình dữ liệu ([erd.md](#sec-erd)) và phân loại ChangeRequest | SRS Web tr.312 — UC03.01.04; SRS Web tr.284 — Lưu đồ trạng thái chung | 🔵 |\n| \"Tạo mới yêu cầu\" ở trạng thái Đã từ chối cũng đưa bản ghi về Chờ phê duyệt | FR-product-catalog-019, BR-product-catalog-019 | SRS Web tr.318 — UC03.01.05 | 🔵 |\n| Màn \"Xem chi tiết công cụ dụng cụ\" ở UC Tạo lốp / ắc quy là màn Thông tin lốp / ắc quy (chép nhầm) | FR-product-catalog-010 cho Lốp, Ắc quy | SRS Web tr.409 — UC03.05.03; SRS Web tr.441 — UC03.06.03 | 🔵 |\n| Mục Hệ thống truyền lực ở PTVT, Lốp, Ắc quy mang mã 2 (nguồn ghi 3, trùng mã mục kế) | BR-product-catalog-005 | SRS Web tr.301 — UC03.01.03; SRS Web tr.337 — UC03.03.03 | 🔵 |\n\n### 12. Open Questions\n\n> Danh sách đầy đủ OQ + Gap ở `reverse-gaps.md`. Dưới đây chỉ trích các OQ chặn tiến độ.\n\n- [ ] OQ-1: Tên duy nhất so sánh với những bản ghi nào (kể cả Đã huỷ / Đã từ chối / Chờ phê duyệt), có phân biệt hoa thường không? — BR-product-catalog-001\n- [ ] OQ-2: Ai được huỷ đề xuất: chỉ người tạo hay mọi người có quyền Huỷ đề xuất tạo mới? — FR-product-catalog-012\n- [ ] OQ-3: \"Tạo mới yêu cầu\" ở trạng thái Đã từ chối có đưa về Chờ phê duyệt không (nguồn ghi \"từ Đã huỷ về Chờ phê duyệt\" cả ở Đã từ chối; Ắc quy thiếu câu này)? — FR-product-catalog-019\n- [ ] OQ-4: Bản ghi Đã phê duyệt không có hành động nào: sửa, ngừng dùng, xoá thực hiện ở đâu? — vòng đời danh mục\n- [ ] OQ-5: Thông báo của Lốp và Ắc quy dùng [Mã] trong khi mã chỉ sinh sau khi phê duyệt; UC phê duyệt ghi [Tên]. Dùng giá trị nào? — FR-product-catalog-020\n- [ ] OQ-6: Mã phương tiện \"chạy từ 00 đến 37\" nhưng bảng có đến mã 38 (Trạm bơm dầu). — BR-product-catalog-022 đến BR-product-catalog-026\n- [ ] OQ-7: Độ dài mã PTVT (aab0xxccccc) và mã Lốp / Ắc quy (aab01ccc kèm ccccc) có thống nhất không? — BR-product-catalog-023, BR-product-catalog-025, BR-product-catalog-026\n- [ ] OQ-8: Cách xác định nhóm giá xx của DVKT cho từng xe tải (tải trọng 1 đến 5 tấn hay trên 5 đến 13 tấn). — BR-product-catalog-022\n- [ ] OQ-25: Danh mục (5 danh mục) áp theo từng xưởng hay dùng chung toàn công ty (ảnh có bộ chọn \"Xưởng Việt Trì\")? — Mục 10\n- [ ] OQ-23: Chữ toast chuẩn là chữ bảng mô tả hay chữ ảnh? — FR-product-catalog-012, FR-product-catalog-013\n\n\n## <a id=\"sec-flows\"></a>2. Luồng (Flows)\n\n### Flow: Xem danh sách danh mục\n\n> Nguồn: SRS Web tr.288 — hình lưu đồ UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; cùng khuôn ở SRS Web tr.325 — hình lưu đồ UC03.03.01; SRS Web tr.361 — hình lưu đồ UC03.04.01; SRS Web tr.394 — hình lưu đồ UC03.05.01; SRS Web tr.427 — hình lưu đồ UC03.06.01. Áp cho cả 5 danh mục (Dịch vụ kỹ thuật, Phụ tùng vật tư, Công cụ dụng cụ, Lốp, Ắc quy), chỉ khác tên sub-tab. ✅\n\n#### Sequence — Xem danh sách danh mục\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    ND->>HT: Mở Dashboards\n    HT-->>ND: Hiển thị màn Dashboards\n    ND->>HT: Chọn tab Danh mục ở thanh điều hướng\n    ND->>HT: Chọn sub-tab của danh mục\n    HT-->>ND: Hiển thị màn Danh sách danh mục\n```\n\n#### Activity — Xem danh sách danh mục\n```mermaid\nflowchart TD\n    A([\"Bắt đầu\"]) --> B[\"Hiển thị màn Dashboards\"]\n    B --> C[\"Người dùng chọn tab Danh mục ở Navigation bar\"]\n    C --> D[\"Người dùng chọn sub-tab của danh mục\"]\n    D --> E[\"Hiển thị màn Danh sách danh mục\"]\n    E --> F([\"Kết thúc\"])\n```\n\n### Flow: Xem thông tin danh mục\n\n> Nguồn: SRS Web tr.293 — hình lưu đồ UC03.01.02 Xem thông tin Dịch vụ kỹ thuật; cùng khuôn ở SRS Web tr.329 — hình lưu đồ UC03.03.02; SRS Web tr.365 — hình lưu đồ UC03.04.02; SRS Web tr.399 — hình lưu đồ UC03.05.02; SRS Web tr.432 — hình lưu đồ UC03.06.02. ✅\n\n#### Sequence — Xem thông tin danh mục\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    HT-->>ND: Hiển thị màn Danh sách\n    ND->>HT: Chọn 1 bản ghi trong danh sách\n    HT-->>ND: Hiển thị màn Thông tin\n```\n\n#### Activity — Xem thông tin danh mục\n```mermaid\nflowchart TD\n    A([\"Bắt đầu\"]) --> B[\"Hiển thị màn Danh sách\"]\n    B --> C[\"Người dùng chọn 1 bản ghi trong danh sách\"]\n    C --> D[\"Hiển thị màn Thông tin\"]\n    D --> E([\"Kết thúc\"])\n```\n\n### Flow: Tạo đề xuất tạo mới\n\n> Nguồn: SRS Web tr.298 — hình lưu đồ UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật; cùng khuôn ở SRS Web tr.334 — hình lưu đồ UC03.03.03; SRS Web tr.370 — hình lưu đồ UC03.04.03; SRS Web tr.405 — hình lưu đồ UC03.05.03; SRS Web tr.437 — hình lưu đồ UC03.06.03. Lưu đồ ghi bước \"Hiển thị popup Tạo mới\", mô tả chữ ghi \"màn hình Tạo mới\", ảnh cho thấy panel trượt bên phải (SRS Web tr.299 — ảnh UC03.01.03). Lưu đồ chỉ vẽ nhánh hợp lệ; nhánh lỗi in-line và gửi thông báo lấy từ mô tả chữ (SRS Web tr.302–303 — UC03.01.03). ✅ cho bước trong lưu đồ, 🔵 cho vị trí bước thông báo.\n\n#### Sequence — Tạo đề xuất tạo mới\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    participant TB as Thông báo\n    HT-->>ND: Hiển thị màn Danh sách\n    ND->>HT: Nhấn nút Tạo mới\n    HT-->>ND: Hiển thị form Tạo mới\n    ND->>HT: Nhập thông tin và xác nhận\n    HT->>HT: Kiểm tra validate\n    alt Có trường không hợp lệ\n        HT-->>ND: Lỗi in-line dưới trường không hợp lệ\n    else Hợp lệ\n        HT->>HT: Lưu bản ghi Chờ phê duyệt\n        HT-->>ND: Toast thành công\n        HT->>HT: Tạo bản ghi Lịch sử hoạt động\n        HT->>TB: Gửi thông báo cho người có quyền phê duyệt (🔵)\n        HT-->>ND: Chuyển sang màn Thông tin (xem)\n    end\n```\n\n#### Activity — Tạo đề xuất tạo mới\n```mermaid\nflowchart TD\n    A([\"Bắt đầu\"]) --> B[\"Hiển thị màn Danh sách\"]\n    B --> C[\"Người dùng nhấn Tạo mới\"]\n    C --> D[\"Hiển thị form Tạo mới\"]\n    D --> E[\"Người dùng nhập thông tin và xác nhận\"]\n    E --> F{\"Kiểm tra validate\"}\n    F -->|Không hợp lệ| G[\"Lỗi in-line dưới trường không hợp lệ\"]\n    G --> D\n    F -->|Hợp lệ| H[\"Toast thành công và lưu bản ghi Chờ phê duyệt\"]\n    H --> I[\"Tạo bản ghi Lịch sử hoạt động\"]\n    I --> J[\"Gửi thông báo cho người có quyền phê duyệt (🔵)\"]\n    J --> K[\"Chuyển sang màn Thông tin (xem)\"]\n    K --> L([\"Kết thúc\"])\n```\n\n### Flow: Huỷ bỏ khi đang tạo đề xuất\n\n> Nguồn: SRS Web tr.303–304 — UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật (nút Huỷ và icon đóng; mô tả chữ, không có hình lưu đồ riêng); cùng khuôn ở SRS Web tr.339–340 — UC03.03.03; SRS Web tr.374–375 — UC03.04.03; SRS Web tr.410 — UC03.05.03; SRS Web tr.442 — UC03.06.03. ✅\n\n#### Sequence — Huỷ bỏ khi đang tạo đề xuất\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    ND->>HT: Nhấn Huỷ hoặc icon đóng ở form Tạo mới\n    HT-->>ND: Hộp thoại xác nhận huỷ tạo mới\n    alt Xác nhận\n        HT-->>ND: Không tạo bản ghi và về màn Danh sách\n    else Hủy\n        HT-->>ND: Quay lại form Tạo mới với dữ liệu đã nhập\n    end\n```\n\n#### Activity — Huỷ bỏ khi đang tạo đề xuất\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: đang ở form Tạo mới\"]) --> B[\"Nhấn Huỷ hoặc icon đóng\"]\n    B --> C[\"Hiển thị hộp thoại xác nhận huỷ tạo mới\"]\n    C --> D{\"Người dùng chọn\"}\n    D -->|Xác nhận| E[\"Không tạo bản ghi và về màn Danh sách\"]\n    D -->|Hủy| F[\"Quay lại form Tạo mới với dữ liệu đã nhập\"]\n    E --> G([\"Kết thúc\"])\n    F --> G\n```\n\n### Flow: Huỷ đề xuất cấp mới\n\n> Nguồn: SRS Web tr.308 — hình lưu đồ UC03.01.04 Huỷ đề xuất cấp mới Dịch vụ kỹ thuật; cùng khuôn ở SRS Web tr.344 — hình lưu đồ UC03.03.04; SRS Web tr.378 — hình lưu đồ UC03.04.04; SRS Web tr.413 — hình lưu đồ UC03.05.04; SRS Web tr.444 — hình lưu đồ UC03.06.04. Lưu đồ không vẽ nhánh Huỷ bỏ và bước gửi thông báo; hai bước này lấy từ mô tả chữ (SRS Web tr.310–311 — UC03.01.04). ✅ cho bước trong lưu đồ, 🔵 cho vị trí bước thông báo.\n\n#### Sequence — Huỷ đề xuất cấp mới\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    participant TB as Thông báo\n    HT-->>ND: Hiển thị màn Thông tin hoặc Danh sách\n    ND->>HT: Nhấn Huỷ đề xuất\n    HT-->>ND: Popup Xác nhận huỷ\n    alt Huỷ bỏ\n        HT-->>ND: Đóng popup và giữ Chờ phê duyệt\n    else Xác nhận\n        HT->>HT: Lưu trạng thái Đã huỷ\n        HT-->>ND: Toast thành công\n        HT->>HT: Tạo bản ghi Lịch sử hoạt động\n        HT->>TB: Gửi thông báo cho người có quyền phê duyệt (🔵)\n        HT-->>ND: Chuyển sang màn Thông tin (xem)\n    end\n```\n\n#### Activity — Huỷ đề xuất cấp mới\n```mermaid\nflowchart TD\n    A([\"Bắt đầu\"]) --> B{\"Vào từ đâu\"}\n    B -->|\"Từ màn Thông tin\"| C[\"Hiển thị màn Thông tin\"]\n    B -->|\"Từ màn Danh sách\"| D[\"Hiển thị màn Danh sách\"]\n    C --> E[\"Người dùng nhấn Huỷ đề xuất\"]\n    D --> E\n    E --> F[\"Hiển thị popup Xác nhận huỷ\"]\n    F --> G{\"Người dùng chọn\"}\n    G -->|Huỷ bỏ| H[\"Đóng popup và giữ Chờ phê duyệt\"]\n    G -->|Xác nhận| I[\"Toast thành công và lưu trạng thái Đã huỷ\"]\n    I --> J[\"Tạo bản ghi Lịch sử hoạt động\"]\n    J --> K[\"Gửi thông báo cho người có quyền phê duyệt (🔵)\"]\n    K --> L[\"Chuyển sang màn Thông tin (xem)\"]\n    H --> M([\"Kết thúc\"])\n    L --> M\n```\n\n### Flow: Phê duyệt / Từ chối đề xuất cấp mới\n\n> Nguồn: SRS Web tr.314 — hình lưu đồ UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật; cùng khuôn ở SRS Web tr.350 — hình lưu đồ UC03.03.05; SRS Web tr.383 — hình lưu đồ UC03.04.05; SRS Web tr.418 — hình lưu đồ UC03.05.05; SRS Web tr.450 — hình lưu đồ UC03.06.05. Lưu đồ không vẽ nhánh bỏ xác nhận (nút Huỷ bỏ hoặc Huỷ), nhánh xung đột đồng thời, nhập lý do, sinh mã, gửi thông báo; các bước này lấy từ mô tả chữ (SRS Web tr.316–320 — UC03.01.05). ✅ cho bước trong lưu đồ, 🔵 cho vị trí bước thông báo và sinh mã.\n\n#### Sequence — Phê duyệt / Từ chối đề xuất cấp mới\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    participant TB as Thông báo\n    HT-->>ND: Hiển thị màn Thông tin hoặc Danh sách\n    alt Chọn Phê duyệt\n        ND->>HT: Nhấn Phê duyệt\n        HT-->>ND: Popup Xác nhận phê duyệt\n        alt Huỷ\n            ND->>HT: Nhấn Huỷ trong popup\n            HT-->>ND: Đóng popup và giữ Chờ phê duyệt\n        else Phê duyệt\n            ND->>HT: Nhấn Phê duyệt trong popup\n            alt Đề xuất vừa bị huỷ\n                HT-->>ND: Popup Lỗi với nút Tải lại trang\n            else Còn Chờ phê duyệt\n                HT->>HT: Lưu trạng thái Đã phê duyệt và sinh mã\n                HT-->>ND: Toast thành công\n                HT->>HT: Tạo bản ghi Lịch sử hoạt động\n                HT->>TB: Gửi thông báo cho người đã tạo yêu cầu (🔵)\n                HT-->>ND: Chuyển sang màn Thông tin (xem)\n            end\n        end\n    else Chọn Từ chối\n        ND->>HT: Nhấn Từ chối\n        HT-->>ND: Popup Xác nhận từ chối với Lý do từ chối\n        alt Huỷ bỏ\n            ND->>HT: Nhấn Huỷ bỏ trong popup\n            HT-->>ND: Đóng popup và giữ Chờ phê duyệt\n        else Từ chối\n            ND->>HT: Nhập lý do (tuỳ chọn) và nhấn Từ chối\n            alt Đề xuất vừa bị huỷ\n                HT-->>ND: Popup Lỗi với nút Tải lại trang\n            else Còn Chờ phê duyệt\n                HT->>HT: Lưu trạng thái Đã từ chối\n                HT-->>ND: Toast thành công\n                HT->>HT: Tạo bản ghi Lịch sử hoạt động\n                HT->>TB: Gửi thông báo cho người đã tạo yêu cầu (🔵)\n                HT-->>ND: Chuyển sang màn Thông tin (xem)\n            end\n        end\n    end\n```\n\n#### Activity — Phê duyệt / Từ chối đề xuất cấp mới\n```mermaid\nflowchart TD\n    A([\"Bắt đầu\"]) --> B{\"Vào từ đâu\"}\n    B -->|\"Từ màn Thông tin\"| C[\"Hiển thị màn Thông tin\"]\n    B -->|\"Từ màn Danh sách\"| D[\"Hiển thị màn Danh sách\"]\n    C --> E{\"Người dùng chọn\"}\n    D --> E\n    E -->|Phê duyệt| F[\"Hiển thị popup Xác nhận phê duyệt\"]\n    E -->|Từ chối| G[\"Hiển thị popup Xác nhận từ chối\"]\n    F --> F1{\"Nhấn Phê duyệt hay Huỷ\"}\n    G --> G1{\"Nhấn Từ chối hay Huỷ bỏ\"}\n    F1 -->|Huỷ bỏ| Z[\"Đóng popup và giữ Chờ phê duyệt\"]\n    G1 -->|Huỷ bỏ| Z\n    F1 -->|Phê duyệt| X{\"Đề xuất đã bị huỷ trước đó\"}\n    G1 -->|Từ chối| X\n    X -->|Có| Y[\"Popup lỗi với nút Tải lại trang\"]\n    X -->|Không| H[\"Toast thành công và lưu trạng thái mới\"]\n    H --> I[\"Tạo bản ghi Lịch sử hoạt động\"]\n    I --> J[\"Gửi thông báo cho người đã tạo yêu cầu (🔵)\"]\n    J --> K[\"Chuyển sang màn Thông tin (xem)\"]\n    Z --> M([\"Kết thúc\"])\n    Y --> M\n    K --> M\n```\n\n### Flow: Xoá yêu cầu và Tạo mới yêu cầu từ bản đã huỷ hoặc đã từ chối\n\n> Nguồn: SRS Web tr.296–297 — UC03.01.02 Xem thông tin Dịch vụ kỹ thuật; SRS Web tr.311–312 — UC03.01.04 Huỷ đề xuất cấp mới Dịch vụ kỹ thuật; SRS Web tr.317–318 — UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật; cùng khuôn ở 4 danh mục còn lại (PTVT tr.332, 347–348, 353–354; CCDC tr.368, 380–381, 386–387; Lốp tr.402, 415–416, 420–421; Ắc quy tr.435, 447–448, 453–454). Nguồn mô tả bằng chữ, không có hình lưu đồ riêng. ✅ cho bước Xoá; 🔵 cho kết quả \"Tạo mới yêu cầu\" ở trạng thái Đã từ chối (OQ-3).\n\n#### Sequence — Xoá yêu cầu và Tạo mới yêu cầu\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống PMX\n    HT-->>ND: Màn Thông tin ở trạng thái Đã huỷ hoặc Đã từ chối\n    ND->>HT: Chọn icon ba chấm\n    alt Xoá yêu cầu\n        HT-->>ND: Popup Xác nhận xoá\n        alt Xoá\n            HT->>HT: Xoá yêu cầu đã chọn\n            HT-->>ND: Toast Xoá yêu cầu thành công và về màn Danh sách\n        else Huỷ\n            HT-->>ND: Quay về màn Thông tin\n        end\n    else Tạo mới yêu cầu\n        HT-->>ND: Màn Tạo mới yêu cầu với thông tin lấy từ yêu cầu hiện tại\n        ND->>HT: Chỉnh sửa và xác nhận\n        HT->>HT: Cập nhật bản ghi và đưa về Chờ phê duyệt (🔵)\n    end\n```\n\n#### Activity — Xoá yêu cầu và Tạo mới yêu cầu\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: màn Thông tin ở Đã huỷ hoặc Đã từ chối\"]) --> B[\"Người dùng chọn icon ba chấm\"]\n    B --> C{\"Hành động\"}\n    C -->|Xoá yêu cầu| D[\"Hiển thị popup Xác nhận xoá\"]\n    D --> E{\"Người dùng chọn\"}\n    E -->|Xoá| F[\"Xoá yêu cầu và toast Xoá yêu cầu thành công\"]\n    F --> G[\"Đóng popup và về màn Danh sách\"]\n    E -->|Huỷ| H[\"Quay về màn Thông tin\"]\n    C -->|Tạo mới yêu cầu| I[\"Hiển thị màn Tạo mới yêu cầu với dữ liệu cũ\"]\n    I --> J[\"Người dùng chỉnh sửa và xác nhận\"]\n    J --> K[\"Cập nhật bản ghi, không sinh bản ghi mới, trạng thái về Chờ phê duyệt (🔵)\"]\n    G --> L([\"Kết thúc\"])\n    H --> L\n    K --> L\n```\n\n\n## <a id=\"sec-states\"></a>3. Trạng thái (States)\n\n### State: Bản ghi danh mục / Yêu cầu cấp mới (chung cho 5 danh mục)\n\n> Nguồn: SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục (hình lưu đồ trạng thái và bảng Trạng thái / Thời điểm / Hành động, ghi \"Lưu đồ chung cho tất cả các danh mục\"); Dịch vụ kỹ thuật, Phụ tùng vật tư, Công cụ dụng cụ, Lốp, Ắc quy đều dùng chung và đều trỏ về lưu đồ này (\"xem thêm ở Lưu đồ trạng thái\") ✅ [SRS Web tr.291 — UC03.01.01 Xem danh mục Dịch vụ kỹ thuật; SRS Web tr.328 — UC03.03.01; SRS Web tr.364 — UC03.04.01; SRS Web tr.397 — UC03.05.01; SRS Web tr.430 — UC03.06.01]. Trong nguồn, yêu cầu cấp mới và bản ghi danh mục là cùng một bản ghi mang trạng thái (🔵). Hình lưu đồ có 2 cổng \"?\" sau Đã huỷ / Đã từ chối: \"Không tạo YC mới\" đi tới Kết thúc, \"Tạo lại 1 yêu cầu mới (từ data cũ)\" quay về bước Tạo đề xuất.\n\n```mermaid\nstateDiagram-v2\n    [*] --> ChoPheDuyet: Tạo đề xuất\n    ChoPheDuyet: Chờ phê duyệt\n    DaPheDuyet: Đã phê duyệt\n    DaTuChoi: Đã từ chối\n    DaHuy: Đã huỷ\n    ChoPheDuyet --> DaPheDuyet: Phê duyệt\n    ChoPheDuyet --> DaTuChoi: Từ chối\n    ChoPheDuyet --> DaHuy: Huỷ\n    DaTuChoi --> ChoPheDuyet: Tạo mới yêu cầu từ dữ liệu cũ (🔵)\n    DaHuy --> ChoPheDuyet: Tạo mới yêu cầu từ dữ liệu cũ\n    DaTuChoi --> [*]: Xoá yêu cầu hoặc không tạo yêu cầu mới\n    DaHuy --> [*]: Xoá yêu cầu hoặc không tạo yêu cầu mới\n    DaPheDuyet --> [*]: Kết thúc\n```\n\n**Ghi chú trạng thái:**\n\n| Trạng thái | Ý nghĩa | Vào bằng | Ra bằng | Nguồn | Nhãn |\n|-----------|---------|----------|---------|-------|------|\n| Chờ phê duyệt | Yêu cầu cấp mới đã tạo, chưa ai duyệt | Sau khi người dùng tạo yêu cầu cấp mới (hoặc tạo lại từ yêu cầu Đã huỷ / Đã từ chối) | Phê duyệt, Từ chối, Huỷ | SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục | ✅ |\n| Đã huỷ | Yêu cầu bị huỷ trước khi duyệt | Sau khi người dùng huỷ yêu cầu cấp mới | Xoá yêu cầu; Tạo mới yêu cầu; hoặc kết thúc khi không tạo yêu cầu mới | SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục | ✅ |\n| Đã từ chối | Yêu cầu bị người duyệt từ chối | Sau khi người dùng từ chối yêu cầu cấp mới | Xoá yêu cầu; Tạo mới yêu cầu; hoặc kết thúc khi không tạo yêu cầu mới | SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục | ✅ |\n| Đã phê duyệt | Bản ghi danh mục có hiệu lực, đã có mã | Sau khi người dùng phê duyệt yêu cầu cấp mới | Không có hành động (kết thúc) | SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục; SRS Web tr.321 — UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật | ✅ |\n\n**Kết thúc và ngõ cụt:**\n\n| Trạng thái | Là kết thúc? | Đường ra (huỷ / đóng / sửa) | Chứng từ đã sinh phía sau xử lý thế nào khi huỷ | Sửa được sau khi chốt? | Nguồn | Nhãn |\n|-----------|--------------|------------------------------|--------------------------------------------------|------------------------|-------|------|\n| Chờ phê duyệt | Không | Huỷ (→ Đã huỷ), Từ chối (→ Đã từ chối), Phê duyệt (→ Đã phê duyệt); không có hành động sửa nội dung | Chưa có mã; nguồn không nói thông báo đã gửi cho người duyệt có bị thu hồi khi huỷ | Không có trong nguồn (phải huỷ rồi tạo lại) | SRS Web tr.284 — Lưu đồ trạng thái chung cho danh mục; SRS Web tr.308 — UC03.01.04 Huỷ đề xuất cấp mới Dịch vụ kỹ thuật | ✅ |\n| Đã huỷ | Có thể kết thúc (cổng \"không tạo YC mới\") hoặc tạo lại | Xoá yêu cầu; Tạo mới yêu cầu (về Chờ phê duyệt); hoặc kết thúc | Không phát sinh chứng từ nào phía sau (chưa có mã) 🔵; nguồn không nói thông báo / lịch sử cũ khi xoá | Có — \"Tạo mới yêu cầu\" chỉnh sửa thông tin và nộp lại | SRS Web tr.284 — Lưu đồ trạng thái chung; SRS Web tr.311–312 — UC03.01.04 | ✅ |\n| Đã từ chối | Có thể kết thúc (cổng \"không tạo YC mới\") hoặc tạo lại | Xoá yêu cầu; Tạo mới yêu cầu; hoặc kết thúc | Như Đã huỷ | Có — như Đã huỷ (câu trạng thái ghi \"từ Đã huỷ về\", OQ-3) | SRS Web tr.284 — Lưu đồ trạng thái chung; SRS Web tr.317–318 — UC03.01.05 | 🔵 |\n| Đã phê duyệt | Có (điểm kết thúc của lưu đồ) | Không có huỷ, đóng, ngừng dùng, xoá | Nguồn không nói khi bản ghi đã phê duyệt đã được dùng ở nơi khác | Không có trong nguồn — \"không có thêm hành động nào khác ở trạng thái Đã phê duyệt\" | SRS Web tr.284 — Lưu đồ trạng thái chung; SRS Web tr.321 — UC03.01.05 | ✅ |\n\n\n## <a id=\"sec-erd\"></a>4. Dữ liệu (ERD)\n\n```mermaid\nerDiagram\n    LOAI_PHUONG_TIEN ||--o{ PHUONG_TIEN : \"gom\"\n    PHUONG_TIEN ||--o{ DICH_VU_KY_THUAT : \"ap dung cho\"\n    PHUONG_TIEN ||--o{ PHU_TUNG_VAT_TU : \"ap dung cho\"\n    PHUONG_TIEN ||--o{ LOP : \"gan cho\"\n    PHUONG_TIEN ||--o{ AC_QUY : \"gan cho\"\n    HE_THONG_TONG_THANH_XE ||--o{ DICH_VU_KY_THUAT : \"thuoc\"\n    HE_THONG_TONG_THANH_XE ||--o{ PHU_TUNG_VAT_TU : \"thuoc\"\n    HE_THONG_TONG_THANH_XE ||--o{ LOP : \"thuoc\"\n    HE_THONG_TONG_THANH_XE ||--o{ AC_QUY : \"thuoc\"\n    DON_VI_TINH ||--o{ DICH_VU_KY_THUAT : \"tinh theo\"\n    DON_VI_TINH ||--o{ PHU_TUNG_VAT_TU : \"tinh theo\"\n    DON_VI_TINH ||--o{ CONG_CU_DUNG_CU : \"tinh theo\"\n    DON_VI_TINH ||--o{ LOP : \"tinh theo\"\n    DON_VI_TINH ||--o{ AC_QUY : \"tinh theo\"\n    LOAI_CCDC ||--o{ CONG_CU_DUNG_CU : \"phan loai\"\n    NHOM_GIA_DVKT ||--o{ DICH_VU_KY_THUAT : \"xac dinh ma\"\n    NGUOI_DUNG ||--o{ YEU_CAU_CAP_MOI : \"tao\"\n    YEU_CAU_CAP_MOI ||--|| DICH_VU_KY_THUAT : \"la cung ban ghi\"\n    YEU_CAU_CAP_MOI ||--|| PHU_TUNG_VAT_TU : \"la cung ban ghi\"\n    YEU_CAU_CAP_MOI ||--|| CONG_CU_DUNG_CU : \"la cung ban ghi\"\n    YEU_CAU_CAP_MOI ||--|| LOP : \"la cung ban ghi\"\n    YEU_CAU_CAP_MOI ||--|| AC_QUY : \"la cung ban ghi\"\n    YEU_CAU_CAP_MOI ||--o{ LICH_SU_HOAT_DONG : \"co\"\n    YEU_CAU_CAP_MOI ||--o{ THONG_BAO : \"phat sinh\"\n    NGUOI_DUNG ||--o{ LICH_SU_HOAT_DONG : \"thuc hien\"\n    NGUOI_DUNG ||--o{ THONG_BAO : \"nhan\"\n\n    DICH_VU_KY_THUAT {\n        chuoi ma_dvkt \"Ma DVKT - chi co khi da phe duyet\"\n        chuoi ten_dich_vu_ky_thuat \"Ten DVKT - bat buoc va duy /a>UC-approve-reject-catalog-request — Phê duyệt / Từ chối đề xuất cấp mới\n\n#### a. Introduction\n\nPhê duyệt hoặc từ chối một đề xuất tạo mới đang ở Chờ phê duyệt. Phê duyệt sinh mã cho bản ghi. Mã UC gốc: UC03.01.05 (DVKT), UC03.03.05 (PTVT), UC03.04.05 (CCDC), UC03.05.05 (Lốp), UC03.06.05 (Ắc quy). Nguồn ghi tên UC \"Phê duyệt/từ chối yêu cầu tạo mới …\". ✅ [SRS Web tr.313, 349, 382, 417, 449 — Phê duyệt/Từ chối đề xuất cấp mới (5 danh mục)]\n\n#### b. Actors & Objects\n\n- Tác nhân: Người dùng phần mềm xưởng (có quyền Phê duyệt/Từ chối) ✅ [SRS Web tr.313 — UC03.01.05 Phê duyệt/Từ chối đề xuất cấp mới Dịch vụ kỹ thuật]\n- Đối tượng: bản ghi danh mục (Chờ phê duyệt), Thông báo, Lịch sử hoạt động ✅ [SRS Web tr.316, 319 — UC03.01.05]\n\n#### c. Pre-conditions\n\n- Người dùng được phân quyền vào chức năng Phê duyệt/Từ chối đề xuất tạo mới của danh mục ✅ [SRS Web tr.313 — UC03.01.05]\n- Bản ghi ở trạng thái Chờ phê duyệt ✅ [SRS Web tr.313 — UC03.01.05]\n\n#### d. Expected result\n\n- Trạng thái bản ghi từ Chờ phê duyệt → Đã phê duyệt hoặc Đã từ chối ✅ [SRS Web tr.313 — UC03.01.05]\n- Hiển thị toast message thành công ✅ [SRS Web tr.313 — UC03.01.05]\n- Tắt popup Xác nhận và hiển thị màn Thông tin ✅ [SRS Web tr.313 — UC03.01.05]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Phê duyệt / Từ chối đề xuất cấp mới.\n\nMain Success Scenario (Phê duyệt):\n1. Người dùng ở màn Thông tin hoặc màn Danh sách ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n2. Người dùng nhấn Phê duyệt ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n3. Hệ thống hiển thị popup Xác nhận phê duyệt ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n4. Người dùng nhấn Phê duyệt trong popup ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n5. Hệ thống đổi trạng thái sang Đã phê duyệt, báo toast “Phê duyệt đề xuất tạo … thành công” ✅ [SRS Web tr.319 — UC03.01.05]\n6. Hệ thống hiển thị màn Thông tin ✅ [SRS Web tr.319 — UC03.01.05]\n7. Hệ thống gửi thông báo cho người dùng đã tạo yêu cầu: \"… đã được phê duyệt.\" ✅ [SRS Web tr.319 — UC03.01.05]\n8. Hệ thống sinh mã mới theo quy tắc của danh mục ✅ [SRS Web tr.319–320 — UC03.01.05]\n9. Hệ thống lưu Lịch sử hoạt động \"Đã phê duyệt yêu cầu cấp mới\" ✅ [SRS Web tr.320 — UC03.01.05]\n\nMain Success Scenario (Từ chối):\n1. Người dùng ở màn Thông tin hoặc màn Danh sách ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n2. Người dùng nhấn Từ chối ✅ [SRS Web tr.314 — hình lưu đồ UC03.01.05]\n3. Hệ thống hiển thị popup Xác nhận từ chối với trường Lý do từ chối (không bắt buộc) ✅ [SRS Web tr.314–315 — UC03.01.05]\n4. Người dùng nhập lý do (tuỳ chọn) và nhấn Từ chối ✅ [SRS Web tr.315–316 — UC03.01.05]\n5. Hệ thống đổi trạng thái sang Đã từ chối, báo toast “Từ chối đề xuất tạo … thành công” (ảnh DVKT ghi “Từ chối tạo mới dịch vụ kỹ thuật thành công!”, OQ-23) ✅ [SRS Web tr.316 — UC03.01.05]\n6. Hệ thống hiển thị màn Thông tin với 2 hoạt động: Xoá yêu cầu, Tạo mới yêu cầu ✅ [SRS Web tr.316 — UC03.01.05]\n7. Hệ thống gửi thông báo cho người dùng đã tạo yêu cầu: \"… đã bị từ chối.\" ✅ [SRS Web tr.316 — UC03.01.05]\n8. Hệ thống lưu Lịch sử hoạt động \"Đã từ chối yêu cầu cấp mới\" kèm \"Lý do: [lý do người dùng nhập]\" ✅ [SRS Web tr.316 — UC03.01.05]\n\nExtensions:\n- 4a. Người dùng nhấn Huỷ bỏ (popup từ chối) hoặc Huỷ (popup phê duyệt trên ảnh; bảng ghi Huỷ bỏ) ở popup: trạng thái giữ nguyên Chờ phê duyệt; đóng popup và về màn Thông tin ✅ [SRS Web tr.317, 320 — UC03.01.05]\n- 4b. Người khác vừa huỷ đề xuất trước (hoặc huỷ và duyệt cùng lúc): ưu tiên Huỷ; hệ thống hiển thị popup lỗi (tiêu đề “Lỗi!”, nội dung “Đề xuất tạo mới này đã bị huỷ. Vui lòng tải lại trang để cập nhật.”, nút “Tải lại trang”, chữ trên ảnh giống ở 5 danh mục) ✅ [SRS Web tr.316, 319 — UC03.01.05]\n- 6a. Ở trạng thái Đã từ chối: Xoá yêu cầu / Tạo mới yêu cầu ✅ [SRS Web tr.317–318 — UC03.01.05]\n- 6b. Ở trạng thái Đã phê duyệt: không có hành động nào thêm ✅ [SRS Web tr.321 — UC03.01.05]\n\n#### f. Screens\n\n- Popup Xác nhận phê duyệt; popup Xác nhận từ chối; popup lỗi Tải lại trang; màn Thông tin các trạng thái Đã từ chối, Đã phê duyệt ([spec.md](#sec-spec) Mục 10)\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|------|----|----|-------|-------|\n| Phê duyệt 1 đến 4 | FR-product-catalog-008, FR-product-catalog-014 | BR-product-catalog-014, BR-product-catalog-027 | — | SRS Web tr.314, 318 — UC03.01.05 |\n| Phê duyệt 5 đến 7, 9 | FR-product-catalog-014, FR-product-catalog-020, FR-product-catalog-021 | BR-product-catalog-014, BR-product-catalog-021 | — | SRS Web tr.319–320 — UC03.01.05 |\n| Phê duyệt 8 | FR-product-catalog-015 | BR-product-catalog-022 đến BR-product-catalog-026 | — | SRS Web tr.319–320 — UC03.01.05 |\n| Từ chối 1 đến 4 | FR-product-catalog-008, FR-product-catalog-013 | BR-product-catalog-014, BR-product-catalog-015 | — | SRS Web tr.314–316 — UC03.01.05 |\n| Từ chối 5 đến 8 | FR-product-catalog-013, FR-product-catalog-020, FR-product-catalog-021 | BR-product-catalog-014, BR-product-catalog-021 | — | SRS Web tr.316 — UC03.01.05 |\n| 4a | FR-product-catalog-016 | BR-product-catalog-016 | — | SRS Web tr.317, 320 — UC03.01.05 |\n| 4b | FR-product-catalog-017 | BR-product-catalog-017 | E-product-catalog-003, E-product-catalog-004 | SRS Web tr.316, 319 — UC03.01.05 |\n| 6a, 6b | FR-product-catalog-018, FR-product-catalog-019, FR-product-catalog-022 | BR-product-catalog-018, BR-product-catalog-019 | — | SRS Web tr.317–318, 321 — UC03.01.05 |\n\n#### h. Open Questions\n\nOQ-3, OQ-5, OQ-6, OQ-7, OQ-8, OQ-14, OQ-19, OQ-23 (xem gaps.md)\n\n\n---\n\n### <a id=\"uc-cancel-catalog-request\"></a>UC-cancel-catalog-request — Huỷ đề xuất cấp mới\n\n#### a. Introduction\n\nHuỷ một đề xuất tạo mới đang ở Chờ phê duyệt; bản ghi chuyển sang Đã huỷ. Mã UC gốc: UC03.01.04 (DVKT), UC03.03.04 (PTVT), UC03.04.04 (CCDC), UC03.05.04 (Lốp), UC03.06.04 (Ắc quy). ✅ [SRS Web tr.308, 344, 377, 412, 444 — Huỷ đề xuất cấp mới (5 danh mục)]\n\n#### b. Actors & Objects\n\n- Tác nhân: Người dùng phần mềm xưởng ✅ [SRS Web tr.308 — UC03.01.04 Huỷ đề xuất cấp mới Dịch vụ kỹ thuật]\n- Đối tượng: bản ghi danh mục (Chờ phê duyệt), Thông báo, Lịch sử hoạt động ✅ [SRS Web tr.310 — UC03.01.04]\n\n#### c. Pre-conditions\n\n- Người dùng được phân quyền vào chức năng Huỷ đề xuất tạo mới của danh mục ✅ [SRS Web tr.308 — UC03.01.04]\n- Bản ghi ở trạng thái Chờ phê duyệt (DVKT và PTVT ghi \"trạng thái xưởng\") ✅ [SRS Web tr.308 — UC03.01.04; SRS Web tr.344 — UC03.03.04]\n\n#### d. Expected result\n\n- Trạng thái bản ghi từ Chờ phê duyệt → Đã huỷ ✅ [SRS Web tr.308 — UC03.01.04]\n- Hiển thị toast message thành công ✅ [SRS Web tr.308 — UC03.01.04]\n- Tắt popup Xác nhận huỷ và hiển thị màn Thông tin ✅ [SRS Web tr.308 — UC03.01.04]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Huỷ đề xuất cấp mới.\n\nMain Success Scenario:\n1. Người dùng ở màn Thông tin hoặc màn Danh sách ✅ [SRS Web tr.308 — hình lưu đồ UC03.01.04]\n2. Người dùng nhấn Huỷ đề xuất (ở cột Hành động hoặc ở màn Thông tin) ✅ [SRS Web tr.308 — UC03.01.04]\n3. Hệ thống hiển thị popup \"Huỷ đề xuất tạo mới?\" (nút \"Huỷ bỏ\" / \"Xác nhận\", chữ ở FR-product-catalog-024) ✅ [SRS Web tr.308 — hình lưu đồ UC03.01.04; ảnh tr.309]\n4. Người dùng nhấn Xác nhận ✅ [SRS Web tr.310 — UC03.01.04]\n5. Hệ thống đổi trạng thái sang Đã huỷ, báo toast “Huỷ đề xuất tạo … thành công” (câu chữ theo danh mục; ảnh DVKT ghi “Huỷ đề xuất tạo mới thành công!”, OQ-23) ✅ [SRS Web tr.310 — UC03.01.04]\n6. Hệ thống hiển thị màn Thông tin với 2 hành động: Xoá yêu cầu, Tạo mới yêu cầu ✅ [SRS Web tr.310 — UC03.01.04]\n7. Hệ thống gửi thông báo cho người dùng có quyền phê duyệt: \"… đã bị huỷ.\" ✅ [SRS Web tr.310 — UC03.01.04]\n8. Hệ thống lưu Lịch sử hoạt động \"Đã huỷ yêu cầu cấp mới\" ✅ [SRS Web tr.310 — UC03.01.04]\n\nExtensions:\n- 4a. Người dùng nhấn Huỷ bỏ: trạng thái giữ nguyên Chờ phê duyệt; đóng popup và về màn Thông tin ✅ [SRS Web tr.311 — UC03.01.04]\n- 4b. Tham chiếu: khi Phê duyệt/Từ chối xảy ra cùng lúc thì ưu tiên Huỷ đề xuất; popup lỗi xuất hiện ở phía người duyệt và được mô tả ở UC Phê duyệt/Từ chối, UC này không có thông báo lỗi nào 🔵 [SRS Web tr.316 — UC03.01.05; SRS Web tr.310–311 — UC03.01.04]\n- 6a. Ở trạng thái Đã huỷ: Xoá yêu cầu / Tạo mới yêu cầu (xem UC-view-catalog-detail 3b) ✅ [SRS Web tr.311–312 — UC03.01.04]\n\n#### f. Screens\n\n- Popup Xác nhận huỷ yêu cầu; màn Thông tin trạng thái Đã huỷ ([spec.md](#sec-spec) Mục 10)\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|------|----|----|-------|-------|\n| 1, 2 | FR-product-catalog-008 | BR-product-catalog-013, BR-product-catalog-027 | — | SRS Web tr.308 — UC03.01.04 |\n| 3, 4 | FR-product-catalog-012 | BR-product-catalog-013 | — | SRS Web tr.310 — UC03.01.04 |\n| 5 đến 8 | FR-product-catalog-012, FR-product-catalog-020, FR-product-catalog-021 | BR-product-catalog-021 | — | SRS Web tr.310 — UC03.01.04 |\n| 4a | FR-product-catalog-016 | BR-product-catalog-016 | — | SRS Web tr.311 — UC03.01.04 |\n| 4b (tham chiếu) | FR-product-catalog-017 | BR-product-catalog-017 | — (xem UC Phê duyệt/Từ chối) | SRS Web tr.316 — UC03.01.05 |\n| 6a | FR-product-catalog-018, FR-product-catalog-019 | BR-product-catalog-018, BR-product-catalog-019 | — | SRS Web tr.311–312 — UC03.01.04 |\n\n#### h. Open Questions\n\nOQ-2, OQ-3, OQ-16, OQ-23 (xem gaps.md)\n\n\n---\n\n### <a id=\"uc-create-catalog-request\"></a>UC-create-catalog-request — Tạo đề xuất tạo mới bản ghi danh mục\n\n#### a. Introduction\n\nNgười dùng đề xuất tạo mới một bản ghi danh mục; hệ thống kiểm tra, tạo bản ghi ở Chờ phê duyệt, thông báo cho người duyệt và ghi lịch sử. Mã UC gốc: UC03.01.03 (DVKT), UC03.03.03 (PTVT), UC03.04.03 (CCDC), UC03.05.03 (Lốp), UC03.06.03 (Ắc quy). Trường của từng danh mục ở [spec.md](#sec-spec) Mục 3 bảng Khác biệt. ✅ [SRS Web tr.298, 334, 370, 404, 437 — Tạo đề xuất tạo mới (5 danh mục)]\n\n#### b. Actors & Objects\n\n- Tác nhân: Người dùng phần mềm xưởng ✅ [SRS Web tr.298 — UC03.01.03 Tạo đề xuất tạo mới Dịch vụ kỹ thuật]\n- Đối tượng: bản ghi danh mục mới, Thông báo, Lịch sử sec-sources\"></a>7. Danh mục nguồn (Provenance)\n\n| Nguồn | Tài liệu | Loại | Ngày | Confidence | Encoding | Phần suy ra từ đây |\n|---|---|---|---|---|---|---|\n| SRS Web | Tài liệu SRS - ERP Delta 3.0 (Web) — `docs-input/srs-cu/lg-srs-export.md` (ảnh: `docs-input/srs-cu/images/`; bản gốc: ~/Downloads/lg-export.pdf (ngoài git)) | pdf → md | bản 30/9/2026 | high | OK — bảng chuyển từ PDF hay bị cắt ô | Dịch vụ kỹ thuật, phụ tùng vật tư, công cụ dụng cụ, lốp, ắc quy: tr.282–457 |\n\n### Ghi chú nguồn\n\n- SRS Web chuyển từ PDF theo bố cục trang: bảng hay bị cắt ô (chữ dồn dòng), `Cột n` là nhãn kỹ thuật. Ảnh trích lại từ PDF gốc ngày 2026-10-14 (lưu đồ hoạt động, lưu đồ trạng thái, mockup màn hình).\n- Hai nguồn nói khác nhau cùng 1 điểm → ghi cả hai, nhãn 🟡, Conflict ở `reverse-gaps.md`. Không tự chọn bên.\n- Ghi chép thay đổi là tài liệu của đội (không phải tài liệu khách), chỉ dùng để đối chiếu ở Mục 0.3.\n\n";
      const md = window.markdownit({ html: true, linkify: true, breaks: false });
      const defaultFence = md.renderer.rules.fence.bind(md.renderer.rules);
      md.renderer.rules.fence = (tokens, idx, options, env, slf) => {
        const token = tokens[idx];
        if (token.info.trim() === 'mermaid') {
          return `<pre class="mermaid">${token.content}</pre>`;
        }
        return defaultFence(tokens, idx, options, env, slf);
      };
      document.getElementById('content').innerHTML = md.render(MD_SOURCE);
    }

    // === Build nested TOC đa cấp (H2 → H3 → H4) theo đúng phân cấp heading ===
    const toc = document.getElementById('toc');
    // Lấy H2/H3/H4 (bỏ heading trong cover page). H4 cho thấy mục con sâu (vd
    // "## Screen: ..." trong wireframe demote thành H4) — TOC nest đúng theo cấp.
    const headings = Array.from(document.querySelectorAll('main h2, main h3, main h4'))
                          .filter(h => !h.closest('.cover'));
    // Stack các <ul> theo cấp: stack[L] = ul chứa item cấp L. Gốc toc = cấp 1 (giữ H2).
    const listStack = { 1: toc };   // toc là <ol> gốc
    let counter = 0;

    headings.forEach((h) => {
      const level = parseInt(h.tagName[1], 10);   // 2 | 3 | 4
      const id = `sec-${++counter}`;
      h.id = id;

      const li = document.createElement('li');
      li.className = 'toc-item';
      li.dataset.level = level;
      const row = document.createElement('div');
      row.className = 'toc-row';
      const toggle = document.createElement('span');
      toggle.className = 'toggle leaf';   // 'leaf' cho tới khi có con
      toggle.textContent = '▾';
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      row.appendChild(toggle);
      row.appendChild(a);
      li.appendChild(row);
      const childUl = document.createElement('ul');
      childUl.className = 'toc-children';
      li.appendChild(childUl);

      // Gắn vào parent = ul của cấp NGAY TRÊN đang mở (level-1); không có thì leo lên tiếp.
      let parentUl = null;
      for (let L = level - 1; L >= 1; L--) { if (listStack[L]) { parentUl = listStack[L]; break; } }
      (parentUl || toc).appendChild(li);
      // Parent li không còn là leaf → hiện toggle.
      const parentLi = (parentUl || toc).closest('li.toc-item');
      if (parentLi) parentLi.querySelector(':scope > .toc-row > .toggle').classList.remove('leaf');

      // Cấp hiện tại giờ mở childUl này; xóa mọi cấp sâu hơn khỏi stack.
      listStack[level] = childUl;
      for (let L = level + 1; L <= 6; L++) delete listStack[L];

      toggle.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        li.classList.toggle('collapsed');
      });
    });

    function setAllTocCollapsed(collapsed) {
      // Chỉ gập/mở các item CÓ con (leaf giữ nguyên).
      toc.querySelectorAll('li.toc-item').forEach(li => {
        const t = li.querySelector(':scope > .toc-row > .toggle');
        if (t && !t.classList.contains('leaf')) li.classList.toggle('collapsed', collapsed);
      });
    }

    // === Click link nội bộ #anchor (TOC LẪN trong nội dung) → cuộn mượt tới mục ===
    // Bắt ở document để phủ cả link "chi tiết ở erd.md" (đã đổi thành #sec-erd) trong
    // content, không chỉ TOC. Anchor có thể là <a id> động (sec-N) hoặc cố định (sec-erd...).
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      const target = document.getElementById(id) ||
                     document.querySelector(`main [id="${id}"]`);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + id);
      }
    });

    // === Scroll-spy: highlight mục đang xem + mọi tổ tiên của nó ===
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          toc.querySelectorAll('li.active').forEach(el => el.classList.remove('active'));
          const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
          if (link) {
            // Đánh dấu item hiện tại + leo lên mọi cấp cha (nested).
            let li = link.closest('li.toc-item');
            while (li) { li.classList.add('active'); li = li.parentElement.closest('li.toc-item'); }
          }
        }
      });
    }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
    document.querySelectorAll('main h2, main h3, main h4').forEach(h => obs.observe(h));

    // === Mermaid render (CHỈ online) + zoom modal ===
    if (!OFFLINE && window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
      (async () => {
        const blocks = Array.from(document.querySelectorAll('pre.mermaid'));
        for (let i = 0; i < blocks.length; i++) {
          const el = blocks[i];
          const code = el.textContent;
          try {
            const { svg } = await mermaid.render(`mmd-${i}`, code);
            el.innerHTML = svg;
            el.dataset.processed = '1';
          } catch (err) {
            console.error(`Mermaid block #${i} failed:`, err.message || err);
            el.innerHTML = `<div style="color:#b00;font-family:monospace;font-size:12px;padding:8px;border:1px solid #b00;border-radius:4px;text-align:left;">⚠ Mermaid render lỗi: ${(err.message||err).toString().split('\n')[0]}<br><pre style="white-space:pre-wrap;margin-top:8px;">${code.replace(/</g,'&lt;')}</pre></div>`;
          }
        }
        attachMermaidZoom();
      })();
    } else {
      // offline: SVG đã inline sẵn server-side, chỉ cần gắn click-zoom.
      attachMermaidZoom();
    }

    function attachMermaidZoom() {
      document.querySelectorAll('.mermaid svg, pre.mermaid svg').forEach(svg => {
        if (svg.dataset.zoomAttached) return;
        svg.dataset.zoomAttached = '1';
        svg.addEventListener('click', () => openMermaidModal(svg));
      });
    }

    function openMermaidModal(svg) {
      const modal = document.getElementById('mermaid-modal');
      const inner = modal.querySelector('.modal-svg');
      const clone = svg.cloneNode(true);
      clone.style.maxWidth = 'none';
      clone.style.maxHeight = 'none';
      clone.setAttribute('width', '100%');
      clone.setAttribute('height', '100%');
      inner.innerHTML = '';
      inner.appendChild(clone);
      modal.classList.add('open');
      // svg-pan-zoom chỉ có online (CDN). Offline: hiển thị to trong modal, không pan/zoom lib
      // (degrade nhẹ — vẫn xem được full diagram, ESC/click nền để đóng).
      if (!OFFLINE && window.svgPanZoom) {
        requestAnimationFrame(() => {
          modalPanZoom = svgPanZoom(clone, {
            zoomEnabled: true, controlIconsEnabled: false,
            fit: true, center: true, minZoom: 0.3, maxZoom: 20,
            zoomScaleSensitivity: 0.3
          });
        });
      }
    }

    function closeMermaidModal() {
      const modal = document.getElementById('mermaid-modal');
      if (modalPanZoom) { modalPanZoom.destroy(); modalPanZoom = null; }
      modal.querySelector('.modal-svg').innerHTML = '';
      modal.classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('mermaid-modal').classList.contains('open')) {
        closeMermaidModal();
      }
    });
  </script>
