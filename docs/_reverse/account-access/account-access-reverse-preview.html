<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access — Reverse SRS Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --color-primary: #262626;
      --color-primary-muted: #f1f1f1;
      --color-canvas: #ffffff;
      --color-surface: #fafafa;
      --color-surface-strong: #f3f3f5;
      --color-ink: #181a20;
      --color-muted: #707a8a;
      --color-hairline: #eaecef;
      --color-link: #2563eb;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-surface);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-hairline);
      padding: 24px 16px;
    }
    aside h2 { font-size: 14px; text-transform: uppercase; color: var(--color-muted); margin: 0 0 12px; letter-spacing: .03em; }
    aside nav ol, aside nav ul { list-style: none; padding: 0; margin: 0; }
    .toc-controls { display: flex; gap: 6px; margin-bottom: 12px; }
    .toc-controls button {
      flex: 1; font-size: 11px; color: var(--color-muted); background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toc-controls button:hover { background: var(--color-surface-strong); color: var(--color-ink); }
    /* TOC nested đa cấp (H2→H3→H4) — thụt lề + cỡ chữ theo cấp. */
    aside nav li.toc-item { list-style: none; }
    aside nav li.toc-item > .toc-row { display: flex; align-items: flex-start; border-radius: 6px; }
    aside nav li.toc-item > .toc-row:hover { background: var(--color-surface); }
    aside nav li.toc-item > .toc-row > a { flex: 1; display: block; text-decoration: none; padding: 5px 8px; line-height: 1.4; }
    aside nav .toc-children { margin: 0; padding: 0; }
    aside nav li.collapsed > .toc-children { display: none; }
    /* Cấp 2 (section chính) */
    aside nav > li.toc-item { margin-top: 12px; }
    aside nav > li.toc-item:first-child { margin-top: 0; }
    aside nav > li.toc-item[data-level="2"] > .toc-row > a { font-weight: 600; font-size: 13px; color: var(--color-ink); }
    aside nav > li.toc-item[data-level="2"].active > .toc-row { background: var(--color-primary-muted); }
    /* Cấp 3 */
    aside nav li.toc-item[data-level="3"] { margin-left: 12px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="3"] > .toc-row > a { font-size: 12px; color: var(--color-muted); }
    /* Cấp 4 */
    aside nav li.toc-item[data-level="4"] { margin-left: 22px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="4"] > .toc-row > a { font-size: 11.5px; color: var(--color-muted); opacity: .9; }
    aside nav li.toc-item.active > .toc-row > a { color: var(--color-ink); font-weight: 600; }
    aside nav .toggle { cursor: pointer; user-select: none; color: var(--color-muted); width: 14px; flex: 0 0 14px; text-align: center; padding-top: 5px; transition: transform .15s; }
    aside nav .toggle.leaf { visibility: hidden; }
    aside nav li.collapsed > .toc-row > .toggle { transform: rotate(-90deg); }
    main { padding: 40px 60px; max-width: 1100px; }
    main h1 { font-size: 32px; border-bottom: 2px solid var(--color-ink); padding-bottom: 12px; }
    main h2 { font-size: 24px; margin-top: 40px; border-bottom: 1px solid var(--color-hairline); padding-bottom: 6px; }
    main h3 { font-size: 18px; margin-top: 28px; color: var(--color-ink); }
    main h4 { font-size: 16px; margin-top: 20px; }
    main p, main li { font-size: 14px; }
    main code { font-family: var(--font-mono); font-size: 13px; background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }
    main pre { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 13px; }
    main pre.mermaid { background: var(--color-canvas); text-align: center; }
    main .mermaid svg { cursor: zoom-in; transition: filter .15s; max-width: 100%; }
    main img.embedded-img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
    main .mermaid svg:hover { filter: drop-shadow(0 0 6px rgba(252, 213, 53, .5)); }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
    main th, main td { border: 1px solid var(--color-hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
    main th { background: var(--color-surface); font-weight: 600; }
    main a { color: var(--color-link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main hr { border: none; border-top: 1px solid var(--color-hairline); margin: 32px 0; }
    main blockquote { border-left: 4px solid var(--color-primary); margin: 16px 0; padding: 8px 16px; background: var(--color-surface); color: var(--color-muted); }
    main details.inline-screen { border: 1px solid var(--color-hairline); border-radius: 8px; padding: 0; margin: 16px 0; background: var(--color-canvas); overflow: hidden; }
    main details.inline-screen[open] { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    main details.inline-screen > summary { cursor: pointer; padding: 12px 16px; background: var(--color-surface); font-size: 14px; user-select: none; border-bottom: 1px solid transparent; }
    main details.inline-screen[open] > summary { border-bottom-color: var(--color-hairline); }
    main details.inline-screen > summary:hover { background: var(--color-surface-strong); }
    main details.inline-screen > summary code { background: var(--color-canvas); border: 1px solid var(--color-hairline); }
    main details.inline-screen > *:not(summary) { padding-left: 16px; padding-right: 16px; }
    main details.inline-screen pre { margin: 8px 0; }
    .wf-src-tag { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
    /* HTML wireframe embed — CSS chi tiết đến từ style GỐC của file wireframe (scope .wf-embed,
       xem extract_scoped_wireframe_css) nên font-size/spacing GIỐNG bản /wireframe-html. Ở đây chỉ
       reset kế thừa + layout container để không bị body preview đè. */
    main .wf-embed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; font-size: 12px; line-height: 1.4; }
    main .wf-embed * { box-sizing: border-box; }
    main .wf-embed .wf-screen { display: inline-block; vertical-align: top; max-width: 100%; }
    main .wf-embed .wf-step-badge { display: none; }
    .meta { color: var(--color-muted); font-size: 13px; margin-bottom: 24px; }
    /* Cover page (export) — khối bìa căn giữa, viền dưới ngăn cách với nội dung. */
    main .cover { text-align: center; padding: 48px 24px 40px; margin-bottom: 24px; border-bottom: 2px solid var(--color-hairline); }
    main .cover h1 { border: none; font-size: 34px; }
    main .cover h2 { border: none; color: var(--color-muted); font-weight: 500; font-size: 17px; margin-top: 4px; }
    main .cover p { font-size: 15px; line-height: 2; }

    /* Mermaid zoom modal */
    .mermaid-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; animation: fadeIn 0.2s ease-out;
    }
    .mermaid-modal.open { display: flex; }
    .modal-svg {
      width: 95vw; height: 90vh; border-radius: 8px;
      background: var(--color-canvas); padding: 2rem; box-sizing: border-box;
      overflow: hidden;
    }
    .modal-svg svg { display: block; max-width: none !important; max-height: none !important; width: 100% !important; height: 100% !important; }
    .modal-toolbar {
      position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;
    }
    .modal-toolbar button {
      width: 40px; height: 40px; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: 6px; font-size: 1.2rem; cursor: pointer; color: var(--color-ink);
    }
    .modal-toolbar button:hover { background: var(--color-surface); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    footer { padding: 24px 60px; border-top: 1px solid var(--color-hairline); color: var(--color-muted); font-size: 13px; background: var(--color-canvas); }
    footer code { font-family: var(--font-mono); background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-hairline); }
      main { padding: 24px; }
      footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h2>Account Access</h2>
      <div class="meta">Reverse SRS Preview · 2026-10-15</div>
      <nav>
        <div class="toc-controls">
          <button type="button" onclick="setAllTocCollapsed(false)">Expand all</button>
          <button type="button" onclick="setAllTocCollapsed(true)">Collapse all</button>
        </div>
        <ol id="toc"></ol>
      </nav>
    </aside>
    <main id="content"></main>
  </div>

  <!-- Mermaid zoom modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div class="modal-toolbar">
      <button onclick="modalPanZoom && modalPanZoom.zoomIn()" title="Zoom in">＋</button>
      <button onclick="modalPanZoom && modalPanZoom.zoomOut()" title="Zoom out">－</button>
      <button onclick="modalPanZoom && (modalPanZoom.resetZoom(), modalPanZoom.center(), modalPanZoom.fit())" title="Reset">⟲</button>
      <button onclick="closeMermaidModal()" title="Close (ESC)">✕</button>
    </div>
    <div class="modal-svg"></div>
  </div>

  <footer><p>Workflow: edit MD source → save → chạy <code>python3 _scripts/build-reverse-preview.py account-access</code> để regen → refresh browser.</p></footer>

  <script>
    const OFFLINE = false;
    let modalPanZoom = null;

    // === Markdown parsing (CHỈ online — offline đã render sẵn server-side) ===
    if (!OFFLINE) {
      const MD_SOURCE = "# Account Access — Reverse SRS Preview\n\n> Bản tái lập từ nguồn · Generated 2026-10-15\n\n\n> Tái lập (chưa duyệt) · `draft` · **✅145 🔵11 🟡19**  \n> Nhãn: ✅ chắc chắn · 🔵 suy đoán · 🟡 cần xác nhận\n\n## <a id=\"sec-spec\"></a>1. Đặc tả tái lập (spec 12 Mục)\n\n> Trạng thái: `draft` (tái lập, chưa duyệt). Nhãn: ✅ chắc chắn · 🔵 suy đoán · 🟡 cần xác nhận.\n\n### 0. Truy vết nguồn & độ tin cậy\n\n- **Module:** Nền tảng (gắn tạm theo DEC-079, chốt ở PRD).\n- **Nguồn:** Tài liệu SRS - ERP Delta 3.0 (Web) (bản 30/9/2026) và Tài liệu SRS - ERP Delta 3.0 (Mobile) (bản 5/10/2026) — chi tiết ở `reverse-sources.md`.\n- **Câu hỏi mở / khác biệt:** xem `reverse-gaps.md`.\n- **Độ tin cậy:** ✅ 145 · 🔵 11 · 🟡 19 (đếm trên các dòng bảng).\n- **Trạng thái:** tái lập từ SRS cũ, **CHƯA duyệt**. ✅ nghĩa là \"SRS cũ ghi rõ\", không có nghĩa \"hệ thống đang chạy đúng như thế\".\n\n| Phần | Nguồn đã đọc |\n|---|---|\n| Đăng nhập, mật khẩu, thông tin cá nhân, ngôn ngữ | SRS Web tr.247–281, tr.160–162; SRS Mobile dòng 941–1604 |\n\n### 1. Scope\n\nPhần a của feature **Đăng nhập và tài khoản cá nhân** (Nền tảng) tái lập hiện trạng các chức năng tài khoản mà người dùng tự thực hiện trên hai kênh: **SRS Web** (phần mềm Xưởng, ERP Delta 3.0) và **SRS Mobile** (Delta Super App / Delta Partner Portal). Gồm: đăng nhập (kể cả chọn tổ chức/chi nhánh sau đăng nhập), quên mật khẩu (liên hệ IT hoặc reset bằng email), đăng xuất, đổi mật khẩu, tạo mật khẩu mới, xem thông tin cá nhân (Web, Mobile nội bộ, Mobile tài khoản cây dầu) và đổi ngôn ngữ giao diện (Web). ✅ [SRS Web tr.247 — Epic 01 Quản lý tài khoản cá nhân; SRS Mobile tr.42 — Epic 01 Quản lý tài khoản]\n\nHai kênh cùng nói về một số điểm nhưng lệch nhau ở nhiều chỗ (ngưỡng khoá tài khoản 5/10 lần, link/OTP khi reset bằng email, câu chữ thông báo, sắp xếp chi nhánh, xác nhận đăng xuất). Mọi điểm lệch được ghi cả hai phía kèm Conflict ở `gaps.md`, không tự chọn. Nguồn nhắc nhiều tên gọi cho cùng ứng dụng (Delta Super App, Delta Partner Portal, ứng dụng lái xe Delta) và cho hệ thống nhận mật khẩu mới (ERP Delta, PMX); tài liệu giữ đúng tên theo nguồn. ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu; SRS Web tr.272 — UC01.04 Đổi mật khẩu]\n\nLát nguồn này không có bảng \"Thay đổi …\" nên không có Mục 0.3, và không có bảng \"Thông báo & Lịch sử hoạt động\" riêng; các email/popup/toast tự động nằm trong FR và Error Matrix.\n\nNgoài phạm vi:\n- Cấp tài khoản mới, khoá/mở khoá/vô hiệu hoá tài khoản do quản trị, phân quyền, quản lý mật khẩu mặc định (nguồn chỉ nhắc tài khoản có thể ở các trạng thái này, không có use case trong lát). 🟡 [SRS Web tr.248 — UC01.01 Đăng nhập]\n- Màn Module Menu, Home nội bộ, Home Partner Portal (UC-PP.01) sau đăng nhập. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n- Phạm vi, bộ lọc và dữ liệu đầy đủ của Lịch sử hoạt động của nhân viên (nguồn chỉ có hình mẫu trên Mobile, Web không có hình). 🟡 [SRS Mobile tr.74 — hình màn Lịch sử hoạt động UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n- Mục \"Tài liệu\" trong menu avatar Web (chỉ thấy trên ảnh, không có mô tả). 🟡 [SRS Web tr.161 — hình menu avatar UC02.03.01 Thay đổi ngôn ngữ]\n- Sửa thông tin cây dầu (qua CBQL trên Delta ERP, UC12.04.06) và chi tiết UC12.04.05. ✅ [SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- Đổi ngôn ngữ trên Mobile (lát không có mục tương ứng). 🟡 [SRS Mobile tr.42 — Epic 01 Quản lý tài khoản]\n\n### 2. Actors & Stakeholders\n\n| Actor | Loại (người/hệ thống/ngoài) | Mục tiêu | Trong scope? | Nguồn | Nhãn |\n|---|---|---|---|---|---|\n| Người dùng chưa đăng nhập (mọi role) — Web | người | Đăng nhập vào phần mềm Xưởng trên web | Có | SRS Web tr.248 — UC01.01 Đăng nhập | ✅ |\n| Người dùng ứng dụng Delta Super App / Delta Partner Portal (mọi role) — Mobile | người | Đăng nhập vào ứng dụng; gồm tài khoản nội bộ và tài khoản đối tác | Có | SRS Mobile tr.43 — UC01.01.01 Đăng nhập | ✅ |\n| Người dùng phần mềm Xưởng (đã đăng nhập) | người | Đăng xuất, đổi mật khẩu, xem thông tin cá nhân, đổi ngôn ngữ, quên/tạo mật khẩu | Có | SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Web tr.267 — UC01.03 Đăng xuất; SRS Web tr.269 — UC01.04 Đổi mật khẩu; SRS Web tr.160 — UC02.03.01 Thay đổi ngôn ngữ | ✅ |\n| Người dùng ứng dụng lái xe Delta / Delta Super App (tài khoản nội bộ) | người | Quên mật khẩu, đăng xuất, đổi mật khẩu, tạo mật khẩu mới, xem thông tin cá nhân | Có | SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.60 — UC01.01.03 Đăng xuất; SRS Mobile tr.71 — UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ | ✅ |\n| Nhân viên cây dầu mua ngoài (tài khoản đối tác loại Cây dầu) | người | Xem thông tin tài khoản của mình và đăng xuất | Có | SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản - Tài khoản cây dầu | ✅ |\n| Bộ phận IT phần mềm ERP Delta | người | Nhận email yêu cầu hỗ trợ đặt lại mật khẩu và reset mật khẩu | Có | SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu | ✅ |\n| Admin | người | Được người dùng liên hệ khi tài khoản bị khoá hoặc chưa được phân quyền | Có (chỉ được nhắc tên trong thông báo) | SRS Web tr.257 — UC01.01 Đăng nhập | ✅ |\n| Hệ thống PMX | hệ thống | Nhận mật khẩu mới cập nhật từ ERP (sau khi IT reset và sau khi tạo mật khẩu mới; ở Đổi mật khẩu nguồn chỉ nhắc ERP Delta) | Có | SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Web tr.272 — UC01.04 Đổi mật khẩu; SRS Web tr.274 — hình lưu đồ UC01.05 Tạo mật khẩu mới | 🔵 |\n| ERP Delta | hệ thống | Cập nhật mật khẩu mới, gọi API sang PMX | Có | SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Web tr.272 — UC01.04 Đổi mật khẩu | 🔵 |\n| Hệ thống gửi email | hệ thống | Gửi email yêu cầu hỗ trợ cho IT; email link/OTP cho người dùng | Có | SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.56 — UC01.01.02 Quên mật khẩu | 🔵 |\n\n### 3. Functional Requirements (FR)\n\n| ID | Title | Description | Priority | Verify by | Nguồn | Nhãn |\n|---|---|---|---|---|---|---|\n| FR-account-access-001 | Đăng nhập bằng tài khoản và mật khẩu | Người dùng nhập **Tên tài khoản** và **Mật khẩu** rồi bấm \"Đăng nhập\". Hệ thống kiểm tra tính hợp lệ của tên tài khoản và mật khẩu trước khi cho vào. Đúng và tài khoản không dùng mật khẩu mặc định → vào bước phân luồng tổ chức (FR-account-access-012) hoặc phân luồng đối tác (FR-account-access-015). Đúng và tài khoản đang dùng mật khẩu mặc định → vào màn Tạo mật khẩu mới (FR-account-access-011). Sai → FR-account-access-006. Web: ô tài khoản nhận **tên tài khoản hoặc email** (placeholder \"Tên tài khoản hoặc Email\"). Mobile: chỉ ghi \"Tên tài khoản\". Nút \"Đăng nhập\" Web: full-width, nền xanh lá đậm, chữ đậm. | — | — | SRS Web tr.250 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập; SRS Mobile tr.46 — UC01.01.01 Đăng nhập; SRS Mobile tr.48 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-002 | Chuyển về trang đăng nhập khi chưa có phiên | Web: người dùng vào hệ thống khi chưa có phiên hợp lệ thì tự chuyển về trang đăng nhập (trang mặc định khi chưa có phiên). Mobile: khởi động app → Splash → (Onboarding lần đầu) → màn Đăng nhập khi không có phiên. | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-003 | Màn Splash khi mở app (Mobile) | Khi vào ứng dụng hiển thị màn Splash 3 giây (hoặc đến khi tài nguyên chính tải xong), không có tương tác, rồi tự chuyển tiếp: kiểm tra phiên; có phiên hợp lệ thì bỏ qua Onboarding và Đăng nhập, kiểm tra tổ chức; không có phiên thì sang Onboarding. | — | — | SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.45 — UC01.01.01 Đăng nhập (màn hình Splash) | ✅ |\n| FR-account-access-004 | Màn Onboarding lần đầu (Mobile) | Chỉ hiển thị lần đầu cài app hoặc sau khi xoá dữ liệu. Có nội dung giới thiệu ngắn về ứng dụng và nút CTA \"Đăng nhập\" dẫn tới màn Đăng nhập. | — | — | SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.46 — UC01.01.01 Đăng nhập (màn hình Onboarding) | ✅ |\n| FR-account-access-005 | Ghi nhớ đăng nhập | Checkbox \"Ghi nhớ đăng nhập\", mặc định không chọn (Web ghi \"Unchecked\"; Mobile bảng ghi giá trị mặc định \"Enable\" nhưng ảnh Mobile thấy ô chưa chọn — xem Conflict). Web: chọn → phiên lưu lâu dài, không hết hạn khi đóng tab; bỏ chọn → phiên hết hạn khi đóng trình duyệt. Mobile: chọn → phiên không hết hạn khi đóng app; bỏ chọn → phiên hết hạn khi đóng app. Điều kiện sau đăng nhập Web: phiên được lưu theo tuỳ chọn này. | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.251 — UC01.01 Đăng nhập; SRS Mobile tr.47 — UC01.01.01 Đăng nhập; SRS Mobile tr.46 — hình màn Đăng nhập UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-006 | Báo lỗi khi đăng nhập sai và đếm lượt thử | Thông tin đăng nhập sai → hiển thị lỗi inline dưới các ô, kèm số lần thử còn lại (câu chữ ở E-account-access-001), trừ 1 lần thử, mật khẩu bị xoá để nhập lại (Web). Thông báo tự ẩn khi người dùng bắt đầu nhập lại (Web). Mobile ghi \"Trừ 1 lần thử\". Mobile: ảnh minh hoạ nút Đăng nhập cho thấy lỗi theo từng ô — ô Tên tài khoản hiện \"Tài khoản không hợp lệ\", ô Mật khẩu hiện \"Mật khẩu không đúng\" (E-account-access-021, E-account-access-022), bên cạnh câu gộp ở E-account-access-001 (xem Conflict). | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập; SRS Mobile tr.48 — UC01.01.01 Đăng nhập; SRS Mobile tr.48 — hình lỗi inline UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-007 | Khoá tài khoản khi nhập sai quá nhiều lần | Nhập sai mật khẩu vượt ngưỡng thì hệ thống khoá tài khoản; đăng nhập lại tài khoản đã khoá hiện lỗi (E-account-access-002 hoặc E-account-access-003) và không đăng nhập tiếp được. Ngưỡng: Web \"quá 5 lần\", Mobile \"quá 10 lần\" / \"Sai ≥ 10 lần\" (xem Conflict ở `gaps.md`). | — | — | SRS Web tr.251 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập; SRS Mobile tr.47 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-008 | Chặn đăng nhập tài khoản không đủ điều kiện | (1) Tài khoản bị khoá / vô hiệu hoá → lỗi inline dưới ô Mật khẩu (E-account-access-003). (2) Tài khoản không có quyền truy cập chi nhánh nào → lỗi inline dưới ô Mật khẩu (E-account-access-004). (3) Tài khoản không có quyền truy cập phần mềm xưởng (Web) / ứng dụng Delta (Mobile) → hiện màn lỗi (E-account-access-005) kèm nút \"Quay về đăng nhập\" (Web). | — | — | SRS Web tr.253 — UC01.01 Đăng nhập; SRS Web tr.254 — hình lỗi UC01.01 Đăng nhập; SRS Web tr.257 — UC01.01 Đăng nhập; SRS Mobile tr.48 — UC01.01.01 Đăng nhập | ✅ (Web); 🟡 (Mobile — hình lỗi trống trong bản nguồn) |\n| FR-account-access-009 | Kiểm tra trước khi gọi hệ thống và chống bấm lặp (Web) | Trước khi gọi API xác thực, Web kiểm tra phía màn hình: có trường trống thì hiện lỗi inline tương ứng và không gọi API (câu chữ không có trong nguồn). Khi đang gọi API, nút \"Đăng nhập\" hiện spinner và bị khoá. | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập | ✅ |\n| FR-account-access-010 | Hiện/ẩn mật khẩu | Biểu tượng \"mắt\" ở ô mật khẩu: bấm để hiện mật khẩu dạng chữ, bấm lại để ẩn. Mặc định ẩn. Áp dụng ở màn Đăng nhập (Web và Mobile), Đổi mật khẩu (ô Mật khẩu cũ — Web và Mobile) và Tạo mật khẩu mới (Web và Mobile); nguồn ghi mô tả \"mật khẩu cũ\" cho biểu tượng ở màn Tạo mật khẩu mới. Bảng nguồn chỉ liệt kê biểu tượng cho ô Mật khẩu cũ (Đổi mật khẩu) và ô Mật khẩu mới (Tạo mật khẩu mới); ảnh cho thấy: Web Đổi mật khẩu có mắt ở cả 3 ô, Mobile Đổi mật khẩu có mắt ở cả 3 ô, Web Tạo mật khẩu mới chỉ có mắt ở ô Xác nhận mật khẩu mới, Mobile Tạo mật khẩu mới có mắt ở 2 ô mật khẩu (bảng và ảnh lệch nhau — xem Conflict). | — | — | SRS Web tr.251 — UC01.01 Đăng nhập; SRS Web tr.271 — UC01.04 Đổi mật khẩu; SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.47 — UC01.01.01 Đăng nhập; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu; SRS Mobile tr.68 — UC01.01.05 Tạo mật khẩu mới; SRS Web tr.270 — hình màn Đổi mật khẩu UC01.04 Đổi mật khẩu; SRS Web tr.274 — hình màn Tạo mật khẩu mới UC01.05 Tạo mật khẩu mới; SRS Mobile tr.63 — hình màn Đổi mật khẩu UC01.01.04 Đổi mật khẩu; SRS Mobile tr.67 — hình màn Tạo mật khẩu mới UC01.01.05 Tạo mật khẩu mới | ✅ |\n| FR-account-access-011 | Bắt tạo mật khẩu mới khi dùng mật khẩu mặc định | Đăng nhập đúng nhưng tài khoản đang dùng mật khẩu mặc định → không vào hệ thống mà chuyển sang màn Tạo mật khẩu mới (UC Tạo mật khẩu mới, FR-account-access-032). | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-012 | Phân luồng theo số tổ chức/chi nhánh (tài khoản nội bộ) | Sau đăng nhập đúng, hệ thống kiểm tra số tổ chức/chi nhánh tài khoản được truy cập. Chỉ 1 chi nhánh → tự chọn và vào thẳng Module Menu (Web) / Home nội bộ (Mobile), không hiện chọn tổ chức. ≥2 chi nhánh hoặc ≥2 tổ chức → hiện Modal (Web) / Bottom Sheet (Mobile) Chọn tổ chức. | — | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-013 | Chọn tổ chức/chi nhánh sau đăng nhập | Cửa sổ chọn tổ chức gồm: tiêu đề \"Chọn tổ chức\"; option **Công ty mẹ/Tổ chức** (thẻ radio có biểu tượng + tên + \"[X] chi nhánh\"); dòng phân cách \"HOẶC CHỌN CHI NHÁNH CỤ THỂ\"; ô tìm kiếm chi nhánh; danh sách chi nhánh (thẻ: avatar chữ tắt + tên chi nhánh + tỉnh thành); trạng thái trống tìm kiếm (E-account-access-009); nút Huỷ và nút Chọn (Web) / Xác nhận (Mobile). Chọn xong → vào Module Menu / Home của tổ chức hoặc chi nhánh đã chọn. Huỷ (hoặc ✕ trên Web) → đăng xuất, quay về màn Đăng nhập. | — | — | SRS Web tr.254 — UC01.01 Đăng nhập; SRS Web tr.255 — UC01.01 Đăng nhập; SRS Web tr.256 — UC01.01 Đăng nhập; SRS Mobile tr.49 — UC01.01.01 Đăng nhập; SRS Mobile tr.50 — UC01.01.01 Đăng nhập; SRS Mobile tr.51 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-014 | Nhớ lựa chọn tổ chức qua phiên (Mobile) | Bấm \"Xác nhận\" → vào Home của tổ chức/chi nhánh đã chọn; phiên lưu lựa chọn, lần đăng nhập sau tự bỏ qua Bottom Sheet nếu tài khoản vẫn còn quyền. Web không nói điều này. | — | — | SRS Mobile tr.51 — UC01.01.01 Đăng nhập | ✅ (Mobile); 🟡 (Web không nói) |\n| FR-account-access-015 | Phân luồng tài khoản đối tác (Mobile) | Tài khoản đối tác không qua màn chọn tổ chức; hệ thống tự xác định loại tài khoản đối tác và vào thẳng Home tương ứng. Hiện hỗ trợ loại Cây dầu → Home Partner Portal (UC-PP.01); các loại khác sẽ bổ sung theo UC tương ứng. | — | — | SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập | ✅ |\n| FR-account-access-016 | Xử lý phiên hết hạn khi đang dùng (Web) | Phiên hết hạn khi đang dùng → chuyển về trang đăng nhập kèm banner thông tin xanh dương phía trên form với câu chữ E-account-access-006. | — | — | SRS Web tr.257 — UC01.01 Đăng nhập | ✅ |\n| FR-account-access-017 | Bỏ qua trang đăng nhập khi đã có phiên (Web) | Truy cập URL đăng nhập khi đã có phiên hợp lệ → chuyển thẳng đến màn Module Menu, bỏ qua trang đăng nhập. | — | — | SRS Web tr.257 — UC01.01 Đăng nhập | ✅ |\n| FR-account-access-018 | Báo lỗi hệ thống và mất mạng khi đăng nhập (Web) | Lỗi máy chủ (5xx) khi gọi API đăng nhập → toast lỗi E-account-access-007. Mất kết nối internet khi bấm Đăng nhập → toast lỗi E-account-access-008. | — | — | SRS Web tr.257 — UC01.01 Đăng nhập | ✅ |\n| FR-account-access-019 | Mở luồng Quên mật khẩu từ màn Đăng nhập | Nút \"Quên mật khẩu\" (hoặc \"Quên mật khẩu?\") ở màn Đăng nhập mở popup Quên mật khẩu / màn Chọn cách lấy lại mật khẩu gồm hai nút: **Liên hệ IT** và **Reset mật khẩu** (hình Mobile ghi nhãn \"Đặt lại mật khẩu\"). | — | — | SRS Web tr.249 — UC01.01 Đăng nhập; SRS Web tr.252 — UC01.01 Đăng nhập; SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.47 — UC01.01.01 Đăng nhập; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.52 — hình màn Chọn cách lấy lại mật khẩu UC01.01.02 | ✅ |\n| FR-account-access-020 | Nhập tên tài khoản để lấy lại mật khẩu | Cả hai nhánh (Liên hệ IT, Reset bằng email) qua màn Nhập tên tài khoản (ô bắt buộc). Hệ thống đối chiếu với các tài khoản đang có: đúng → hiện Họ và tên và Tên tài khoản (nhãn \"Tài khoản\", mặc định no data); sai → lỗi E-account-access-010. Chỉ tài khoản có trạng thái Đang hoạt động mới được đổi mật khẩu. Ảnh popup Web: \"Liên hệ IT\" có lời dẫn \"Vui lòng nhập tên tài khoản phía dưới, chúng tôi sẽ liên hệ IT và mở lại tài khoản sớm nhất.\"; \"Reset mật khẩu\" có lời dẫn \"Vui lòng nhập email của bạn phía dưới và làm theo hướng dẫn để mở lại tài khoản sớm nhất.\" (lời dẫn nói \"email\" nhưng ô ghi \"Tên tài khoản\" — xem Conflict). Thời điểm kiểm tra: Web sau khi người dùng dừng gõ 1 giây; Mobile sau khi bấm \"Kết thúc nhập\". | — | — | SRS Web tr.262 — UC01.02 Quên mật khẩu; SRS Mobile tr.54 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu; SRS Web tr.261 — hình popup UC01.02 Quên mật khẩu | ✅ |\n| FR-account-access-021 | Quên mật khẩu — Liên hệ IT | Bấm \"Xác nhận\" khi đã nhập đúng tài khoản → hiện màn \"Gửi tài khoản thành công\" và hệ thống tự gửi email tới email IT Delta (nội dung ở BR-account-access-020: tên tài khoản, tên người dùng, thời gian yêu cầu). Câu chữ màn kết quả ở BR-account-access-039. Điều kiện sau: thông báo reset mật khẩu được gửi tới bộ phận IT phần mềm ERP Delta. | — | — | SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu | ✅ |\n| FR-account-access-022 | IT reset mật khẩu cho người dùng | Sau khi IT reset, ERP gọi API cho PMX để cập nhật mật khẩu mới mà IT đã reset; khi đó trạng thái tài khoản chuyển sang \"Cấp mới\". Nguồn không mô tả IT thao tác ở màn nào. | — | — | SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu | ✅ |\n| FR-account-access-023 | Quên mật khẩu — Reset bằng email (Web: link) | Bấm \"Xác nhận\" khi đã nhập đúng tài khoản → hiện màn \"Kiểm tra hòm thư\"; hệ thống tự tạo và gửi email có đường link để người dùng truy cập và đổi mật khẩu (màn Tạo mật khẩu m lưu đồ UC01.04 Đổi mật khẩu; SRS Mobile tr.62 — hình lưu đồ UC01.01.04 Đổi mật khẩu]\n- Tạo mật khẩu mới (3 đường vào). [SRS Web tr.274 — hình lưu đồ UC01.05 Tạo mật khẩu mới; SRS Mobile tr.67 — hình lưu đồ UC01.01.05 Tạo mật khẩu mới]\n- Xem thông tin cá nhân (Web và Mobile nội bộ, kể cả mở Lịch sử hoạt động / Đổi mật khẩu). [SRS Web tr.278 — hình lưu đồ UC01.06 Xem thông tin cá nhân; SRS Mobile tr.71 — hình lưu đồ UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n- Xem thông tin tài khoản cây dầu và đăng xuất. [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- Đổi ngôn ngữ. [SRS Web tr.160 — hình lưu đồ UC02.03.01 Thay đổi ngôn ngữ]\n\n### 10. Screens\n\n- **Web — Đăng nhập** — vào hệ thống bằng tên tài khoản/email và mật khẩu — ảnh hero (cột trái, overlay tối, tiêu đề \"Kết nối quy trình · Nâng cao hiệu suất\"), logo Delta International, tiêu đề \"Mừng bạn trở lại!\", mô tả \"Vui lòng nhập thông tin tài khoản và mật khẩu bên dưới để tiếp tục.\", ô Tên tài khoản/Email,  ô Mật khẩu + biểu tượng mắt, checkbox Ghi nhớ đăng nhập, nút Quên mật khẩu, nút Đăng nhập — SRS Web tr.249 — UC01.01 Đăng nhập; SRS Web tr.250 — UC01.01 Đăng nhập; SRS Web tr.251 — UC01.01 Đăng nhập; SRS Web tr.252 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập ✅\n- **Web — Modal Chọn tổ chức** — chọn phạm vi truy cập — tiêu đề \"Chọn tổ chức\" + ✕, option công ty mẹ, dòng \"HOẶC CHỌN CHI NHÁNH CỤ THỂ\", ô \"Tìm kiếm chi nhánh\", lưới thẻ chi nhánh 2 cột, nút Huỷ (~40%, ảnh ghi \"Hủy\"), nút Chọn (~60%); option công ty mẹ có icon lấy 2 chữ cái đầu của tên viết tắt chi nhánh, icon và tên + số chi nhánh cố định theo giao diện (bảng); ảnh thấy dòng \"[X] chi nhánh\" dưới tên — SRS Web tr.254 — UC01.01 Đăng nhập; SRS Web tr.255 — UC01.01 Đăng nhập; SRS Web tr.256 — UC01.01 Đăng nhập ✅\n- **Web — Màn lỗi không có quyền đăng nhập** — thông báo E-account-access-005, nút \"Quay về đăng nhập\" — SRS Web tr.254 — hình lỗi UC01.01 Đăng nhập ✅\n- **Web — Banner phiên hết hạn trên t flow riêng.\n\n#### Sequence — Đăng nhập\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống\n    ND->>HT: Mở hệ thống (Web) / mở app (Mobile)\n    Note over HT: Mobile: Splash 3 giây, Onboarding nếu lần đầu\n    alt Có phiên hợp lệ\n        HT-->>ND: Bỏ qua đăng nhập, kiểm tra tổ chức\n    else Chưa có phiên\n        HT-->>ND: Hiện màn Đăng nhập\n        ND->>HT: Nhập tên tài khoản + mật khẩu, bấm Đăng nhập\n        alt Có trường trống (Web)\n            HT-->>ND: Lỗi inline từng ô, không gọi xác thực (E-account-access-020)\n        else Đủ thông tin\n            HT->>HT: Xác thực tên tài khoản và mật khẩu\n            alt Lỗi máy chủ hoặc mất mạng (Web)\n                HT-->>ND: Toast lỗi (E-account-access-007 / E-account-access-008)\n            else Sai thông tin\n                HT-->>ND: Lỗi còn [N] lần thử, xoá mật khẩu (E-account-access-001)\n            else Tài khoản bị khoá hoặc vô hiệu hoá\n                HT-->>ND: Lỗi liên hệ Admin (E-account-access-002 / E-account-access-003)\n            else Không có quyền truy cập\n                HT-->>ND: Lỗi không có quyền (E-account-access-004 / E-account-access-005)\n            else Đúng và dùng mật khẩu mặc định\n                HT-->>ND: Chuyển sang Tạo mật khẩu mới\n            else Đúng\n                HT->>HT: Xác định loại tài khoản và số chi nhánh\n                HT-->>ND: Vào Module Menu / Home hoặc hiện chọn tổ chức\n            end\n        end\n    end\n```\n\n#### Activity — Đăng nhập\n```mermaid\nflowchart TD\n    A([\"Mở hệ thống / mở app\"]) --> M{\"Mobile?\"}\n    M -->|\"Có\"| S[\"Splash 3 giây\"]\n    S --> P1{\"Có phiên hợp lệ?\"}\n    M -->|\"Không (Web)\"| P1\n    P1 -->|\"Có\"| ORG[\"Kiểm tra tổ chức\"]\n    P1 -->|\"Không\"| ONB{\"Mobile lần đầu?\"}\n    ONB -->|\"Có\"| ONB2[\"Onboarding, bấm Đăng nhập\"]\n    ONB -->|\"Không\"| L[\"Màn Đăng nhập\"]\n    ONB2 --> L\n    L --> IN[\"Nhập tên tài khoản + mật khẩu, bấm Đăng nhập\"]\n    IN --> V{\"Có trường trống? (Web)\"}\n    V -->|\"Có\"| VE[\"Lỗi inline từng ô, không gọi API\"]\n    VE --> L\n    V -->|\"Không\"| AUTH[\"Hệ thống xác thực\"]\n    AUTH --> R{\"Kết quả\"}\n    R -->|\"Lỗi 5xx hoặc mất mạng (Web)\"| TE[\"Toast lỗi\"]\n    TE --> L\n    R -->|\"Sai thông tin\"| WR[\"Lỗi còn N lần thử, xoá mật khẩu\"]\n    WR --> LK{\"Vượt ngưỡng sai? (Web 5 / Mobile 10)\"}\n    LK -->|\"Có\"| LOCK[\"Khoá tài khoản\"]\n    LK -->|\"Không\"| L\n    R -->|\"Tài khoản khoá hoặc vô hiệu hoá\"| LOCK2[\"Lỗi liên hệ Admin\"]\n    R -->|\"Không có quyền truy cập\"| NP[\"Lỗi không có quyền\"]\n    R -->|\"Đúng + mật khẩu mặc định\"| NEWPW[\"Chuyển sang Tạo mật khẩu mới\"]\n    R -->|\"Đúng\"| TYPE{\"Loại tài khoản (Mobile)\"}\n    TYPE -->|\"Nội bộ hoặc Web\"| ORG\n    TYPE -->|\"Đối tác (Cây dầu)\"| HP[\"Vào Home Partner Portal\"]\n    ORG --> CNT{\"Số chi nhánh/tổ chức\"}\n    CNT -->|\"1 chi nhánh\"| HOME[\"Vào Module Menu / Home nội bộ\"]\n    CNT -->|\"2 trở lên\"| SEL[\"Chọn tổ chức (flow riêng)\"]\n    LOCK --> KetThuc([\"Kết thúc\"])\n    LOCK2 --> KetThuc\n    NP --> KetThuc\n    NEWPW --> KetThuc\n    HP --> KetThuc\n    HOME --> KetThuc\n    SEL --> KetThuc\n```\n\n### Flow: Chọn tổ chức/chi nhánh sau đăng nhập\n\n> Nguồn: SRS Web tr.254 — UC01.01 Đăng nhập (Modal Chọn tổ chức); SRS Web tr.255 — UC01.01 Đăng nhập; SRS Web tr.256 — UC01.01 Đăng nhập; SRS Web tr.257 — UC01.01 Đăng nhập; SRS Mobile tr.49 — UC01.01.01 Đăng nhập; SRS Mobile tr.50 — UC01.01.01 Đăng nhập; SRS Mobile tr.51 — UC01.01.01 Đăng nhập. Chỉ tài khoản nội bộ.\n\n#### Sequence — Chọn tổ chức/chi nhánh\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống\n    HT-->>ND: Hiện Modal (Web) / Bottom Sheet (Mobile) Chọn tổ chức\n    Note over HT,ND: Không đóng được bằng click nền hoặc kéo xuống\n    opt Muốn tìm chi nhánh\n        ND->>HT: Gõ vào ô tìm kiếm\n        HT-->>ND: Lọc gần đúng theo thời gian thực\n    end\n    alt Không có kết quả tìm\n        HT-->>ND: Không tìm thấy chi nhánh phù hợp (E-account-access-009)\n    end\n    alt Bấm Huỷ (hoặc ✕ trên Web)\n        ND->>HT: Huỷ\n        HT-->>ND: Đăng xuất, về màn Đăng nhập\n    else Chọn công ty mẹ hoặc 1 chi nhánh\n        ND->>HT: Chọn option rồi bấm Chọn / Xác nhận\n        HT-->>ND: Vào Module Menu / Home của phạm vi đã chọn\n        Note over HT: Mobile lưu lựa chọn cho lần sau (🟡 Web không nói)\n    end\n```\n\n#### Activity — Chọn tổ chức/chi nhánh\n```mermaid\nflowchart TD\n    A([\"Đăng nhập đúng, có 2 chi nhánh trở lên hoặc 2 tổ chức\"]) --> B[\"Hiện Modal / Bottom Sheet Chọn tổ chức\"]\n    B --> C{\"Tài khoản có quyền toàn bộ tổ chức?\"}\n    C -->|\"Có\"| D[\"Hiện option công ty mẹ + dòng HOẶC CHỌN CHI NHÁNH CỤ THỂ\"]\n    C -->|\"Không\"| E[\"Chỉ hiện danh sách chi nhánh\"]\n    D --> F[\"Người dùng chọn 1 option hoặc tìm kiếm\"]\n    E --> F\n    F --> G{\"Hành động\"}\n    G -->|\"Tìm kiếm không có kết quả\"| H[\"Hiện: Không tìm thấy chi nhánh phù hợp\"]\n    H --> F\n    G -->|\"Huỷ hoặc ✕\"| I[\"Đăng xuất, về màn Đăng nhập\"]\n    G -->|\"Chọn 1 option\"| J[\"Nút Chọn / Xác nhận được bật\"]\n    J --> K[\"Bấm Chọn / Xác nhận\"]\n    K --> L[\"Vào Module Menu / Home của phạm vi đã chọn\"]\n    I --> KetThuc([\"Kết thúc\"])\n    L --> KetThuc\n```\n\n### Flow: Quên mật khẩu — Liên hệ IT\n\n> Nguồn: SRS Web tr.259 — hình lưu đồ UC01.02 Quên mật khẩu; SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu. Bước \"IT reset\" suy từ câu \"ERP call API cho PMX để update mật khẩu mới mà IT đã reset\" (🟡).\n\n#### Sequence — Quên mật khẩu, Liên hệ IT\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống\n    actor IT as IT Delta\n    participant PMX as PMX\n    ND->>HT: Bấm Quên mật khẩu ở màn Đăng nhập\n    HT-->>ND: Hiện lựa chọn cách lấy lại mật khẩu\n    ND->>HT: Chọn Liên hệ IT\n    HT-->>ND: Hiện màn Nhập tên tài khoản\n    ND->>HT: Nhập tên tài khoản, bấm Xác nhận\n    alt Tên tài khoản sai\n        HT-->>ND: Tên tài khoản không chính xác (E-account-access-010)\n    else Tài khoản không ở trạng thái Đang hoạt động\n        HT-->>ND: Không cho đổi mật khẩu (câu lỗi không có trong nguồn 🟡)\n    else Gửi quá nhanh (dưới 1 phút)\n        HT-->>ND: Popup lỗi 1 lần mỗi phút (E-account-access-011)\n    else Hợp lệ\n        HT->>IT: Email Yêu cầu hỗ trợ đặt lại mật khẩu tài khoản Delta\n        HT-->>ND: Màn Gửi tài khoản thành công\n        ND->>HT: Bấm Quay về đăng nhập\n        Note over IT,PMX: IT reset, ERP gọi API cập nhật mật khẩu sang PMX, trạng thái Cấp mới (🟡)\n    end\n```\n\n#### Activity — Quên mật khẩu, Liên hệ IT\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: màn Đăng nhập\"]) --> B[\"Bấm Quên mật khẩu\"]\n    B --> C[\"Hiện popup Chọn cách lấy lại mật khẩu\"]\n    C --> D[\"Bấm Liên hệ IT\"]\n    D --> E[\"Màn Nhập tên tài khoản\"]\n    E --> F[\"Nhập tên tài khoản, bấm Xác nhận\"]\n    F --> G{\"Tên tài khoản đúng?\"}\n    G -->|\"Không\"| H[\"Lỗi: Tên tài khoản không chính xác\"]\n    G -->|\"Có\"| GA{\"Tài khoản Đang hoạt động?\"}\n    GA -->|\"Không\"| GB[\"Không cho đổi mật khẩu (câu lỗi không có trong nguồn 🟡)\"]\n    H --> E\n    GA -->|\"Có\"| I{\"Đã gửi trong vòng 1 phút?\"}\n    I -->|\"Có\"| J[\"Popup lỗi tối đa 1 lần mỗi phút\"]\n    J --> E\n    I -->|\"Không\"| K[\"Gửi email tới IT Delta\"]\n    K --> L[\"Màn Gửi tài khoản thành công\"]\n    L --> M[\"Quay về đăng nhập\"]\n    K --> N[\"IT reset, ERP cập nhật mật khẩu sang PMX, trạng thái Cấp mới (🟡)\"]\n    M --> KetThuc([\"Kết thúc\"])\n    N --> KetThuc\n```\n\n### Flow: Quên mật khẩu — Reset bằng email (Web, gửi link)\n\n> Nguồn: SRS Web tr.259 — hình lưu đồ UC01.02 Quên mật khẩu; SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Web tr.264 — UC01.02 Quên mật khẩu; SRS Web tr.265 — UC01.02 Quên mật khẩu. Bước người dùng bấm link rồi vào Tạo mật khẩu mới suy từ UC01.05 TH3 (🔵).\n\n#### Sequence — Reset bằng email (link)\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống\n    participant EM as Email\n    ND->>HT: Quên mật khẩu rồi chọn Reset mật khẩu\n    HT-->>ND: Màn Nhập tên tài khoản\n    ND->>HT: Nhập tên tài khoản, bấm Xác nhận\n    alt Tên tài khoản sai\n        HT-->>ND: Tên tài khoản không chính xác (E-account-access-010)\n    else Tài khoản không ở trạng thái Đang hoạt động\n        HT-->>ND: Không cho đổi mật khẩu (câu lỗi không có trong nguồn 🟡)\n    else Gửi quá nhanh\n        HT-->>ND: Popup lỗi 1 lần mỗi phút (E-account-access-011)\n    else Hợp lệ\n        HT->>EM: Gửi email kèm đường link đổi mật khẩu\n        HT-->>ND: Màn Kiểm tra hòm thư\n        ND->>HT: Bấm Quay về đăng nhập\n        EM-->>ND: Email Yêu cầu reset mật khẩu cho tài khoản Delta\n        ND->>HT: Bấm link trong email (🔵)\n        HT-->>ND: Màn Tạo mật khẩu mới (TH3)\n    end\n```\n\n#### Activity — Reset bằng email (link)\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: màn Đăng nhập\"]) --> B[\"Bấm Quên mật khẩu rồi Reset mật khẩu\"]\n    B --> C[\"Màn Nhập tên tài khoản\"]\n    C --> D[\"Nhập tên tài khoản, bấm Xác nhận\"]\n    D --> E{\"Tên tài khoản đúng?\"}\n    E -->|\"Không\"| F[\"Lỗi: Tên tài khoản không chính xác\"]\n    E -->|\"Có\"| EA{\"Tài khoản Đang hoạt động?\"}\n    EA -->|\"Không\"| EB[\"Không cho đổi mật khẩu (câu lỗi không có trong nguồn 🟡)\"]\n    F --> C\n    EA -->|\"Có\"| G{\"Đã gửi trong vòng 1 phút?\"}\n    G -->|\"Có\"| H[\"Popup lỗi tối đa 1 lần mỗi phút\"]\n    H --> C\n    G -->|\"Không\"| I[\"Gửi email reset tới email của tài khoản\"]\n    I --> J[\"Màn Kiểm tra hòm thư\"]\n    J --> K[\"Bấm Quay về đăng nhập\"]\n    I --> L[\"Người dùng mở email, bấm link (🔵)\"]\n    L --> M[\"Màn Tạo mật khẩu mới\"]\n    K --> KetThuc([\"Kết thúc\"])\n    M --> KetThuc\n```\n\n### Flow: Quên mật khẩu — Reset bằng email (Mobile, mã OTP)\n\n> Nguồn: SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.56 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.57 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.59 — UC01.01.02 Quên mật khẩu. Mục \"Lưu đồ hoạt động\" của UC này không có hình trong bản nguồn nên flow dựng từ bảng mô tả màn (🔵).\n\n#### Sequence — Reset bằng email (OTP)\n```mermaid\nsequenceDiagram\n    actor ND as Người dùng\n    participant HT as Hệ thống\n    participant EM as Email\n    ND->>HT: Quên mật khẩu rồi chọn Reset mật khẩu\n    HT-->>ND: Màn Nhập tên tài khoản\n    ND->>HT: Nhập tên tài khoản, bấm Xác nhận\n    alt Tên tài khoản sai\n        HT-->>ND: Tên tài khoản không chính xác (E-account-access-010)\n    else Tài khoản không ở trạng thái Đang hoạt động\n        HT-->>ND: Không cho đổi mật khẩu (câu lỗi không có trong nguồn 🟡)\n    else Gửi quá nhanh\n        HT-->>ND: Popup lỗi 1 lần mỗi phút (E-account-access-011)\n    else Hợp lệ\n        HT->>EM: Gửi email OTP 6 ký tự, hiệu lực 5 phút\n        HT-->>ND: Màn Nhập OTP, nút Gửi lại mã khoá đếm ngược\n        ND->>HT: Nhập đủ 6 chữ số\n        alt OTP đúng\n            HT-->>ND: Màn Tạo mật khẩu mới\n        else OTP sai hoặc hết hạn\n            HT-->>ND: Popup OTP không hợp lệ hoặc hết hạn (E-account-access-013)\n        else Sai 5 lần\n            HT-->>ND: Popup đã nhập sai 5 lần, gửi lại mã (E-account-access-012)\n        end\n        opt Sau 5 phút nút Gửi lại mã bật\n            ND->>HT: Bấm Gửi lại mã\n            HT->>EM: Email OTP mới, reply email OTP cũ\n        end\n    end\n```\n\n#### Activity — Reset bằng email (OTP)\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: màn Đăng nhập\"]) --> B[\"Quên mật khẩu rồi Reset mật khẩu\"]\n    B --> C[\"Màn Nhập tên tài khoản\"]\n    C --> D[\"Nhập tên tài khoản, bấm Xác nhận\"]\n    D --> E{\"Tên tài khoản đúng?\"}\n    E -->|\"Không\"| F[\"Lỗi: Tên tài khoản không chính xác\"]\n    E -->|\"Có\"| EA{\"Tài khoản Đang hoạt động?\"}\n    EA -->|\"Không\"| EB[\"Không cho đổi mật khẩu (câu lỗi khô s Hệ thống\n    ND->>HT: Bấm icon Avatar\n    HT-->>ND: Dropdown Tài khoản\n    ND->>HT: Chọn Ngôn ngữ\n    HT-->>ND: Danh sách Tiếng Anh, Tiếng Việt, Tiếng Nhật\n    ND->>HT: Chọn 1 ngôn ngữ\n    HT-->>ND: Tải lại giao diện theo ngôn ngữ mới + toast thành công\n```\n\n#### Activity — Đổi ngôn ngữ\n```mermaid\nflowchart TD\n    A([\"Bắt đầu: màn bất kỳ\"]) --> B[\"Bấm icon Avatar\"]\n    B --> C[\"Hiện dropdown Tài khoản\"]\n    C --> D[\"Chọn Ngôn ngữ\"]\n    D --> E[\"Chọn 1 ngôn ngữ: Anh, Việt hoặc Nhật\"]\n    E --> F[\"Hiển thị giao diện với ngôn ngữ được chọn, toast thành công\"]\n    F --> KetThuc([\"Kết thúc\"])\n```\n\n\n## <a id=\"sec-states\"></a>3. Trạng thái (States)\n\n### State: Tài khoản người dùng\n\n> Nguồn: nguồn không có lưu đồ trạng thái cho tài khoản. Trạng thái ghép từ: điều kiện trước \"Đang hoạt động\" (SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập); \"trạng thái tài khoản chuyển sang: Cấp mới\" (SRS Web tr.260 — UC01.02 Quên mật khẩu); khoá khi sai quá ngưỡng (SRS Web tr.251 — UC01.01 Đăng nhập; SRS Mobile tr.47 — UC01.01.01 Đăng nhập); \"Tài khoản bị khoá / vô hiệu hoá\" (SRS Web tr.257 — UC01.01 Đăng nhập); mật khẩu mặc định (SRS Web tr.273 — UC01.05 Tạo mật khẩu mới). Chỉ các chuyển trạng thái có nguồn được vẽ; phần còn thiếu ghi ở bảng ngõ cụt (OQ-6).\n\n```mermaid\nstateDiagram-v2\n    [*] --> DangHoatDong: Điều kiện trước của đăng nhập và quên mật khẩu\n    DangHoatDong --> BiKhoa: Nhập sai mật khẩu quá ngưỡng (Web 5, Mobile 10)\n    DangHoatDong --> CapMoi: IT reset mật khẩu, ERP gọi API cập nhật PMX\n    BiKhoa --> [*]: Nguồn không nói đường ra (ngõ cụt)\n    CapMoi --> [*]: Nguồn không nói trạng thái sau (ngõ cụt)\n    VoHieuHoa: Vô hiệu hoá (nguồn không nói đường vào và đường ra)\n```\n\nSơ đồ chỉ vẽ các chuyển trạng thái có nguồn. Không vẽ vì nguồn không nói: đường vào ban đầu (cấp tài khoản), Cấp mới sang Đang hoạt động, mở khoá Bị khoá, đường vào và đường ra của Vô hiệu hoá. Các điểm này nằm ở bảng  Expected result\n\n- Hệ thống đổi ngôn ngữ thành công, hiển thị giao diện theo ngôn ngữ mới. ✅ [SRS Web tr.160 — UC02.03.01 Thay đổi ngôn ngữ]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Đổi ngôn ngữ (Web).\n\n**Main Success Scenario**\n\n1. Người dùng bấm icon Avatar; hệ thống hiện dropdown Tài khoản. ✅ [SRS Web tr.160 — hình lưu đồ UC02.03.01 Thay đổi ngôn ngữ; SRS Web tr.161 — UC02.03.01 Thay đổi ngôn ngữ]\n2. Người dùng chọn \"Ngôn ngữ\"; hệ thống hiện dropdown Tiếng Anh, Tiếng Việt, Tiếng Nhật. ✅ [SRS Web tr.161 — hình UC02.03.01 Thay đổi ngôn ngữ; SRS Web tr.162 — UC02.03.01 Thay đổi ngôn ngữ]\n3. Người dùng chọn 1 ngôn ngữ (chỉ chọn 1). ✅ [SRS Web tr.162 — UC02.03.01 Thay đổi ngôn ngữ]\n4. Hệ thống tải lại giao diện theo ngôn ngữ mới và báo toast thành công. ✅ [SRS Web tr.162 — UC02.03.01 Thay đổi ngôn ngữ]\n\n**Extensions**\n\nNguồn không mô tả nhánh lỗi (ví dụ tải ngôn ngữ thất bại) cho use case này. 🟡 [SRS Web tr.162 — UC02.03.01 Thay đổi ngôn ngữ]\n\n#### f. Screens\n\nMenu Avatar (Web); Web — Ngôn ngữ.\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1–4 | FR-account-access-037 | BR-account-access-034 | — | SRS Web tr.162 — UC02.03.01 Thay đổi ngôn ngữ |\n\n#### h. Open Questions\n\nOQ-16.\n\n\n---\n\n### <a id=\"uc-change-password\"></a>UC-change-password — Đổi mật khẩu\n\n#### a. Introduction\n\nNgười dùng đã đăng nhập đổi mật khẩu của chính mình từ màn Thông tin cá nhân. Mã UC gốc: Web UC01.04; Mobile UC01.01.04. ✅ [SRS Web tr.269 — UC01.04 Đổi mật khẩu; SRS Mobile tr.62 — UC01.01.04 Đổi mật khẩu]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng phần mềm Xưởng (Web); người dùng ứng dụng Lái xe Delta (Mobile). ✅ [SRS Web tr.269 — UC01.04 Đổi mật khẩu; SRS Mobile tr.62 — UC01.01.04 Đổi mật khẩu]\n- Hệ thống ERP Delta (nhận mật khẩu mới; nguồn không nhắc PMX ở use case này). ✅ [SRS Web tr.272 — UC01.04 Đổi mật khẩu; SRS Web tr.269 — hình lưu đồ UC01.04 Đổi mật khẩu]\n- Đối tượng: Tài khoản người dùng (mật khẩu).\n\n#### c. Pre-conditions\n\n- Người dùng đã đăng nhập. Đường dẫn UC: Thông tin cá nhân > nút Đổi mật khẩu; bảng mô tả đặt trong \"Hành động\" (Web) / menu ☰ (Mobile) — lối vào lệch nhau (OQ-23). ✅ [SRS Web tr.269 — UC01.04 Đổi mật khẩu; SRS Web tr.281 — UC01.06 Xem thông tin cá nhân; SRS Mobile tr.62 — UC01.01.04 Đổi mật khẩu]\n\n#### d. Expected result\n\n- Mật khẩu mới được cập nhật cho tài khoản, hiển thị toast (Web) / popup message (Mobile) thành công, hiển thị lại màn Thông tin tài khoản. ✅ [SRS Web tr.269 — UC01.04 Đổi mật khẩu; SRS Mobile tr.62 — UC01.01.04 Đổi mật khẩu]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Đổi mật khẩu.\n\n**Main Success Scenario**\n\n1. Người dùng ở màn Thông tin cá nhân bấm Đổi mật khẩu (nút trên màn hoặc trong \"Hành động\"); hệ thống hiện popup Đổi mật khẩu (lời dẫn trên ảnh Web \"Vui lòng nhập các thông tin tài khoản của bạn bên dưới.\"; Mobile \"Vui lòng nhập mật khẩu cũ của bạn\"). ✅ [SRS Web tr.269 — hình lưu đồ UC01.04 Đổi mật khẩu; SRS Web tr.270 — UC01.04 Đổi mật khẩu; SRS Mobile tr.62 — hình lưu đồ UC01.01.04 Đổi mật khẩu; SRS Mobile tr.63 — UC01.01.04 Đổi mật khẩu]\n2. Người dùng nhập Mật khẩu cũ,  Mật khẩu mới, Xác nhận mật khẩu mới (đều bắt buộc). ✅ [SRS Web tr.270 — UC01.04 Đổi mật khẩu; SRS Web tr.271 — UC01.04 Đổi mật khẩu; SRS Mobile tr.63 — UC01.01.04 Đổi mật khẩu; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu]\n3. Người dùng bấm \"Xác nhận\"; hệ thống kiểm tra hợp lệ cả 3 ô. ✅ [SRS Web tr.272 — UC01.04 Đổi mật khẩu; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu]\n4. Hợp lệ: hệ thống cập nhật mật khẩu mới (cả qua hệ thống ERP Delta), báo \"Đổi mật khẩu thành công\", tắt popup, quay lại Thông tin tài khoản. ✅ [SRS Web tr.272 — UC01.04 Đổi mật khẩu; SRS Mobile tr.65 — UC01.01.04 Đổi mật khẩu]\n\n**Extensions**\n\n- 3a. Mật khẩu cũ sai → \"Mật khẩu cũ không chính xác.\" (E-account-access-014). ✅ [SRS Web tr.270 — UC01.04 Đổi mật khẩu; SRS Mobile tr.63 — UC01.01.04 Đổi mật khẩu]\n- 3b. Mật khẩu mới không đủ 8 ký tự gồm chữ cái, số, chữ hoa, ký tự đặc biệt → E-account-access-015. ✅ [SRS Web tr.271 — UC01.04 Đổi mật khẩu; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu]\n- 3c. Mật khẩu mới trùng mật khẩu hiện tại → \"Mật khẩu trùng với mật khẩu cũ\" (E-account-access-016). ✅ [SRS Web tr.271 — UC01.04 Đổi mật khẩu; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu]\n- 3d. Xác nhận không khớp → \"Mật khẩu xác nhận không khớp.\" (E-account-access-017). ✅ [SRS Web tr.271 — UC01.04 Đổi mật khẩu; SRS Mobile tr.64 — UC01.01.04 Đổi mật khẩu]\n\n#### f. Screens\n\nPopup Đổi mật khẩu; Web — Xem thông tin tài khoản; Mobile — Xem thông tin tài khoản nội bộ.\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1 | FR-account-access-031, FR-account-access-036 | — | — | SRS Web tr.270 — UC01.04 Đổi mật khẩu; SRS Web tr.281 — UC01.06 Xem thông tin cá nhân |\n| 2 | FR-account-access-010, FR-account-access-031 | BR-account-access-030 | — | SRS Web tr.271 — UC01.04 Đổi mật khẩu |\n| 3 | FR-account-access-031 | BR-account-access-026, BR-account-access-027, BR-account-access-029 | E-account-access-014 đến E-account-access-017 | SRS Web tr.270 — UC01.04 Đổi mật khẩu; SRS Web tr.271 — UC01.04 Đổi mật khẩu |\n| 4 | FR-account-access-031 | BR-account-access-031 | — | SRS Web tr.272 — UC01.04 Đổi mật khẩu |\n\n#### h. Open Questions\n\nOQ-13, OQ-23.\n\n\n---\n\n### <a id=\"uc-create-new-password\"></a>UC-create-new-password — Tạo mật khẩu mới\n\n#### a. Introduction\n\nNgười dùng tạo mật khẩu mới khi đăng nhập lần đầu, sau khi IT reset thành mật khẩu mặc định, hoặc từ link/luồng reset bằng email. Mã UC gốc: Web UC01.05; Mobile UC01.01.05. ✅ [SRS Web tr.273 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.66 — UC01.01.05 Tạo mật khẩu mới]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng phần mềm Xưởng (Web); người dùng ứng dụng lái xe Delta (Mobile). ✅ [SRS Web tr.273 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.66 — UC01.01.05 Tạo mật khẩu mới]\n- ERP Delta và PMX (theo lưu đồ \"Update mật khẩu (ERP + PMX)\"). ✅ [SRS Web tr.274 — hình lưu đồ UC01.05 Tạo mật khẩu mới]\n- Đối tượng: Tài khoản người dùng (mật khẩu mặc định, mật khẩu mới).\n\n#### c. Pre-conditions\n\n- TH1 và TH2: tài khoản đang dùng mật khẩu mặc định. TH3: email tài khoản nhận được link reset gửi từ luồng Quên mật khẩu - Reset bằng email. ✅ [SRS Web tr.273 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.66 — UC01.01.05 Tạo mật khẩu mới]\n\n#### d. Expected result\n\n- Mật khẩu mới được cập nhật; hiển thị toast (Web) / popup message (Mobile) thành công; hiển thị màn Đăng nhập để đăng nhập bằng mật khẩu mới. ✅ [SRS Web tr.273 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.66 — UC01.01.05 Tạo mật khẩu mới] (nút \"Đổi mật khẩu\" nói tự đăng nhập vào trang chủ — Conflict, 🟡)\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Tạo mật khẩu mới.\n\n**Main Success Scenario**\n\n1. Vào màn Tạo mật khẩu mới qua TH1 (đăng nhập lần đầu), TH2 (đăng nhập sau khi IT reset thành mật khẩu mặc định) hoặc TH3 (link reset trong email). ✅ [SRS Web tr.273 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.66 — UC01.01.05 Tạo mật khẩu mới]\n2. Hệ thống hiện màn Tạo mật khẩu mới với khung Tài khoản (Web ảnh: khung hiện sẵn; Mobile ảnh: ô nhập \"Tên tài khoản*\" — OQ-24). ✅ [SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.68 — UC01.01.05 Tạo mật khẩu mới]\n3. Người dùng nhập Mật khẩu mới và Nhập lại mật khẩu mới (bắt buộc). ✅ [SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Web tr.276 — UC01.05 Tạo mật khẩu mới]\n4. Người dùng bấm \"Xác nhận\" (bảng còn nút \"Đổi mật khẩu\", ảnh Web chỉ có \"Xác nhận\"); hệ thống kiểm tra hợp lệ. ✅ [SRS Web tr.276 — UC01.05 Tạo mật khẩu mới; SRS Web tr.277 — UC01.05 Tạo mật khẩu mới]\n5. Hợp lệ: cập nhật mật khẩu mới (ERP + PMX), toast \"Đổi mật khẩu thành công\", hiện màn Đăng nhập. ✅ [SRS Web tr.274 — hình lưu đồ UC01.05 Tạo mật khẩu mới; SRS Web tr.277 — UC01.05 Tạo mật khẩu mới]\n\n**Extensions**\n\n- 4a. Mật khẩu không đủ độ mạnh → E-account-access-015. ✅ [SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.68 — UC01.01.05 Tạo mật khẩu mới]\n- 4b. Mật khẩu trùng mật khẩu mặc định → \"Mật khẩu trùng với mật khẩu mặc định\" (E-account-access-018). ✅ [SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.68 — UC01.01.05 Tạo mật khẩu mới]\n- 4c. Nhập lại không khớp → \"Mật khẩu xác nhận không khớp.\" (E-account-access-017). ✅ [SRS Web tr.276 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.69 — UC01.01.05 Tạo mật khẩu mới]\n- 4d. Cập nhật thất bại → \"Đã có lỗi xảy ra, vui lòng thử lại.\" (E-account-access-019). ✅ [SRS Web tr.276 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.69 — UC01.01.05 Tạo mật khẩu mới]\n- 5a. Nút \"Đổi mật khẩu\": thành công thì tự đăng nhập vào trang chủ Delta (mô tả nút). 🟡 [SRS Web tr.276 — UC01.05 Tạo mật khẩu mới; SRS Mobile tr.69 — UC01.01.05 Tạo mật khẩu mới]\n\n#### f. Screens\n\nMàn Tạo mật khẩu mới; Web — Đăng nhập; Mobile — Đăng nhập.\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1 | FR-account-access-011, FR-account-access-032 | BR-account-access-007, BR-account-access-021, BR-account-access-032 | — | SRS Web tr.273 — UC01.05 Tạo mật khẩu mới |\n| 3 | FR-account-access-010, FR-account-access-032 | BR-account-access-030 | — | SRS Web tr.275 — UC01.05 Tạo mật khẩu mới |\n| 4 | FR-account-access-032 | BR-account-access-026, BR-account-access-028, BR-account-access-029 | E-account-access-015, E-account-access-017, E-account-access-018, E-account-access-019 | SRS Web tr.275 — UC01.05 Tạo mật khẩu mới; SRS Web tr.276 — UC01.05 Tạo mật khẩu mới |\n| 5 | FR-account-access-032 | BR-account-access-031 | — | SRS Web tr.277 — UC01.05 Tạo mật khẩu mới |\n\n#### h. Open Questions\n\nOQ-2, OQ-4, OQ-13, OQ-19, OQ-24.\n\n\n---\n\n### <a id=\"uc-forgot-password\"></a>UC-forgot-password — Quên mật khẩu\n\n#### a. Introduction\n\nNgười dùng quên mật khẩu chọn lấy lại qua IT hoặc tự reset bằng email. Mã UC gốc: Web UC01.02; Mobile UC01.01.02. ✅ [SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng phần mềm Xưởng (Web); người dùng ứng dụng lái xe Delta (Mobile). ✅ [SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu]\n- Bộ phận IT phần mềm ERP Delta; ERP và PMX; hệ thống gửi email. ✅ [SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Web tr.263 — UC01.02 Quên mật khẩu]\n- Đối tượng: Tài khoản người dùng, Yêu cầu hỗ trợ đặt lại mật khẩu, Mã OTP (Mobile), Link reset (Web). ✅ [SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.57 — UC01.01.02 Quên mật khẩu]\n\n#### c. Pre-conditions\n\n- Người dùng đã được cấp tài khoản; trạng thái tài khoản \"Đang hoạt động\"; tài khoản có quyền truy cập phần mềm Xưởng (Web) / ứng dụng lái xe Delta (Mobile). ✅ [SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu]\n\n#### d. Expected result\n\n- Chọn Liên hệ IT: thông báo reset mật khẩu được gửi tới bộ phận IT phần mềm ERP Delta, hiển thị màn \"Gửi tài khoản thành công\". ✅ [SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu]\n- Chọn Reset bằng email: Web gửi email kèm link tạo mật khẩu mới và hiện màn \"Kiểm tra hòm thư\"; Mobile gửi OTP qua email công ty và hiện màn Nhập OTP (điều kiện sau ghi \"Kiểm tra hòm thư\" — Conflict). ✅ (Web); 🟡 (Mobile) [SRS Web tr.258 — UC01.02 Quên mật khẩu; SRS Mobile tr.52 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.57 — UC01.01.02 Quên mật khẩu]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Quên mật khẩu — Liên hệ IT; Flow: Quên mật khẩu — Reset bằng email (Web, gửi link); Flow: Quên mật khẩu — Reset bằng email (Mobile, mã OTP).\n\n**Main Success Scenario**\n\n1. Người dùng bấm \"Quên mật khẩu\" ở màn Đăng nhập; hệ thống hiện lựa chọn cách lấy lại mật khẩu. ✅ [SRS Web tr.259 — hình lưu đồ UC01.02 Quên mật khẩu; SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu]\n2. Người dùng chọn \"Liên hệ IT\" hoặc \"Reset mật khẩu\"; hệ thống mở màn Nhập tên tài khoản tương ứng. ✅ [SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu]\n3. Người dùng nhập tên tài khoản; hệ thống kiểm tra (Web sau 1 giây dừng gõ, Mobile sau \"Kết thúc nhập\") và hiện Họ tên + Tên tài khoản. ✅ [SRS Web tr.262 — UC01.02 Quên mật khẩu; SRS Mobile tr.54 — UC01.01.02 Quên mật khẩu]\n4. Người dùng bấm \"Xác nhận\". ✅ [SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu]\n5a. Liên hệ IT: hệ thống gửi email tự động tới IT Delta và hiện màn \"Gửi tài khoản thành công\"; người dùng bấm \"Quay về đăng nhập\" (Web) / \"Quay lại\" (Mobile). ✅ [SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Web tr.265 — UC01.02 Quên mật khẩu; SRS Mobile tr.57 — UC01.01.02 Quên mật khẩu]\n5b. Reset bằng email (Web): hệ thống gửi email có link, hiện \"Kiểm tra hòm thư\", người dùng bấm link để sang Tạo mật khẩu mới (bước bấm link 🔵). ✅ [SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Web tr.264 — UC01.02 Quên mật khẩu]\n5c. Reset bằng email (Mobile): hệ thống gửi OTP, hiện màn Nhập OTP; nhập đủ 6 số, đúng → Tạo mật khẩu mới. ✅ [SRS Mobile tr.56 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu]\n6. IT reset mật khẩu; ERP gọi API cho PMX cập nhật; trạng thái tài khoản chuyển sang \"Cấp mới\" (nhánh Liên hệ IT). ✅ [SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu]\n\n**Extensions**\n\n- 3a. Tên tài khoản sai → \"Tên tài khoản không chính xác.\" (E-account-access-010). ✅ [SRS Web tr.262 — UC01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu]\n- 3b. Tài khoản không ở trạng thái Đang hoạt động → không được đổi mật khẩu; nguồn không có câu lỗi cho trường hợp này (`<\!-- TBD -->`). ✅ (quy tắc) / 🟡 (câu lỗi) [SRS Web tr.262 — UC01.02 Quên mật khẩu]\n- 4a. Gửi lần 2 trong vòng 1 phút → popup \"Bạn chỉ có thể gửi yêu cầu quên mật khẩu tối đa 1 lần mỗi phút. Xin vui lòng thử lại sau.\" (E-account-access-011), nút \"Trở về\". ✅ [SRS Web tr.263 — UC01.02 Quên mật khẩu; SRS Mobile tr.55 — UC01.01.02 Quên mật khẩu]\n- 5c-1. OTP sai hoặc hết hạn → \"OTP không hợp lệ hoặc hết hạn. Vui lòng thử lại.\" (E-account-access-013). ✅ [SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu]\n- 5c-2. Sai 5 lần → \"Bạn đã nhập sai mã OTP 5 lần. Vui lòng gửi lại mã OTP mới.\" (E-account-access-012). ✅ [SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu]\n- 5c-3. Bấm \"Gửi lại mã [x]\" khi đã bật (sau 5 phút): gửi OTP mới, email reply email OTP cũ. ✅ [SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu; SRS Mobile tr.59 — UC01.01.02 Quên mật khẩu]\n- 5c-4. Bấm \"Back\" → về màn Đăng nhập. ✅ [SRS Mobile tr.59 — UC01.01.02 Quên mật khẩu]\n\n#### f. Screens\n\nPopup / màn Chọn cách lấy lại mật khẩu; Màn Nhập tên tài khoản (Liên hệ IT / Reset bằng email); Popup lỗi giới hạn 1 lần/phút; Màn Gửi tài khoản thành công; Màn Kiểm tra hòm thư (Web); Màn Nhập OTP (Mobile).\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1–2 | FR-account-access-019 | — | — | SRS Web tr.260 — UC01.02 Quên mật khẩu; SRS Mobile tr.53 — UC01.01.02 Quên mật khẩu |\n| 3 | FR-account-access-020 | BR-account-access-017, BR-account-access-018, BR-account-access-041 | E-account-access-010 | SRS Web tr.262 — UC01.02 Quên mật khẩu; SRS Mobile tr.54 — UC01.01.02 Quên mật khẩu |\n| 4 | FR-account-access-025 | BR-account-access-019 | E-account-access-011 | SRS Web tr.263 — UC01.02 Quên mật khẩu |\n| 5a | FR-account-access-021, FR-account-access-028 | BR-account-access-020, BR-account-access-039 | — | SRS Web tr.263 — UC01.02 Quên mật khẩu |\n| 5b | FR-account-access-023, FR-account-access-028 | BR-account-access-022, BR-account-access-039 | — | SRS Web tr.264 — UC01.02 Quên mật khẩu |\n| 5c | FR-account-access-024, FR-account-access-026, FR-account-access-027 | BR-account-access-023, BR-account-access-024, BR-account-access-025 | E-account-access-012, E-account-access-013 | SRS Mobile tr.58 — UC01.01.02 Quên mật khẩu |\n| 6 | FR-account-access-022 | BR-account-access-021 | — | SRS Web tr.260 — UC01.02 Quên mật khẩu |\n\n#### h. Open Questions\n\nOQ-2, OQ-5, OQ-6, OQ-11, OQ-12, OQ-13.\n\n\n---\n\n### <a id=\"uc-login\"></a>UC-login — Đăng nhập (kèm chọn tổ chức/chi nhánh)\n\n#### a. Introduction\n\nNgười dùng chưa đăng nhập vào hệ thống bằng tên tài khoản và mật khẩu; sau đó vào Module Menu (Web) / Home (Mobile) của tổ chức/chi nhánh, hoặc được chuyển sang Tạo mật khẩu mới. Mã UC gốc: Web UC01.01; Mobile UC01.01.01. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng chưa đăng nhập (mọi role) — Web; người dùng Delta Super App / Delta Partner Portal (mọi role) — Mobile. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n- Hệ thống xác thực; Admin (được nhắc trong thông báo lỗi). ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- Đối tượng: Tài khoản người dùng, Phiên đăng nhập, Tổ chức/Chi nhánh, Quyền truy cập tổ chức/chi nhánh, Tài khoản đối tác (Cây dầu). ✅ [SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n\n#### c. Pre-conditions\n\n- Tài khoản đang hoạt động (Mobile: \"Đang hoạt động/Hoạt động\"); tài khoản có quyền truy cập website / ứng dụng; người dùng chưa đăng nhập hoặc phiên đã hết hạn (Web); người dùng đã được cấp tài khoản (Mobile). ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n\n#### d. Expected result\n\n- Tài khoản không dùng mật khẩu mặc định: đăng nhập thành công và vào Module Menu (Web) / Home nội bộ (Mobile) của tổ chức/chi nhánh đã chọn (hoặc chi nhánh duy nhất); phiên lưu theo tuỳ chọn \"Ghi nhớ đăng nhập\". ✅ [SRS Web tr.248 — UC01.01 Đăng nhập]\n- Tài khoản đang dùng mật khẩu mặc định: vào màn Tạo mật khẩu mới để đổi mật khẩu lần đầu. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n- Tài khoản đối tác: vào thẳng Home theo loại tài khoản, không qua chọn tổ chức. ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Đăng nhập; Flow: Chọn tổ chức/chi nhánh sau đăng nhập.\n\n**Main Success Scenario**\n\n1. (Mobile) Mở app → Splash 3 giây → kiểm tra phiên; (Web) vào hệ thống, chưa có phiên thì tự về trang đăng nhập. ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Web tr.248 — UC01.01 Đăng nhập]\n2. (Mobile, lần đầu hoặc sau khi xoá dữ liệu) Onboarding, bấm \"Đăng nhập\". ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.46 — UC01.01.01 Đăng nhập]\n3. Người dùng nhập Tên tài khoản (Web: hoặc email) và Mật khẩu, tuỳ chọn Ghi nhớ đăng nhập, bấm \"Đăng nhập\". ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.250 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n4. Hệ thống kiểm tra ô trống phía màn hình (Web), rồi gọi xác thực; nút Đăng nhập hiện spinner và khoá khi đang gọi. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Web tr.253 — UC01.01 Đăng nhập]\n5. Xác thực đúng và không dùng mật khẩu mặc định: hệ thống kiểm tra số tổ chức/chi nhánh. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n6. Chỉ 1 chi nhánh: tự chọn, vào thẳng Module Menu / Home nội bộ. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n7. Từ 2 chi nhánh hoặc 2 tổ chức: hiện Modal / Bottom Sheet Chọn tổ chức; người dùng chọn công ty mẹ hoặc 1 chi nhánh (có thể tìm kiếm), bấm \"Chọn\" / \"Xác nhận\"; vào Module Menu / Home của phạm vi đã chọn. ✅ [SRS Web tr.254 — UC01.01 Đăng nhập; SRS Web tr.256 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập; SRS Mobile tr.51 — UC01.01.01 Đăng nhập]\n\n**Extensions**\n\n- 1a. (Web) Có phiên hợp lệ mà vào URL đăng nhập → vào thẳng Module Menu. ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- 1b. (Mobile) Có phiên hợp lệ → bỏ qua Onboarding và Đăng nhập, kiểm tra tổ chức. ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập]\n- 1c. (Web) Phiên hết hạn khi đang dùng → về trang đăng nhập, banner \"Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại.\" (E-account-access-006). ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- 4a. Có trường trống (Web) → lỗi inline, không gọi API (E-account-access-020, 🟡 chưa có câu chữ). ✅ [SRS Web tr.248 — UC01.01 Đăng nhập]\n- 4b. Lỗi 5xx → toast \"Đã xảy ra lỗi. Vui lòng thử lại.\" (E-account-access-007); mất mạng → toast \"Mất kết nối. Vui lòng kiểm tra mạng.\" (E-account-access-008) (Web). ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- 5a. Sai thông tin → lỗi inline, trừ 1 lần thử, xoá mật khẩu (E-account-access-001); Mobile ảnh còn lỗi theo ô \"Tài khoản không hợp lệ\" / \"Mật khẩu không đúng\" (E-account-access-021, E-account-access-022). ✅ [SRS Web tr.253 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n- 5b. Sai quá ngưỡng (Web 5, Mobile 10) → khoá tài khoản; đăng nhập lại báo (E-account-access-002, E-account-access-003). ✅ [SRS Web tr.251 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập; SRS Mobile tr.47 — UC01.01.01 Đăng nhập] (ngưỡng lệch: 🟡 OQ-1)\n- 5c. Tài khoản bị khoá / vô hiệu hoá → lỗi dưới ô Mật khẩu (E-account-access-003). ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- 5d. Không có quyền truy cập chi nhánh nào → lỗi dưới ô Mật khẩu (E-account-access-004). ✅ [SRS Web tr.257 — UC01.01 Đăng nhập]\n- 5e. Không có quyền truy cập phần mềm xưởng → màn lỗi (E-account-access-005) với nút \"Quay về đăng nhập\". ✅ [SRS Web tr.253 — UC01.01 Đăng nhập; SRS Web tr.254 — hình lỗi UC01.01 Đăng nhập] (Mobile 🟡: hình trống)\n- 5f. Đúng nhưng dùng mật khẩu mặc định → màn Tạo mật khẩu mới. ✅ [SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n- 5g. (Mobile) Tài khoản đối tác → bỏ qua chọn tổ chức, vào Home theo loại (Cây dầu → Home Partner Portal UC-PP.01). ✅ [SRS Mobile tr.43 — UC01.01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập]\n- 7a. Tìm kiếm không có kết quả → \"Không tìm thấy chi nhánh phù hợp.\" (E-account-access-009). ✅ [SRS Web tr.256 — UC01.01 Đăng nhập; SRS Mobile tr.51 — UC01.01.01 Đăng nhập]\n- 7b. Bấm Huỷ (hoặc ✕ Web) → đăng xuất, về màn Đăng nhập. ✅ [SRS Web tr.255 — UC01.01 Đăng nhập; SRS Web tr.256 — UC01.01 Đăng nhập; SRS Mobile tr.44 — UC01.01.01 Đăng nhập; SRS Mobile tr.51 — UC01.01.01 Đăng nhập]\n- 7c. (Mobile) Lần đăng nhập sau, nếu còn quyền, bỏ qua Bottom Sheet theo lựa chọn đã lưu. ✅ [SRS Mobile tr.51 — UC01.01.01 Đăng nhập]\n- 3a. Bấm \"Quên mật khẩu\" → UC Quên mật khẩu. ✅ [SRS Web tr.249 — UC01.01 Đăng nhập; SRS Mobile tr.47 — UC01.01.01 Đăng nhập]\n\n#### f. Screens\n\nWeb — Đăng nhập; Web — Modal Chọn tổ chức; Web — Màn lỗi không có quyền đăng nhập; Web — Banner phiên hết hạn trên trang Đăng nhập; Mobile — Splash; Mobile — Onboarding; Mobile — Đăng nhập; Mobile — Bottom Sheet Chọn tổ chức.\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1 | FR-account-access-002, FR-account-access-003, FR-account-access-017 | BR-account-access-016 | — | SRS Web tr.248 — UC01.01 Đăng nhập; SRS Mobile tr.43 — UC01.01.01 Đăng nhập |\n| 2 | FR-account-access-004 | — | — | SRS Mobile tr.46 — UC01.01.01 Đăng nhập |\n| 3 | FR-account-access-001, FR-account-access-005, FR-account-access-010 | BR-account-access-001, BR-account-access-002, BR-account-access-003, BR-account-access-006, BR-account-access-040 | — | SRS Web tr.250 — UC01.01 Đăng nhập; SRS Web tr.251 — UC01.01 Đăng nhập |\n| 4 | FR-account-access-009, FR-account-access-018 | — | E-account-access-007, E-account-access-008, E-account-access-020 | SRS Web tr.253 — UC01.01 Đăng nhập; SRS Web tr.257 — UC01.01 Đăng nhập |\n| 5 (rẽ nhánh lỗi) | FR-account-access-006, FR-account-access-007, FR-account-access-008, FR-account-access-011 | BR-account-access-004, BR-account-access-005, BR-account-access-007 | E-account-access-001 đến E-account-access-005, E-account-access-021, E-account-access-022 | SRS Web tr.253 — UC01.01 Đăng nhập; SRS Web tr.257 — UC01.01 Đăng nhập |\n| 6–7 | FR-account-access-012, FR-account-access-013, FR-account-access-014, FR-account-access-015 | BR-account-access-008 đến BR-account-access-015 | E-account-access-009 | SRS Web tr.254 — UC01.01 Đăng nhập; SRS Mobile tr.49 — UC01.01.01 Đăng nhập |\n| 1c | FR-account-access-016 | — | E-account-access-006 | SRS Web tr.257 — UC01.01 Đăng nhập |\n\n#### h. Open Questions\n\nOQ-1, OQ-3, OQ-6, OQ-7, OQ-8, OQ-9, OQ-10, OQ-17, OQ-19, OQ-21, OQ-22.\n\n\n---\n\n### <a id=\"uc-logout\"></a>UC-logout — Đăng xuất\n\n#### a. Introduction\n\nNgười dùng đăng xuất khỏi hệ thống từ menu Avatar. Mã UC gốc: Web UC01.03; Mobile UC01.01.03 (nội bộ); tài khoản cây dầu có nhánh xác nhận riêng ở UC01.01.07. ✅ [SRS Web tr.267 — UC01.03 Đăng xuất; SRS Mobile tr.60 — UC01.01.03 Đăng xuất; SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng phần mềm Xưởng (Web); người dùng ứng dụng Lái xe Delta (Mobile); nhân viên cây dầu (Mobile Partner Portal). ✅ [SRS Web tr.267 — UC01.03 Đăng xuất; SRS Mobile tr.60 — UC01.01.03 Đăng xuất; SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- Đối tượng: Phiên đăng nhập.\n\n#### c. Pre-conditions\n\n- Người dùng đã đăng nhập. ✅ [SRS Web tr.267 — UC01.03 Đăng xuất; SRS Mobile tr.60 — UC01.01.03 Đăng xuất]\n\n#### d. Expected result\n\n- Tài khoản đã đăng xuất, hiển thị màn Đăng nhập. ✅ [SRS Web tr.267 — UC01.03 Đăng xuất; SRS Mobile tr.60 — UC01.01.03 Đăng xuất]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Đăng xuất.\n\n**Main Success Scenario**\n\n1. Người dùng bấm icon Avatar (góc trên bên phải); hệ thống hiện dropdown Tài khoản. ✅ [SRS Web tr.267 — hình lưu đồ UC01.03 Đăng xuất; SRS Web tr.268 — UC01.03 Đăng xuất; SRS Mobile tr.61 — UC01.01.03 Đăng xuất]\n2. Người dùng chọn \"Đăng xuất\". ✅ [SRS Web tr.268 — UC01.03 Đăng xuất]\n3. Hệ thống đăng xuất và hiện màn Đăng nhập. ✅ [SRS Web tr.268 — UC01.03 Đăng xuất; SRS Mobile tr.61 — UC01.01.03 Đăng xuất]\n\n**Extensions**\n\n- 1a. Đường vào riêng của tài khoản cây dầu (Mobile): không qua dropdown Avatar; ở màn Tài khoản bấm nút \"Đăng xuất\" → hộp xác nhận \"Bạn có chắc muốn đăng xuất?\" với nút \"Ở lại\" và \"Đăng xuất\" (đỏ); \"Đăng xuất\" → đăng xuất, redirect màn đăng nhập. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- 2b. Đăng xuất cũng được gọi từ menu ☰ (\"Hành động\") ở màn Thông tin cá nhân (Mobile nội bộ). ✅ (chữ trên ảnh) [SRS Mobile tr.72 — hình màn Thông tin tài khoản UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ; SRS Mobile tr.74 — UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n\n#### f. Screens\n\nMenu Avatar (Web); Mobile — Hộp xác nhận đăng xuất (cây dầu); Mobile — Tài khoản cây dầu.\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1–3 | FR-account-access-029 | — | — | SRS Web tr.267 — UC01.03 Đăng xuất; SRS Mobile tr.60 — UC01.01.03 Đăng xuất |\n| 1a | FR-account-access-030 | BR-account-access-038 | — | SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu |\n\n#### h. Open Questions\n\nOQ-14.\n\n\n---\n\n### <a id=\"uc-view-oil-station-account\"></a>UC-view-oil-station-account — Xem thông tin tài khoản cây dầu (Mobile)\n\n#### a. Introduction\n\nNhân viên cây dầu mua ngoài xem thông tin tài khoản của chính mình trên app Delta Partner Portal (chỉ đọc) và đăng xuất. Mã UC gốc: UC01.01.07. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### b. Actors & Objects\n\n- Actor chính: Nhân viên cây dầu mua ngoài đã đăng nhập. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- Đối tượng: Tài khoản cây dầu, Nhà cung cấp HHDV, Người đại diện, Hạn mức tháng, Hợp đồng. ✅ [SRS Mobile tr.77 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.78 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### c. Pre-conditions\n\n- Đã đăng nhập, loại tài khoản = Cây dầu. Đường dẫn: app Delta Partner Portal — Bottom Navigation > tab Tài khoản (tab cuối) hoặc tap Avatar trên Trang chủ. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### d. Expected result\n\n- Hiển thị thông tin đầy đủ của cây dầu; đăng xuất nếu người dùng chọn. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### e. Activity diagram\n\nXem [flows.md](#sec-flows) — Flow: Xem thông tin tài khoản cây dầu (Mobile).\n\n**Main Success Scenario**\n\n1. Người dùng tap tab Tài khoản hoặc Avatar trên Trang chủ. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n2. Hệ thống tải thông tin tài khoản cây dầu, hiện skeleton loader khi tải. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n3. Người dùng xem thông tin (chỉ đọc): avatar, tên cây dầu, mã đối tác, nhà cung cấp HHDV, người đại diện, địa chỉ, ghi chú; hạn mức tháng hiện tại; loại hợp đồng, số tiền đặt cọc (nếu Đặt cọc). ✅ [SRS Mobile tr.76 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.77 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.78 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n4. Người dùng tap \"Đăng xuất\" → hộp xác nhận \"Bạn có chắc muốn đăng xuất?\" → \"Đăng xuất\" → về màn đăng nhập. ✅ [SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n**Extensions**\n\n- 3a. Cây dầu không có ảnh → icon no data. Ghi chú không có giá trị → ẩn hoàn toàn. ✅ [SRS Mobile tr.76 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.77 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- 3b. Loại hợp đồng \"Tín chấp\" → ẩn \"Số tiền đặt cọc\"; mục Hợp đồng ẩn hoàn toàn. ✅ (số tiền đặt cọc); 🟡 (Hợp đồng — bảng cắt) [SRS Mobile tr.78 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- 4a. Tap \"Ở lại\" ở hộp xác nhận → ở lại màn Tài khoản. 🔵 [SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n- 3c. Muốn sửa thông tin cây dầu → không sửa trên app; thực hiện qua CBQL trên Delta ERP (UC12.04.06). ✅ [SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu]\n\n#### f. Screens\n\nMobile — Tài khoản cây dầu; Mobile — Hộp xác nhận đăng xuất (cây dầu).\n\n#### g. Related FR\n\n| Bước | FR | BR | Error | Nguồn |\n|---|---|---|---|---|\n| 1–2 | FR-account-access-038 | BR-account-access-035 | — | SRS Mobile tr.75 — UC01.01.07 Xem thông tin tài khoản cây dầu |\n| 3 | FR-account-access-038, FR-account-access-039, FR-account-access-040, FR-account-access-041 | BR-account-access-036, BR-account-access-037 | — | SRS Mobile tr.77 — UC01.01.07 Xem thông tin tài khoản cây dầu; SRS Mobile tr.78 — UC01.01.07 Xem thông tin tài khoản cây dầu |\n| 4 | FR-account-access-030 | BR-account-access-038 | — | SRS Mobile tr.79 — UC01.01.07 Xem thông tin tài khoản cây dầu |\n\n#### h. Open Questions\n\nOQ-17, OQ-18.\n\n\n---\n\n### <a id=\"uc-view-profile\"></a>UC-view-profile — Xem thông tin cá nhân (nội bộ)\n\n#### a. Introduction\n\nNgười dùng nội bộ xem thông tin tài khoản của mình (chỉ đọc), mở lịch sử hoạt động và đổi mật khẩu. Mã UC gốc: Web UC01.06; Mobile UC01.01.06 (Tài khoản nội bộ). ✅ [SRS Web tr.278 — UC01.06 Xem thông tin cá nhân; SRS Mobile tr.71 — UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n\n#### b. Actors & Objects\n\n- Actor chính: Người dùng phần mềm Xưởng (Web); người dùng ứng dụng Delta Super App (Mobile). ✅ [SRS Web tr.278 — UC01.06 Xem thông tin cá nhân; SRS Mobile tr.71 — UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n- Đối tượng: Tài khoản người dùng, Hồ sơ nhân viên, Lịch sử hoạt động.\n\n#### c. Pre-conditions\n\n- Người dùng đã đăng nhập. Đường dẫn: Web — màn bất kỳ > icon Avatar > nút \"Thông tin tài khoản\"; Mobile — màn bất kỳ > icon Avatar > màn Thông tin tài khoản, hoặc icon Tài khoản trên Navigation Bar. ✅ [SRS Web tr.278 — UC01.06 Xem thông tin cá nhân; SRS Mobile tr.71 — UC01.01.06 Xem thông tin cá nhân - Tài khoản nội bộ]\n\n#### d. Expected result\n\n- Người dùng xem được thông tin tài khoản của mình đang đăng nhập. ✅ [SR "Cấp mới\" sau khi IT reset; không nói chuyển sang trạng thái nào khi người dùng tạo mật khẩu mới | Không biết vòng đời trạng thái sau reset | PO/BA |\n| Ngõ cụt — Mã OTP quên mật khẩu: Sai 5 lần / Hết hạn | Nhập sai 5 lần báo \"gửi lại mã OTP mới\" nhưng nút gửi lại bị khoá đến khi OTP hết hạn 5 phút; không nói người dùng làm gì trong thời gian chờ, có khoá tạm không | Người dùng có thể bị kẹt tới 5 phút; không rõ giới hạn số lần gửi lại | PO/BA |\n| Ngõ cụt — Yêu cầu hỗ trợ đặt lại mật khẩu: đã gửi IT | Gửi xong người dùng chỉ có màn \"Gửi tài khoản thành công!\" với nút quay về đăng nhập; không có trạng thái yêu cầu, không nói IT xử lý xong thì người dùng biết bằng cách nào, bao lâu, bị từ chối thì sao | Người dùng không theo dõi được yêu cầu; có thể gửi nhiều lần (bị chặn 1 lần/phút) | PO/IT Delta |\n| Ngõ cụt — Link reset mật khẩu (Web): hết hạn / đã dùng | Không nói link có hạn dùng, dùng một lần hay nhiều lần, hết hạn/đã dùng thì người dùng làm gì | Không có đường phục hồi khi link hỏng | PO/BA |\n| Ngõ cụt — Phiên đăng nhập: bấm Huỷ ở chọn tổ chức | Đã nói Huỷ = đăng xuất; không nói có giữ phiên \"Ghi nhớ đăng nhập\" hay xoá | Có thể còn phiên ghi nhớ khiến vòng lặp đăng nhập–chọn tổ chức | BA |\n| Vòng đời danh mục — Tài khoản người dùng | Thiếu: tạo tài khoản, sửa hồ sơ, mở khoá, ngừng dùng (vô hiệu hoá), xoá — chỉ có đổi mật khẩu và IT reset | Không có đặc tả quản lý tài khoản trọn vòng đời (có thể nằm ở phần khác của SRS cũ) | PO/BA đối chiếu phần quản trị người dùng |\n| Vòng đời danh mục — Tài khoản cây dầu (đối tác) | Màn chỉ đọc; tạo/sửa/ngừng dùng/xoá nằm ngoài lát (UC12.04.05–06) | Không thấy vòng đời trong phần này | BA đối chiếu feature cây dầu |\n| Vòng đời danh mục — Tổ chức/chi nhánh | Chỉ dùng để chọn khi đăng nhập; không có tạo/sửa/ngừng/xoá trong phần này | Không có | BA đối chiếu feature danh mục tổ chức |\n| Mục 6 E-account-access-020 | Câu chữ lỗi inline khi trường trống (Web) không có trong nguồn | Không thống nhất câu chữ | BA |\n| Mục
